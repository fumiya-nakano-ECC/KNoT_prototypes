// --- シーケンス（モードを順につないだタイムライン）---
// ステップには「モード・長さ・なじませる時間・そのときのパラメーター一式」を持たせる。
// 再生中は、次のステップのパラメーターへスライダーごと少しずつ移していく。
// 途中で変えるとバーを作り直すものは触らない。
// 音まわり（idが sound で始まるもの）はステップに入れず、いつでも手元で調整する。
// 見え方や動作環境の設定は、ステップごとに変わるものではないので入れない
// （触っても「編集中」にならず、編集中でも色が変わらない）
const SEQ_SKIP_IDS = [
    'numBoidsSlider', 'previewScaleSlider',
    'lightModeToggle', 'showLeaderToggle', 'colorCodeLayersToggle',
    'showRailToggle', 'showTopToggle', 'showDotsToggle',
    'bgPlayToggle', 'sleepBlockToggle',
];
function seqSkips(id) { return SEQ_SKIP_IDS.includes(id) || id.startsWith('sound'); }
let seqSteps = [];
let seqPlaying = false;
let seqLoop = true;
let seqIndex = 0;
let seqStepStart = 0;      // いまのステップが始まった時刻(ms)
let seqFadeFrom = null;    // フェードの出発点になるパラメーター
let seqFadeIn = 0;         // 入りぎわに「モードらしさ」を戻す時間(ms)
let seqNextApplyAt = 0;    // スライダーを流し込む間隔（間引き用）
let seqPrevNow = 0;        // 前フレームの時刻（待ちのあいだ時計を止めるのに使う）
let seqWaiting = false;    // 文字盤ができるのを待っているところ
let seqSelected = -1;      // パネルに読み込んで見ているステップ
let seqApplying = false;   // ステップの設定をパネルへ流し込んでいる最中
// 再生中に手で動かした項目。ここに入っているあいだは、シーケンス側から上書きしない
let seqUserEdits = new Set();
let seqResumeFrom = null;  // 編集をやめたあと、いまのステップへ戻すときの出発点
let seqResumeAt = 0;
const SEQ_RESUME_MS = 2500;

function modeLabel(m) {
    const opt = document.querySelector(`#motionModeSelect option[value="${m}"]`);
    return opt ? opt.textContent.replace(/　+/g, ' ').trim() : `MODE${m}`;
}

// いまのパネルの状態を、そのまま1枚の写真として取っておく
function snapshotParams() {
    const o = {};
    for (const el of document.querySelectorAll('#controls input, #controls select')) {
        if (!el.id || el.id.startsWith('seq') || el.id === 'motionModeSelect') continue;
        if (seqSkips(el.id)) continue;
        o[el.id] = el.type === 'checkbox' ? el.checked : el.value;
    }
    return o;
}

function setControl(id, v) {
    const el = document.getElementById(id);
    if (!el) return;
    if (el.type === 'checkbox') {
        if (el.checked !== !!v) { el.checked = !!v; el.dispatchEvent(new Event('change')); }
    } else if (String(el.value) !== String(v)) {
        el.value = v;
        el.dispatchEvent(new Event('input'));
        // 選択欄は change で受けているものがあるので、そちらも起こしておく
        // （これがないと、見た目だけ変わって中身が変わらない）
        if (el.tagName === 'SELECT') el.dispatchEvent(new Event('change'));
    }
}

function applyParams(p) {
    for (const id in p) {
        if (seqSkips(id) || seqUserEdits.has(id)) continue;
        setControl(id, p[id]);
    }
}

// フェード中：スライダーは2枚の写真のあいだを補間し、スイッチは途中で切り替える
function applyParamsBlend(from, to, t) {
    for (const id in to) {
        // 再生中に手で動かしたものは、こちらから触らない
        if (seqSkips(id) || seqUserEdits.has(id)) continue;
        const el = document.getElementById(id);
        if (!el) continue;
        if (el.type === 'range' && from && from[id] !== undefined) {
            const step = parseFloat(el.step) || 1;
            const lo = parseFloat(el.min);
            const hi = parseFloat(el.max);
            const raw = lerp(parseFloat(from[id]), parseFloat(to[id]), t);
            const snapped = clamp(Math.round(raw / step) * step, lo, hi);
            setControl(id, String(parseFloat(snapped.toFixed(6))));
        } else if (t >= 0.5) {
            setControl(id, to[id]);
        }
    }
}

function seqEnterStep(i, now, silent) {
    const prevMode = motionMode;
    seqIndex = i;
    seqStepStart = now;
    seqNextApplyAt = 0;
    if (silent) {
        // 編集中の進行。時計だけ次のステップへ渡して、設定はいじらない
        seqFadeFrom = null;
        seqFadeIn = 0;
        renderSeq();
        return;
    }
    // 手で動かしたぶんは、そのステップのあいだだけのこと。次のステップでは解除する
    seqUserEdits = new Set();
    seqSelected = -1;
    seqResumeFrom = null;
    const st = seqSteps[i];
    if (!st) return;
    seqFadeFrom = snapshotParams();
    const sel = document.getElementById('motionModeSelect');
    if (parseInt(sel.value, 10) !== st.mode) {
        sel.value = String(st.mode);
        sel.dispatchEvent(new Event('change'));
    }
    // 途中の値を持てないもの（スイッチ・表示まわり）は、切り替えの瞬間に合わせる
    for (const id in st.params) {
        if (seqSkips(id)) continue;
        const el = document.getElementById(id);
        if (el && el.type !== 'range') setControl(id, st.params[id]);
    }
    if (!(st.fade > 0)) { applyParams(st.params); seqFadeFrom = null; }
    // モードが変わったときだけ、入りぎわに「らしさ」を戻していく
    // 文字盤どうし（MODE5⇄MODE6）は同じ画のつづきなので、らしさを抜かずにつなぐ
    const sameFamily = prevMode === st.mode
        || (isDialMode(prevMode) && isDialMode(st.mode));
    // 「フェード」に入れた秒数を、そのまま入りぎわの時間として使う。
    // （前のモードから抜けるぶんは、この半分の時間を手前に取ってある）
    seqFadeIn = sameFamily ? 0 : Math.max(0, st.fade) * 1000;
    renderSeq();
}

function seqStop() {
    seqPlaying = false;
    seqFadeFrom = null;
    seqWaiting = false;
    modeInfluence = 1;
    renderSeq();
}

// ステップを選ぶと、そこに入れてある設定を上の調整パラメータへ丸ごと戻す。
// 選んでいるあいだの手直しは、そのままそのステップに書き込まれる。
function seqLoadStep(i) {
    const st = seqSteps[i];
    if (!st) return;
    seqApplying = true;
    const sel = document.getElementById('motionModeSelect');
    if (parseInt(sel.value, 10) !== st.mode) {
        sel.value = String(st.mode);
        sel.dispatchEvent(new Event('change'));
    }
    for (const id in st.params) {
        // 再生中はバーの数だけ触らない（作り直しになって画が飛ぶため）
        if (seqPlaying && seqSkips(id)) continue;
        setControl(id, st.params[id]);
    }
    seqApplying = false;
    seqSelected = i;
    seqUserEdits = new Set();
    seqFadeFrom = null;
    renderSeq();
}

// パネルをいじった結果を、そのままステップに書き込む。
//   再生中 … いま流れているステップへ。以後そこはシーケンス側から上書きしない
//   停止中 … 選んでいるステップへ
function seqSyncFromPanel(e) {
    if (seqApplying) return;
    // 音まわりはステップに持たせていないので、触ってもステップの編集にはしない
    if (e && e.target && e.target.id && seqSkips(e.target.id)) return;
    if (seqPlaying) {
        // 直す先は、選んでいるステップ。選んでいなければ、いま流れているステップ。
        const target = seqSelected >= 0 ? seqSelected : seqIndex;
        const cur = seqSteps[target];
        if (!cur) return;
        const el = e && e.target;
        let changed = cur.mode !== motionMode;
        cur.mode = motionMode;
        if (el && el.id && el.id !== 'motionModeSelect') {
            // 触った項目だけを書き換える。フェード中の値まで写し取らないようにするため
            cur.params[el.id] = el.type === 'checkbox' ? el.checked : el.value;
            if (!seqUserEdits.has(el.id)) { seqUserEdits.add(el.id); changed = true; }
        }
        // いま直しているのがどのステップか、枠の色で分かるようにする
        if (seqSelected < 0) { seqSelected = seqIndex; changed = true; }
        if (changed) renderSeq();
        return;
    }
    const st = seqSteps[seqSelected];
    if (!st) return;
    const modeChanged = st.mode !== motionMode;
    st.mode = motionMode;
    st.params = snapshotParams();
    if (modeChanged) renderSeq();
}

function seqDeselect() {
    if (seqSelected < 0) return;
    seqSelected = -1;
    seqUserEdits = new Set();
    if (seqPlaying && seqSteps[seqIndex]) {
        // 編集をやめたら、いま流れているステップの設定へゆっくり戻す
        seqResumeFrom = snapshotParams();
        seqResumeAt = performance.now() - startTime;
        seqNextApplyAt = 0;
        const st = seqSteps[seqIndex];
        const sel = document.getElementById('motionModeSelect');
        if (parseInt(sel.value, 10) !== st.mode) {
            seqApplying = true;
            sel.value = String(st.mode);
            sel.dispatchEvent(new Event('change'));
            seqApplying = false;
        }
    }
    renderSeq();
}

for (const type of ['input', 'change']) {
    document.getElementById('controls').addEventListener(type, (e) => {
        if (e.target.closest('#seqBox')) return;
        seqSyncFromPanel(e);
    });
}

// パネルの枠の外を押したら、ステップの編集から抜けて、ふだんの調整に戻る
document.addEventListener('mousedown', (e) => {
    if (e.target.closest('#controls') || e.target.closest('#seqWrap')
        || e.target.closest('#seqOpenBtn')) return;
    seqDeselect();
});

// シーケンスのパネルでも、ステップやボタン以外のところを押したら編集をやめる
document.getElementById('seqPanel').addEventListener('mousedown', (e) => {
    if (e.target.closest('.seq-step') || e.target.closest('button')
        || e.target.closest('details')) return;
    seqDeselect();
});

// シーケンスのパネルは、たたんで画面を広く使える
function setSeqPanelOpen(open) {
    document.getElementById('seqWrap').classList.toggle('closed', !open);
    document.getElementById('seqOpenBtn').style.display = open ? 'none' : '';
    resizeCanvas();
}
document.getElementById('seqCloseBtn').addEventListener('click', () => setSeqPanelOpen(false));
document.getElementById('seqOpenBtn').addEventListener('click', () => setSeqPanelOpen(true));

function seqStart() {
    if (seqSteps.length === 0) return;
    seqSelected = -1;
    seqPlaying = true;
    seqEnterStep(0, performance.now() - startTime);
}

function updateSequence(now) {
    const since = seqPrevNow === 0 ? 0 : Math.max(0, now - seqPrevNow);
    seqPrevNow = now;
    if (!seqPlaying || seqSteps.length === 0) {
        modeInfluence = 1;
        seqWaiting = false;
        return;
    }
    if (seqIndex >= seqSteps.length) seqIndex = 0;
    // ステップを直しているあいだは、時間だけ流して、パネルには触らない。
    // 見えている設定が勝手に書き換わると、手直しができないため。
    const pinned = seqSelected >= 0 && !!seqSteps[seqSelected];
    let st = seqSteps[seqIndex];
    let dur = Math.max(1, st.sec) * 1000;
    if (pinned) {
        if (now - seqStepStart >= dur) {
            let next = seqIndex + 1;
            if (next >= seqSteps.length) {
                if (!seqLoop) { seqStop(); return; }
                next = 0;
            }
            seqEnterStep(next, now, true);
            st = seqSteps[seqIndex];
            dur = Math.max(1, st.sec) * 1000;
        }
        modeInfluence = 1;
        seqWaiting = false;
        const el = document.getElementById('seqStatus');
        const txt = `${seqIndex + 1}/${seqSteps.length}・編集中`;
        if (el && el.textContent !== txt) el.textContent = txt;
        return;
    }
    // 文字盤のモードは、数字の形になるまでステップの時計を止めて待つ。
    // なじませ終わってから待ちに入るので、形になる動き自体は先に効いている。
    seqWaiting = st.mode === 5 && motionMode === 5 && dialFormPending
        && now - seqStepStart >= Math.max(0, st.fade) * 1000;
    if (seqWaiting) {
        seqStepStart += since;
        modeInfluence = 1;
        const el = document.getElementById('seqStatus');
        const txt = `${seqIndex + 1}/${seqSteps.length}・文字盤づくり`;
        if (el && el.textContent !== txt) el.textContent = txt;
        return;
    }
    if (now - seqStepStart >= dur) {
        let next = seqIndex + 1;
        if (next >= seqSteps.length) {
            if (!seqLoop) { seqStop(); return; }
            next = 0;
        }
        seqEnterStep(next, now);
        st = seqSteps[seqIndex];
        dur = Math.max(1, st.sec) * 1000;
    }
    const t = now - seqStepStart;
    const fade = Math.max(0, st.fade) * 1000;

    // 編集をやめた直後は、いまのステップの設定へ数秒かけて戻す
    if (seqResumeFrom) {
        const rt = now - seqResumeAt;
        if (rt < SEQ_RESUME_MS) {
            if (now >= seqNextApplyAt) {
                seqNextApplyAt = now + 60;
                applyParamsBlend(seqResumeFrom, st.params, rt / SEQ_RESUME_MS);
            }
        } else {
            applyParams(st.params);
            seqResumeFrom = null;
        }
    // パラメーターを少しずつ移す（毎フレームだと重いので間引く）
    } else if (seqFadeFrom && fade > 0 && t < fade) {
        if (now >= seqNextApplyAt) {
            seqNextApplyAt = now + 60;
            applyParamsBlend(seqFadeFrom, st.params, t / fade);
        }
    } else if (seqFadeFrom) {
        applyParams(st.params);
        seqFadeFrom = null;
    }

    // 「モードらしさ」の出入り。
    // 入りぎわは素の動きから立ち上げ、終わりぎわは次のモードが違うなら引いておく。
    const nextStep = seqSteps[(seqIndex + 1) % seqSteps.length];
    const nextIsFamily = nextStep && (nextStep.mode === st.mode
        || (isDialMode(nextStep.mode) && isDialMode(st.mode)));
    const endFade = (seqSteps.length > 1 && nextStep && !nextIsFamily
        && (seqLoop || seqIndex + 1 < seqSteps.length))
        ? Math.max(0, nextStep.fade) * 1000 * 0.5 : 0;
    let inf = 1;
    if (seqFadeIn > 0) inf = Math.min(inf, t / seqFadeIn);
    if (endFade > 0) inf = Math.min(inf, (dur - t) / endFade);
    inf = clamp(inf, 0, 1);
    modeInfluence = inf * inf * (3 - 2 * inf);   // 角を丸める
    updateSeqStatus(now, st, dur);
}

function updateSeqStatus(now, st, dur) {
    const el = document.getElementById('seqStatus');
    if (!el) return;
    const left = Math.max(0, Math.ceil((dur - (now - seqStepStart)) / 1000));
    const txt = `${seqIndex + 1}/${seqSteps.length}・あと${left}秒`;
    if (el.textContent !== txt) el.textContent = txt;
}

function renderSeq() {
    const list = document.getElementById('seqList');
    const empty = document.getElementById('seqEmpty');
    if (!list) return;
    empty.style.display = seqSteps.length === 0 ? '' : 'none';
    list.innerHTML = seqSteps.map((s, i) => `
        <div class="seq-step${seqPlaying && i === seqIndex ? ' now' : ''}${
            i === seqSelected ? ' sel' : ''}" data-i="${i}" draggable="true">
            <div class="seq-head">
                <span class="nm" title="クリックすると、このステップの設定をパネルに出す">${
                    i + 1}. ${modeLabel(s.mode)}</span>${
                i === seqSelected ? '<span class="edited" title="このステップを直しています">✎</span>' : ''}
                <button type="button" data-act="del" title="削除" draggable="false">×</button>
            </div>
            <div class="seq-nums">
                長さ<input type="number" data-act="sec" min="1" max="9999" value="${s.sec}"
                    title="このステップの長さ（秒）" draggable="false">
                フェード<input type="number" data-act="fade" min="0" max="120" value="${s.fade}"
                    title="前のステップからなじませる時間（秒）" draggable="false">
            </div>
        </div>`).join('');
    const play = document.getElementById('seqPlayBtn');
    play.textContent = seqPlaying ? '■ 停止' : '▶ 再生';
    play.classList.toggle('on', seqPlaying);
    // ステップを編集しているあいだは、パネルの枠の色を変えて区別する（再生中も同じ）
    const editing = seqSelected >= 0 && !!seqSteps[seqSelected];
    document.getElementById('controls').classList.toggle('editing', editing);
    document.getElementById('seqPanel').classList.toggle('editing', editing);
    document.getElementById('seqWrap').classList.toggle('editing', editing);
    if (!seqPlaying) {
        document.getElementById('seqStatus').textContent = editing
            ? `${seqSelected + 1}番を編集中` : '停止中';
    }
}

document.getElementById('seqAddBtn').addEventListener('click', () => {
    seqSteps.push({ mode: motionMode, sec: motionMode === 6 ? 180 : 60, fade: 6,
        params: snapshotParams() });
    // 足したあとは選ばない。続けて次のステップを作りたいことが多く、
    // 選んだままだと、その手直しが直前のステップに書き込まれてしまうため。
    seqSelected = -1;
    renderSeq();
});

document.getElementById('seqPlayBtn').addEventListener('click', () => {
    if (seqPlaying) seqStop(); else seqStart();
});

document.getElementById('seqLoopBtn').addEventListener('click', (e) => {
    seqLoop = !seqLoop;
    e.currentTarget.classList.toggle('on', seqLoop);
});

document.getElementById('seqList').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) {
        // ボタン以外のところを押したら、そのステップを開く。
        // 止まっているときはパネルに読み込み、再生中はそこへ飛ぶ。
        const row = e.target.closest('.seq-step');
        if (!row || e.target.closest('input')) return;
        // 再生中でも時間は止めず流したまま、そのステップの設定をパネルに出す
        seqLoadStep(parseInt(row.dataset.i, 10));
        return;
    }
    const i = parseInt(btn.closest('.seq-step').dataset.i, 10);
    const act = btn.dataset.act;
    if (act === 'del') {
        seqSteps.splice(i, 1);
        seqSelected = -1;
        if (seqPlaying) {
            seqIndex = Math.min(seqIndex, Math.max(0, seqSteps.length - 1));
            if (seqSteps.length === 0) seqStop();
        }
        renderSeq();
    }
});

// 並べ替え。再生中でも、いま流れているステップ・直しているステップを見失わないよう、
// 位置ではなく「そのステップ自体」を見て番号をつけ直す。
function seqMove(from, to) {
    if (from === to || from < 0 || from >= seqSteps.length) return;
    if (to < 0 || to >= seqSteps.length) return;
    const playing = seqSteps[seqIndex];
    const selected = seqSteps[seqSelected];
    seqSteps.splice(to, 0, seqSteps.splice(from, 1)[0]);
    if (playing) seqIndex = Math.max(0, seqSteps.indexOf(playing));
    seqSelected = selected ? seqSteps.indexOf(selected) : -1;
    renderSeq();
}

// --- ドラッグで並べ替える ---
let seqDragFrom = -1;
function seqClearDropMarks() {
    for (const el of document.querySelectorAll('.seq-step')) {
        el.classList.remove('drop-before', 'drop-after', 'dragging');
    }
}
const seqListEl = document.getElementById('seqList');
seqListEl.addEventListener('dragstart', (e) => {
    const row = e.target.closest('.seq-step');
    if (!row || e.target.closest('input') || e.target.closest('button')) {
        e.preventDefault();
        return;
    }
    seqDragFrom = parseInt(row.dataset.i, 10);
    if (e.dataTransfer) {
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', String(seqDragFrom));
    }
    row.classList.add('dragging');
});
seqListEl.addEventListener('dragover', (e) => {
    if (seqDragFrom < 0) return;
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
    const row = e.target.closest('.seq-step');
    for (const el of document.querySelectorAll('.seq-step')) {
        el.classList.remove('drop-before', 'drop-after');
    }
    if (!row) return;
    const r = row.getBoundingClientRect();
    row.classList.add(e.clientY > r.top + r.height / 2 ? 'drop-after' : 'drop-before');
});
seqListEl.addEventListener('drop', (e) => {
    if (seqDragFrom < 0) return;
    e.preventDefault();
    const row = e.target.closest('.seq-step');
    let to = seqSteps.length - 1;
    if (row) {
        const r = row.getBoundingClientRect();
        const idx = parseInt(row.dataset.i, 10);
        to = e.clientY > r.top + r.height / 2 ? idx + 1 : idx;
        if (seqDragFrom < to) to -= 1;
    }
    const from = seqDragFrom;
    seqDragFrom = -1;
    seqClearDropMarks();
    seqMove(from, clamp(to, 0, seqSteps.length - 1));
});
seqListEl.addEventListener('dragend', () => {
    seqDragFrom = -1;
    seqClearDropMarks();
});

document.getElementById('seqList').addEventListener('input', (e) => {
    const el = e.target;
    if (!el.dataset || !el.dataset.act) return;
    const i = parseInt(el.closest('.seq-step').dataset.i, 10);
    const v = parseFloat(el.value);
    if (!Number.isFinite(v)) return;
    if (el.dataset.act === 'sec') seqSteps[i].sec = Math.max(1, Math.round(v));
    if (el.dataset.act === 'fade') seqSteps[i].fade = clamp(Math.round(v), 0, 120);
});

// 音の設定は、ステップごとではなくシーケンス全体でひとつ持つ。
// 外すのは「音を鳴らす」だけ——これは人が押さないと始められないため。
const SOUND_SAVE_SKIP = ['soundOnToggle'];
// 音のつまみは、アルゴリズムごとに別々に持つ。
// 画面のつまみは1組しかないので、切り替えるときに
// 「いまの値をしまって、向こうの値を出す」ことで別々にしている。
const SOUND_STASH_SKIP = ['soundOnToggle', 'soundAlgoSelect'];
const soundStash = { flock: null, motor: null };
let soundStashBusy = false;

function collectSound() {
    const o = {};
    for (const el of document.querySelectorAll('#controls input, #controls select')) {
        if (!el.id || !el.id.startsWith('sound')) continue;
        if (SOUND_STASH_SKIP.includes(el.id)) continue;
        o[el.id] = el.type === 'checkbox' ? el.checked : el.value;
    }
    return o;
}

// 版4までは「ドローン⇄グレイン」1本だった。同じ音量になる2本に読み替える。
function splitMix(o) {
    if (!o || typeof o !== 'object') return o;
    // 版7までは、音源ごとのEQが3段（低域・中域・高域）だった。近い段へ移す。
    for (const src of ['Drone', 'Grain']) {
        if (o[`soundEq${src}B1Slider`] !== undefined) continue;
        const mv = (from, to) => {
            if (o[from] !== undefined) o[`soundEq${src}${to}Slider`] = o[from];
        };
        mv(`soundEq${src}LowSlider`, 'B1');
        mv(`soundEq${src}MidSlider`, 'B3');
        mv(`soundEq${src}HighSlider`, 'B5');
    }
    // 版6までは、残響がマスターに1つだけあって、音源ごとの送りで量を決めていた。
    // いまはスロットのひとつなので、マスターのスロット1へ移す。
    if (o.soundVerbSlider !== undefined && o.soundFxMaster1Type === undefined) {
        o.soundFxMaster1Type = 'reverb';
        o.soundFxMaster1Mix = String(o.soundVerbSlider);
        const sec = parseFloat(o.soundVerbLenSlider);
        if (Number.isFinite(sec)) {
            o.soundFxMaster1P1 = String(Math.round(
                100 * Math.log(Math.max(0.2, sec) / 0.2) / Math.log(40)));
        }
    }
    // 版5までは「ステレオ幅」「バーティカル」がマスターに1本ずつだった
    if (o.soundWidthSlider !== undefined && o.soundWidthDroneSlider === undefined) {
        o.soundWidthDroneSlider = o.soundWidthSlider;
        o.soundWidthGrainSlider = o.soundWidthSlider;
        o.soundWidthMtrSlider = o.soundWidthSlider;
    }
    if (o.soundVertSlider !== undefined && o.soundVertDroneSlider === undefined) {
        o.soundVertDroneSlider = o.soundVertSlider;
        o.soundVertGrainSlider = o.soundVertSlider;
    }
    if (o.soundDroneVolSlider !== undefined) return o;
    if (o.soundMixSlider === undefined) return o;
    const m = clamp(parseFloat(o.soundMixSlider) / 100, 0, 1);
    o.soundDroneVolSlider = String(Math.round(Math.cos((m * Math.PI) / 2) * 100));
    o.soundGrainVolSlider = String(Math.round(Math.sin((m * Math.PI) / 2) * 100));
    return o;
}

function putSound(o) {
    if (!o) return;
    splitMix(o);
    const was = soundStashBusy;
    soundStashBusy = true;
    for (const id in o) {
        if (SOUND_STASH_SKIP.includes(id)) continue;
        if (id === 'soundPresetSelect') continue;      // 最後に、静かに
        if (id === 'soundPitchSlider') continue;       // スケールのあとで
        if (document.getElementById(id)) setControl(id, o[id]);
    }
    if (o.soundPitchSlider !== undefined) {
        setControl('soundPitchSlider', o.soundPitchSlider);
        refreshPitch();
    }
    const pre = document.getElementById('soundPresetSelect');
    if (pre && o.soundPresetSelect
        && [...pre.options].some((x) => x.value === o.soundPresetSelect)) {
        pre.value = o.soundPresetSelect;
    }
    soundStashBusy = was;
}

function stashSound(algo) { soundStash[algo] = collectSound(); }

function snapshotSound() {
    stashSound(soundAlgo);
    return { algo: soundAlgo, flock: soundStash.flock, motor: soundStash.motor };
}

function applySound(o, version) {
    if (!o || typeof o !== 'object') return 0;
    splitMix(o);
    splitMix(o.flock);
    splitMix(o.motor);
    // 新しい形（アルゴリズムごとに2組）
    if (o.flock || o.motor) {
        if (o.flock) soundStash.flock = o.flock;
        if (o.motor) soundStash.motor = o.motor;
        const algo = o.algo === 'motor' ? 'motor' : 'flock';
        const sel = document.getElementById('soundAlgoSelect');
        if (sel && sel.value !== algo) {
            soundStashBusy = true;
            sel.value = algo;
            sel.dispatchEvent(new Event('change'));   // 表示の切り替えもここで起きる
            soundStashBusy = false;
        } else {
            soundAlgo = algo;
            putSound(soundStash[algo]);
            if (actx) applySoundMix(0.15);
        }
        return Object.keys(o.flock || o.motor || {}).length;
    }
    let n = 0;
    for (const id in o) {
        if (!id.startsWith('sound') || SOUND_SAVE_SKIP.includes(id)) continue;
        if (id === 'soundPresetSelect') continue;      // これは最後に、静かに戻す
        if (id === 'soundPitchSlider') continue;       // スケールが決まってから
        if (!document.getElementById(id)) continue;
        setControl(id, o[id]);
        n++;
    }
    // マスターピッチは「いまのスケールの段」なので、スケールを入れたあとで置く。
    // 版2までは0〜100でオクターブを表していたので、同じ高さになる段に読み替える。
    if (o.soundPitchSlider !== undefined) {
        let step = parseFloat(o.soundPitchSlider);
        if (!Number.isFinite(step)) step = 0;
        if (!(version >= 3)) {
            const oct = (step - 50) / 25;
            step = Math.round(oct * scaleSteps());
        }
        setControl('soundPitchSlider', String(clamp(Math.round(step), -24, 24)));
        refreshPitch();
        n++;
    }
    // プリセットの名前は、いちばん最後に表示だけ戻す。
    // ここで change を起こすと、せっかく読み込んだつまみの値が
    // プリセットの既定値で上書きされてしまうので、値だけ入れる。
    const pre = document.getElementById('soundPresetSelect');
    if (pre && o.soundPresetSelect
        && [...pre.options].some((x) => x.value === o.soundPresetSelect)) {
        pre.value = o.soundPresetSelect;
        n++;
    }
    return n;
}

function seqNote(text, bad) {
    const el = document.getElementById('seqNote');
    el.textContent = text || '';
    el.classList.toggle('bad', !!bad);
    if (text) setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 4000);
}

// 並びをそのままファイルに落とす。中身は今までと同じJSON。
document.getElementById('seqExportBtn').addEventListener('click', () => {
    if (seqSteps.length === 0) { seqNote('ステップがまだありません', true); return; }
    // 中身は「音の設定（全体でひとつ）」と「ステップの並び」の2つ
    const text = JSON.stringify({ version: 8, sound: snapshotSound(), steps: seqSteps }, null, 1);
    const d = new Date();
    const p2 = (n) => String(n).padStart(2, '0');
    const name = `boids-seq-${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}`
        + `-${p2(d.getHours())}${p2(d.getMinutes())}.json`;
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    seqNote(`${name} を保存しました`);
});

document.getElementById('seqImportBtn').addEventListener('click', () => {
    document.getElementById('seqFile').click();
});

document.getElementById('seqFile').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';                      // 同じファイルをもう一度選べるように
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
        try {
            const data = JSON.parse(String(reader.result));
            // 古い書き出し（並びだけ）も、そのまま読める
            const list = Array.isArray(data) ? data : data && data.steps;
            if (!Array.isArray(list)) throw new Error('並びの形になっていません');
            seqSteps = list.map((st) => ({
                mode: clamp(parseInt(st.mode, 10) || 1, 1,
                    document.querySelectorAll('#motionModeSelect option').length),
                sec: Math.max(1, Math.round(st.sec) || 60),
                fade: clamp(Math.round(st.fade) || 0, 0, 120),
                params: st.params && typeof st.params === 'object' ? st.params : {},
            }));
            const nSound = Array.isArray(data) ? 0 : applySound(data.sound, data.version);
            seqStop();
            renderSeq();
            seqNote(`${file.name} を読み込みました（${seqSteps.length}ステップ`
                + `${nSound > 0 ? '・音の設定つき' : ''}）`);
        } catch (err) {
            seqNote('読み込めませんでした（中身の形が違うようです）', true);
        }
    };
    reader.onerror = () => seqNote('ファイルを開けませんでした', true);
    reader.readAsText(file);
});

renderSeq();

// はじめは両方とも、いま画面にある既定値から始める。
// ここから先は、切り替えるたびにそれぞれ別々に育っていく。
soundStash.flock = collectSound();
soundStash.motor = collectSound();

applyModeVisibility();

// ===== 音 =====
// バーの動きそのものを音にする。作るのは2種類だけ。
//  ・ひびき（ドローン）… いま画面にできている「塊」ひとつに声をひとつ当てる。

// 通す幅は「中心の高さ ÷ Q」で、中心は速さで動く。表示が絶えず
// 動くと読みにくいので、代表値として「止まっているときの唸り」の
// ところでの幅を出す。動けば中心が上がるぶん、実際の幅も広がる。
function mtrIdleHz() { return mtrPoles * mtrOrder * 0.8; }

function qLabel(q, shift) {
    const bw = (mtrIdleHz() * (shift || 1)) / Math.max(0.5, q);
    return `Q${Math.round(q)}　${bw < 10 ? bw.toFixed(1) : Math.round(bw)}Hz幅`;
}

    if (b) b.textContent = qLabel(mtrTiltQ, pitchRatio(mtrTiltStep));
}

// 根音から見た「純正な距離」の候補（セント）。
// 平均律の12個それぞれに、いちばん近い簡単な比をあてがってある。
//   1/1 16/15 9/8 6/5 5/4 4/3 7/5 3/2 8/5 5/3 16/9 15/8
// 平均律との差は最大でも17.5セント（三全音）。ここが「寄せ幅」になる。
const ADAPT_PURE = [
    0, 111.73, 203.91, 315.64, 386.31, 498.04,
    582.51, 701.96, 813.69, 884.36, 996.09, 1088.27, 1200,
];
const ADAPT_SCALES = ['adaptive', 'adaptPenta', 'adaptRitsu'];
function isAdaptive() { return ADAPT_SCALES.includes(soundScale); }
let sndAdaptRootHz = 0;      // いま根音になっている高さ（0＝アダプティブでない）
let sndRootUntil = 0;        // 根音を保つ期限

// 名目の高さを、根音に対して純正な高さへ寄せる。
// 動くのはせいぜい十数セント——音名は変えず、和音だけを澄ませる。
function adaptSnap(hz) {
    if (!isAdaptive() || !(sndAdaptRootHz > 0) || !(hz > 0)) return hz;
    const c = 1200 * Math.log2(hz / sndAdaptRootHz);
    const oct = Math.floor(c / 1200);
    const rem = c - oct * 1200;
    let best = 0;
    let bd = Infinity;
    for (const q of ADAPT_PURE) {
        const d = Math.abs(rem - q);
        if (d < bd) { bd = d; best = q; }
    }
    return sndAdaptRootHz * Math.pow(2, oct + best / 1200);
}
// 倍音の並び。金属感のスライダーで、素直な整数倍から
// 鐘や竹のような外れた倍音へ移っていく。
const SND_HARM = [1, 2, 3, 4];
const SND_METAL = [1, 2.01, 2.69, 3.72];
const SND_ANALYSE_MS = 110;       // 塊の見立てを更新する間隔
const SND_GRAIN_MIN_MS = 90;      // 同じバーが続けて鳴らないための待ち

let actx = null;
let sndMaster = null;        // 出口の音量（乾いた音と残響を合わせたあと）
let sndDry = null;           // 乾いた音の集まるところ。ここだけが「まとまり」を通る
let sndGlue = null;          // まとまり（乾いた音だけにかける）
let sndMix = null;           // 乾いた音＋残響の合流点
let sndDroneBus = null;
let sndGrainBus = null;
let sndGrainDuck = null;
// 凝縮したときに、ひびきの低いほうを前へ出すための2枚
let sndDroneLow = null;
let sndDroneHigh = null;
let sndHushD = null;
let sndHushG = null;
let sndEqHp = null;
let sndEqBands = [];
let sndVoices = [];
let sndSub = null;
let sndNoiseBuf = null;
let sndNextAnalyseAt = 0;
let sndGrainCredit = 8;
let sndPrevBanged = false;
let sndPrevMode = 0;

function grainBudget() { return 2 + soundDensity * 16; }

// 波形。既製の4つに加えて、倍音を書き並べた自前の波を2つ用意してある。
// 波が太いほど音も大きくなるので、選び替えても音量が跳ねないよう補正をかける。
const SND_CUSTOM_WAVES = {
    // 数字は倍音の強さ。左から 1倍・2倍・3倍…（先頭の0は使わない）
    soft: [0, 1, 0, 0.28],                                  // サインに3倍音をひとつまみ
    flute: [0, 1, 0.14, 0.05, 0.02],                        // 息のような、細く上品な音
    wood: [0, 1, 0.08, 0.5, 0.05, 0.25, 0.03, 0.12],        // 木管ふう。奇数倍音が主
    hollow: [0, 1, 0, 0.33, 0, 0.2, 0, 0.14, 0, 0.11],      // 奇数倍音だけ。中空の響き
    organ: [0, 1, 0, 0.5, 0, 0.32, 0, 0.18, 0, 0.1],
    bell: [0, 1, 0.6, 0.35, 0.5, 0.28, 0.18, 0.3, 0.12, 0.2],   // 上の倍音が飛び飛びに立つ
    harmonics: [0, 1, 0.5, 0.33, 0.25, 0.2, 0.17, 0.14, 0.13],  // 1/n。角のとれたノコギリ
    glass: [0, 1, 0.22, 0.5, 0.16, 0.42, 0.12, 0.3, 0.22, 0.2, 0.16, 0.12],
    // 矩形の幅を1/4にしたもの。4の倍数の倍音が抜けるので、
    // スクエアより細く、鼻にかかった張りが出る
    pulse: [0, 1, 0.707, 0.333, 0, -0.2, -0.236, -0.101, 0, 0.079, 0.1, 0.064],
    // 電気ピアノ。基音のほかに、ずっと上の倍音がひとつだけ立つ
    tine: [0, 1, 0.12, 0.05, 0.02, 0.01, 0, 0, 0, 0, 0, 0, 0, 0.3, 0.12],
    // 人の声のような、途中の倍音がふくらむ形
    vox: [0, 1, 0.5, 0.35, 0.62, 0.45, 0.16, 0.08, 0.22, 0.12, 0.05],
    // ダブルリード。偶数と奇数が交互に立って、細く芯のある音
    reed: [0, 1, 0.35, 0.62, 0.26, 0.42, 0.16, 0.26, 0.1, 0.16, 0.08],
    // 基音と3倍音だけ。1本で5度に重なって聞こえる
    fifth: [0, 1, 0, 0.75, 0, 0.22, 0, 0.12, 0, 0.06],
    // 基音より上の倍音のほうが強い。遠くで鳴っているような、鼻に抜ける音
    nasal: [0, 0.45, 0.3, 1, 0.8, 0.5, 0.25, 0.12, 0.06],
};
// ドローンはローパスの向こう側で鳴るので、明るい波ほど削られて痩せる。
// グレインは素通しなので、補正のかけ方が別になる。
// 実際に鳴らして測り、どの波形でも同じくらいの大きさになるよう決めた値
const SND_WAVE_GAIN = {
    sine: 1.0, soft: 0.83, flute: 0.9, triangle: 1.25, wood: 0.91, hollow: 0.66,
    organ: 0.8, bell: 1.15, harmonics: 1.04, sawtooth: 1.13, square: 0.62, glass: 1.13,
    pulse: 1.32, tine: 1.15, vox: 1.56, reed: 1.3, fifth: 1.02, nasal: 1.55,
};
const SND_GRAIN_WAVE_GAIN = {
    sine: 1, soft: 1, flute: 1, triangle: 1, wood: 1, hollow: 0.95,
    organ: 1.05, bell: 1.1, harmonics: 0.95, sawtooth: 0.9, square: 0.8, glass: 1.4,
    pulse: 1.4, tine: 1.23, vox: 1.39, reed: 1.36, fifth: 0.92, nasal: 1.35,
};
let sndWaveCache = null;
let sndWatch = null;         // 出口の見張り（NaNが回り込んでいないか）
let sndWatchBuf = null;
let sndWatchAt = 0;
let sndRebuilds = 0;

function buildWaves() {
    sndWaveCache = {};
    for (const [name, imag] of Object.entries(SND_CUSTOM_WAVES)) {
        const im = Float32Array.from(imag);
        const re = new Float32Array(im.length);
        sndWaveCache[name] = actx.createPeriodicWave(re, im, { disableNormalization: false });
    }
}

function setOscWave(o, name) {
    if (sndWaveCache && sndWaveCache[name]) o.setPeriodicWave(sndWaveCache[name]);
    else o.type = name;
}

function waveGain(name) { return SND_WAVE_GAIN[name] || 1; }
function grainWaveGain(name) { return SND_GRAIN_WAVE_GAIN[name] || 1; }

function partialRatio(k) { return lerp(SND_HARM[k], SND_METAL[k], soundMetal); }

// 段（step）を実際の高さに直す。無音階のときは連続した高さになる。
function scaleHz(step) {
    const sc = SND_SCALES[soundScale];
    const base = SND_ROOT_HZ * Math.pow(2, soundPitchOct);
    if (!sc) return clamp(base * Math.pow(2, step / 5), 20, 8000);
    const n = sc.length;
    const oct = Math.floor(step / n);
    const semi = sc[((step % n) + n) % n];
    return clamp(base * Math.pow(2, oct + semi / 12), 20, 8000);
}

// マスターピッチの基音。スケールの段をそのまま上り下りするので、
// 純正律なら基音そのものが純正の比で動く（平均律の半音ではなく）。
// 何段でちょうど1オクターブかはスケールしだい（5音なら5段、12音なら12段）。
function pitchBaseHzFor(step) {
    const sc = SND_SCALES[soundScale];
    if (!sc) return SND_ROOT_HZ * Math.pow(2, step / 12);   // 無音階のときは半音として扱う
    const n = sc.length;
    const oct = Math.floor(step / n);
    const semi = sc[((step % n) + n) % n];
    return SND_ROOT_HZ * Math.pow(2, oct + semi / 12);
}

// 段を「かける倍率」に直す。MODE1のマスターピッチはスケールの段を
// たどるが、モーターの音はスケールから出てくるとは限らない
//（倍音固定はモーターの唸りの整数倍、無音階は速さそのもの）。
// そこでこちらは音数によらず12段＝1オクターブの半音刻みにしてある。
function pitchRatio(step) {
    return Math.pow(2, clamp(sndSafe(step, 0), -48, 48) / 12);
}

function mtrPitchLabel(step) {
    const st = Math.round(step);
    const sign = st > 0 ? '+' : st < 0 ? '-' : '±';
    // 速度ステップのときはスケールの段へ読み替えるので、その行き先を出す
    const hz = mtrMode === 'step'
        ? pitchBaseHzFor(mtrDegShift(st)) : SND_ROOT_HZ * pitchRatio(st);
    return `${sign}${Math.abs(st)}段　${hz.toFixed(2)}Hz`;
}

function pitchLabel(step) {
    const hz = pitchBaseHzFor(step);
    const sign = step > 0 ? '+' : step < 0 ? '-' : '±';
    return `${sign}${Math.abs(step)}段　${hz.toFixed(2)}Hz`;
}

// スライダーとスケールのどちらが動いてもここを通す
function refreshPitch() {
    const el = document.getElementById('soundPitchSlider');
    soundPitchStep = Math.round(parseFloat(el.value) || 0);
    soundPitchOct = Math.log2(pitchBaseHzFor(soundPitchStep) / SND_ROOT_HZ);
    const lab = document.getElementById('soundPitchValue');
    if (lab) lab.textContent = pitchLabel(soundPitchStep);
    refreshMtrPitch();
}

// モーター側の2本。こちらは半音刻みなので、スケールを変えても値は動かない
function refreshMtrPitch() {
    for (const [sid, vid] of [['soundMtrRailStepSlider', 'soundMtrRailStepValue'],
        ['soundMtrTiltStepSlider', 'soundMtrTiltStepValue']]) {
        const el = document.getElementById(sid);
        const lab = document.getElementById(vid);
        if (el && lab) lab.textContent = mtrPitchLabel(parseFloat(el.value) || 0);
    }
}

function scaleSteps() {
    const sc = SND_SCALES[soundScale];
    return sc ? sc.length : 5;
}

// 音の見張り。出口に NaN が回り込んでいないか、ときどき覗く。
// 見つけたら仕組みごと建て直す（壊れたノードは直せないため）。
function audioWatchdog(elapsedMs) {
    if (!actx || !soundOn) return;
    if (document.hidden && !bgMode()) return;
    if (elapsedMs < sndWatchAt) return;
    sndWatchAt = elapsedMs + 400;
    if (actx.state !== 'running') { actx.resume(); return; }
    if (!sndMaster || !sndWatch) return;
    if (!Number.isFinite(sndMaster.gain.value)) { rebuildAudio(); return; }
    sndWatch.getFloatTimeDomainData(sndWatchBuf);
    for (let i = 0; i < sndWatchBuf.length; i += 8) {
        if (!Number.isFinite(sndWatchBuf[i])) { rebuildAudio(); return; }
    }
}

// 音まわりの数値は、ひとつでも NaN が混じるとフィルターの内部状態が壊れ、
// そこから先が二度と鳴らなくなる。入口でせき止めておく。
function sndSafe(v, fb) { return Number.isFinite(v) ? v : fb; }

// AudioParam への書き込みは、すべてここを通す。
// 数でないものが来たら控えの値に置き換え、それも駄目なら黙って何もしない。
function setP(param, v, t, tc, fb) {
    if (!param) return;
    const x = Number.isFinite(v) ? v : fb;
    if (!Number.isFinite(x)) return;
    param.setTargetAtTime(x, t, Number.isFinite(tc) && tc > 0 ? tc : 0.05);
}

// レール上の位置を、耳で追える場所に置き換える。
//   左右 … そのままステレオの定位へ。画面ではなくレールの枠を基準にするので、
//          いちばん左の辺が左いっぱい、右の辺が右いっぱいになる。
//   上下 … 左右だけでは上の辺と下の辺が同じ場所に聞こえてしまう。
//          そこで高いところほど明るく、低いところほどこもらせて、
//          音色そのもので高さが分かるようにする。
function sndPlaceFor(frac, width, vert) {
    const wd = sndSafe(width, 0.9);
    const vt = sndSafe(vert, 0);
    const flat = { pan: 0, up: 0.5, tone: 1 };
    if (!Number.isFinite(frac) || perimeterLength <= 0 || !bounds) return flat;
    const p = getPointOnPerimeter(((frac % 1) + 1) % 1);
    if (!p || !Number.isFinite(p.x) || !Number.isFinite(p.y)) return flat;
    const w = Math.max(1, bounds.right - bounds.left);
    const h = Math.max(1, bounds.bottom - bounds.top);
    const nx = clamp((p.x - bounds.left) / w, 0, 1);
    const up = 1 - clamp((p.y - bounds.top) / h, 0, 1);
    return {
        pan: clamp((nx * 2 - 1) * wd, -1, 1),
        up,
        tone: Math.pow(2, (up - 0.5) * 2 * vt),
    };
}

function sndPanFor(frac) { return sndPlaceFor(frac, soundWidthDrone, 0).pan; }

// 音の仕組みをまるごと作り直す。壊れたノードは直せないので、捨てて建て直す。
function rebuildAudio() {
    const prev = actx;
    actx = null;
    sndRebuilds++;
    sndMaster = null; sndDry = null; sndGlue = null; sndMix = null;
    sndDroneBus = null; sndGrainBus = null;
    sndGrainDuck = null; sndDroneLow = null; sndDroneHigh = null;
    sndHushD = null; sndHushG = null; sndEqHp = null; sndEqBands = [];
    sndDroneEq = null; sndGrainEq = null; sndEqWet = null; sndEqDry = null;
    fxRacks = { drone: null, grain: null, master: null };
    sndVoices = []; sndSub = null; sndNoiseBuf = null; sndWaveCache = null;
    sndMtrBus = null; sndMtrRailBus = null; sndMtrTiltBus = null;
    mtrVoices = []; mtrNoise = null;
    sndWatch = null; sndWatchBuf = null; sndWatchAt = 0;
    sndAdaptRootHz = 0; sndRootUntil = 0; sndOpenAt = 0;
    sndHushAmt = 0; sndPacked = 0; sndDensWarm = 0;
    try { if (prev) prev.close(); } catch (err) { /* すでに閉じている */ }
    if (!ensureAudio()) return;
    if (actx.state === 'suspended') actx.resume();
    applySoundMix(0.05);
    applySoundEq();
    sndPrevBanged = dialBanged;
    sndPrevMode = motionMode;
    for (const b of layers.flatMap((l) => l.boids)) b.sndDir = undefined;
    if (soundOn) sndMaster.gain.setTargetAtTime(soundVol, actx.currentTime, 0.4);
}

function makeNoiseBuffer() {
    const len = Math.floor(actx.sampleRate * 2);
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
}

function ensureAudio() {
    if (actx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try {
        actx = new AC();
    } catch (err) {
        actx = null;
        return false;
    }
    sndNoiseBuf = makeNoiseBuffer();
    buildWaves();

    // 出口の順番は、DAWのマスターと同じ並びにしてある。
    //   乾いた音 → まとまり（コンプ）─┐
    //   スロット（マスター） ─────────┴→ 合流 → 音量 → EQ → 頭打ち → 出力
    // 残響はマスターのスロットに入るので、「まとまり」の後ろで鳴る。
    // こうすると、強い音が来ても残響の尾が引っこまない。
    sndDry = actx.createGain();
    sndDry.gain.value = 1;
    sndMix = actx.createGain();
    sndMix.gain.value = 1;
    sndMaster = actx.createGain();
    sndMaster.gain.value = 0;
    // 乾いた音だけをゆるくまとめる。深さは「グルーコンプ」つまみで決まる。
    const comp = actx.createDynamicsCompressor();
    sndGlue = comp;
    comp.knee.value = 12;
    comp.attack.value = 0.008;
    comp.release.value = 0.25;
    applySoundGlue(comp);
    sndDry.connect(comp);
    comp.connect(sndMix);
    // それでも越えてくるところは、いちばん出口でやわらかく頭打ちにする。
    // 波形を切り落とすのではなく、押し返して丸める（歪んだ音にならない）。
    // 前後のゲインは、小さい音がそのままの大きさで通るように決めてある。
    const K = 3;
    const pre = actx.createGain();
    pre.gain.value = 0.4;
    const post = actx.createGain();
    post.gain.value = Math.tanh(K) / (0.4 * K);      // 天井は約0.83
    const soft = actx.createWaveShaper();
    const n = 2048;
    const curve = new Float32Array(n);
    for (let i = 0; i < n; i++) {
        const x = (i / (n - 1)) * 2 - 1;
        curve[i] = Math.tanh(x * K) / Math.tanh(K);
    }
    soft.curve = curve;
    soft.oversample = '4x';
    // 出口の整え（EQ）。低いところの濁りを落とし、中ほどを抜き差しして、
    // 上を開ける。既定値は控えめだが、どれも「音」タブから動かせる。
    sndEqHp = actx.createBiquadFilter();
    sndEqHp.type = 'highpass';
    sndEqHp.Q.value = 0.7;
    fxRacks.master = makeFxRack();
    sndMix.connect(fxRacks.master.in);
    fxRacks.master.out.connect(sndMaster);
    sndMaster.connect(sndEqHp);
    let tail = sndEqHp;
    sndEqBands = SND_EQ_BANDS.map((b) => {
        const f = actx.createBiquadFilter();
        f.type = b.type;
        f.frequency.value = b.hz;
        if (b.type === 'peaking') f.Q.value = 1.1;
        tail.connect(f);
        tail = f;
        return f;
    });
    // EQは入／切を切り替えられるように、通す側と素通りする側の2本を作って
    // 音量で選ぶ。片方を0にするだけなので、切り替えでプツッと鳴らない。
    sndEqWet = actx.createGain();
    sndEqDry = actx.createGain();
    sndEqWet.gain.value = soundEqOn ? 1 : 0;
    sndEqDry.gain.value = soundEqOn ? 0 : 1;
    tail.connect(sndEqWet);
    sndMaster.connect(sndEqDry);
    applySoundEq();
    sndEqWet.connect(pre);
    sndEqDry.connect(pre);
    pre.connect(soft);
    soft.connect(post);
    post.connect(actx.destination);
    // 出口を見張る。ひとつでも NaN が混じると、フィルターの内部状態が
    // そこで壊れて二度と戻らない（音が完全に消えたまま、モードを
    // 切り替えても鳴らない）。見つけたら作り直す。
    sndWatch = actx.createAnalyser();
    sndWatch.fftSize = 512;
    sndWatchBuf = new Float32Array(sndWatch.fftSize);
    post.connect(sndWatch);

    sndDroneBus = actx.createGain();
    sndGrainBus = actx.createGain();
    // つぶは、密度が上がったときに引っこめられるよう、もう一段はさむ
    sndGrainDuck = actx.createGain();
    sndGrainDuck.gain.value = 1;
    // ひびきの帯域を傾ける2枚。凝縮したときに、
    // 下を持ち上げて上を抑え、低音域が表に出てくるようにする。
    sndDroneLow = actx.createBiquadFilter();
    sndDroneLow.type = 'lowshelf';
    sndDroneLow.frequency.value = 170;
    sndDroneHigh = actx.createBiquadFilter();
    sndDroneHigh.type = 'highshelf';
    sndDroneHigh.frequency.value = 700;
    // 爆発の直前だけ、ひびきもつぶもいっしょに沈ませるための2枚。
    // ここより後ろに残響があるので、尾だけが残って静けさになる。
    sndHushD = actx.createGain();
    sndHushG = actx.createGain();
    sndHushD.gain.value = 1;
    sndHushG.gain.value = 1;
    sndDroneBus.connect(sndHushD);
    sndHushD.connect(sndDroneLow);
    sndDroneLow.connect(sndDroneHigh);
    sndDroneEq = makeChEq();
    sndDroneHigh.connect(sndDroneEq.in);
    fxRacks.drone = makeFxRack();
    sndDroneEq.out.connect(fxRacks.drone.in);
    fxRacks.drone.out.connect(sndDry);
    // MODE2（モーター）のバス。MODE1とは別系統で、同じ出口へ流す
    sndMtrBus = actx.createGain();
    sndMtrBus.gain.value = soundAlgo === 'motor' ? 1 : 0;
    sndMtrBus.connect(sndDry);
    // 走行と首振りで、まとめて角を落とせるようにローパスを1枚ずつ挟む。
    // 声ごとに持たせると72枚になるので、まとめてかける。
    sndMtrRailBus = actx.createBiquadFilter();
    sndMtrRailBus.type = 'lowpass';
    sndMtrRailBus.frequency.value = mtrRailLp;
    sndMtrRailBus.Q.value = 0.7;
    sndMtrRailBus.connect(sndMtrBus);
    sndMtrTiltBus = actx.createBiquadFilter();
    sndMtrTiltBus.type = 'lowpass';
    sndMtrTiltBus.frequency.value = mtrTiltLp;
    sndMtrTiltBus.Q.value = 0.7;
    sndMtrTiltBus.connect(sndMtrBus);
    sndGrainBus.connect(sndHushG);
    sndHushG.connect(sndGrainDuck);
    sndGrainEq = makeChEq();
    sndGrainDuck.connect(sndGrainEq.in);
    fxRacks.grain = makeFxRack();
    sndGrainEq.out.connect(fxRacks.grain.in);
    fxRacks.grain.out.connect(sndDry);
    applyChEq();
    fxApplyAll();

    // ひびきにだけ、ごく浅い揺れを足す。同じ音がふたつ、
    // わずかにずれて鳴っている状態をつくると、平べったさが取れる。
    const chorusMix = actx.createGain();
    chorusMix.gain.value = 0.3;
    chorusMix.connect(sndDry);
    for (let i = 0; i < 2; i++) {
        const d = actx.createDelay(0.06);
        d.delayTime.value = 0.012 + i * 0.007;
        const pan = actx.createStereoPanner();
        pan.pan.value = i === 0 ? -0.6 : 0.6;
        const lfo = actx.createOscillator();
        lfo.frequency.value = 0.07 + i * 0.05;
        const depth = actx.createGain();
        depth.gain.value = 0.0022;
        lfo.connect(depth);
        depth.connect(d.delayTime);
        lfo.start();
        fxRacks.drone.out.connect(d);
        d.connect(pan);
        pan.connect(chorusMix);
    }

    for (let i = 0; i < SND_VOICES; i++) sndVoices.push(makeVoice());
    sndSub = makeVoice();
    applySoundMix(0);
    return true;
}

// ひびきの声ひとつ。倍音を何本か重ねた本体と、息づかいの雑音、
// それに、ゆっくり明滅させるための小さな揺れを持たせてある。
function makeVoice() {
    const out = actx.createGain();
    out.gain.value = 0;
    // 声ごとの、高さを保つ長さのばらつき（0〜1）
    const pan = actx.createStereoPanner();
    out.connect(pan);
    pan.connect(sndDroneBus);

    const tone = actx.createBiquadFilter();
    tone.type = 'lowpass';
    tone.frequency.value = 700;
    tone.Q.value = 0.7;
    tone.connect(out);

    const parts = [];
    for (let k = 0; k < SND_HARM.length; k++) {
        const o = actx.createOscillator();
        setOscWave(o, soundWave);
        const g = actx.createGain();
        g.gain.value = k === 0 ? 1 : 0;
        o.connect(g);
        g.connect(tone);
        o.start(actx.currentTime + Math.random() * 0.05);
        parts.push({ osc: o, gain: g });
    }

    // 息づかい。帯域を絞った白色雑音を、本体のうしろに薄く敷く
    const noiseMix = actx.createGain();
    noiseMix.gain.value = 0;
    noiseMix.connect(tone);
    const band = actx.createBiquadFilter();
    band.type = 'bandpass';
    band.frequency.value = 300;
    band.Q.value = 6;
    band.connect(noiseMix);
    const src = actx.createBufferSource();
    src.buffer = sndNoiseBuf;
    src.loop = true;
    src.connect(band);
    src.start(actx.currentTime + Math.random() * 0.5);

    // ゆらぎ。音量にゆっくりした波を足して、複数の声が呼吸をずらす
    const lfo = actx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 0.2 + Math.random() * 0.3;
    const lfoGain = actx.createGain();
    lfoGain.gain.value = 0;
    lfo.connect(lfoGain);
    lfoGain.connect(out.gain);
    lfo.start(actx.currentTime + Math.random() * 0.5);

    return { out, pan, tone, parts, band, noiseMix, lfo, lfoGain, centre: null,
        hz: 0, holdUntil: 0, holdJitter: Math.random() };
}

function applySoundMix(ramp) {
    if (!actx) return;
    const t = actx.currentTime;
    const tc = ramp > 0 ? ramp : 0.001;
    const a = clamp(sndSafe(soundDroneVol, 0.71), 0, 1);
    const b = clamp(sndSafe(soundGrainVol, 0.71), 0, 1);
    // MODE2 を選んでいるあいだ、群れ側は黙る（逆もまた同じ）
    const flock = soundAlgo === 'flock' ? 1 : 0;
    setP(sndDroneBus.gain, a * 0.55 * flock, t, tc);
    setP(sndGrainBus.gain, b * 0.9 * flock, t, tc);
    if (sndMtrBus) setP(sndMtrBus.gain, 1 - flock, t, tc);
}

// 音源ごとのEQを1組つくる。4枚を数珠つなぎにして、入口と出口を返す。
function makeChEq() {
    const hp = actx.createBiquadFilter();
    hp.type = 'highpass';
    hp.Q.value = 0.7;
    hp.frequency.value = 20;
    let tail = hp;
    const bands = SND_EQ_BANDS.map((b) => {
        const f = actx.createBiquadFilter();
        f.type = b.type;
        f.frequency.value = b.hz;
        if (b.type === 'peaking') f.Q.value = 1.1;
        tail.connect(f);
        tail = f;
        return f;
    });
    return { in: hp, out: tail, hp, bands };
}

function applyChEq() {
    if (!actx) return;
    const t = actx.currentTime;
    const pair = [['drone', sndDroneEq], ['grain', sndGrainEq]];
    for (const [key, n] of pair) {
        if (!n) continue;
        const c = chEq[key];
        setP(n.hp.frequency, c.hp, t, 0.05, 20);
        for (let i = 0; i < n.bands.length; i++) {
            setP(n.bands[i].gain, c.db[i] || 0, t, 0.05, 0);
        }
    }
}

function applySoundEq() {
    if (!actx || !sndEqHp) return;
    const t = actx.currentTime;
    setP(sndEqHp.frequency, soundEqHpHz, t, 0.05);
    for (let i = 0; i < sndEqBands.length; i++) {
        setP(sndEqBands[i].gain, soundEqDb[i] || 0, t, 0.05);
    }
    if (sndEqWet) setP(sndEqWet.gain, soundEqOn ? 1 : 0, t, 0.03, 1);
    if (sndEqDry) setP(sndEqDry.gain, soundEqOn ? 0 : 1, t, 0.03, 0);
}

// 乾いた音のまとまり。0でほぼ素通り、1でしっかり寄せる。
// 深くしすぎると全体が脈打つので、比は最大でも4:1に留めてある。
function applySoundGlue(node) {
    const c = node || sndGlue;
    if (!c) return;
    const a = clamp(sndSafe(soundGlue, 0.4), 0, 1);
    const t = actx ? actx.currentTime : 0;
    setP(c.threshold, -1 - 17 * a, t, 0.05, -8);
    setP(c.ratio, 1 + 3 * a, t, 0.05, 2.2);
}

// いま画面にできている塊を数え上げる。
// 車間が近いバーが続いているところをひとつの塊とみなす。
function sndReadField() {
    const all = layers.flatMap((l) => l.boids);
    const n = all.length;
    const L = perimeterLength;
    if (n === 0 || !(L > 0)) return null;

    const vRef = Math.max(1e-6, maxSpeed * motionScale);
    let sumSpeed = 0;
    let sumTilt = 0;
    let bx = 0;
    let by = 0;
    for (const b of all) {
        sumSpeed += Math.abs(b.speed) / vRef;
        sumTilt += Math.abs(Math.sin(b.tilt));
        const a = b.arcFraction * Math.PI * 2;
        bx += Math.cos(a);
        by += Math.sin(a);
    }
    const meanSpeed = clamp(sumSpeed / n, 0, 2);
    const meanTilt = clamp(sumTilt / n, 0, 1);
    const bias = clamp(Math.hypot(bx, by) / n, 0, 1);   // 偏り（1に近いほど一か所に寄っている）
    let biasAt = Math.atan2(by, bx) / (Math.PI * 2);    // どちら側に寄っているか
    if (biasAt < 0) biasAt += 1;

    // レイヤーごとに輪をたどって、車間の近いものをつなげる
    const near = minDistance * 3.2;
    const clumps = [];
    const gaps = [];
    for (const layer of layers) {
        const bs = layer.boids.slice().sort((a, b) => a.arcFraction - b.arcFraction);
        const m = bs.length;
        if (m === 0) continue;
        const gap = [];
        for (let i = 0; i < m; i++) {
            let g = (bs[(i + 1) % m].arcFraction - bs[i].arcFraction) * L;
            if (g <= 0) g += L;
            gap.push(g);
            gaps.push(g);
        }
        // 切れ目（いちばん離れているところ）から数えはじめる
        let start = 0;
        for (let i = 1; i < m; i++) if (gap[i] > gap[start]) start = i;
        let cur = [];
        for (let k = 1; k <= m; k++) {
            const i = (start + k) % m;
            cur.push(bs[i]);
            const gAfter = gap[i];
            if (gAfter > near || k === m) {
                if (cur.length > 0) clumps.push(cur);
                cur = [];
            }
        }
    }

    // どれだけ寄っているか。レール1周の長さは変わらないので、車間の平均では測れない。
    // 「ほとんど触れている隣どうし」が全体の何割あるか、で数える。
    let touching = 0;
    for (const g of gaps) if (g < minDistance * 1.7) touching++;
    const packed = gaps.length ? clamp(touching / gaps.length, 0, 1) : 0;

    const meanGap = gaps.length ? gaps.reduce((a, b) => a + b, 0) / gaps.length : 0;
    let dev = 0;
    for (const g of gaps) dev += (g - meanGap) * (g - meanGap);
    const spread = gaps.length
        ? clamp(Math.sqrt(dev / gaps.length) / Math.max(1, meanGap), 0, 2) : 0;

    const items = clumps.map((c) => {
        let sx = 0;
        let sy = 0;
        let sp = 0;
        let tl = 0;
        for (const b of c) {
            const a = b.arcFraction * Math.PI * 2;
            sx += Math.cos(a);
            sy += Math.sin(a);
            sp += Math.abs(b.speed) / vRef;
            tl += Math.abs(Math.sin(b.tilt));
        }
        let centre = Math.atan2(sy, sx) / (Math.PI * 2);
        if (centre < 0) centre += 1;
        return { centre, size: c.length, speed: sp / c.length, tilt: tl / c.length };
    }).sort((a, b) => b.size - a.size);

    return { items, n, meanSpeed, meanTilt, bias, biasAt, spread, packed };
}

// 輪のうえでの近さ（0.5でいちばん遠い）
function fracDist(a, b) {
    const d = Math.abs(a - b) % 1;
    return d > 0.5 ? 1 - d : d;
}

// 名目の高さ（寄せる前）。アダプティブのときは、ここでは根音を見ない。
function adaptNominal(centre, heavy) {
    const keep = sndAdaptRootHz;
    sndAdaptRootHz = 0;
    const hz = voiceHz(centre, heavy);
    sndAdaptRootHz = keep;
    return hz;
}

// 塊の位置と大きさから、その声の高さを決める
function voiceHz(centre, heavy) {
    const n = scaleSteps();
    if (!SND_SCALES[soundScale]) {
        const base = 58 * Math.pow(2, soundPitchOct);
        return clamp(base * Math.pow(2, centre * 2.6 + (1 - heavy) * 1.6), 24, 6000);
    }
    const step = Math.round(centre * (n * 2 - 1)) + Math.round((1 - heavy) * n * 2);
    return scaleHz(step);
}

function updateDrone() {
    const f = sndReadField();
    if (!f) return;
    const t = actx.currentTime;

    // 声を塊に割り当てる。大きさの順に並べ替えるだけだと、
    // 塊がすこし増減しただけで声の高さが総入れ替えになって落ち着かない。
    // そこで、前に見ていた塊にいちばん近いものを引き続き担当させる。
    const pool = f.items.slice(0, sndVoices.length);
    const taken = new Array(pool.length).fill(false);
    const pick = new Array(sndVoices.length).fill(null);
    for (let i = 0; i < sndVoices.length; i++) {
        const was = sndVoices[i].centre;
        if (was === null || was === undefined) continue;
        let best = -1;
        let bestD = 0.2;
        for (let k = 0; k < pool.length; k++) {
            if (taken[k]) continue;
            const d = fracDist(was, pool[k].centre);
            if (d < bestD) { bestD = d; best = k; }
        }
        if (best >= 0) { taken[best] = true; pick[i] = pool[best]; }
    }
    for (let i = 0; i < sndVoices.length; i++) {
        if (pick[i]) continue;
        const k = taken.indexOf(false);
        if (k < 0) break;
        taken[k] = true;
        pick[i] = pool[k];
    }

    // アダプティブのときは、いちばん大きい塊の声を根音に立てる。
    // 根音そのものは平均律の位置のままなので、全体の高さは流れない
    //（純正比だけで渡り歩くと基準がじりじりずれていく＝コンマ・ポンプ）。
    // ころころ替わると全声が揺れ続けるので、サステインの2倍だけ保つ。
    if (isAdaptive()) {
        const big = f.items && f.items[0];
        if (big && (t >= sndRootUntil || !(sndAdaptRootHz > 0))) {
            const wasRoot = sndAdaptRootHz;
            sndAdaptRootHz = 0;                       // 名目の高さを取るあいだは寄せない
            const nominal = voiceHz(big.centre, clamp(big.size / 10, 0, 1));
            sndAdaptRootHz = nominal > 0 ? nominal : wasRoot;
            sndRootUntil = t + holdSec() * 2;
        }
    } else {
        sndAdaptRootHz = 0;
    }

    // explosion の震えが高まっている間は、ひびきもざらついていく
    const shake = isDialMode(motionMode) && Number.isFinite(dialVib) ? dialVib : 0;
    // 「凝縮」の度合い。ふたつの見方のうち、強いほうを採る。
    //   ・explosion は、縮んでいく進み具合そのもの（爆発したら解ける）
    //   ・それ以外は、実際にどれだけ詰まっているか
    // どちらも状態から直に出るので、場面が変わっても取り違えない。
    const squeeze = isDialMode(motionMode) && !dialBanged && Number.isFinite(dialContract)
        ? dialContract : 0;
    // 密度そのものは、モードによってふだんの値がかなり違う。
    // Boids は3割ほど、漂いは5割ほどのバーがふだんから触れ合っている。
    // そこで「そのモードのふだんの値」をゆっくり覚えておき、
    // それより詰まったぶんだけを効かせる。こうすると、どのモードでも
    // 群れが寄り集まった瞬間だけ低いほうが前に出てくる。
    if (sndDensMode !== motionMode) {
        sndDensMode = motionMode;
        sndDensBase = f.packed;
        sndDensWarm = 60;               // モードが変わった直後だけ、早く覚える
    }
    // explosion の収縮の最中だけは覚えこまない。そこを「ふだん」にしてしまうと、
    // 縮みきったところで効きが消えてしまう。
    if (squeeze < 0.05) {
        sndDensBase += (f.packed - sndDensBase) * (sndDensWarm > 0 ? 0.05 : 0.006);
        if (sndDensWarm > 0) sndDensWarm--;
    }
    const byDensity = clamp((f.packed - sndDensBase - 0.06) / 0.22, 0, 1);
    sndPacked += (Math.max(squeeze, byDensity) - sndPacked) * 0.1;
    const pack = clamp(sndPacked, 0, 1) * soundPack;

    // 縮みきってから爆発するまでの、息を止めているあいだ。
    // ここでは音ぜんたいをすっと沈めて、残響の尾だけを残す。
    // 沈むのはゆっくり、爆発ではぱっと戻す。
    let hushTo = 0;
    if (isDialMode(motionMode) && !dialBanged && Number.isFinite(dialCollapse)) {
        // はじめはゆるやかに、終わりぎわで一気に落ちる形
        hushTo = Math.pow(ramp01(dialCollapse, P_SHRINK_FULL - 0.09, P_SHRINK_TO - 0.005), 1.7);
    }
    sndHushAmt += (hushTo - sndHushAmt) * (hushTo > sndHushAmt ? 0.35 : 0.5);
    const hush = clamp(sndHushAmt, 0, 1) * soundHush;
    if (sndHushD && t >= sndOpenAt) {
        const hg = 1 - hush * 0.95;
        setP(sndHushD.gain, hg, t, 0.1);
        setP(sndHushG.gain, hg, t, 0.1);
    }

    for (let i = 0; i < sndVoices.length; i++) {
        const v = sndVoices[i];
        const c = pick[i];
        if (!c) {
            // 塊が消えても、すぐには切らない。ここがドローンの尾になる。
            v.centre = null;
            v.holdUntil = 0;          // 次に鳴るときは、新しい高さから
            setP(v.out.gain, 0, t, susTc(1.4));
            setP(v.lfoGain.gain, 0, t, susTc(1.4));
            continue;
        }
        v.centre = c.centre;
        const share = clamp(c.size / 12, 0, 1);
        // 大きい塊ほど低く、重く。小さいものは上のほうで細く鳴る
        const heavy = clamp(c.size / 10, 0, 1);
        // 高さそのものは動かさない（和音が崩れてしまうため）。
        // 凝縮は「低いほうが前に出てくる」ことで表す。
        // 高さは、決めたら決めた時間だけ保つ。ほとんど消えている声は、
        // 待たずに新しい高さへ移ってよい（そこは音の切れ目なので聞こえない）。
        const want = adaptNominal(c.centre, heavy);
        if (!v.hz || t >= (v.holdUntil || 0) || v.out.gain.value < 0.02) {
            v.hz = want;
            v.holdUntil = t + holdSec() * (0.7 + v.holdJitter * 0.6);
        }
        // 保つのは名目の高さ。実際に鳴らすときに根音へ寄せるので、
        // 根音が移ると、伸ばしたままの声も数セントだけ動いて和音が澄む。
        const hz = adaptSnap(v.hz);
        // 車間のばらつきと震えは、そのままうなりになる
        const cents = soundBeat * (6 + f.spread * 40 + c.tilt * 18 + shake * 30);
        setVoiceTone(v, hz, cents, t);
        // 速いほど明るく、傾いているほど開く。さらに、画面の上にいるほど明るい。
        // 詰まっているあいだは暗く沈める。
        const place = sndPlaceFor(c.centre, soundWidthDrone, soundVertDrone);
        const bright = (190 + soundBright * 2600)
            * (0.55 + f.meanSpeed * 0.9 + c.speed * 0.5 + f.meanTilt * 0.4) * place.tone
            * (1 - pack * 0.35);
        // 長いロングトーンのときは、明るさの移りかわりもゆっくりにする
        setP(v.tone.frequency, clamp(sndSafe(bright, 1200), 90, 11000), t,
            Math.max(0.15, susTc(0.5)));
        // 長く伸ばすときは、居場所の移りかわりも同じだけゆっくりにする
        setP(v.pan.pan, clamp(sndSafe(place.pan, 0), -1, 1), t,
            Math.max(0.1, susTc(0.4)));
        // 塊が大きいほど太く、偏っているほど全体が押し出される。
        // 低い塊（heavy が大きい）は、凝縮するほどさらに前へ。
        const lowWeight = 1 + pack * heavy * 1.6;
        const lv = (0.05 + share * 0.45) * (0.7 + f.bias * 0.6)
            * lowWeight / Math.sqrt(SND_VOICES);
        const level = clamp(sndSafe(lv, 0), 0, 0.6);
        setP(v.out.gain, level, t, susTc());
        setP(v.lfo.frequency, 0.12 + soundShimmer * 1.5 + i * 0.03, t, 0.5);
        setP(v.lfoGain.gain, level * soundShimmer * 0.75, t, susTc(1.6));
    }

    // 凝縮したぶんだけ、ひびきの重心を下へ移す。
    // 下を持ち上げ、上を抑える——音の高さは変えずに、低音域が表に出てくる。
    if (sndDroneLow) {
        const pk = clamp(sndSafe(pack, 0), 0, 1);
        setP(sndDroneLow.gain, pk * 11, t, 0.35);
        setP(sndDroneHigh.gain, -pk * 9, t, 0.35);
    }

    // いちばん下でうなっている声。バーが一方に寄るほど濃くなる（偏りそのものの音）
    if (sndSub) {
        // 低い声。1オクターブ下だと 27Hz あたりまで落ちて、
        // スピーカーからも出ず、出口のローカットでも切られてしまう。
        // 聞こえる下限（およそ42Hz）から下へは行かせない。
        const hz = Math.max(42, sndSafe(SND_SCALES[soundScale]
            ? adaptSnap(scaleHz(-scaleSteps()))
            : 34 * Math.pow(2, soundPitchOct) + f.meanSpeed * 10, 55));
        setVoiceTone(sndSub, hz, soundBeat * (3 + f.spread * 12), t);
        setP(sndSub.tone.frequency, 
            clamp((120 + soundBright * 420) * (0.6 + f.meanSpeed), 80, 1200), t, 0.3);
        setP(sndSub.pan.pan, sndPanFor(f.biasAt) * 0.6, t, 0.35);
        // いちばん下の声は「偏り」と「密度」のどちらでも立ち上がる
        const drive = Math.max(Math.pow(clamp(f.bias * 2.5, 0, 1), 1.4), pack * pack);
        const lv = clamp(sndSafe(drive * 0.6, 0), 0, 1);
        setP(sndSub.out.gain, lv, t, susTc(2.4));
        setP(sndSub.lfo.frequency, 0.08 + soundShimmer * 0.5, t, 0.5);
        setP(sndSub.lfoGain.gain, lv * soundShimmer * 0.5, t, susTc(1.6));
    }
}

// 倍音の並びと混ぜぐあいを、いまのスライダーどおりに整える
function setVoiceTone(v, hz, cents, t) {
    hz = clamp(sndSafe(hz, 220), 10, 12000);
    cents = clamp(sndSafe(cents, 0), -1200, 1200);
    const norm = waveGain(soundWave) / (1 + soundRich * 0.9);
    for (let k = 0; k < v.parts.length; k++) {
        const pt = v.parts[k];
        setP(pt.osc.frequency, clamp(hz * partialRatio(k), 10, 12000), t, 0.12);
        // 上の倍音ほど、うなりを強めにずらす（金属らしいゆらぎ）
        setP(pt.osc.detune, k === 0 ? 0 : cents * (0.6 + k * 0.5), t, 0.2);
        const g = k === 0 ? norm
            : norm * soundRich * Math.pow(0.55, k - 1) * (0.55 + soundMetal * 0.75);
        setP(pt.gain.gain, g, t, 0.15);
    }
    setP(v.band.frequency, clamp(hz * 2.4, 40, 9000), t, 0.15);
    setP(v.band.Q, 1.5 + (1 - soundBreath) * 8, t, 0.2);
    setP(v.noiseMix.gain, soundBreath * 1.3, t, 0.15);
}

// つぶの高さ。出来事の種類ごとに、鳴る高さの帯を変えてある。
function grainHz(kind, frac, tiltAbs) {
    const reg = kind === 'bang' ? -1.1 : kind === 'bounce' ? 0 : kind === 'arrive' ? 1.3 : 0.6;
    const n = scaleSteps();
    if (!SND_SCALES[soundScale]) {
        const base = 110 * Math.pow(2, soundPitchOct + soundGrainOct + reg * 0.55);
        return clamp(base * Math.pow(2, frac * 2.2 + tiltAbs * 0.5), 24, 8000);
    }
    const step = Math.round(reg * n) + Math.round(soundGrainOct * n)
        + Math.round(frac * (n * 2 - 1))
        + Math.round(tiltAbs * Math.max(2, n * 0.12)) + n * 2;
    return adaptSnap(scaleHz(step));
}

// 短いつぶをひとつ鳴らす
// 爆発の頭で、沈めていたものをいっせいに開ける。
// フェードではなく、聞こえないくらい短い立ち上がり（8ms）で戻す。
// 段差で「プツッ」と鳴らないだけの時間があれば充分で、
// つぶの立ち上がり（20ms〜）より手前に開ききる。
function openAfterBang() {
    if (!actx) return;
    const t = actx.currentTime;
    const open = (p) => {
        if (p.cancelAndHoldAtTime) p.cancelAndHoldAtTime(t);
        else { p.cancelScheduledValues(t); p.setValueAtTime(p.value, t); }
        p.linearRampToValueAtTime(1, t + 0.008);
    };
    if (sndHushD) { open(sndHushD.gain); open(sndHushG.gain); }
    if (sndGrainDuck) open(sndGrainDuck.gain);
    // 開けきるまでのわずかなあいだ、毎フレームの書き込みで邪魔をしない
    sndOpenAt = t + 0.05;
    // 凝縮でつぶを間引いていたぶんも、その場で返す
    sndGrainCredit = grainBudget();
}

function playGrain(kind, frac, strength, tiltAbs) {
    if (!actx || !soundOn || sndGrainCredit <= 0) return;
    frac = sndSafe(frac, 0);
    strength = sndSafe(strength, 0.5);
    tiltAbs = sndSafe(tiltAbs, 0);
    sndGrainCredit -= kind === 'bang' ? 0 : 1;
    const t = actx.currentTime;
    const s = clamp(strength, 0, 1);
    const hz = clamp(sndSafe(grainHz(kind, frac, tiltAbs), 440), 10, 12000);

    // 余韻の長さ。出来事の重さで伸び縮みする
    const kindLen = kind === 'bang' ? 1.8 : kind === 'bounce' ? 1 : kind === 'arrive' ? 0.6 : 0.75;
    const dur = (0.22 + soundDecay * 3.6) * kindLen;
    let peak = 0.10 + s * 0.16;
    if (kind === 'bounce') peak = 0.13 + s * 0.28;
    else if (kind === 'arrive') peak = 0.06 + s * 0.08;
    else if (kind === 'bang') peak = 0.45;

    const place = sndPlaceFor(frac, soundWidthGrain, soundVertGrain);
    const pan = actx.createStereoPanner();
    pan.pan.value = place.pan;
    pan.connect(sndGrainBus);
    const stop = t + dur + 0.15;

    if (soundGrainStyle === 'tone') {
        // のびる音：ひとつの音が立ち上がって、ゆっくり引く
        const g = actx.createGain();
        const lp = actx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = clamp(
            hz * (2 + soundBright * 8 + s * 4 + tiltAbs * 3) * place.tone, 160, 12000);
        lp.connect(g);
        g.connect(pan);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(
            Math.max(0.0002, peak * grainWaveGain(soundGrainWave)), t + 0.02 + soundDecay * 0.08);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        for (let k = 0; k < 3; k++) {
            const o = actx.createOscillator();
            setOscWave(o, soundGrainWave);
            o.frequency.setValueAtTime(clamp(hz * partialRatio(k), 10, 12000), t);
            if (kind === 'bang' && k === 0) {
                o.frequency.exponentialRampToValueAtTime(hz * 0.5, t + dur * 0.7);
            }
            const gk = actx.createGain();
            gk.gain.value = k === 0 ? 1 : soundRich * Math.pow(0.5, k - 1);
            o.connect(gk);
            gk.connect(lp);
            o.start(t);
            o.stop(stop);
        }
        if (soundBreath > 0.02) addStrikeNoise(pan, t, hz, peak * soundBreath * 0.8, 0.09);
    } else {
        // 打つ音：叩かれた金属や竹のように、倍音ごとに違う速さで消えていく。
        // 高い倍音ほど早く落ちるので、鳴りはじめだけが金属的で、
        // あとには低い胴の響きが残る。
        const lp = actx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = clamp(hz * (3 + soundBright * 9) * place.tone, 160, 12000);
        lp.Q.value = 0.6;
        lp.connect(pan);
        for (let k = 0; k < SND_HARM.length; k++) {
            const amp = peak * [1, 0.5, 0.28, 0.16][k] * (k === 0 ? 1 : 0.4 + soundRich)
                * grainWaveGain(soundGrainWave);
            if (amp < 0.0015) continue;
            const o = actx.createOscillator();
            setOscWave(o, soundGrainWave);
            const jitter = 1 + (Math.random() - 0.5) * 0.008;
            o.frequency.setValueAtTime(clamp(hz * partialRatio(k) * jitter, 10, 12000), t);
            const g = actx.createGain();
            const life = dur * [1, 0.66, 0.45, 0.32][k] * (0.6 + soundBright * 0.8);
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(amp, t + 0.004 + k * 0.003);
            g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(0.06, life));
            o.connect(g);
            g.connect(lp);
            o.start(t);
            o.stop(stop);
        }
        // 撥（ばち）が当たる音。これがないと、音の出はじめがのっぺりする
        addStrikeNoise(lp, t, hz, peak * (0.18 + soundBreath * 0.6), 0.05 + soundBreath * 0.12);
    }

    setTimeout(() => { try { pan.disconnect(); } catch (err) { /* すでに外れている */ } },
        Math.ceil((dur + 0.4) * 1000));
}

// 打ちはじめの短い雑音
function addStrikeNoise(dest, t, hz, amp, len) {
    if (amp < 0.002) return;
    const src = actx.createBufferSource();
    src.buffer = sndNoiseBuf;
    src.loop = true;
    const bp = actx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(clamp(hz * 3.2, 60, 9000), t);
    bp.frequency.exponentialRampToValueAtTime(clamp(hz * 1.4, 40, 9000), t + len);
    bp.Q.value = 1.4;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(amp, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    src.connect(bp);
    bp.connect(g);
    g.connect(dest);
    src.start(t + Math.random() * 0.004);
    src.stop(t + len + 0.05);
}

// 出来事を拾う。バーの状態を前のフレームと見くらべるだけなので、
// 動きのしくみ側には手を入れていない。
function scanEvents(elapsedMs) {
    const all = layers.flatMap((l) => l.boids);
    const vRef = Math.max(1e-6, maxSpeed * motionScale);
    let fired = 0;
    for (const b of all) {
        const v = Math.abs(b.speed) / vRef;
        const tiltAbs = Math.abs(Math.sin(b.tilt));
        if (b.sndDir === undefined) {
            b.sndDir = b.direction;
            b.sndSpeed = v;
            b.sndArrived = false;
            b.sndAt = 0;
            continue;
        }
        const ready = elapsedMs - (b.sndAt || 0) > SND_GRAIN_MIN_MS && fired < 3;
        // 止まりかけのバーが小刻みに向きを変えるのは「出来事」ではないので鳴らさない。
        // （震えているだけの場面を静かに保つため）
        const moving = Math.max(v, b.sndSpeed) > 0.18 + sndPacked * soundPack * 0.5;
        // 向きが反転した＝ぶつかって跳ね返った、あるいは向きを変えた
        if (b.direction !== b.sndDir && moving && ready) {
            playGrain(motionMode === 7 ? 'bounce' : 'flip', b.arcFraction,
                clamp(Math.max(v, b.sndSpeed) * 1.4, 0, 1), tiltAbs);
            b.sndAt = elapsedMs;
            fired++;
        } else if (v - b.sndSpeed > 0.7 && ready) {
            // 急に押し出された
            playGrain('flip', b.arcFraction, clamp(v - b.sndSpeed, 0, 1), tiltAbs);
            b.sndAt = elapsedMs;
            fired++;
        } else if (isDialMode(motionMode) && ready) {
            const arrived = !!b.dialArrivedAt;
            if (arrived && !b.sndArrived) {
                playGrain('arrive', b.arcFraction, clamp(0.3 + v, 0, 1), tiltAbs);
                b.sndAt = elapsedMs;
                fired++;
            }
        }
        b.sndDir = b.direction;
        b.sndSpeed = v;
        b.sndArrived = isDialMode(motionMode) ? !!b.dialArrivedAt : false;
    }
    // 爆発した瞬間だけは、まとめて大きく鳴らす
    if (dialBanged && !sndPrevBanged) {
        // 沈めていたぶんは、ここで待たずに開ける。ゆっくり戻すと
        // 爆発の頭が鈍るので、8ミリ秒（つぶの立ち上がりより短い）で全開にする。
        sndHushAmt = 0;
        sndPacked = 0;
        for (const v of sndVoices) v.holdUntil = 0;   // 和音も組み直す
        openAfterBang();
        playGrain('bang', 0.0, 1, 0);
        for (let i = 0; i < 5; i++) {
            const f = Math.random();
            setTimeout(() => playGrain('bounce', f, 0.7, 0.5), 30 + i * 55);
        }
    }
    sndPrevBanged = dialBanged;
    if (motionMode !== sndPrevMode) {
        // 場面が変わっても、つぶは鳴らさない。切り替わりは動きで見えるので、
        // 音で印をつけるとかえって邪魔になる。
        // 長く保っている高さだけ解いて、和音を組み直す。
        for (const v of sndVoices) v.holdUntil = 0;
        sndPrevMode = motionMode;
    }
}

// ============ MODE2：モーターの音 ============
// 実機のバーには「レールを走るモーター」と「首を振るモーター」が
// ひとつずつ付いている。準ダイレクトドライブなので、回転に比例した
// はっきりした唸りが出る。その唸りの高さを見積もって、
//   ・協和 … その整数倍に音を置き、モーター音を「基音」に変えてしまう
//   ・マスキング … その高さを中心にした帯域の雑音を重ねて覆い隠す
// のふたつを、つまみで行き来できるようにしてある。

// 走行モーターの唸り。速さ(mm/秒)から、駆動輪→減速機→電気周波数→主次数、と辿る
function mtrRailHz(mmPerSec) {
    const shaft = mmPerSec / (Math.PI * Math.max(1, mtrWheelMm));   // 駆動輪の回転/秒
    return shaft * mtrGear * mtrPoles * mtrOrder;
}

// 首振りモーターの唸り。バーの角速度(ラジアン/秒)から同じように辿る
function mtrTiltHz(radPerSec) {
    const shaft = Math.abs(radPerSec) / (Math.PI * 2);
    return shaft * mtrTiltGear * mtrPoles * mtrOrder;
}

// バーごとの散らばり。番号から決まるので、毎回同じバーが同じ癖を持つ
function mtrOffsetFor(i) {
    const r = Math.sin(i * 12.9898 + 78.233) * 43758.5453;
    return (r - Math.floor(r)) * 2 - 1;         // -1〜+1
}

function makeMotorVoice(dest) {
    const out = actx.createGain();
    out.gain.value = 0;
    const pan = actx.createStereoPanner();
    out.connect(pan);
    pan.connect(dest || sndMtrBus);

    const osc = actx.createOscillator();
    const oscGain = actx.createGain();
    oscGain.gain.value = 0;
    osc.connect(oscGain);
    oscGain.connect(out);
    osc.start(actx.currentTime + Math.random() * 0.1);

    const bp = actx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 400;
    bp.Q.value = 8;
    const nzGain = actx.createGain();
    nzGain.gain.value = 0;
    mtrNoise.connect(bp);
    bp.connect(nzGain);
    nzGain.connect(out);

    return { out, pan, osc, oscGain, bp, nzGain, wave: '', hz: 0, centre: 0, q: 0, lvl: -1,
        env: 0, st: 0 };
}

// 雑音のもとは1本だけ。声ごとに持つと、同じ音を72回読み出すことになって重い。
function ensureMotorVoices(n) {
    if (!mtrNoise) {
        mtrNoise = actx.createBufferSource();
        mtrNoise.buffer = sndNoiseBuf;
        mtrNoise.loop = true;
        mtrNoise.start(actx.currentTime);
    }
    // 一度にたくさん作るとそこで音が途切れるので、1回に8つまで
    let made = 0;
    while (mtrVoices.length < n && made < 8) {
        // 偶数番が走行、奇数番が首振り
        mtrVoices.push(makeMotorVoice(mtrVoices.length % 2 ? sndMtrTiltBus : sndMtrRailBus));
        made++;
    }
}

function mtrGlideTc() { return 0.01 + Math.pow(1 - mtrGlide, 2) * 1.4; }

// 速度から、鳴らす高さを決める
// ピッチ（段）は12段＝1オクターブの半音として表示しているが、
// 速度ステップのときだけは「スケールの段」に読み替えて動かす。
// 半音の比のまま持ち上げると、たとえば純正律で+7段（×1.4983）は
// 純正5度（3/2＝1.5）から2セントずれ、走行と首振りのあいだで
// ゆっくりした唸りになる。スケールの上をそのまま移せば、
// どちらの音も同じ格子に乗るので唸らない。
function mtrDegShift(semi) {
    return Math.round((sndSafe(semi, 0) / 12) * scaleSteps());
}

function mtrToneHz(hum, norm, i, semi, steps, gap, amt) {
    const fw = clamp(sndSafe(amt, 1), 0, 1);
    const shift = Math.pow(2, clamp(sndSafe(semi, 0), -48, 48) / 12);
    if (mtrMode === 'harmonic') {
        // モーターの唸りの整数倍。バーごとに次数をずらして厚みを出す
        const k = Math.max(1, Math.round(mtrHarm + mtrOffsetFor(i) * mtrSpread * 6));
        return clamp(hum * k * shift, 20, 9000);
    }
    if (mtrMode === 'free') {
        // 無音階。速さがそのまま高さになる（段に落とさない）
        const base = 70 * shift * Math.pow(2, soundPitchOct);
        const spread = mtrOffsetFor(i) * mtrSpread * 0.8;
        return clamp(base * Math.pow(2, norm * fw * 3.2 + spread), 20, 9000);
    }
    // 速度ステップ。速度帯ごとに段を割り当て、スケールの上に落とす。
    // 「段の開き」を上げると、ひとつ上の帯へ行くときにスケールを
    // 何段もまたぐので、帯が少なくても音の変化が大きくなる。
    const nb = Math.max(2, Math.round(steps || 6));
    const gp = Math.max(1, Math.round(gap || 1));
    const band = Math.min(nb - 1, Math.floor(norm * nb));
    const n = scaleSteps();
    // 「速さで高さを変える」は、帯の数を減らすのではなく
    // 帯ひとつぶんの開きを縮める。こうすると段数はぜんぶ使ったまま、
    // 音の高さの振れ幅だけが小さくなる（0で高さが止まる）。
    const step = Math.round(band * gp * fw)
        + Math.round(mtrOffsetFor(i) * mtrSpread * n) + n * 2
        + mtrDegShift(semi);
    return clamp(adaptSnap(scaleHz(step)), 20, 9000);
}

// つまみを動かしたときは、間引きをいったん解いて全声に書き直させる
function mtrTouch() { for (const v of mtrVoices) { v.lvl = -1; v.centre = 0; v.q = 0; } }

function updateMotor(dtMs) {
    if (!sndMtrBus) return;
    const all = layers.flatMap((l) => l.boids);
    ensureMotorVoices(all.length * 2);
    const t = actx.currentTime;
    const tc = mtrGlideTc();
    const dt = Math.max(1, dtMs) / 1000;
    const vRef = Math.max(1e-6, maxSpeed * motionScale);
    const perFrameToMmSec = 60 / Math.max(1e-6, mmToPx);
    // バーが増えるほど声の数も増えるので、1声あたりを絞って総量をそろえる
    const countNorm = 1 / Math.sqrt(Math.max(1, all.length) / 18);
    // 段をかける倍率に直しておく（スケールが1段の幅を決める）
    const railShift = pitchRatio(mtrRailStep);
    const tiltShift = pitchRatio(mtrTiltStep);

    // 速度帯に割り当てるための物差し。走行と首振りでは速さの桁が
    // まったく違ううえ、モードによっても大きく変わる。実測では
    // 首振りは中央値0.02〜0.07rad/秒に対して跳ねるときは0.8rad/秒——
    // 決め打ちの上限だと、ほとんどの時間が最下段に貼りついてしまう。
    // そこで「上から15%くらいのところ」を追いかけて、そこを上限にする。
    // いちばん速い値ではなく分位点を使うので、たまの跳ねでぶれない。
    {
        let rAbove = 0;
        let tAbove = 0;
        for (const b of all) {
            if (Math.abs(sndSafe(b.speed, 0)) / vRef > mtrRailRef) rAbove++;
            const pv = Number.isFinite(b.mtrTiltPrev) ? b.mtrTiltPrev : sndSafe(b.tilt, 0);
            if (Math.abs(sndSafe(b.tilt, 0) - pv) / dt > mtrTiltRef) tAbove++;
        }
        const n = Math.max(1, all.length);
        const TARGET = 0.15;                       // 上から15%が超えている状態を保つ
        mtrRailRef *= 1 + 0.10 * (rAbove / n - TARGET);
        mtrTiltRef *= 1 + 0.10 * (tAbove / n - TARGET);
        mtrRailRef = clamp(sndSafe(mtrRailRef, 1), 0.05, 6);
        mtrTiltRef = clamp(sndSafe(mtrTiltRef, 0.2), 0.004, 6);
    }

    for (let i = 0; i < all.length; i++) {
        const b = all[i];
        // 走行モーター
        const vPx = Math.abs(sndSafe(b.speed, 0));
        const mmSec = sndSafe(vPx * perFrameToMmSec, 0);
        const railNorm = clamp(sndSafe(vPx / vRef / mtrRailRef, 0), 0, 1);
        // 首振りモーター。前のフレームからの角度の変わりぶんで測る
        const tiltNow = sndSafe(b.tilt, 0);
        const prev = Number.isFinite(b.mtrTiltPrev) ? b.mtrTiltPrev : tiltNow;
        const dTilt = tiltNow - prev;
        b.mtrTiltPrev = tiltNow;
        const radSec = sndSafe(Math.abs(dTilt) / dt, 0);
        const tiltNorm = clamp(sndSafe(radSec / mtrTiltRef, 0), 0, 1);

        const place = sndPlaceFor(b.arcFraction, soundWidthMtr, 0);
        const pairs = [
            { v: mtrVoices[i * 2], hum: mtrRailHz(mmSec), norm: railNorm,
              vol: mtrRailVol, wave: mtrRailWave, q: mtrRailQ,
              semi: mtrRailStep, shift: railShift, steps: mtrRailSteps, gap: mtrRailGap },
            { v: mtrVoices[i * 2 + 1], hum: mtrTiltHz(radSec), norm: tiltNorm,
              vol: mtrTiltVol, wave: mtrTiltWave, q: mtrTiltQ,
              semi: mtrTiltStep, shift: tiltShift, steps: mtrTiltSteps, gap: mtrTiltGap },
        ];
        const mix = clamp(mtrBlend, 0, 1) * (Math.PI / 2);
        const cosMix = Math.cos(mix);
        const sinMix = Math.sin(mix);
        const dtE = clamp(dt, 0.001, 0.5);
        const idleHz = mtrIdleHz();
        for (let k = 0; k < 2; k++) {
            const { v, hum: rawHum, norm, vol, wave, q, semi, shift, steps, gap } = pairs[k];
            if (!v) continue;
            if (v.wave !== wave) { setOscWave(v.osc, wave); v.wave = wave; }
            // 止まっていても、保持トルクのぶんの唸りは残る。
            // 唸りの高さを0まで落とさないので、止まりぎわに音が
            // 下へ滑り落ちて「ブツッ」となることもなくなる。
            const hum = Math.max(rawHum, idleHz);
            const moving = norm > mtrFloor ? clamp((norm - mtrFloor) / 0.25, 0, 1) : 0;
            let on;
            let tcHz = tc;
            let humUse = hum;
            let pitchAmt = 1;
            if (k === 1) {
                // 首振りは、動きが短く途切れがちで「キュッキュ」と鳴りやすい。
                // そこで包絡（アタック・ディケイ・サステイン・リリース）を通し、
                // 高さのほうも、速さに引っぱられる量となめらかさを別に持たせる。
                if (moving > 0.001) {
                    if (v.st !== 2) {
                        v.env += dtE / Math.max(0.005, mtrTiltAtk);
                        if (v.env >= 1) { v.env = 1; v.st = 2; }
                    } else {
                        v.env += (mtrTiltSus - v.env)
                            * (1 - Math.exp(-dtE / Math.max(0.02, mtrTiltDec)));
                    }
                } else {
                    v.st = 0;
                    v.env += (0 - v.env) * (1 - Math.exp(-dtE / Math.max(0.02, mtrTiltRel)));
                }
                v.env = clamp(v.env, 0, 1);
                on = Math.max(mtrIdle * 0.22, v.env * (0.55 + 0.45 * moving));
                tcHz = Math.max(0.01, mtrTiltGlide);
                // 追従を0にすると、高さは止まったままで音量だけが動く。
                // 倍音固定は唸りから、速度ステップと無音階は速さから高さを
                // 決めるので、どちらの入口にも同じだけ効かせる。
                pitchAmt = clamp(mtrTiltFollow, 0, 1);
                humUse = idleHz + (hum - idleHz) * pitchAmt;
            } else {
                on = Math.max(mtrIdle * 0.22, moving);
            }
            const lvl = on * vol * 0.021 * waveGain(wave) * countNorm;
            const hz = clamp(sndSafe(mtrToneHz(humUse, norm, i * 2 + k, semi, steps, gap, pitchAmt), 220), 20, 9000);
            const centre = clamp(sndSafe(humUse * shift, 220), 40, 12000);
            // 帯域雑音は、狭く絞るほど通り抜ける量が減る（通す幅が f/Q になる）。
            // 絞っても音量が痩せないよう、√(Q/中心周波数) で持ち上げておく。
            const nzComp = clamp(sndSafe(62 * Math.sqrt(q / centre), 4), 1, 34);
            // 値がほとんど変わっていないものは書き込まない。
            // 72声ぶんの書き込みが毎回全部走ると、音の処理が間に合わずに途切れる。
            if (Math.abs(hz - v.hz) > v.hz * 0.004 + 0.5) {
                setP(v.osc.frequency, hz, t, tcHz, 220);
                v.hz = hz;
            }
            if (Math.abs(centre - v.centre) > v.centre * 0.01 + 1) {
                // 帯域の中心は、音程より鈍く動かす（高いQで速く振ると暴れる）
                setP(v.bp.frequency, centre, t, Math.max(tcHz, 0.08), 220);
                v.centre = centre;
            }
            if (Math.abs(q - v.q) > 0.05) { setP(v.bp.Q, q, t, 0.12, 8); v.q = q; }
            if (Number.isFinite(lvl) && Math.abs(lvl - v.lvl) > 0.0004) {
                setP(v.oscGain.gain, lvl * cosMix * 0.4, t, tc, 0);
                setP(v.nzGain.gain, lvl * sinMix * nzComp, t, tc, 0);
                setP(v.out.gain, 1, t, tc, 1);
                v.lvl = lvl;
            }
            setP(v.pan.pan, clamp(sndSafe(place.pan, 0), -1, 1), t, 0.14, 0);
        }
    }
    // 余った声は黙らせる
    for (let i = all.length * 2; i < mtrVoices.length; i++) {
        setP(mtrVoices[i].out.gain, 0, t, 0.2, 0);
    }
}

function updateSound(elapsedMs, dtMs) {
    if (!actx || !soundOn) return;
    audioWatchdog(elapsedMs);
    if (!actx) return;
    if (soundAlgo === 'motor') {
        // モーターの音は、速さに素直に付いていく必要があるので細かく回す。
        // ただし毎フレームだと声の数だけ書き込みが増えるので25Hzに間引く。
        if (elapsedMs >= mtrNextAt) {
            const step = elapsedMs - (mtrNextAt - 40);
            mtrNextAt = elapsedMs + 40;
            updateMotor(step > 0 && step < 500 ? step : dtMs);
        }
        return;
    }
    // 詰まってきたら、つぶは引っこめる。
    // 音量を下げるだけでなく、鳴らす回数そのものも減らす。
    const duck = clamp(sndPacked, 0, 1) * soundPack;
    if (sndGrainDuck && actx.currentTime >= sndOpenAt) {
        setP(sndGrainDuck.gain, 1 - duck * 0.9, actx.currentTime, 0.25);
    }
    // 沈黙のあいだは、鳴らす回数もいっしょに引く
    const still = clamp(sndHushAmt, 0, 1) * soundHush;
    const budget = grainBudget() * (1 - duck * 0.8) * (1 - still * 0.95);
    sndGrainCredit = Math.min(budget, sndGrainCredit + (dtMs / 1000) * budget);
    scanEvents(elapsedMs);
    if (elapsedMs >= sndNextAnalyseAt) {
        sndNextAnalyseAt = elapsedMs + SND_ANALYSE_MS;
        updateDrone();
    }
}

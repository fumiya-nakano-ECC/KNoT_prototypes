        this.driftPhase = Math.random() * Math.PI * 2;
        this.driftPhase2 = Math.random() * Math.PI * 2;
        this.driftTiltRate = 0.5 + Math.random() * 1.1;
        this.driftTiltPhase = Math.random() * Math.PI * 2;
        this.driftTiltPhase2 = Math.random() * Math.PI * 2;
        this.vibPhase = Math.random() * Math.PI * 2;
        this.vibFreq = (1.4 + Math.random() * 1.1) / 1000;   // rad/ms（周期およそ 2.5〜4.5 秒）

        // MODE10（ライフゲーム）で使う状態
        this.lifeVal = 0;      // 落ち着き具合（0＝動きたい、1＝ここに居たい）
        this.lifeRest = 0;     // 落ち着いたまま過ごした度合い（＝飽き）
        this.lifeNb = 0;       // まわりにいるバーの本数（重みつき）
        this.lifeCom = 0;      // まわりのバーの重心までの、符号つきのずれ（px）
        this.lifeHasNb = false;
        this.lifePress = 0;    // 過密のはみ出し量
        this.lifeStarve = 0;   // 過疎のはみ出し量
        this.lifeBoreMul = 0.6 + Math.random() * 0.8;  // 飽きる速さの個体差

        // MODE11（結晶する文様）で使う状態
        this.rdU = 0;      // 濃度（-1〜1）。これが傾きと粗密の両方を決める
        this.rdBias = 0;   // 濃度の出やすさの個体差（毎周引き直す「地形」）
        this.rdErr = 0;    // 望む車間といまの車間とのずれ

        // MODE12（新規性探索）で使う状態
        this.nsPrevDir = 0;  // 前フレームの向き（向き変えの回数を数えるため）

        // MODE13（個性が育つ）で使う状態。
        // 5つの癖はすべて0（＝全員おなじ）から始まり、経験を積むほど分かれていく
        this.persona = new Float64Array(PERSONA_TRAITS);
        this.perExp = new Float64Array(PERSONA_TRAITS);   // いま溜めている経験
        this.perExpW = new Float64Array(PERSONA_TRAITS);  // その重み（数えた回数）
        this.perEma = new Float64Array(PERSONA_TRAITS);   // 数秒ならした「ふだんの様子」
        this.perEmaOn = new Float64Array(PERSONA_TRAITS); // ならしを始めたかどうか
        this.perPrevDir = this.direction;

        // MODE14（群れない）で使う状態
        this.soloHome = Math.random();   // 自分の居場所
        this.soloFreq = 0.0002;          // 漂いのテンポ（1本ずつ違う）
        this.soloPhase1 = Math.random() * Math.PI * 2;
        this.soloPhase2 = Math.random() * Math.PI * 2;
        this.soloPhase3 = Math.random() * Math.PI * 2;
        this.soloPhase4 = Math.random() * Math.PI * 2;
        this.soloHomeDrift = 0;

        // MODE15（偶然から広がる文様）で使う状態
        this.gesSlot = 0;     // MODE21 席番号と、動きの履歴
        this.gesHv = null;
        this.gesHl = null;
        this.gesW = 0;
        this.gesFill = 0;
        this.gesU = 0;
        this.gesUl = 0;
        this.gesLean = 0;
        this.gesTarget = NaN;
        this.gesVel = 0;
        this.gesAdopt = 0;
        this.chiPhase = 0;    // MODE16 振動子の位相
        this.chiLean = 0;
        this.chiCoh = 0;
        this.todaSite = 0;    // MODE17 内側の鎖のどの席か
        this.todaTarget = NaN;
        this.todaLean = 0;
        this.frsPhase = 0;    // MODE18 ねじれた位相
        this.frsLean = 0;
        this.frsDefect = 0;
        this.avaSite = 0;     // MODE19 歪みと、すべった跡
        this.avaTarget = NaN;
        this.avaSlip = 0;
        this.avaLean = 0;
        this.cpgReq = 0;      // MODE20 いま受けている要求
        this.cpgOpen = 0;
        this.cpgLean = 0;
        this.waAmpCur = NaN;  // その周の柄で実際に出せる倒し方の振れ幅
        this.waSlot = 0;      // 一周のなかでの席番号（結晶に入るときに決める）
        this.waMeltOrder = 0.5;  // 前の文様からどの順に手を離すか
        this.waLean = 0;      // 単位が決めた倒し方
        this.waWantGap = 0;   // 単位が決めた車間
        this.waErr = 0;       // いまの車間とのずれ
        this.waGapNext = 0;   // 実際に出ている車間（採点に使う）
        this.waGapPrev = 0;
        this.gapPrevPx = 0;              // 避け合いを使うときだけ参照する
        this.gapNextPx = 0;

        this.tilt = 0;          // バーの傾き（ラジアン、0＝レールに垂直／+で後ろへ倒れる）
        this.tiltVel = 0;       // バーの角速度（ラジアン/フレーム）
        this.prevLimit = 0;     // 前フレームの限界角（縮む速さを知るために保持）
        this.smoothAccel = 0;   // ならした加速度。バーの傾きはこれに比例する
        this.flipCooldown = 0;  // 向きを変えた直後の待ちフレーム数
        this.flipIntent = false; // 「向きを変えたい」意思。減速して止まってから実際に反転する

        // 1パス目で計算した次フレームの値を、2パス目で反映するための一時保存領域
        this.nextArcFraction = this.arcFraction;
        this.tiltStamp = -1;      // 傾きをこのフレームで計算済みかの印
        this.dialArrivedAt = 0;   // 持ち場に着いた時刻（0＝まだ着いていない）
        this.nextSpeed = this.speed;
        this.nextDirection = this.direction;
        this.nextTilt = this.tilt;
        this.nextTiltVel = this.tiltVel;
        this.nextPrevLimit = this.prevLimit;
        this.nextSmoothAccel = this.smoothAccel;
        this.nextFlipIntent = this.flipIntent;
    }

    // リーダー非表示のときは、動きのルールはリーダーのままでも
    // 一般boidと同じ色・大きさで描画し、外見から区別できないようにする
    showsAsLeader() {
        return this.isLeader && showLeader;
    }

    // 使う色のセット。
    // ・レイヤーの色分けoff → 上下どちらも下レイヤーの色に揃える
    // ・白背景モードでも、リーダー表示かレイヤー色分けを使っているときは
    // 　黒背景と同じ色をそのまま使う（どちらも使っていなければ黒一色）
    palette() {
        const index = colorCodeLayers ? layers.indexOf(this.layer) : 0;
        if (!lightMode) return LAYER_PALETTES[index];
        // 白背景：どちらの見分けも使っていなければ黒一色
        if (!colorCodeLayers && !showLeader) return MONO_PALETTE;
        return showLeader && !colorCodeLayers
            ? LIGHT_LAYER_PALETTES_LEADER_ON[index]
            : LIGHT_LAYER_PALETTES[index];
    }

    // レールの法線方向（枠の外側）へ伸びるバーを描く。
    // バーは進行方向と逆向きに this.tilt だけ傾く（＝先端が後ろに残る）。
    drawBar() {
        const p = getPointOnPerimeter(this.arcFraction);
        const len = getNormalLineLength();

        // レール上を「時計回りに進む向き」の接線ベクトル。外向き法線を90°回すと得られる。
        const tcx = -p.ny;
        const tcy = p.nx;
        // 自分が実際に進んでいる向きの接線
        const tmx = tcx * this.direction;
        const tmy = tcy * this.direction;

        // 法線から、進行方向と逆向き（-進行方向）へ tilt だけ倒す
        const c = Math.cos(this.tilt);
        const s = Math.sin(this.tilt);
        const dx = p.nx * c - tmx * s;
        const dy = p.ny * c - tmy * s;

        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + dx * len, p.y + dy * len);
        const pal = this.palette();
        ctx.strokeStyle = this.showsAsLeader() ? pal.leaderLine : pal.followerLine;
        if (motionMode === 13 && personaShow) {
            // 確認用の表示。実物のバーは塗り分けを変えられないので、これは
            // 設計中に癖の効きを見るためだけのもの。展示ではトグルを切る。
            // 色相＝車間の好み（青が詰めたがり、赤が離れたがり）、
            // 明るさ＝速さの好み、彩度＝落ち着きのなさ。
            const g = this.persona ? this.persona[0] : 0;
            const s = this.persona ? this.persona[1] : 0;
            const r = this.persona ? this.persona[2] : 0;
            const hue = 210 + g * 150;
            const light = 50 + s * 22;
            const sat = 35 + Math.abs(r) * 55;
            ctx.strokeStyle = `hsl(${hue.toFixed(0)}, ${sat.toFixed(0)}%, ${light.toFixed(0)}%)`;
        }
        const baseWidth = showTopPlate ? BAR_WIDTH_PLATE_MM * mmToPx : BAR_LINE_WIDTH;
        ctx.lineWidth = baseWidth * (pal.strokeScale || 1);
        ctx.stroke();
    }

    draw() {
        const p = getPointOnPerimeter(this.arcFraction);
        const pal = this.palette();
        // 表示サイズを縮めたときはドットも一緒に小さくする（小さくなりすぎない下限つき）。
        // モノクロで上レイヤーを細く描くときは、ドットもそれに合わせて少し小さくする。
        const radius = Math.max(2, boidRadius * previewScale * (0.6 + 0.4 * (pal.strokeScale || 1)));
        ctx.beginPath();
        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = this.showsAsLeader() ? pal.leader : pal.follower;
        ctx.fill();
    }
}

// --- レイヤー ---
// まったく同じ仕組みのセットを2つ用意し、同じレールの上に重ねて動かす。
// パラメータ（スライダーの値）は共通で、各レイヤーは自分のドット群だけを持つ。
// ドットの初期位置や速度の癖はレイヤーごとに独立してランダムなので、
// 同じルールでも別々の流れに育っていく。
const layers = LAYER_PALETTES.map((palette) => ({
    palette,
    boids: [],
}));

// 集団判定は上下のレイヤーをまとめて行うので、タイミングも全体で1つ持つ
let nextClusterCheckAt = 0;

// ボイドの初期化（リーダーは誰も持たせず、集団ができたときに動的に生まれる）
function rebuildBoids() {
    for (const layer of layers) {
        layer.boids = Array.from({ length: numBoids }, () => new Boid(layer));
    }
    nextClusterCheckAt = 0;
    boidsReady = true;
    spaceOutStart();
}

// 作りたてのバーは、たまたま重なった位置に置かれることがある。
// そのまま止まっているモード（explosionなど）に入ると重なりが残るので、
// はじめに最小の車間だけ空けておく。
function spaceOutStart() {
    const L = perimeterLength;
    const safe = minDistance * 1.2;
    for (const layer of layers) {
        const bs = layer.boids.slice().sort((a, b) => a.arcFraction - b.arcFraction);
        const n = bs.length;
        if (n < 2 || safe * n >= L) continue;
        for (let it = 0; it < 12; it++) {
            let worst = 0;
            for (let i = 0; i < n; i++) {
                const a = bs[i];
                const c = bs[(i + 1) % n];
                let g = (c.arcFraction - a.arcFraction) * L;
                if (g <= 0) g += L;
                if (g < safe) {
                    const push = (safe - g) / 2 / L;
                    a.arcFraction = ((a.arcFraction - push) % 1 + 1) % 1;
                    c.arcFraction = ((c.arcFraction + push) % 1 + 1) % 1;
                    worst = Math.max(worst, safe - g);
                }
            }
            if (worst === 0) break;
        }
        for (const b of bs) b.nextArcFraction = b.arcFraction;
    }
}
rebuildBoids();

// 1つのレイヤーの全boidを「トラック上を進み、自分の進行方向にいる前のboidを
// 追い抜けない」というルールで進める（進む向きはboidごとにランダムで、
// 対向もあり得る）。干渉を見るのは同じレイヤー内だけで、レイヤーをまたいだ
// ドット同士は互いに影響しない（同じ場所に重なって独立に動く）。
// 前のboidとの位置関係だけで速度が決まるので、このフレーム開始時点の
// スナップショットを基に計算する（1パス目）→計算結果をまとめて反映する
// （2パス目）という手順にして、処理順序によって結果が変わってしまう
// バグを防ぐ。
let simFrameId = 0;

function stepSimulation(layer, elapsedMs) {
    simFrameId++;
    const boids = layer.boids;
    const L = perimeterLength;

    // スライダーの値は「表示サイズ100%のときのpx/フレーム」として扱い、
    // 縮小表示のときは同じ割合で小さくする（見た目の速さを変えないため）
    const effMaxSpeed = maxSpeed * motionScale;
    const effMaxAccel = maxAccel * motionScale;
    const effStartupAccel = startupAccel * motionScale;
    const effBounceEpsilon = BOUNCE_SPEED_EPSILON * motionScale;
    // 結束力・影響力の計算で使うリーダー一覧（レイヤーをまたいで共通）。
    // 上下のレイヤーはすり抜けて物理的には干渉しないが、
    // 「近くのリーダーにつられる」という関係だけは層をまたいで効かせる。
    const leadersSnapshot = layers.flatMap((l) => l.boids).filter((b) => b.isLeader);
    const converging = motionMode === 1 && targetGroupCount > 0;
    const snapshot = boids.map((b) => ({ boid: b, s: b.arcFraction * L }));
    snapshot.sort((a, b) => a.s - b.s);
    const n = snapshot.length;

    // 1パス目
    for (let i = 0; i < n; i++) {
        const cur = snapshot[i];
        const dir = cur.boid.direction;
        // ニュートンのゆりかごで、いままさに弾かれて飛んでいる1本だけに
        // 加速・減速そのものを強くする（発進の鋭さと急停止の効き＝「パチン」感）。
        // 他のバーやモードには一切影響しない、この1本だけの特例。
        const isNewtonTraveler = motionMode === 9 && newton && cur.boid === newton.traveler;
        // 静止した文字盤から動き出す最初の1本（newton.softStart）だけは、
        // この強い加速倍率の代わりに、専用のもっと弱い加速倍率
        // （NEWTON_SOFT_START_ACCEL_MUL）を使い、ふわっとゆっくり立ち上がらせる。
        // 2本目以降の受け渡し（softStartでない）は、これまでどおり
        // 一気に全速へ切り替わる「パチン」という手応えを保つ。
        const newtonAccelMul = isNewtonTraveler
            ? (newton.softStart ? NEWTON_SOFT_START_ACCEL_MUL : NEWTON_ACCEL_BOOST)
            : 1;

        // 自分の進む向きで「前」にあたる仲間を求める（時計回りなら次、反時計回りなら前）
        const frontIndex = dir === 1 ? (i + 1) % n : (i - 1 + n) % n;
        const front = snapshot[frontIndex];

        let gap;
        if (dir === 1) {
            gap = front.s - cur.s;
        } else {
            gap = cur.s - front.s;
        }
        if (gap <= 0) gap += L; // 周回のラップ

        // 物理的に重ならないための最小車間（絶対に守るハード制約）と、
        // リーダー同士がくっつきすぎないよう「好む」広めの車間（先読み減速にだけ効くソフト制約）。
        // ソフト側をハード制約に混ぜると、リーダーが入れ替わった瞬間に必要車間が跳ね上がり、
        // その場で急ブレーキが起きてしまうため、2つを分けている。
        // 速いほど広い車間を保つ（車間時間）。ぎりぎりまで詰めて走ると、
        // 前が急に止まったときに反応する余地がなくなってしまうため。
        // リーダー同士は広めの車間を好む……が、収束モードでは外す。
        // ここを残すとリーダー同士が近づけず、単独のリーダーが他の群れやリーダーと
        // 合体できなくなってしまうため（合体してよい、という前提に合わせる）。
        const bothLeaders = cur.boid.isLeader && front.boid.isLeader && !converging;
        let preferredMinGap = Math.max(
            bothLeaders ? minDistance * LEADER_MIN_GAP_FACTOR : minDistance,
            minDistance + headwayMin + cur.boid.speed * HEADWAY_FRAMES
        );
        if (motionMode === 13) {
            // 車間の好み。ぴったり付きたがる個体と、間合いを取りたがる個体に分かれる。
            // 一周の長さは決まっているので、誰かが空間を多く取れば誰かは詰まる。
            // この取り合いそのものが、性格を分けていく力になっている。
            preferredMinGap = Math.max(minDistance,
                preferredMinGap * clamp(1 + personaOf(cur.boid, 0) * 0.7, 0.5, 2.0));
        }

        // 同じレイヤーの両隣との車間。傾きの制限と、震えの速さ・振れ幅に使う。
        const prev = snapshot[(i - 1 + n) % n];
        const next = snapshot[(i + 1) % n];
        let gapPrev = cur.s - prev.s;
        if (gapPrev <= 0) gapPrev += L;
        let gapNext = next.s - cur.s;
        if (gapNext <= 0) gapNext += L;
        cur.boid.roomPx = Math.min(gapPrev, gapNext);
        cur.boid.gapPrevPx = gapPrev;   // MODE14の避け合いだけが参照する
        cur.boid.gapNextPx = gapNext;

        // 自分の前にある車間が「継ぎ目」かどうか。
        // arc順で自分が手前なら自分の印、逆向きに走っているなら前のバーの印を見る。
        const gapIsSeam = converging && (dir === 1 ? cur.boid.seamAhead : front.boid.seamAhead);
        // 大きな塊を割るために生まれたリーダーは、しばらくのあいだ自分の前を
        // 継ぎ目と同じだけ空けにいく。これで塊がその場所から2つに割れる。
        const splitting = converging && cur.boid.isLeader && cur.boid.splitUntil > elapsedMs;

        // このboidが好む速度。フェーズに応じて効き具合が変わる「ばらつき量」を、
        // 個体固有の癖（固定）と、ゆっくりした時間変動（wobble）の両方に掛ける。
        // これにより同じ個体でも速度が一定にならず、常に少しずつ変化する。
        // 収束モードでは、時間でゆらぐぶんを弱めて「誰が遅いか」を安定させる。
        // 遅いドットの後ろに列ができ、その塊をリーダーが割っていく形にしたいので、
        // 塊の顔ぶれが毎秒入れ替わってしまうと目的の数に落ち着かない。
        // 収束モードでは速度のばらつきを弱める。
        // ばらつきが大きいと、遅いドットのうしろに勝手な渋滞がいくつもでき、
        // 「リーダーが割った数＝グループ数」にならなくなるため。
        // 完全には消さないので、隊列の伸び縮みや追いつきは残る。
        const damp = converging ? CONVERGE_VARIANCE_DAMP : 1;
        const variance = speedVariance * speedVarianceScale * damp;
        const wobble = Math.sin(elapsedMs * cur.boid.wobbleFreq + cur.boid.wobblePhase);
        // 速い揺らぎは「均一フェーズ」でも下限ぶんは残し、速度が完全に一定にならないようにする
        const fastVariance = speedVariance * lerp(FAST_WOBBLE_FLOOR, 1, speedVarianceScale) * damp;
        const wobbleFast = Math.sin(elapsedMs * cur.boid.wobbleFreq2 + cur.boid.wobblePhase2);
        // ばらつきを100%以上に上げると、係数そのものがマイナスになり得る。
        // そのまま掛け合わせると符号が反転して速度が逆に上がってしまうので、
        // 各係数を0以上に丸めてから掛ける（遅い側は下の下限値で止まる）。
        const individualFactor = Math.max(0, 1 + cur.boid.speedFactor * variance);
        const wobbleFactor = Math.max(0, 1
            + wobble * variance * WOBBLE_STRENGTH
            + wobbleFast * fastVariance * FAST_WOBBLE_STRENGTH);
        let preferredSpeed = effMaxSpeed * individualFactor * wobbleFactor;
        preferredSpeed = Math.max(preferredSpeed, effMaxSpeed * 0.1);

        // モードらしさを出し入れするときの「素の速さ」。
        // シーケンスの切り替わり目では、いったんここへ戻してから次の色を付ける。
        const cruiseSpeed = preferredSpeed;
        // MODE26は、Boidsの動きとグループ・数字への動きを、バーごとに混ぜる
        const w22 = motionMode === 26 ? m22BarW(cur.boid) : 0;
        const boidsLike = motionMode === 1 || (motionMode === 26 && w22 < 1);
        if (!boidsLike) {
            // MODE2〜5。共通の巡航速度を、そのモードなりの気分で上げ下げする。
            preferredSpeed = modePreferredSpeed(cur.boid, dir, preferredSpeed, elapsedMs);
        } else if (converging) {
            if (cur.boid.isLeader) {
                // 収束モードのリーダーは、前後のリーダーとの距離が均等になるよう
                // 速度を微調整する。前が近く後ろが遠ければ少し緩めて前を空ける。
                // 全体を指図する仕掛けを置かなくても、リーダーがリング上に散らばり、
                // 結果として同じくらいの大きさのグループに分かれる。
                const spacing = leaderSpacing(cur.boid, dir);
                if (spacing) {
                    const balance = (spacing.behind - spacing.ahead) / (spacing.behind + spacing.ahead);
                    preferredSpeed *= clamp(1 - balance * leaderSpacingGain(), 0.35, 2.0);
                }
            }
            // 継ぎ目は広げにいき、それ以外の車間は空いているぶんだけ詰めにいく（＝結束力）。
            // リング1周のなかで「詰まったところ」と「空いたところ」がはっきり分かれていく。
            // 継ぎ目側は「車間を好む」形（先読み減速）にすると目標が遠いあいだ止まって
            // 待ってしまうので、速度そのものを緩める形にしている。
            // ゆっくりでも進み続けるので、見た目が固まらない。
            if (gapIsSeam || splitting) {
                const want = groupSeamGap();
                preferredSpeed *= clamp(gap / Math.max(1, want), SEAM_SLOW_MIN, 1);
            } else {
                const excess = Math.max(0, gap - preferredMinGap);
                preferredSpeed *= clamp(1 + excess * CLOSE_GAIN, 1, CLOSE_MAX);
            }
            // 等間隔モードでは、割り当てた居場所へ寄せる力を重ねる。
            // 上の「継ぎ目を空ける／詰める」で塊の形を作り、こちらで位置をそろえる。
            if (cur.boid.groupShift !== 0) {
                const along = cur.boid.groupShift * dir;   // 進行方向で見たずれ
                // 「等間隔の強さ」で、寄せる力そのものを変える。
                // 弱いと、持ち場へ向かうのは気持ちていどで、向きの混ざりや
                // 群れの気まぐれがそのまま残る。強いと持ち場へきっちり収まるが、
                // 逆走ぎみのバーが詰まって向きを変えるので、
                // だんだん全体が同じ向きへ流れていく。どちらを取るかのつまみ。
                // 手前のほうで効きが立ち上がるようにしておく（70%でほぼ本気）
                const e = Math.pow(clamp(evenBlend, 0, 1), 0.55);
                const gain = lerp(EVEN_MOVE_GAIN, EVEN_MOVE_GAIN_MAX, e);
                const lo = lerp(EVEN_MOVE_MIN, EVEN_MOVE_MIN_HARD, e);
                const hi = lerp(EVEN_MOVE_MAX, EVEN_MOVE_MAX_HARD, e);
                preferredSpeed *= clamp(1 + along * gain, lo, hi);
            }
        } else if (cur.boid.isLeader) {
            // 収束させていないときのリーダーは、一般boidより速く走ろうとする
            preferredSpeed *= leaderSpeedMultiplier;
        } else {
            // 収束させていないときは、前方のリーダーの勢いにつられて速く走る（＝影響される）。
            // 直前の1台だけでなく届く範囲で判定し、上下どちらのレイヤーのリーダーでも効く。
            const pull = leaderPullAhead(cur.boid, dir, leadersSnapshot);
            if (pull > 0) {
                preferredSpeed *= 1 + (leaderInfluenceWeight / 10) * 0.5 * pull;
            }
        }
        if (motionMode === 26 && w22 > 0 && w22 < 1) {
            preferredSpeed = lerp(preferredSpeed, m22StructSpeed(cur.boid, dir), w22);
        }
        // 切り替わり目のなじませ。
        // 漂いから出てきたところでは、素の巡航へ一度戻すと勢いが揃ってしまうので、
        // 「そのバーが持っていた速さ」から新しいモードの速さへ移していく。
        // 漂いそのものの最中は、慣性を邪魔しないよう何もしない。
        if (motionMode !== 7 && prevMotionMode === 7 && (cur.boid.handoff || 0) < 1) {
            // 漂いから出たところ。勢いはそのまま持っていて、
            // そこから新しいモードの速さへ、ゆっくり引き渡す。
            const from = Number.isFinite(cur.boid.hoSpeed) ? cur.boid.hoSpeed : cruiseSpeed;
            preferredSpeed = lerp(from, preferredSpeed, cur.boid.handoff || 0);
        } else if (modeInfluence < 1 && motionMode !== 7) {
            const from = Number.isFinite(cur.boid.hoSpeed) ? cur.boid.hoSpeed : cruiseSpeed;
            preferredSpeed = lerp(from, preferredSpeed, barInfluence(cur.boid));
        }

        const headOn = front.boid.direction !== dir;
        const hardGap = Math.max(0, gap - minDistance);       // 重ならないために必要な空き
        const softGap = Math.max(0, gap - preferredMinGap);   // 保ちたい車間までの空き

        // --- 前の仲間への「先読み減速」---
        // ぶつかる直前まで走ってから急停止するのではなく、
        // 残りの距離で無理なく減速しきれる速度を先に計算し、それを上限にする。
        // これにより、近づくにつれて自然に速度が落ち、
        // ・同じ向き → 前の相手と同じ速度に収束して滑らかに合流（追従）する
        // ・向かい合わせ → お互いゆるやかに止まり、やがて向きを変えて離れていく
        const brake = Math.max(1e-6, effMaxAccel * newtonAccelMul * BRAKE_STRENGTH);
        let safeSpeed;
        if (headOn) {
            // 正面から近づく場合は相手も同じだけ減速するので、空き距離を半分ずつ使う
            safeSpeed = Math.sqrt(2 * brake * (softGap * 0.5));
        } else {
            // 同じ向きの追従。前の相手がいまから全力で減速して止まったとしても、
            // 自分も空き距離の中で止まりきれる速度を上限にする。
            //   （自分の停止距離）≦（空き距離）＋（相手の停止距離）
            //   v²/2b ≦ softGap + v_front²/2b   →   v ≦ √(v_front² + 2·b·softGap)
            // 前の相手の速度をそのまま足すより厳しいが、こうしておくと
            // 前が急に止まっても自分は無理なく減速でき、カクつかずに合流できる。
            safeSpeed = Math.sqrt(front.boid.speed * front.boid.speed + 2 * brake * softGap);
        }
        // 漂いで正面から来る相手とは、減速せずにそのままぶつかって跳ね返る。
        // 漂いを出たあとも、この「止まらなさ」をフェードのあいだ少しずつ手放す。
        // 漂いそのものは減速なし（ぶつかって跳ね返る）。
        // なじませ中は「止まらなさ」を6割までにとどめ、残りは先読み減速に任せる。
        // ここを0にしてしまうと、跳ね返り待ちのあいだに車間が潰れることがある。
        const driftContact = motionMode === 7 ? 1
            : (prevMotionMode === 7 ? clamp(1 - (cur.boid.handoff || 0), 0, 0.6) : 0);
        // ニュートンのゆりかごで飛んでいる1本には、この「前もって滑らかに減速する」
        // 先読み減速はかけない。本物のゆりかごは、ぶつかる直前まで一定速度で走り、
        // 当たった瞬間に止まる（＝じわじわ減速しながら近づくのではない）。
        // これをかけたままだと、行き先の持ち場（止まっているグループ）に近づくにつれて
        // ふつうのバーと同じように早くから速度を落としはじめてしまい、
        // 最後の数十mmを長い時間かけて忍び寄るような、間延びした動きに見えてしまう
        // （「XIで止まる」と感じられていた動きの正体はこれだった）。
        // 実際にぶつからないようにする最後の安全網（少し下のspeedCap）は
        // この先読みとは別物として残るので、外しても重なりは起きない。
        if (!isNewtonTraveler) {
            if (!(headOn && driftContact > 0)) {
                preferredSpeed = Math.min(preferredSpeed, safeSpeed);
            } else {
                preferredSpeed = Math.min(preferredSpeed,
                    lerp(preferredSpeed, safeSpeed, 1 - driftContact));
            }
        }

        // --- 向きを変える「意思」---
        // その場で急に反転すると、後ろに続く仲間が急ブレーキを強いられる。
        // そこで、反転したくなったらまず目標速度を0にして滑らかに減速し、
        // 止まりきってから向きを変えて、改めてゆっくり加速していく。
        let flipIntent = cur.boid.flipIntent;
        let newCooldown = Math.max(0, cur.boid.flipCooldown - 1);
        if (!flipIntent && newCooldown === 0
            && !(motionMode === 1 || (motionMode === 26 && w22 < 0.5))) {
            // MODE2〜5では、そのモードが向きを指定したときだけ回れ右する
            // 切り替わり目（モードらしさが薄いあいだ）は、向きの指図もしない
            // 切り替わり目では、全部のバーがいっせいに回れ右すると、
            // そこだけ号令がかかったように見える。効きはじめをバーごとにずらす。
            const gate = cur.boid.flipGate || 0.5;
            const want = modeInfluence > gate ? modeDesiredDir(cur.boid, elapsedMs) : 0;
            const jammed = cur.boid.speed < effBounceEpsilon;
            if (want !== 0 && want !== dir) {
                flipIntent = true;
            } else if (jammed
                && Math.random() < BOUNCE_CHANCE * (motionMode === 13
                    // 落ち着きのなさ。詰まったときに、すぐ向きを変えて抜けようと
                    // する個体と、辛抱して待つ個体に分かれる
                    ? clamp(1 + personaOf(cur.boid, 2) * 0.95, 0.05, 2.2) : 1)
                && (motionMode !== 7 || headOn)
                && motionMode !== 9 && motionMode !== 11
                && !(motionMode >= 22 && motionMode <= 25)
                && !(motionMode === 26 && m22 && m22.phase !== 'gather')) {
                // MODE11（結晶する文様）でも、この気まぐれな反転は外しておく。
                // 文様が固まって静止しているバーが、意味もなく向きを変え直して
                // しまい、落ち着いたはずの並びがまた崩れはじめるため。
                // 漂いでは、前に追いついただけなら向きを変えず、押すだけ。
                // 向きが変わるのは、正面から来た相手とにらみ合ったときだけ。
                // ニュートンのゆりかごでは、持ち場に近いバーはすでに数字の形へ
                // ほぼ傾き終えている（後ろのバーに阻まれてぴったりの位置までは
                // 詰め切れていないだけ）。ここでの気まぐれな反転を許すと、
                // ほぼ止まっているだけの画が、数秒おきにランダムへ逆向き
                // （鏡写しの傾き）へパッと切り替わって見えてしまう。
                // 行き先を向く力（上のwant）と詰め直しはほかで働くので、
                // このモードでは外しても詰まったまま固まる心配はない。
                flipIntent = true;
            } else if (isDialMode(motionMode) && cur.boid.ego > 0.6
                && Math.random() < RANDOM_DIRECTION_FLIP_CHANCE) {
                flipIntent = true;   // 目を覚ましたバーは、気まぐれに向きも変える
            }
        } else if (!flipIntent && newCooldown === 0) {
            const jammed = cur.boid.speed < effBounceEpsilon;
            // 収束モードでは、詰まったときに「群れの多数派の向き」へそろえる。
            // 向かい合ったまま固まった列を、いちばん早くほどける向きに倒すための整列で、
            // すでに多数派と同じ向きなら反転せず待つ（無駄な往復を減らす）。
            const aligned = !converging || cur.boid.groupDir === 0
                || cur.boid.groupDir === dir;
            if (converging && !aligned) {
                // 群れの向きとずれていたら、詰まっていなくてもそろえにいく。
                // 反転はいったん減速して止まってから起きるので、急な反転にはならない。
                flipIntent = true;
            } else if (jammed && aligned && Math.random() < BOUNCE_CHANCE) {
                // 前が詰まって進めない状態から抜け出すために向きを変える
                flipIntent = true;
            } else if (Math.random() < RANDOM_DIRECTION_FLIP_CHANCE * (converging ? CONVERGE_FLIP_DAMP : 1)) {
                // 詰まっていなくても、ごくまれに自発的に向きを変えたくなる
                flipIntent = true;
            }
        }
        if (flipIntent) preferredSpeed = 0; // まずは減速して止まる

        // 加減速をなめらかにする（急発進・急ブレーキを防ぐ）。
        // 加速側は、止まっている状態からは startupAccel、巡航速度に近づくほど maxAccel を使う。
        // これにより、向きが切り替わった直後の動き出しだけをゆるやかにできる。
        // 減速側は先読み減速に追従できるよう、少し強めまで許す。
        const speedRatio = effMaxSpeed > 0 ? clamp(cur.boid.speed / effMaxSpeed, 0, 1) : 1;
        const accelUp = lerp(effStartupAccel * newtonAccelMul, effMaxAccel * newtonAccelMul, speedRatio);
        const dv = preferredSpeed - cur.boid.speed;
        let newSpeed = cur.boid.speed + (dv > 0 ? Math.min(dv, accelUp) : Math.max(dv, -brake));
        newSpeed = Math.max(0, newSpeed);

        // 安全網：先読み減速が間に合わない場合でも、前の仲間と重ならないよう
        // 速度を直接制限する＝これが「追い抜けない」の最後の砦。
        // 通常はここまで到達する前に上の先読み減速で速度が落ちている。
        const speedCap = headOn ? hardGap / 2 : hardGap;
        newSpeed = Math.min(newSpeed, speedCap);

        // 止まりきったら、ここで実際に向きを変える
        let newDirection = dir;
        if (flipIntent && newSpeed < effBounceEpsilon) {
            newDirection = -dir;
            newSpeed = 0;
            flipIntent = false;
            newCooldown = FLIP_COOLDOWN_FRAMES;
        }
        cur.boid.nextFlipIntent = flipIntent;

        cur.boid.nextSpeed = newSpeed;
        cur.boid.nextDirection = newDirection;
        cur.boid.nextFlipCooldown = newCooldown;
        cur.boid.nextArcFraction = ((((cur.s + newSpeed * dir) % L) + L) % L) / L;

        let radialAmount = 0;

        // --- バーの傾き（慣性）---
        // 実際に生じた加速度をならして、その大きさに比例した傾きを与える。
        // 加速中は後ろへ倒れ（tilt > 0）、減速中は前へ振り出される（tilt < 0）。
        const rawAccel = newDirection !== dir ? 0 : newSpeed - cur.boid.speed;
        const smoothAccel = newDirection !== dir
            ? 0 // 向きが変わる瞬間は加速度の履歴をリセットして、傾きの飛びを防ぐ
            : cur.boid.smoothAccel + (rawAccel - cur.boid.smoothAccel) * ACCEL_SMOOTH;
        cur.boid.nextSmoothAccel = smoothAccel;

        // 「加減速の強さ」いっぱいで加速したときに最大の傾きになるようにする。
        // ニュートンのゆりかごで弾かれている1本は、加速そのものを強くしてあるので、
        // 基準もその強くした分に合わせて正規化する（そうしないと、動き出した瞬間に
        // 傾きが上限まで振り切れて、カクッと急に傾いて見えてしまう）。
        const maxTilt = (maxTiltDeg * Math.PI) / 180;
        const tiltAccelNorm = effMaxAccel * newtonAccelMul;
        const accelTilt = maxTilt * clamp(tiltAccelNorm > 0 ? smoothAccel / tiltAccelNorm : 0, -1, 1);

        // 加速度がほぼゼロ（一定速度で巡航中）でもバーが固まって見えないよう、
        // 吊り下がった棒が残り揺れしているような、ごく小さな揺れを常に足す。
        // 揺れの速さにも個性が出る。止められている時間が長かった個体ほど
        // 手持ち無沙汰で小刻みになり、悠々と流れてきた個体はゆったり揺れる
        const swayRate = cur.boid.swayFreq * (motionMode === 13
            ? clamp(1 + personaOf(cur.boid, 4) * 0.85, 0.25, 2.2) : 1);
        const sway = Math.sin(elapsedMs * swayRate + cur.boid.swayPhase);
        let targetTilt = accelTilt + maxTilt * IDLE_SWAY_RATIO * sway;
        if (motionMode === 13) {
            // 倒れぐせ。前のめりぎみか、後ろに残りぎみか。
            // 装置で出せる角度が狭いので、ここは控えめにしておく
            targetTilt += maxTilt * 0.16 * personaOf(cur.boid, 3);
        }
        if (motionMode === 7) {
            // 漂いは、爆発のあとの続き。レールの中心から外へ向かう放射状のまま、
            // 傾きもゆっくり揺らぐだけ（加速度の結果ではない）。
            // 揺らぎは「画面から見た倒れ方（lean）」で決める。
            // 進む向きが反転しても画面上の角度が変わらないので、
            // 回れ右のたびにバーがカクンと跳ねることがない。
            // 隣の倒れ方に合わせて毎フレーム押し込むとカクカクするので、
            // ここでは隣を見ない。代わりに、隣が近いほど揺らぎ自体を控える
            // （放射状にそろっているかぎり、バーどうしは交わらない）。
            const w = (Math.PI * 2) / Math.max(1000, driftPeriodSec * 1000);
            const a = Math.sin(elapsedMs * w * cur.boid.driftTiltRate + cur.boid.driftTiltPhase);
            const b2 = Math.sin(elapsedMs * w * cur.boid.driftTiltRate * 0.53
                + cur.boid.driftTiltPhase2);
            // 隣が近いほど揺らぎを消す。まっすぐ放射状に向いているかぎり、
            // バーは中心から伸びる光線のようなもので、けっして交わらない。
            const roomForTilt = Math.min(gapPrev, gapNext);
            const near = clamp(roomForTilt / (minDistance * 3), 0, 1);
            const ampLean = Math.sin((driftTiltDeg * Math.PI) / 180)
                * near * near
                * clamp(roomForTilt / Math.max(1, getNormalLineLength() * 1.4), 0, 1);
            const leanTarget = clamp(radialLeanAt(cur.boid.arcFraction)
                + ampLean * (a * 0.7 + b2 * 0.3), -0.98, 0.98);
            targetTilt = Math.asin(clamp(-leanTarget * newDirection, -1, 1));
        }
        // 漂いから出てきた直後は、まだ放射状に向いている。
        // そこから新しいモードの倒し方へ、フェードの時間をかけて移っていく。
        // （ここを飛ばすと、全部のバーが数秒で一斉に向きを戻してしまう）
        const barInf = modeInfluence >= 1 ? 1 : barInfluence(cur.boid);
        // 漂いから出たあとの戻り具合を、バーごとに進める。
        // フェードの秒数には縛られない。ゆっくり、一定の速さで戻る。
        if (motionMode === 7) {
            cur.boid.handoff = 0;
        } else if (prevMotionMode === 7 && (cur.boid.handoff || 0) < 1) {
            cur.boid.handoff = Math.min(1, (cur.boid.handoff || 0) + HANDOFF_STEP);
        }
        const back = motionMode !== 7 && prevMotionMode === 7
            ? (cur.boid.handoff || 0) : 1;
        if (motionMode !== 7 && prevMotionMode === 7 && back < 1
            && !isDialMode(motionMode)) {
            const rl = radialLeanAt(cur.boid.arcFraction);
            const radialTilt = Math.asin(clamp(-rl * newDirection, -1, 1));
            targetTilt = lerp(radialTilt, targetTilt, back * back * (3 - 2 * back));
        }
        if (isDialMode(motionMode)) {
            // 文字盤モードでは、傾きは「加速度の結果」ではなく形そのもの。
            // ニュートンのゆりかごでは、合流した瞬間に dialLean が新しい数字の
            // 値へ切り替わるので、そのまま使うとそこでカクッと角度が跳ぶ。
            // 着いた瞬間の古い値から、少しずつ（TURN_RISE_MSかけて）新しい値へ
            // 混ぜていくことで、「合流してからじわっと形になる」を作る。
            let effDialLean = cur.boid.dialLean;
            if (motionMode === 9 && cur.boid.dialLeanBlendStart) {
                const bt = ramp01(elapsedMs - cur.boid.dialLeanBlendStart, 0, TURN_RISE_MS);
                effDialLean = lerp(cur.boid.dialLeanFrom, cur.boid.dialLean, bt);
            }
            // dialLean は画面上の倒し方（＋でarcの進む向きへ）なので、
            // 進行方向によって符号が入れ替わるぶんをここで戻している。
            const want = clamp(-effDialLean * newDirection, -1, 1);
            // ごくわずかな揺れだけ残して、置物のように固まって見えないようにする
            let shaped = Math.asin(want)
                + maxTilt * DIAL_SWAY_RATIO * sway * (1 - dialFreeze);
            // 縮むほど「形」は立っていく（隣と間隔がなくなれば、倒れている余地もない）。
            // 先に形だけを潰しておき、そのあとに震えを足す。
            // そうしないと、いちばん圧縮された瞬間に震えまで消えてしまう。
            shaped *= 1 - dialContract * 0.9;
            // 震えは角度にも出る。振れ幅は小さいまま、速さだけが上がっていく。
            if (dialVib > 0) {
                const v = vibParamsFor(cur.boid);
                shaped += Math.sin(elapsedMs * cur.boid.vibFreq * v.freq
                    + cur.boid.vibPhase) * v.tilt * dialVib;
            }
            // 首を振るタイミング。持ち場から遠いあいだは、ふつうのバーのまま走り、
            // 近づくにつれて数字の形（放射状の倒し方）へ移っていく。
            // 「首振りのタイミング」スライダーで、どのくらい手前から傾け始めるかを決める。
            // ニュートンのゆりかごでは、行き先までの距離を目安にできない
            // （弾かれた瞬間に行き先が遠くへ変わるだけなので、着いていなくても
            // 「遠い」と誤判定してしまい、まだ隣にぴったりくっついている最中に
            // 普通の走り方の傾きへ戻そうとしてカクッと跳ねてしまう）。
            // そのため文字盤の傾き方はそのまま使い、代わりに dialLean の値そのものを
            // 着いてからゆっくり書き換える（下の dialLeanBlendStart）ことで
            // 「合流してからじわっと形になる」を実現している。
            // 「遠いと誤判定してしまう」問題が起きるのは、実際に弾かれて
            // 飛んでいる1本（newton.traveler）だけ。休んでいる他のバーや、
            // 最初にバラバラの位置から文字盤を組み上げる場面（フォーメーション）は
            // 従来どおり距離ベースでじわじわ傾いていく見え方のままにしておく。
            const isFlyingTraveler = motionMode === 9 && newton && cur.boid === newton.traveler;
            if (dialTurnMm < DIAL_TURN_FAR_MM && !isFlyingTraveler) {
                const dMm = Math.abs(dialOffsetFor(cur.boid)) / mmToPx;
                // 手前から徐々に傾ける分
                const byDistance = dialTurnMm > 0
                    ? 1 - ramp01(dMm, dialTurnMm * 0.35, dialTurnMm) : 0;
                // 着いてから振る分（スライダーを右いっぱいにすると、これだけになる）
                const byArrival = cur.boid.dialArrivedAt
                    ? ramp01(elapsedMs - cur.boid.dialArrivedAt, 0, TURN_RISE_MS) : 0;
                const formAmount = Math.max(byDistance, byArrival);
                if (formAmount < 1) shaped = lerp(targetTilt, shaped, formAmount);
            }
            // 爆発してからは、レールの中心から外へ向かう「放射状」に向き直る。
            radialAmount = dialRadial * (1 - cur.boid.reform);
            if (dialRadial > 0.001) {
                const rl = radialLeanAt(cur.boid.arcFraction);
                const radialTilt = Math.asin(clamp(-rl * newDirection, -1, 1));
                if (radialAmount > 0) shaped = lerp(shaped, radialTilt, radialAmount);
            }
            // 文字盤モードの傾きは「形」なので、一般の限界角ではなく
            // 両隣の実際の倒れ方から、先端が追い越さない範囲を出して収める。
            // 車間 gapNext に対し、自分の倒れ方が「前のバーの倒れ方＋車間ぶん」を
            // 超えなければ、先端の順番は入れ替わらない。
            // 縮んで車間がなくなるほど範囲も狭まるので、
            // 数字の形はひとりでに立って崩れていく。
            // シーケンスの切り替わり目では、いつもの「加速でしなる」傾きから
            // 数字の形へ、少しずつ移る。混ぜたあとに下の安全な範囲へ収める。
            if (modeInfluence < 1) shaped = lerp(targetTilt, shaped, barInf);
            targetTilt = clampLeanToNeighbours(shaped, prev.boid, next.boid,
                gapPrev, gapNext, newDirection, cur.boid);
        } else if (motionMode === 15) {
            // 単位が決めた倒し方をそのまま写す。i mod k で役が決まるので、
            // 傾きの並びも 18/k 回きっちりくり返される
            const ampW = Number.isFinite(cur.boid.waAmpCur) ? cur.boid.waAmpCur : waAmp();
            const leanW = clamp((cur.boid.waLean || 0) * ampW, -0.95, 0.95);
            const shapedW = Math.asin(clamp(-leanW * newDirection, -1, 1));
            const mixedW = modeInfluence < 1
                ? lerp(targetTilt, shapedW, barInfluence(cur.boid)) : shapedW;
            targetTilt = clampLeanToNeighbours(mixedW, prev.boid, next.boid,
                gapPrev, gapNext, newDirection, cur.boid);
        } else if (motionMode === 26 && (cur.boid.m22Form || 0) > 0.001) {
            // 数字の画の倒し方へ。開き具合に合わせて、ふだんの傾きから移っていく
            const shaped22 = Math.asin(clamp(-(cur.boid.m22Lean || 0) * newDirection, -1, 1));
            const mixed22 = lerp(targetTilt, shaped22, cur.boid.m22Form);
            targetTilt = clampLeanToNeighbours(mixed22, prev.boid, next.boid,
                gapPrev, gapNext, newDirection, cur.boid);
        } else if (motionMode >= 16 && motionMode <= 25) {
            // この5つはどれも、内側で回している鎖の状態を倒し方へ写す。
            // 最後は文字盤・和柄と同じで、両隣の実際の倒れ方から見て
            // 先端が追い越さない範囲へ収める
            const lc = modeChainLean(cur.boid);
            const ampC = Math.sin((modeChainTiltDeg() * Math.PI) / 180);
            const leanC = clamp(lc * ampC, -0.95, 0.95);
            const shapedC = Math.asin(clamp(-leanC * newDirection, -1, 1));
            const mixedC = modeInfluence < 1
                ? lerp(targetTilt, shapedC, barInfluence(cur.boid)) : shapedC;
            targetTilt = clampLeanToNeighbours(mixedC, prev.boid, next.boid,
                gapPrev, gapNext, newDirection, cur.boid);
        } else if (motionMode === 11) {
            // 濃度をそのまま倒し方に写す。濃いところは片側へ、薄いところは
            // 反対側へ倒れるので、傾きの連なりそのものが縞として読める。
            // 振れ幅は装置で出せる範囲に抑え、最後は文字盤モードと同じ
            // 「両隣の実際の倒れ方から見て、先端が追い越さない範囲」へ収める。
            const amp = Math.sin((rdTiltDeg * Math.PI) / 180);
            const lean = clamp((cur.boid.rdU || 0) * amp, -0.95, 0.95);
            const shaped11 = Math.asin(clamp(-lean * newDirection, -1, 1));
            // モードの切り替わり目では、いつもの傾きから少しずつ移る
            const mixed = modeInfluence < 1
                ? lerp(targetTilt, shaped11, barInfluence(cur.boid)) : shaped11;
            targetTilt = clampLeanToNeighbours(mixed, prev.boid, next.boid,
                gapPrev, gapNext, newDirection, cur.boid);
        }

        // 角を回るぶんの向きの変化を、時間方向にならす。
        // 漂いは「画面の向きをそのまま保つ」モードなので、ここでは何もしない。
        {
            const pAt = getPointOnPerimeter(
                Number.isFinite(cur.boid.nextArcFraction)
                    ? cur.boid.nextArcFraction : cur.boid.arcFraction);
            const phi = Math.atan2(pAt.ny, pAt.nx);
            if (!Number.isFinite(cur.boid.normLag)) cur.boid.normLag = phi;
            let dPhi = phi - cur.boid.normLag;
            while (dPhi > Math.PI) dPhi -= Math.PI * 2;
            while (dPhi < -Math.PI) dPhi += Math.PI * 2;
            dPhi = clamp(dPhi, -TURN_LAG_MAX, TURN_LAG_MAX);
            if (motionMode === 7) {
                cur.boid.normLag = phi;          // 漂いのあいだは遅れを持たない
            } else {
                cur.boid.normLag = phi - dPhi * (1 - TURN_EASE);
                targetTilt += dPhi * newDirection;
            }
        }

        // 隣のバーとぶつからないための傾きの限界角を求める。
        // バーを傾けると、先端はレールに沿って len*sin(tilt) だけ前後にずれる。
        // このずれを「前後の車間のうち狭い方」の半分未満に収めれば、
        // 両隣も同じ制限を守っているので、バー同士は交差しない
        // （前傾・後傾どちらでも、ずれの絶対値を抑えれば同じ理屈で成り立つ）。
        const barLen = getNormalLineLength();
        let limit = Math.PI / 2;
        if (n > 1 && barLen > 0) {
            const allowedTipShift = Math.min(gapPrev, gapNext) * BAR_TIP_GAP_SAFETY;
            limit = Math.asin(clamp(allowedTipShift / barLen, 0, 1));
        }
        if ((isDialMode(motionMode) && cur.boid.dialFrac !== null) || motionMode === 25
            || (motionMode === 26 && (cur.boid.m22Form || 0) > 0.001)) {
            // 目標角はすでに「両隣の実際の倒れ方」から安全な範囲に収めてあるので、
            // ここでの左右対称な見積もりは外す（そうしないと形も放射状も作れない）。
            limit = Math.max(limit, Math.abs(targetTilt));
        } else if (motionMode === 15 && n > 1 && barLen > 0) {
            // 和柄モードも、狙う角度は「両隣の実際の倒れ方」から安全な範囲へ
            // 収めてある。ただ上の見積もりは前後の車間の「狭いほう」で決まるので、
            // V（広い側）と∧（狭い側）が交互に来る柄では、広い側で倒せるはずの
            // 角度まで狭い側に合わせて削られ、どの柄もほとんど直立になっていた。
            // そこで、この見積もりだけは「広いほう」の車間で立て直す。
            // 外してしまうと、角の内側で本数を増やしたときに逃げ場がなくなるので、
            // 上限そのものは残しておく
            // ただし広いほうで立て直すのは「柄を組んでいるあいだ」だけ。
            // 何も決まっていないカオスの前半は、守るべき形がないので、
            // 狭いほうで見積もる安全側のままにしておく
            // ほどけている最中はまだ文様が立っているので、見積もりも広いほうのまま。
            // ここをカオス開始と同時に狭いほうへ戻すと、その1フレームだけ
            // 全バーの傾きが削られ、ほどけ始めにぴくりと角度が飛んでいた
            // さらに、そのバーが狙いの席に着いているぶんだけに限る。
            // 席をレールの角へ釘づけにしてからは、遠くまで歩くバーが出る。
            // 歩いている途中は「どちら側の車間を使う柄か」がまだ決まっていないので、
            // 広いほうで見積もると、向かい合って歩いてきた二本が先端で交差した
            const seated = clamp(1 - Math.abs(cur.boid.waErr || 0)
                / Math.max(1e-6, minDistance * 1.5), 0, 1);
            const g = ((waFlock && waFlock.phase === 'chaos')
                ? Math.max(waFlock.grip || 0, 1 - (waFlock.melt ?? 1)) : 1) * seated;
            const lo = Math.min(gapPrev, gapNext);
            const wide = lo + g * (Math.max(gapPrev, gapNext) - lo);
            limit = Math.asin(clamp((wide * BAR_TIP_GAP_SAFETY) / barLen, 0, 1));
        }

        // --- 傾きを角速度で動かす ---
        // 傾きを毎フレーム直接クランプすると、限界に触れた瞬間に角速度が0になり、
        // 回転がぴたりと止まって見えてしまう。そこで角速度を状態として持ち、
        // 限界が近づくにつれて角速度を落としていく。
        // 傾きは「進行方向に対して」の角度なので、向きが反転すると同じ見た目の
        // バーでも符号が入れ替わる。反転時に符号を合わせておくことで、
        // 画面上のバーの向きと回転が途切れずにつながる。
        const framePathFlip = newDirection !== dir ? -1 : 1;
        const prevTilt = cur.boid.tilt * framePathFlip;
        const prevTiltVel = cur.boid.tiltVel * framePathFlip;

        // 目標角へ向かう角速度（目標に近づくほど遅くなる比例制御）
        const target = clamp(targetTilt, -limit, limit);
        const velCap = TILT_MAX_VEL
            * (isDialMode(motionMode) && dialVib > 0 ? 1 + 2 * dialVib : 1);
        // 漂いは、比例制御をゆるめて、ふわりと追いかける
        const tiltGain = motionMode === 7 ? TILT_GAIN * 0.45 : TILT_GAIN;
        let desiredVel = clamp((target - prevTilt) * tiltGain * (1 + 2 * dialVib),
            -velCap, velCap);

        // 限界角への「先読み減速」。残りの角度の中で無理なく止まりきれる
        // 角速度を上限にするので、限界に届くころには角速度がほぼ0になっていて、
        // 急に回転が止まったようには見えない。
        // さらに、隣が近づいてきて限界角そのものが縮んでいる場合は、
        // 縮む速さから少し先の限界角を見積もり、早めに退き始める。
        const limitRate = limit - cur.boid.prevLimit; // 負なら限界角が縮んでいる
        const closingLimit = limit + Math.min(0, limitRate) * LIMIT_LOOKAHEAD_FRAMES;
        const roomPos = Math.max(0, closingLimit - prevTilt);
        const roomNeg = Math.max(0, closingLimit + prevTilt);
        desiredVel = Math.min(desiredVel, Math.sqrt(2 * TILT_BRAKE * roomPos));
        desiredVel = Math.max(desiredVel, -Math.sqrt(2 * TILT_BRAKE * roomNeg));

        // 角加速度も制限して、角速度そのものが跳ばないようにする
        // 文字盤モードで震えているあいだだけ、角の動きの上限をゆるめる
        const angAccel = TILT_ANGULAR_ACCEL
            * (isDialMode(motionMode) && dialVib > 0 ? 1 + (VIB_ACCEL_BOOST - 1) * dialVib : 1);
        let tiltVel = prevTiltVel + clamp(desiredVel - prevTiltVel, -angAccel, angAccel);
        let tilt = prevTilt + tiltVel;

        // 安全網：車間が急に詰まって限界角が縮みきった場合でも交差はさせない。
        // このとき角速度は0ではなく「限界角が動く速さ」に合わせる。
        // 押してくる壁に沿って動く形になるので、回転が急に止まって見えない。
        // 漂いから移ってきた直後は、限界角の外に倒れているバーがいる。
        // そこへいきなり当てると一撃で起こされてしまうので、
        // 「いまの角度」から本来の限界角まで、フェードをかけて締めていく。
        let wall = limit;
        if (prevMotionMode === 7 && back < 1 && !isDialMode(motionMode)) {
            wall = lerp(Math.max(limit, Math.abs(prevTilt)), limit, back);
        }
        if (tilt > wall) { tilt = wall; tiltVel = Math.min(tiltVel, limitRate); }
        else if (tilt < -wall) { tilt = -wall; tiltVel = Math.max(tiltVel, -limitRate); }

        // 壁に押された場合でも角速度が一気に飛ばないよう、
        // 最終的な角速度の変化量にも上限を設けておく
        const maxVelChange = angAccel * TILT_WALL_ACCEL_FACTOR;
        tiltVel = prevTiltVel + clamp(tiltVel - prevTiltVel, -maxVelChange, maxVelChange);

        // 最後の砦：実際の線分で両隣と交わらないところまで戻す。
        // 上の左右対称な限界角を外しているモード（文字盤・和柄）では、
        // 角速度の行き過ぎで狙いより深く倒れることがあるので、ここで受け止める
        if ((isDialMode(motionMode) || motionMode === 15 || motionMode === 25
            || (motionMode === 26 && (cur.boid.m22Form || 0) > 0.001)) && n > 1) {
            const safe = tiltWithoutCross(cur.boid, newDirection, prevTilt, tilt,
                prev.boid, next.boid);
            if (safe !== tilt) {
                tilt = safe;
                tiltVel = tilt - prevTilt;
            }
        }

        // 漂いの傾きは「レールの中心から外を向く」ことそのもの。
        // 角を曲がるときはレールに対する角度が大きく変わるが、
        // 画面から見た向きはゆっくりしか変わらない。
        // なので限界角や角速度で追うのではなく、目標をそのまま追いかける。
        // 放射状に向いているかぎり、バーは中心から伸びる光線どうしなので交わらない。
        // 漂いを出たあとも、この追い方から角速度の追い方へ、少しずつ移す。
        const driftLike = motionMode === 7 ? 1
            : (prevMotionMode === 7 && !isDialMode(motionMode) ? 1 - back : 0);
        if (driftLike > 0) {
            // 追い方はこちらに任せきる。
            // 「角速度で追った値」と混ぜてしまうと、混ぜた結果が次のフレームの
            // 出発点になるので、わずかな引きがみるみる積み重なって、
            // フェードの長さに関わらず1秒ほどで倒れきってしまう。
            // 移り変わりは、上で目標角そのものを混ぜることで作る。
            const step = (targetTilt - prevTilt) * (0.02 + 0.20 * driftEase(elapsedMs));
            tilt = prevTilt + clamp(step, -velCap, velCap);
            tiltVel = tilt - prevTilt;
            // 放射状に向いているかぎり交わらない——とはいえ、
            // 揺らぎや押し合いで崩れることもある。実際の線分で見て、
            // 交わるときだけ最小限だけ戻しておく。
            if (n > 1) {
                const safe = tiltWithoutCross(cur.boid, newDirection, prevTilt, tilt,
                    prev.boid, next.boid);
                if (safe !== tilt) { tilt = safe; tiltVel = tilt - prevTilt; }
                // それでもまだ交わっているとき（隣が動いてきた場合など）は、
                // 立てる向きへ静かに逃がす。ふだんは通らない道。
                const len = getNormalLineLength();
                const frac = Number.isFinite(cur.boid.nextArcFraction)
                    ? cur.boid.nextArcFraction : cur.boid.arcFraction;
                const mine = barSegmentAt(frac, tilt, newDirection, len);
                let still = false;
                for (const o of [prev.boid, next.boid]) {
                    if (!o || o === cur.boid) continue;
                    const fresh = o.tiltStamp === simFrameId;
                    const seg = barSegmentAt(
                        fresh ? o.nextArcFraction : o.arcFraction,
                        fresh ? o.nextTilt : o.tilt,
                        fresh ? o.nextDirection : o.direction, len);
                    if (segmentsHit(mine, seg)) { still = true; break; }
                }
                if (still) {
                    // 逃がす速さにも蓋をしておく。一気に起こすと、そこだけ
                    // バーが跳ねたように見えてしまう（数フレームかけて抜ける）。
                    tilt += clamp((0 - tilt) * 0.35, -SEAM_TURN_CAP, SEAM_TURN_CAP);
                    tiltVel = tilt - prevTilt;
                }
            }
        }
        // --- 切り替わり目だけの仕上げ ---
        // ここまでは「レールに対する角度」で考えてきたが、目に映るのは画面上の向き。
        // レールの曲がりぶんも含めた、画面の上での振れ幅そのものに蓋をする。
        // （角を回るぶんは自然な動きなので、そこは妨げない）
        // ここから先は、どのモードでも必ず通す最後の仕上げ。
        // 目に映るのは画面上の向きなので、その1フレームぶんの振れ幅に蓋をする。
        // 交差を避けるための引き戻しも、ここを通ってから効く。
        // （一気に起こすと、そこだけ映像が飛んだように見えてしまう）
        if (perimeterLength > 0) {
            const pPrev = getPointOnPerimeter(cur.boid.arcFraction);
            const pNext = getPointOnPerimeter(cur.boid.nextArcFraction);
            let dPhi = Math.atan2(pNext.ny, pNext.nx) - Math.atan2(pPrev.ny, pPrev.nx);
            while (dPhi > Math.PI) dPhi -= Math.PI * 2;
            while (dPhi < -Math.PI) dPhi += Math.PI * 2;
            // モードごとの「ふだんの振れ幅」に合わせて蓋の高さを変える。
            // 角を回るぶん（dPhi）は自然な動きなので、そこは妨げない。
            const base = motionMode === 7 ? DRIFT_TURN_CAP
                : (prevMotionMode === 7 ? HANDOFF_TURN : SEAM_TURN_CAP);
            const cap = Math.max(base, Math.abs(dPhi));
            // 画面上の向き ＝ 法線の向き − direction × 傾き
            const wasRel = -cur.boid.direction * cur.boid.tilt;
            let rel = -newDirection * tilt;
            const lo = wasRel - dPhi - cap;
            const hi = wasRel - dPhi + cap;
            if (rel < lo || rel > hi) {
                rel = clamp(rel, lo, hi);
                tilt = -rel * newDirection;
                tiltVel = tilt - prevTilt;
            }
        }

        cur.boid.nextTilt = tilt;
        cur.boid.nextTiltVel = tiltVel;
        cur.boid.nextPrevLimit = limit;
        // このフレームで計算済みの印。隣を見るときに、古い値ではなく
        // 決まったばかりの値を使えるようにしておく。
        cur.boid.tiltStamp = simFrameId;
    }

    // 2パス目：計算済みの値をまとめて反映する
    for (const item of snapshot) {
        item.boid.speed = item.boid.nextSpeed;
        item.boid.direction = item.boid.nextDirection;
        item.boid.flipCooldown = item.boid.nextFlipCooldown;
        item.boid.arcFraction = item.boid.nextArcFraction;
        item.boid.tilt = item.boid.nextTilt;
        item.boid.tiltVel = item.boid.nextTiltVel;
        item.boid.prevLimit = item.boid.nextPrevLimit;
        item.boid.smoothAccel = item.boid.nextSmoothAccel;
        item.boid.flipIntent = item.boid.nextFlipIntent;
    }
}

// トラック上でboid同士の車間が十分に狭く（minDistanceのCLUSTER_GAP_FACTOR倍以下）つながっている
// 範囲を1つの「集団」として、周回リング全体を集団の配列に分割する。
//
// 集団の判定だけは上下のレイヤーをまたいで行う。動き（追従・追い越し禁止・
// バーの干渉回避）はレイヤー内で完結したままなので、2つのレイヤーは互いに
// ぶつからずに重なって動くが、「どこに集団ができているか」は両レイヤーの
// 密度を合わせて決まり、リーダーもその合同の集団から選ばれる。
function detectClusters(boids) {
    const L = perimeterLength;
    const snapshot = boids.map((b) => ({ boid: b, s: b.arcFraction * L }));
    snapshot.sort((a, b) => a.s - b.s);
    const n = snapshot.length;
    if (n === 0) return [];

    const gaps = snapshot.map((item, i) => {
        const next = snapshot[(i + 1) % n];
        let gap = next.s - item.s;
        if (gap <= 0) gap += L;
        return gap;
    });

    // 一定のしきい値より広く空いたところで切る。
    // 収束モードでは、いくつに分けたいかによって「切れ目」と呼ぶべき空きの
    // 大きさも変わるので、リーダー同士の間隔を基準にしきい値を決める。
    // （そうしないと、隊列の中のちょっとした空きまで切れ目に数えてしまう）
    let threshold = minDistance * CLUSTER_GAP_FACTOR;
    if (targetGroupCount > 0) {
        // 収束モードでは、実際に開けにいっている継ぎ目の広さを基準にする。
        // こうすると「見えている切れ目」と「集団の判定」がずれない。
        threshold = Math.max(threshold, groupSeamGap() * CONVERGE_BREAK_RATIO);
    }
    const breakIndices = [];
    for (let i = 0; i < n; i++) {
        if (gaps[i] >= threshold) breakIndices.push(i);
    }

    if (breakIndices.length === 0) {
        // 切れ目がない＝全員がつながって1つの集団（トラック全周が1つの塊）
        return [snapshot.map((item) => item.boid)];
    }

    const clusters = [];
    for (let k = 0; k < breakIndices.length; k++) {
        const prevBreak = breakIndices[(k - 1 + breakIndices.length) % breakIndices.length];
        const startIdx = (prevBreak + 1) % n;
        const endIdx = breakIndices[k];
        const cluster = [];
        let i = startIdx;
        while (true) {
            cluster.push(snapshot[i].boid);
            if (i === endIdx) break;
            i = (i + 1) % n;
        }
        clusters.push(cluster);
    }
    return clusters;
}

// 集団の人数に応じて、その集団にいるべきリーダーの人数を決める。
// 3人ごとに1人増える：3〜5人→1人、6〜8人→2人、9〜11人→3人…
//
// ただし2グループ以上に収束させているときは、ドットが1本だけでも
// 1つのグループとみなし、必ずリーダーを1人立てる。
// （そうしないと、少人数のグループだけリーダー不在になり、
// 　見た目のグループ数がスライダーの指定と合わなくなる）
// 収束させないときに、各集団へ何人のリーダーを立てるかを決める。
// 全体で freeLeaderCount 人になるよう、集団の大きさに比例して配る。
function desiredLeaderCounts(clusters) {
    const sizes = clusters.map((c) => c.length);
    const sum = sizes.reduce((a, b) => a + b, 0);
    const want = clusters.map(() => 0);
    const total = Math.min(freeLeaderCount, sum);
    if (sum === 0 || total <= 0) return want;

    // まずは比例配分の整数部分だけ配る
    const exact = sizes.map((size) => (size / sum) * total);
    let assigned = 0;
    for (let i = 0; i < want.length; i++) {
        want[i] = Math.min(sizes[i], Math.floor(exact[i]));
        assigned += want[i];
    }

    // 余りは「本来の取り分に対する取りこぼしが大きい集団」から順に配る
    const order = exact
        .map((e, i) => ({ i, frac: e - Math.floor(e) }))
        .sort((a, b) => b.frac - a.frac);
    for (let k = 0; assigned < total && k < order.length * 4; k++) {
        const idx = order[k % order.length].i;
        if (want[idx] < sizes[idx]) { want[idx]++; assigned++; }
    }
    return want;
}

// 集団の先頭（進行方向でいちばん前）のドットを返す
function frontOfCluster(cluster) {
    const dir = cluster[0].direction;
    let best = cluster[0];
    let bestKey = -Infinity;
    for (const b of cluster) {
        // リング上の位置を、集団の先頭が最大になるように測る
        const key = b.arcFraction * dir;
        if (key > bestKey) { bestKey = key; best = b; }
    }
    return best;
}

// 収束モードのリーダー調整。
// 考え方は「リーダーは基本的に固定。動くのは資格のほうだけ」。
//   ・いちど立ったリーダーは、そのまま走り続ける（気まぐれな交代はしない）
//   ・別のリーダーを持つグループ同士がくっつくのは止めない
//   ・その結果ひとつの塊にリーダーが2人になったら、
//     あとから就いたほうの資格を、リーダーのいない別の塊へ渡す
// リーダーの総数はグループ数のまま変わらないので、合体してもすぐ
// どこかで新しい塊が育ちはじめる、という循環になる。
function updateLeadersForConvergence(clusters, elapsedMs) {
    const all = layers.flatMap((l) => l.boids);
    const leaders = all.filter((b) => b.isLeader);
    const target = Math.min(targetGroupCount, all.length);

    // リング上での2点間の距離（近いほうまわり）
    const L = perimeterLength;
    const ringDist = (a, b) => {
        let d = Math.abs(a.arcFraction - b.arcFraction) * L;
        return Math.min(d, L - d);
    };
    const distToNearestLeader = (boid, from) => {
        let best = Infinity;
        for (const l of from) if (l !== boid) best = Math.min(best, ringDist(boid, l));
        return best;
    };

    if (leaders.length < target) {
        // 新しいリーダーは「いまのリーダーからいちばん離れたところ」に生まれる。
        // つまりいちばん長く続いている列の真ん中あたりが割れることになり、
        // リーダー同士も自然と散らばって、集団の大きさが偏りにくい。
        const pool = all.filter((b) => !b.isLeader);
        if (pool.length > 0) {
            let best = pool[0];
            let bestDist = -1;
            for (const b of pool) {
                const d = leaders.length === 0 ? 0 : distToNearestLeader(b, leaders);
                if (d > bestDist) { bestDist = d; best = b; }
            }
            best.isLeader = true;
            best.leaderSince = elapsedMs;
        }
        return;
    }

    if (leaders.length > target) {
        // 多すぎる分は「いちばん近いリーダー同士」の片方を降ろす
        // （そのグループは隣とつながって1つになる）
        let victim = leaders[0];
        let bestDist = Infinity;
        for (const l of leaders) {
            const d = distToNearestLeader(l, leaders);
            if (d < bestDist) { bestDist = d; victim = l; }
        }
        victim.isLeader = false;
        return;
    }

    // ここから先は、リーダーの人数は合っている状態。
    // あとは「1つの塊にリーダーが何人いるか」だけを見て、資格を移す。
    if (target <= 0) return;
    // 資格の移動には間を置く。判定は0.4秒ごとなので、そのままだと
    // グループが多いときに毎回のように移動が起きて落ち着かなくなる。
    if (elapsedMs < nextLeaderMoveAt) return;

    const surplus = [];     // 資格を手放してもらうリーダー
    const vacant = [];      // リーダーがいない塊
    for (const cluster of clusters) {
        const inCluster = cluster.filter((b) => b.isLeader);
        if (inCluster.length === 0) {
            vacant.push(cluster);
        } else if (inCluster.length > 1) {
            // 長くリーダーをやっているほうを残す（＝先にいたリーダーは動かさない）
            inCluster.sort((a, b) => a.leaderSince - b.leaderSince);
            for (let i = 1; i < inCluster.length; i++) surplus.push(inCluster[i]);
        }
    }
    if (surplus.length > 0 && vacant.length > 0) {
        // 大きい塊から先に資格を受け取る（人数が多いほど「グループ」として見えるため）。
        // 1本だけの塊は、渡す先が他にないときだけの受け皿にする。
        // （割ったばかりの塊から落ちた1本にすぐ資格が戻ると、割った意味がなくなる）
        let pool = vacant.filter((c) => c.length >= 2);
        if (pool.length === 0) pool = vacant;
        pool.sort((a, b) => b.length - a.length);
        const moves = Math.min(surplus.length, pool.length);
        for (let i = 0; i < moves; i++) {
            surplus[i].isLeader = false;
            // 新しいリーダーは塊のまんなかのバー。端だとすぐ隣の塊に吸われてしまう。
            const cluster = pool[i];
            const heir = cluster[Math.floor(cluster.length / 2)];
            heir.isLeader = true;
            heir.leaderSince = elapsedMs;
        }
        nextLeaderMoveAt = elapsedMs + LEADER_MOVE_INTERVAL;
        return;
    }

    // 1本だけで独立しているリーダーは、まだ「群れ」になっていない。
    // それが複数いて、しかも塊の数がリーダーの数に届いていないなら、
    // 単独のリーダーの資格を、いちばん大きい塊の中へ移して割りにいく。
    const solos = clusters.filter((c) => c.length === 1 && c[0].isLeader);
    if (solos.length < 2 || clusters.length > leaders.length) return;

    const big = clusters
        .filter((c) => c.length >= SPLIT_MIN_CLUSTER)
        .sort((a, b) => b.length - a.length)[0];
    if (!big) return;

    // 手放すのは、いちばんあとにリーダーになった単独のバー（古参は動かさない）
    const donor = solos
        .map((c) => c[0])
        .sort((a, b) => b.leaderSince - a.leaderSince)[0];
    const heir = big[Math.floor(big.length / 2)];
    if (heir.isLeader || heir === donor) return;

    donor.isLeader = false;
    heir.isLeader = true;
    heir.leaderSince = elapsedMs;
    heir.splitUntil = elapsedMs + SPLIT_DURATION_MS;   // ここから前を空けて塊を割る
    nextLeaderMoveAt = elapsedMs + LEADER_MOVE_INTERVAL;
}

function maybeUpdateClusterLeaders(elapsedMs) {
    if (elapsedMs < nextClusterCheckAt) return;
    nextClusterCheckAt = elapsedMs + CLUSTER_CHECK_INTERVAL;

    // 上下のレイヤーのドットをひとまとめにして集団を判定する
    const clusters = detectClusters(layers.flatMap((l) => l.boids));
    lastClusterCount = clusters.length;
    if (clusters.length === 0) return;

    if (targetGroupCount > 0 && motionMode === 1) {
        updateLeadersForConvergence(clusters, elapsedMs);
        return;
    }

    const wanted = desiredLeaderCounts(clusters);
    for (let ci = 0; ci < clusters.length; ci++) {
        const cluster = clusters[ci];
        const desiredCount = wanted[ci];
        const currentLeaders = cluster.filter((b) => b.isLeader);

        if (currentLeaders.length < desiredCount) {
            const candidates = cluster.filter((b) => !b.isLeader);
            let need = desiredCount - currentLeaders.length;
            while (need > 0 && candidates.length > 0) {
                const idx = Math.floor(Math.random() * candidates.length);
                candidates[idx].isLeader = true;
                candidates.splice(idx, 1);
                need--;
            }
        } else if (currentLeaders.length > desiredCount) {
            const toDemote = currentLeaders.slice();
            let excess = currentLeaders.length - desiredCount;
            while (excess > 0 && toDemote.length > 0) {
                const idx = Math.floor(Math.random() * toDemote.length);
                toDemote[idx].isLeader = false;
                toDemote.splice(idx, 1);
                excess--;
            }
        } else if (desiredCount > 0 && Math.random() < LEADER_ROTATION_CHANCE) {
            const outgoing = currentLeaders[Math.floor(Math.random() * currentLeaders.length)];
            const candidates = cluster.filter((b) => !b.isLeader);
            if (candidates.length > 0) {
                const incoming = candidates[Math.floor(Math.random() * candidates.length)];
                outgoing.isLeader = false;
                incoming.isLeader = true;
            }
        }
    }
}

// --- モードの切り替え ---
// そのモードで意味のない項目は隠して、パネルを短く保つ。
function applyModeVisibility() {
    for (const row of document.querySelectorAll('#controls [data-modes]')) {
        const modes = row.getAttribute('data-modes').split(' ');
        row.style.display = modes.includes(String(motionMode)) ? '' : 'none';
    }
    // 常に見せるが、このモードでは変えられない項目はグレーにして触れなくする
    for (const row of document.querySelectorAll('#controls [data-enable-modes]')) {
        const on = row.getAttribute('data-enable-modes').split(' ').includes(String(motionMode));
        row.classList.toggle('is-off', !on);
        for (const el of row.querySelectorAll('input, select')) el.disabled = !on;
    }
    // 「漂う広さ」は、居場所に留まる強さが 0 のときは効かない
    {
        const r = document.getElementById('soloRangeSlider');
        if (r) {
            const on = soloKeep > 0;
            r.closest('.control-row').classList.toggle('is-off', !on);
            r.disabled = !on;
        }
    }
    // 中身がひとつも見えないまとまりは、下線ごと隠す
    for (const g of document.querySelectorAll('#paneMotion .ctl-group')) {
        const any = [...g.querySelectorAll('.control-row')].some((r) => r.style.display !== 'none');
        g.style.display = any ? '' : 'none';
    }
}

document.getElementById('motionModeSelect').addEventListener('change', (e) => {
    prevMotionMode = motionMode;
    motionMode = parseInt(e.target.value, 10);
    // バーの長さは天板の表示状態だけで決まる（モードには左右されない）。
    // 念のため、モードを切り替えるたびにも現在の天板の状態に揃え直しておく。
    barLengthMm = showTopPlate ? BAR_LENGTH_LONG_MM : BAR_LENGTH_SHORT_MM;
    // explosion へ移るときは、いまの倒し方（数字の形）を持ち越したいので控えておく
    const prevDialLean = new Map();
    for (const b of layers.flatMap((l) => l.boids)) {
        prevDialLean.set(b, b.dialLean);
        // 切り替わった瞬間の速さ。新しいモードの速さへは、ここから移っていく
        b.hoSpeed = Math.abs(b.speed);
        // 向きを変えはじめる頃合い（バーごとにばらす）
        b.flipGate = 0.15 + Math.random() * 0.6;
        // 移り変わりを始める頃合いも、バーごとにずらす
        b.fadeOffset = Math.random() * 0.4;
        b.normLag = undefined;
        b.handoff = 0;
    }
    // モードをまたぐ内部状態は持ち越さない
    startles = [];
    predator = null;
    wavePhase = 0;
    nextStartleAt = 0;
    for (const b of layers.flatMap((l) => l.boids)) {
        b.seamAhead = false;
        b.groupShift = 0;
        b.groupDir = 0;
        b.dialFrac = null;
        b.dialLean = 0;
        b.packFrac = null;
        b.evenFrac = null;
        b.burstSpeed = 0;
        b.reform = 0;
        b.ego = 0;
        if (motionMode !== 1) b.isLeader = false;
    }
    if (motionMode === 5) {
        // 文字盤は36画ちょうどなので、バーの数は18×2に固定する
        if (numBoids !== 18) {
            numBoids = 18;
            const el = document.getElementById('numBoidsSlider');
            el.value = '18';
            el.dispatchEvent(new Event('input'));
        }
        buildDialTargets();
        assignDialSlots();
        packDialTargets();
        dialFormPending = true;
        dialWaitFrom = performance.now() - startTime;
        dialCollapse = 0;
        dialCollapsePrev = 0;
        dialBanged = false;
    } else if (motionMode === 7) {
        // いまの勢いを覚えて、そのまま流れつづける
        seedDriftHomes();
    } else if (motionMode === 6) {
        // explosion は文字盤を作らない。いまの並びをそのまま持ち場として、
        // 近くにいるバーどうしが1つの塊になって縮んでいく。
        // 直前がローマ数字なら、数字の倒し方はそのまま引き継ぐ。
        for (const b of layers.flatMap((l) => l.boids)) b.dialLean = prevDialLean.get(b) || 0;
        seedExplosionTargets();
        dialFormPending = false;
        dialCollapse = 0;
        dialCollapsePrev = 0;
        dialBanged = false;
        dialReturning = false;
        dialClockStart = performance.now() - startTime;   // 時計もここから
    } else if (motionMode === 8) {
        // MODE8に入るたびに、重みを乱数から作り直して学習をゼロから始める
        mlResetFlock(performance.now() - startTime);
    } else if (motionMode === 9) {
        // MODE9に入るたびに、文字盤を組み直してニュートンのゆりかごを最初から始める
        newtonReset(performance.now() - startTime);
    } else if (motionMode === 10) {
        // ライフゲームは「まだどこにも落ち着いていない」ところから始める。
        // 飽きの溜まり具合だけは最初からばらしておくと、
        // 最初の一巡から、あちこちで別々に群れが出来はじめる。
        for (const b of layers.flatMap((l) => l.boids)) {
            b.lifeVal = 0;
            b.lifeRest = Math.random() * 0.3;
            b.lifeNb = 0;
            b.lifeCom = 0;
            b.lifeHasNb = false;
            b.lifePress = 0;
            b.lifeStarve = 0;
        }
    } else if (motionMode === 11) {
        // 入るたびに種をまき直して、いちから結晶させる
        rdSeed(performance.now() - startTime);
    } else if (motionMode === 12) {
        // 入るたびに、記憶も重みも白紙から探索し直す
        nsResetFlock(performance.now() - startTime);
    } else if (motionMode === 13) {
        // 入るたびに、全員まっさらな同じ性質から育て直す
        personaReset(performance.now() - startTime);
    } else if (motionMode === 14) {
        // 入るたびに、住所とテンポを配り直す
        soloReset(performance.now() - startTime);
    } else if (motionMode === 15) {
        // 入るたびに、柄の探索をいちから始める
        waReset(performance.now() - startTime);
    } else if (motionMode === 16) {
        chiReset(performance.now() - startTime);
    } else if (motionMode === 17) {
        todaReset(performance.now() - startTime);
    } else if (motionMode === 18) {
        frsReset(performance.now() - startTime);
    } else if (motionMode === 19) {
        avaReset(performance.now() - startTime);
    } else if (motionMode === 20) {
        cpgReset(performance.now() - startTime);
    } else if (motionMode === 21) {
        gesFlock = null;
        gesReset(performance.now() - startTime);
    } else if (motionMode === 22) {
        trfReset(performance.now() - startTime);
    } else if (motionMode === 23) {
        ffReset(performance.now() - startTime);
    } else if (motionMode === 24) {
        psReset(performance.now() - startTime);
    } else if (motionMode === 26) {
        if (numBoids !== 18) {
            numBoids = 18;
            const el = document.getElementById('numBoidsSlider');
            el.value = '18';
            el.dispatchEvent(new Event('input'));
        }
        m22Reset(performance.now() - startTime);
    } else if (motionMode === 25) {
        // 文字盤は36画ちょうどなので、バーの数は18×2に固定する
        if (numBoids !== 18) {
            numBoids = 18;
            const el = document.getElementById('numBoidsSlider');
            el.value = '18';
            el.dispatchEvent(new Event('input'));
        }
        nrReset(performance.now() - startTime);
    }
    // 切り替わりの前後は、振れ幅に蓋をしておく期間にする
    seamCapUntil = (performance.now() - startTime)
        + Math.max(2500, (typeof seqFadeIn === 'number' ? seqFadeIn : 0) * 1.8);
    applyModeVisibility();
});

    if (p < P_SHRINK_FULL) return '収縮';
    if (p < P_SHRINK_TO) return '沈黙';

}

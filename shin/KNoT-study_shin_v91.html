<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>boids test v0.1</title>
    <style>
        /* ============================================================
           見た目のもとになる値。色はここだけで決めて、
           暗い/明るいの切り替えも同じ名前を差し替えるだけにしてある。
           ============================================================ */
        :root {
            --bg: #0d0e0f;
            --panel: rgba(24, 26, 27, 0.82);
            --line: rgba(255, 255, 255, 0.09);
            --line-strong: rgba(255, 255, 255, 0.16);
            --text: #e6e7e6;
            --label: rgba(230, 231, 230, 0.82);
            --muted: rgba(230, 231, 230, 0.5);
            --accent: #5f95ff;
            --accent-solid: #5f95ff;
            --accent-soft: rgba(95, 149, 255, 0.16);
            --accent-ink: #08142a;
            /* 編集中でも色を変えない項目のために、素の色を控えておく */
            --accent-base: #5f95ff;
            --accent-solid-base: #5f95ff;
            --accent-ink-base: #08142a;
            --edit: #e0a355;
            --edit-soft: rgba(224, 163, 85, 0.14);
            --track: rgba(255, 255, 255, 0.14);
            --field: rgba(255, 255, 255, 0.055);
            --shadow: 0 1px 8px rgba(0, 0, 0, 0.38);
            --chev: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='9' height='6' viewBox='0 0 9 6'><path d='M1 1l3.5 3.5L8 1' fill='none' stroke='%23909392' stroke-width='1.3' stroke-linecap='round'/></svg>");
            --pad: 11px;
            --gap: 9px;
        }
        body.light {
            --bg: #f5f4f2;
            --panel: rgba(255, 255, 255, 0.95);
            --line: rgba(0, 0, 0, 0.075);
            --line-strong: rgba(0, 0, 0, 0.14);
            --text: #1b1c1b;
            --label: rgba(27, 28, 27, 0.85);
            --muted: rgba(27, 28, 27, 0.5);
            --accent: #2b74f0;
            --accent-solid: #1f5fd0;
            --accent-soft: rgba(43, 116, 240, 0.14);
            --accent-ink: #ffffff;
            --accent-base: #2b74f0;
            --accent-solid-base: #1f5fd0;
            --accent-ink-base: #ffffff;
            --edit: #b8720c;
            --edit-soft: rgba(184, 114, 12, 0.1);
            --track: rgba(0, 0, 0, 0.13);
            --field: rgba(0, 0, 0, 0.035);
            --shadow: 0 1px 6px rgba(0, 0, 0, 0.08);
        }

        html, body { height: 100%; }
        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
                "Noto Sans JP", sans-serif;
            font-size: 11px;
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
        }

        /* --- 全体の置きかた --- */
        #app {
            display: flex;
            align-items: stretch;
            gap: 14px;
            height: 100%;
            padding: 14px;
            box-sizing: border-box;
        }
        #stage { flex: 1; min-width: 120px; position: relative; }
        canvas { display: block; width: 100%; height: 100%; }

        #seqWrap {
            flex: 0 0 198px;
            z-index: 2;
            min-width: 0;
            align-self: flex-start;
            max-height: 100%;
            position: relative;
        }
        #seqWrap.closed { display: none; }
        #seqPanel { width: 100%; }

        /* --- パネル --- */
        #controls, #seqPanel {
            flex: 0 0 198px;
            box-sizing: border-box;
            /* 影は絵より前に出しておく。うしろだと、
               キャンバスの四角でぷつりと切られて見える */
            position: relative;
            z-index: 2;
            min-width: 0;
            align-self: flex-start;
            max-height: 100%;
            overflow-y: auto;
            /* 中身の高さで縦棒が出たり消えたりすると、そのぶん中身の幅が
               変わってしまう。棒の場所は常に空けておく */
            scrollbar-gutter: stable;
            overscroll-behavior: contain;
            padding: var(--pad);
            background: var(--panel);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--line);
            border-radius: 10px;
            box-shadow: var(--shadow);
            color: var(--text);
            transition: border-color .18s, box-shadow .18s;
        }
        #controls::-webkit-scrollbar, #seqPanel::-webkit-scrollbar { width: 6px; }
        #controls::-webkit-scrollbar-thumb, #seqPanel::-webkit-scrollbar-thumb {
            background: var(--line-strong);
            border-radius: 3px;
        }
        #controls::-webkit-scrollbar-track, #seqPanel::-webkit-scrollbar-track { background: transparent; }

        /* --- タブ（ひとつの帯の中で切り替える） --- */
        #tabBar {
            display: flex;
            gap: 2px;
            padding: 2px;
            margin-bottom: 12px;
            background: var(--field);
            border-radius: 7px;
        }
        #tabBar .tab {
            flex: 1;
            padding: 4px 0;
            font: inherit;
            font-size: 10.5px;
            letter-spacing: 0.03em;
            color: var(--muted);
            background: transparent;
            border: 0;
            border-radius: 5px;
            cursor: pointer;
            transition: background .15s, color .15s;
        }
        #tabBar .tab:hover { color: var(--text); }
        #tabBar .tab.on {
            color: var(--accent-ink);
            background: var(--accent-solid);
        }

        /* サウンドの中のタブ（ドローン／グレイン／マスター） */
        #sndTabBar {
            display: flex;
            gap: 2px;
            padding: 2px;
            margin: 14px 0 4px;
            background: var(--field);
            border-radius: 7px;
        }
        #sndTabBar .tab {
            flex: 1;
            padding: 4px 2px;
            font: inherit;
            font-size: 10px;
            letter-spacing: 0;
            white-space: nowrap;
            color: var(--muted);
            background: transparent;
            border: 0;
            border-radius: 5px;
            cursor: pointer;
            transition: background .15s, color .15s;
        }
        #sndTabBar .tab:hover { color: var(--text); }
        #sndTabBar .tab.on {
            color: var(--accent-ink);
            background: var(--accent-solid);
        }

        /* その下の段（OSCILLATOR／EQ／EFFECTS）。
           下線だけの控えめな見た目にして、上のタブと段を分ける */
        #sndSecBar {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin: 10px 0 2px;
            padding: 0 2px;
        }
        #sndSecBar:empty { display: none; }
        #sndSecBar .stab {
            font: inherit;
            font-size: 9.5px;
            letter-spacing: 0.06em;
            color: var(--muted);
            background: transparent;
            border: 0;
            border-bottom: 1px solid transparent;
            padding: 2px 1px 3px;
            cursor: pointer;
            transition: color .15s, border-color .15s;
        }
        #sndSecBar .stab:hover { color: var(--text); }
        #sndSecBar .stab.on {
            color: var(--accent-solid);
            border-bottom-color: var(--accent-solid);
        }
        .sndsec { padding-top: 7px; }

        /* --- 小見出し --- */
        .sec {
            display: flex;
            align-items: center;
            gap: 7px;
            margin: 15px 0 9px;
            font-size: 8.5px;
            font-weight: 600;
            letter-spacing: 0.13em;
            text-transform: uppercase;
            color: var(--muted);
            white-space: nowrap;
        }
        .sec::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--line);
        }

        /* --- ひと組のつまみ --- */
        .control-row { margin-bottom: var(--gap); }
        .control-row label {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 6px;
            margin-bottom: 3px;
            font-size: 10.5px;
            color: var(--label);
        }
        .control-row .value {
            color: var(--text);
            font-size: 10px;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding-bottom: var(--gap);
            border-bottom: 1px solid var(--line);
        }
        .toggle-row label {
            margin: 0;
            font-size: 10.5px;
            color: var(--label);
        }
        .divider-row {
            padding-bottom: var(--gap);
            border-bottom: 1px solid var(--line);
        }


        /* --- 設定のまとまり。下線はまとまりごとに1本 --- */
        .ctl-group {
            padding-bottom: calc(var(--gap) * 0.4);
            margin-bottom: var(--gap);
            border-bottom: 1px solid var(--line);
        }
        .ctl-group:last-child { border-bottom: none; }
        .ctl-group .toggle-row { border-bottom: none; padding-bottom: 0; }
        .ctl-group .control-row:last-child { margin-bottom: calc(var(--gap) * 0.6); }
        .ctl-cap {
            font-size: 9.5px;
            color: var(--muted);
            letter-spacing: 0.04em;
            margin: 0 0 6px;
        }
        /* このモードでは使えない項目（バーの数など）。見えるけれど触れない */
        .control-row.is-off { opacity: 0.35; }
        .control-row.is-off input { pointer-events: none; }

        /* --- スライダー --- */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            display: block;
            width: 100%;
            height: 12px;
            margin: 0;
            background: transparent;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            height: 2px;
            border-radius: 2px;
            background: linear-gradient(to right,
                var(--accent) var(--p, 0%), var(--track) var(--p, 0%));
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 9px;
            height: 9px;
            margin-top: -3.5px;
            border: 0;
            border-radius: 50%;
            background: var(--accent);
            transition: transform .12s;
        }
        input[type="range"]:hover::-webkit-slider-thumb { transform: scale(1.25); }
        input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.35); }
        input[type="range"]::-moz-range-track {
            height: 2px;
            border-radius: 2px;
            background: var(--track);
        }
        input[type="range"]::-moz-range-progress { height: 2px; border-radius: 2px; background: var(--accent); }
        input[type="range"]::-moz-range-thumb {
            width: 9px;
            height: 9px;
            border: 0;
            border-radius: 50%;
            background: var(--accent);
        }

        /* --- 選ぶところ --- */
        #controls select {
            width: 100%;
            box-sizing: border-box;
            margin-top: 1px;
            padding: 4px 20px 4px 7px;
            font: inherit;
            font-size: 10.5px;
            color: var(--text);
            background: var(--field) var(--chev) no-repeat right 7px center;
            border: 1px solid var(--line);
            border-radius: 5px;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }
        #controls select:hover { border-color: var(--line-strong); }
        #controls optgroup {
            font-size: 10px;
            font-style: normal;
            color: var(--muted);
            background: var(--panel);
        }
        #controls option { color: var(--text); background: var(--panel); }
        #controls select:focus { outline: none; border-color: var(--accent); }

        /* --- スイッチ --- */
        .switch {
            position: relative;
            display: inline-block;
            width: 28px;
            height: 16px;
            flex-shrink: 0;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .switch .slider-toggle {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: var(--track);
            border-radius: 16px;
            transition: background-color .18s;
        }
        .switch .slider-toggle::before {
            content: "";
            position: absolute;
            height: 12px;
            width: 12px;
            left: 2px;
            bottom: 2px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
            transition: transform .18s;
        }
        .switch input:checked + .slider-toggle { background: var(--accent); }
        .switch input:checked + .slider-toggle::before { transform: translateX(12px); }
        body.light .switch input:checked + .slider-toggle::before { background: #fff; }

        /* --- シーケンスのステップを直しているあいだ --- */
        #controls.editing, #seqPanel.editing {
            border-color: var(--edit);
            box-shadow: var(--shadow), 0 0 0 1px var(--edit-soft);
        }
        #controls.editing { --accent: var(--edit); --accent-solid: var(--edit); --accent-ink: #2a1a05; }
        /* ステップに保存しない項目は、編集中でも素の色のままにする */
        #controls.editing .nosave {
            --accent: var(--accent-base);
            --accent-solid: var(--accent-solid-base);
            --accent-ink: var(--accent-ink-base);
        }
        #seqWrap.editing #seqCloseBtn { border-color: var(--edit); color: var(--edit); }

        /* --- パネルの外に出しているボタン --- */
        #seqOpenBtn, #seqCloseBtn {
            font: 13px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--muted);
            background: var(--panel);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--line);
            border-radius: 7px;
            padding: 8px 9px;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: color .15s, border-color .15s;
        }
        #seqOpenBtn:hover, #seqCloseBtn:hover { color: var(--text); border-color: var(--line-strong); }
        #seqOpenBtn {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 3;
        }
        #seqCloseBtn {
            position: absolute;
            top: 0;
            right: 100%;
            margin-right: 7px;
        }

        /* --- シーケンス --- */
        #seqPanel h2 {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0 0 11px;
            font-size: 8.5px;
            font-weight: 600;
            letter-spacing: 0.13em;
            text-transform: uppercase;
            color: var(--muted);
        }
        #seqPanel h2 .value {
            flex: 1;
            text-align: right;
            font-size: 9.5px;
            font-weight: 400;
            letter-spacing: 0;
            text-transform: none;
            color: var(--text);
        }
        #seqBox { font-size: 10px; }
        #seqBox button {
            font: inherit;
            font-size: 10px;
            color: var(--muted);
            background: var(--field);
            border: 1px solid var(--line);
            border-radius: 5px;
            padding: 3px 6px;
            cursor: pointer;
            transition: color .15s, background .15s, border-color .15s;
        }
        #seqBox button:hover { color: var(--text); border-color: var(--line-strong); }
        #seqBox button.on {
            color: var(--accent-ink);
            background: var(--accent-solid);
            border-color: var(--accent-solid);
        }
        .seq-step {
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 5px 6px;
            margin-bottom: 4px;
            cursor: grab;
            transition: border-color .15s, background .15s;
        }
        .seq-step:hover { border-color: var(--line-strong); }
        .seq-step.dragging { opacity: 0.4; cursor: grabbing; }
        .seq-step.drop-before { box-shadow: inset 0 2px 0 0 var(--edit); }
        .seq-step.drop-after { box-shadow: inset 0 -2px 0 0 var(--edit); }
        .seq-step.now { border-color: var(--accent); background: var(--accent-soft); }
        .seq-step.sel { border-color: var(--edit); background: var(--edit-soft); }
        .seq-head { display: flex; align-items: center; gap: 3px; }
        .seq-head .nm {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
        }
        .seq-head .edited { color: var(--edit); flex-shrink: 0; }
        .seq-head button {
            padding: 0 4px;
            line-height: 15px;
            border-color: transparent;
            background: transparent;
        }
        .seq-nums {
            display: flex;
            align-items: center;
            gap: 3px;
            margin-top: 4px;
            font-size: 9px;
            color: var(--label);
            white-space: nowrap;
        }
        .seq-nums input {
            width: 32px;
            font: inherit;
            font-size: 9px;
            color: var(--text);
            background: var(--field);
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 1px 3px;
        }
        .seq-btns { display: flex; gap: 4px; margin-bottom: 6px; }
        .seq-btns button { flex: 1; }
        #seqEmpty { color: var(--muted); margin-bottom: 7px; line-height: 1.55; }
        #seqNote {
            min-height: 12px;
            font-size: 9.5px;
            color: var(--muted);
        }
        #seqNote.bad { color: var(--edit); }
    </style>
</head>
<body>
<div id="app">
<div id="controls">
    <div id="tabBar">
        <button type="button" class="tab on" data-pane="paneMotion">動き</button>
        <button type="button" class="tab" data-pane="paneSound">サウンド</button>
    </div>
    <div id="paneMotion" class="pane">
    <div class="ctl-group grp-mode">
    <div class="control-row">
<label for="motionModeSelect">モード</label>
<select id="motionModeSelect">
<!-- 表示の番号（MODEn）と内部の番号（value）は別。value は保存済みのシーケンスとの互換のため据え置き -->
<option value="1">MODE1　Boids</option>
<option value="26">MODE2　Boidsから文字盤へ</option>
<option value="2">MODE3　蠕動</option>
<option value="3">MODE4　驚き</option>
<option value="4">MODE5　捕食者と回避</option>
<option value="5">MODE6　ローマ数字</option>
<option value="6">MODE7　explosion</option>
<option value="7">MODE8　漂い</option>
<option value="8">MODE9　学習中の群れ（AI）</option>
<option value="9">MODE10　ニュートンのゆりかご</option>
<option value="10">MODE11　ライフゲーム</option>
<option value="11">MODE12　結晶する文様</option>
<option value="12">MODE13　新規性探索（AI）</option>
<option value="13">MODE14　個性が育つ</option>
<option value="14">MODE15　群れない</option>
<option value="15">MODE16　パターン生成</option>
<option value="16">MODE17　キメラ</option>
<option value="17">MODE18　ソリトン</option>
<option value="18">MODE19　フラストレーション</option>
<option value="19">MODE20　雪崩</option>
<option value="20">MODE21　拘束の伝播</option>
<option value="21">MODE22　偶然から広がる所作</option>
<option value="22">MODE23　幽霊渋滞</option>
<option value="23">MODE24　蛍の同期</option>
<option value="24">MODE25　相分離と粗大化</option>
<option value="25">MODE26　ローマン算術</option>
</select>
</div>
    </div>

    <div class="ctl-group grp-view">
    <div class="control-row toggle-row">
<label for="lightModeToggle">白背景・黒バー</label>
<label class="switch">
<input checked="" id="lightModeToggle" type="checkbox"/>
<span class="slider-toggle"></span>
</label>
</div>
    <div class="control-row toggle-row">
<label for="showTopToggle">天板を表示</label>
<label class="switch">
<input checked="" id="showTopToggle" type="checkbox"/>
<span class="slider-toggle"></span>
</label>
</div>
    <div class="control-row toggle-row">
<label for="showLeaderToggle">リーダーを表示</label>
<label class="switch">
<input id="showLeaderToggle" type="checkbox"/>
<span class="slider-toggle"></span>
</label>
</div>
    <div class="control-row toggle-row">
<label for="colorCodeLayersToggle">レイヤーを色分け</label>
<label class="switch">
<input id="colorCodeLayersToggle" type="checkbox"/>
<span class="slider-toggle"></span>
</label>
</div>
    <div class="control-row toggle-row">
<label for="showRailToggle">レールを表示</label>
<label class="switch">
<input id="showRailToggle" type="checkbox"/>
<span class="slider-toggle"></span>
</label>
</div>
    
    <div class="control-row toggle-row" style="display:none" data-always-on="1">
<label for="bgPlayToggle">裏でも鳴らす</label>
<label class="switch">
<input checked="" id="bgPlayToggle" type="checkbox"/>
<span class="slider-toggle"></span>
</label>
</div>
    <div class="control-row toggle-row" style="display:none" data-always-on="1">
<label for="sleepBlockToggle">スリープさせない</label>
<label class="switch">
<input checked="" id="sleepBlockToggle" type="checkbox"/>
<span class="slider-toggle"></span>
</label>
</div>
    <div class="control-row toggle-row">
<label for="showDotsToggle">ポイントの表示</label>
<label class="switch">
<input id="showDotsToggle" type="checkbox"/>
<span class="slider-toggle"></span>
</label>
</div>
    </div>

    <div class="ctl-group grp-size">
    <div class="control-row">
<label for="previewScaleSlider">表示サイズ <span class="value" id="previewScaleValue">80%</span></label>
<input id="previewScaleSlider" max="100" min="25" step="5" type="range" value="80"/>
</div>
    </div>

    <div class="ctl-group grp-bars">
    <div class="control-row" data-enable-modes="1 2 3 4 6 7 10 11 12 13 14 22 23 24">
<label for="numBoidsSlider">バーの数 <span class="value" id="numBoidsValue">18 ×2</span></label>
<input id="numBoidsSlider" max="25" min="10" step="1" type="range" value="18"/>
</div>
    </div>

    <div class="ctl-group grp-common">
    <div class="control-row">
<label for="maxSpeedSlider">最高速度(基準比) <span class="value" id="maxSpeedValue">1.0×</span></label>
<input id="maxSpeedSlider" max="3" min="0.3" step="0.1" type="range" value="1.0"/>
</div>
    <div class="control-row">
<label for="startupAccelSlider">動き出しの加速度 <span class="value" id="startupAccelValue">0.006</span></label>
<input id="startupAccelSlider" max="0.05" min="0.001" step="0.001" type="range" value="0.006"/>
</div>

<script>
const canvas = document.getElementById('boidsCanvas');
const ctx = canvas.getContext('2d');

// 経過時間の基準（スライダーの処理からも参照するので早めに定義しておく）
// 経過時間の基準。隠しているあいだは進めたくないので、
// 戻ったときに休んでいたぶんだけ後ろへずらす（＝let にしてある）。
let startTime = performance.now();

// --- 画面内に固定された四角い枠を「1車線のトラック」として、
//     ドットはその線の上だけを動く。進む向き（時計回り/反時計回り）は
//     ドットごとにランダムで、対向もあり得るが、お互いを追い抜くことはできない。 ---
// --- 実寸（mm）での指定 ---
// 画面のピクセルではなく実寸で定義し、描画時に画面サイズへ合わせて縮尺する。
// ウィンドウの大きさが変わっても、各部の比率はここの数値どおりに保たれる。
const RAIL_SIDE_MM = 845;      // レール（四角）の1辺
const CORNER_RADIUS_MM = 50;   // 四隅の丸み R
// 各ドットから法線方向（外側）へ伸ばすバーの長さ。
// 天板を出すと先端が板の下へ入るので、そのぶん長い実寸を使う。
// 天板を消しているあいだは、板に隠れない短いほうにして全体が見えるようにする。
// これはモード（MODE9かどうか）にかかわらず、天板の表示状態だけで決める。
// MODE9で天板を出したときの車間（衝突判定）の安全策は、バーの長さ自体を
// 変えるのではなく、下のdialBandMm（V/Xの足元・交点の計算に使う「帯の長さ」）
// を常に安全な固定値にすることで別に確保している。
const BAR_LENGTH_LONG_MM = 532;
const BAR_LENGTH_SHORT_MM = 200;
let barLengthMm = BAR_LENGTH_LONG_MM;
// レールの中心に置く天板。バーより手前（上）に重なるので、
// レールと、バーの内側の一部が隠れる。
const TOP_PLATE_MM = 940;
// そのまわりを囲むロの字の天板（ベゼル）。内側の穴のほうが
// レール＋バーの全体より大きいので、バーは隠れずに縁取られる。
const BEZEL_OUTER_MM = 2060;
const BEZEL_INNER_MM = 1440;
// 天板の色。背景と見分けはつくが、純白ではないくらいの明るさ。
const PLATE_COLOR = '#fbfaf7';
const MIN_GAP_MM = 24;         // レール上で保つ最小の車間距離（これより前には出られない）
// 上の最小車間に必ず上乗せする余裕。これがないと、最小車間ぴったりに
// 張り付いて走れてしまい、前が急に止まったときに減速の余地がなくなる。
const HEADWAY_MIN_MM = 6;

// 枠の外側へ伸ばすバーがはみ出さないよう、全体（レール＋左右のバー）が
// 画面の短い方の辺の 88% に収まるように縮尺する。
const TOTAL_EXTENT_RATIO = 0.88;

// 表示サイズ（1.0＝画面いっぱい、0.5＝半分の大きさ）。
// 縮小しても「速度が相対的に上がる」ことがないよう、動きの大きさも同じ割合で
// 縮める（＝単純にズームアウトしたように見せる）。
// スライダーの80%を「ふだんの大きさ」にしたいので、目盛りに1.25を掛ける
// （＝スライダー100%は、ふだんの1.25倍まで寄れる）
const PREVIEW_SCALE_GAIN = 1.25;
let previewScale = 1.0;
// 速度・加速度に掛ける係数。表示サイズだけでなく、ウィンドウの大きさにも
// 合わせる。こうしておくと、窓を大きくしても小さくしても、実寸での速さ
// （mm/秒）が変わらない＝実機の速度をそのまま見積もれる。
// 基準にする画布の短辺。ここでの見え方が、これまでと同じになる。
const SPEED_REF_PX = 950;
let motionScale = 0.8;

let bounds = { left: 0, right: 0, top: 0, bottom: 0 };
let mmToPx = 1;             // 実寸(mm)から画面(px)への縮尺
// 見た目上のサイズ（CSSピクセル）。canvas.width/heightは下のresizeCanvasで
// devicePixelRatio倍した「実ピクセル数」にするので、位置やスケールの計算には
// こちらを使う（そうしないと高DPI画面で絵が実寸の何倍にも大きくなってしまう）。
let logicalWidth = 0;
let logicalHeight = 0;
let cornerRadius = 0;       // 四隅の丸みの半径（px）
let straightLength = 0;     // 丸めた分を除いた、1辺の直線部分の長さ
let arcLength = 0;          // 1コーナー分の円弧の長さ（1/4円）
let perimeterLength = 0;    // 枠（トラック）1周の長さ
let minDistance = 0;        // MIN_GAP_MM をpxに換算したもの
let headwayMin = 0;         // HEADWAY_MIN_MM をpxに換算したもの

function updateBounds() {
    // 実寸での全体の幅 ＝ レール1辺 ＋ 左右のバー2本分。
    // これが画面の指定割合に収まるように、mm→px の縮尺を決める。
    // 縮尺はいつも長いほうのバーを基準にする。こうしておくと、天板を
    // 出し入れしてもレールの大きさと位置が動かない（バーだけが伸び縮みする）。
    const totalExtentMm = RAIL_SIDE_MM + 2 * BAR_LENGTH_LONG_MM;
    const totalExtentPx = Math.min(logicalWidth, logicalHeight) * TOTAL_EXTENT_RATIO * previewScale;
    mmToPx = totalExtentPx / totalExtentMm;
    motionScale = previewScale
        * (Math.min(logicalWidth, logicalHeight) / SPEED_REF_PX);

    const size = RAIL_SIDE_MM * mmToPx;
    const centerX = logicalWidth / 2;
    const centerY = logicalHeight / 2;
    bounds = {
        left: centerX - size / 2,
        right: centerX + size / 2,
        top: centerY - size / 2,
        bottom: centerY + size / 2,
    };

    // 角丸トラックの1周の長さ ＝ 直線4本 ＋ 1/4円 4つ（＝円1つ分）
    cornerRadius = Math.min(CORNER_RADIUS_MM * mmToPx, size / 2);
    straightLength = size - 2 * cornerRadius;
    arcLength = (Math.PI / 2) * cornerRadius;
    perimeterLength = 4 * straightLength + 4 * arcLength;

    minDistance = MIN_GAP_MM * mmToPx;
    headwayMin = HEADWAY_MIN_MM * mmToPx;
}

// バーができあがるまでは、後片づけ（sanitizeBoids）を呼ばない
let boidsReady = false;

function resizeCanvas() {
    const stage = document.getElementById('stage');
    // 表示できる幅が0になっても、0のままにはしない。
    // 0にすると1周の長さが0になり、位置の計算が壊れて（0で割る）、
    // ウインドウを広げてもバーが戻ってこなくなるため。
    logicalWidth = Math.max(60, stage.clientWidth);
    logicalHeight = Math.max(60, stage.clientHeight);
    // devicePixelRatio（Retinaなどの高DPI画面で1より大きい）ぶんだけ、
    // 見た目のサイズより多くの実ピクセルでcanvasの中身を持たせる。
    // これをせずCSSの見た目サイズ＝実ピクセル数のままにすると、高DPI画面では
    // 拡大表示になって斜めの線のふちがガビガビ（ジャギー）に見えてしまう。
    // 位置や速度などの計算はすべてlogicalWidth/Heightを基準にしたままにして、
    // ここで実ピクセル数に対して描画側だけをscaleで合わせる。
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(logicalWidth * dpr);
    canvas.height = Math.round(logicalHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    updateBounds();
    if (boidsReady) sanitizeBoids();
}

// 万一おかしな数（NaNなど）が入り込んでも、そこで止まらずに立て直せるようにしておく
const BOID_ZERO_FIELDS = ['speed', 'tilt', 'tiltVel', 'burstSpeed', 'smoothAccel',
    'prevLimit', 'groupShift', 'ego', 'reform',
    'lifeVal', 'lifeRest', 'lifeNb', 'lifeCom', 'lifePress', 'lifeStarve',
    'rdU', 'rdBias', 'rdErr',
    'nextSpeed', 'nextTilt', 'nextTiltVel', 'nextSmoothAccel', 'nextPrevLimit'];

function sanitizeBoids() {
    for (const layer of layers) {
        for (const b of layer.boids) {
            if (!Number.isFinite(b.arcFraction)) b.arcFraction = Math.random();
            b.arcFraction = ((b.arcFraction % 1) + 1) % 1;
            if (!Number.isFinite(b.nextArcFraction)) b.nextArcFraction = b.arcFraction;
            for (const k of BOID_ZERO_FIELDS) {
                if (!Number.isFinite(b[k])) b[k] = 0;
            }
            if (b.direction !== 1 && b.direction !== -1) b.direction = 1;
            if (b.nextDirection !== 1 && b.nextDirection !== -1) b.nextDirection = b.direction;
            for (const k of ['dialFrac', 'packFrac', 'evenFrac', 'dialCentre']) {
                if (b[k] !== null && b[k] !== undefined && !Number.isFinite(b[k])) b[k] = null;
            }
        }
    }
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
// パネルの開け閉めや中身の増減で描画エリアが変わったときも、すぐ合わせ直す
if (window.ResizeObserver) {
    new ResizeObserver(() => resizeCanvas()).observe(document.getElementById('stage'));
}

// 角丸の枠のパスを作る（描画用）
function traceBoundaryPath() {
    const r = cornerRadius;
    ctx.beginPath();
    ctx.moveTo(bounds.left + r, bounds.top);
    ctx.arcTo(bounds.right, bounds.top, bounds.right, bounds.bottom, r);
    ctx.arcTo(bounds.right, bounds.bottom, bounds.left, bounds.bottom, r);
    ctx.arcTo(bounds.left, bounds.bottom, bounds.left, bounds.top, r);
    ctx.arcTo(bounds.left, bounds.top, bounds.right, bounds.top, r);
    ctx.closePath();
}

// 天板。バーをすべて描いたあとに重ねるので、下に隠れるものが出る。
// 中央の正方形と、そのまわりを囲むロの字の2枚。どちらも同じ色。
function drawTopPlate() {
    if (!bounds) return;
    const cx = (bounds.left + bounds.right) / 2;
    const cy = (bounds.top + bounds.bottom) / 2;
    const box = (mm) => {
        const half = (mm * mmToPx) / 2;
        return [cx - half, cy - half, mm * mmToPx, mm * mmToPx];
    };
    ctx.fillStyle = PLATE_COLOR;
    // ロの字。外枠と内枠を同じ道筋に入れて、重なったところを抜く
    ctx.beginPath();
    ctx.rect(...box(BEZEL_OUTER_MM));
    ctx.rect(...box(BEZEL_INNER_MM));
    ctx.fill('evenodd');
    // 中央の1枚
    ctx.fillRect(...box(TOP_PLATE_MM));
}

function drawBoundary() {
    ctx.strokeStyle = currentTheme().rail;
    ctx.lineWidth = RAIL_LINE_WIDTH;
    traceBoundaryPath();
    ctx.stroke();
}

// t (0〜1、周回するので折り返す) を、角丸トラック上の座標と、その位置での
// レールの法線方向（枠の外側を向く単位ベクトル nx, ny）に変換する。
// 上辺 → 右上コーナー → 右辺 → 右下コーナー → 下辺 → 左下コーナー →
// 左辺 → 左上コーナー、の順（時計回り）に進む。
function getRailPoint(t) {
    const r = cornerRadius;
    const S = straightLength;
    const A = arcLength;
    let d = (((t % 1) + 1) % 1) * perimeterLength;

    // 円弧上の点と、その位置での外向き法線を求める。
    // startAngle から角度が増える向き（時計回り）に進む。
    const onArc = (cxArc, cyArc, startAngle, distAlongArc) => {
        const angle = startAngle + (r > 0 ? distAlongArc / r : 0);
        const nx = Math.cos(angle);
        const ny = Math.sin(angle);
        // 円弧の中心から半径方向に外側＝そのまま法線方向になる
        return { x: cxArc + nx * r, y: cyArc + ny * r, nx, ny };
    };

    // 1. 上辺（左→右）：法線は上向き
    if (d < S) return { x: bounds.left + r + d, y: bounds.top, nx: 0, ny: -1 };
    d -= S;
    // 2. 右上コーナー：-90°→0°
    if (d < A) return onArc(bounds.right - r, bounds.top + r, -Math.PI / 2, d);
    d -= A;
    // 3. 右辺（上→下）：法線は右向き
    if (d < S) return { x: bounds.right, y: bounds.top + r + d, nx: 1, ny: 0 };
    d -= S;
    // 4. 右下コーナー：0°→90°
    if (d < A) return onArc(bounds.right - r, bounds.bottom - r, 0, d);
    d -= A;
    // 5. 下辺（右→左）：法線は下向き
    if (d < S) return { x: bounds.right - r - d, y: bounds.bottom, nx: 0, ny: 1 };
    d -= S;
    // 6. 左下コーナー：90°→180°
    if (d < A) return onArc(bounds.left + r, bounds.bottom - r, Math.PI / 2, d);
    d -= A;
    // 7. 左辺（下→上）：法線は左向き
    if (d < S) return { x: bounds.left, y: bounds.bottom - r - d, nx: -1, ny: 0 };
    d -= S;
    // 8. 左上コーナー：180°→270°
    return onArc(bounds.left + r, bounds.top + r, Math.PI, d);
}

// 角では、レールの向きが短い距離で90°変わる。
// バーの角度をその向きにぴったり合わせると、角に入った瞬間に回りはじめ、
// 抜けた瞬間にぴたりと止まる——これが「角でビクッとする」正体になる。
// そこで、向きだけを前後の位置とならしてから使う。位置はレールの上のまま。
// 角の手前から少しずつ回りはじめ、抜けたあとに回り終わる形になる。
const NORMAL_SMOOTH_MM = 110;                       // ならす範囲（前後）
const NORMAL_SMOOTH_W = [1, 3, 6, 8, 6, 3, 1];      // 中心が重いなだらかな重み
function getPointOnPerimeter(t) {
    const p = getRailPoint(t);
    if (!(perimeterLength > 0) || !(cornerRadius > 0)) return p;
    const span = (NORMAL_SMOOTH_MM * mmToPx) / perimeterLength;
    if (!(span > 0)) return p;
    const n = NORMAL_SMOOTH_W.length;
    const half = (n - 1) / 2;
    let nx = 0;
    let ny = 0;
    for (let i = 0; i < n; i++) {
        const q = getRailPoint(t + ((i - half) / half) * span);
        nx += q.nx * NORMAL_SMOOTH_W[i];
        ny += q.ny * NORMAL_SMOOTH_W[i];
    }
    const m = Math.hypot(nx, ny);
    if (!(m > 1e-9)) return p;
    return { x: p.x, y: p.y, nx: nx / m, ny: ny / m };
}

// シーケンス再生中、モードの切り替わり目で「そのモードらしさ」を出し入れする度合い。
// 0だとどのモードでもただ巡航するだけになるので、境目がパッと変わって見えない。
let modeInfluence = 1;
// 直前のモード。切り替わり目で「前の動きから抜けきる」のに使う
let prevMotionMode = 1;
// 切り替わりは、バーごとに少しずつ時間をずらして進める。
// 全部が同じ拍で向きを変えると、そこで号令がかかったように見えてしまう。
// 遅れて始まったバーも、フェードの終わりには追いつく。
function barInfluence(b) {
    if (modeInfluence >= 1) return 1;
    const off = b.fadeOffset || 0;
    const x = clamp((modeInfluence - off) / Math.max(0.05, 1 - off), 0, 1);
    return x * x * (3 - 2 * x);
}
// バーの長さは、モードが変わった瞬間に飛ばないよう、少しずつ目標へ寄せる
let barScaleSmooth = 1;

function getNormalLineLength() {
    // 文字盤のモード（MODE5・MODE6）だけは、数字らしく短いバーにする
    return barLengthMm * barScaleSmooth * mmToPx;
}

function clamp(v, lo, hi) {
    return Math.max(lo, Math.min(hi, v));
}

function lerp(a, b, t) {
    return a + (b - a) * t;
}

// --- パラメータ設定 ---
// 以下の let の変数は、画面左上のスライダーからリアルタイムに調整できる。
let numBoids = 18;               // バーの数（＝1レイヤーあたりのドット数）
const BASE_MAX_SPEED = 0.5;      // 最高速度の基準値（表示サイズ100%でのpx/フレーム）。スライダーはこれに対する倍率
let maxSpeedMultiplier = 1.0;    // 基準値に対する倍率（1.0が基準。上下に調整できる）
let maxSpeed = BASE_MAX_SPEED * maxSpeedMultiplier; // 実際に使う最高速度
let leaderSpeedMultiplier = 1.2; // リーダーの速さ・機敏さの倍率（一般boid比）
let maxAccel = 0.08;             // 通常走行時に、1フレームあたり速度が変化できる量
let startupAccel = 0.006;        // 止まっている状態から動き出すときの加速度（小さいほどゆるやか）
// 減速は加速より少し強めまで許す。強すぎると急ブレーキに、弱すぎると
// 先読み減速が間に合わず安全網（速度の直接制限）が働いてカクつく。
const BRAKE_STRENGTH = 1.5;
// 速度に応じて広げる車間（何フレーム分の移動距離を余裕として持つか）
const HEADWAY_FRAMES = 6;
let leaderInfluenceWeight = 6;   // 前方のリーダーにつられて、後続が速度を上げる度合い
                                 // （前方のリーダーは上下どちらのレイヤーのものでも影響する）
let cycleDuration = 18000;       // 集団の粗密が変わる周期（ミリ秒）
let showLeader = false;          // falseの間は、内部的なリーダー判定はそのままに見た目だけ全員緑にする
let colorCodeLayers = false;     // 上下2つのレイヤーを色で描き分けるかどうか
let lightMode = true;            // 白背景・黒バーのモードにするかどうか
let showRail = false;            // レール（角丸の枠線）を描くかどうか
let showTopPlate = true;         // 天板（中央の白い正方形）を描くかどうか
let showDots = false;            // ドット本体を描くかどうか（offにするとバーだけが残る）
let evenSpacing = false;         // 収束したあと、グループを等間隔に並べ直すかどうか
let evenStrength = 0.7;          // 等間隔にする力の強さ（0〜1）。スライダーで変える
let speedVariance = 1.0;         // 速度のばらつき幅（0＝全員同じ速さ、0.8＝±80%までばらつく）
let targetGroupCount = 0;        // 収束させたいグループ数（0＝収束させず、自然にまかせる）
let freeLeaderCount = 6;         // 収束させないときの、全体のリーダー人数

// --- グループへの収束 ---
// 収束グループ数を1以上にすると、「リーダーがグループを割る」という形で
// 目的の数へ近づける。決められた位置へ全員を誘導するのではなく、
// あくまで普段どおりの流れ（速度のばらつき・追従・渋滞・向きの反転）の中で
// 起きる自然な分裂と合流に任せるので、動きが単調にならない。
//
// 仕組みはひとつだけ：
//   リーダーは自分の後ろに広めの間隔を空けさせる。
// すると各リーダーのすぐ後ろで列が切れ、リーダーがそれぞれの集団の先頭になる。
// つまり「リーダーの数＝グループの数」が自然に成り立つ。
// あとは実際の集団数を数えて、足りなければどこかの集団に新しいリーダーを
// 生んで割り、多すぎればリーダーを一人減らして隣とつながらせるだけでよい。
// 収束モードで、速度のばらつきをどれだけ残すか（0＝全員同じ速さ）
const CONVERGE_VARIANCE_DAMP = 0.3;
// 収束モードで「集団の切れ目」とみなす空きの大きさ（継ぎ目で開けたい車間に対する割合）
const CONVERGE_BREAK_RATIO = 0.30;
// リーダー同士が間隔を均そうとする強さ。
// 「リーダーの影響力」スライダーで、散らばりのそろい具合を調整できる。
const LEADER_SPACING_MIN_GAIN = 0.3;
const LEADER_SPACING_MAX_GAIN = 1.4;

// 進行方向で見た、前後のいちばん近いリーダーまでの距離
function leaderSpacing(boid, dir) {
    const L = perimeterLength;
    const others = layers.flatMap((l) => l.boids).filter((b) => b.isLeader && b !== boid);
    if (others.length === 0) return null;
    let ahead = Infinity;
    let behind = Infinity;
    for (const o of others) {
        let d = (o.arcFraction - boid.arcFraction) * dir * L;
        d = ((d % L) + L) % L;          // 進行方向に測った距離
        ahead = Math.min(ahead, d);
        behind = Math.min(behind, L - d);
    }
    return { ahead, behind };
}

// --- グループの継ぎ目（seam） ---
// 収束が弱く見えていた原因は2つあった。
//   1. 「寄る力」はあっても「グループとグループのあいだを空ける力」がなかった。
//      リングは閉じているので、どこかで車間を広げない限り隙間は生まれず、
//      全体がひとつながりのまま濃淡がつくだけになってしまう。
//   2. 所属を「いちばん近いリーダー」で決めると、境目はリーダーとリーダーの
//      ちょうど中間になる。そこに固まりがあっても構わず切ってしまうので、
//      できかけの塊が真ん中で分断されていた。
// そこで発想を変えて、「すでに空いているところをもっと空ける」ようにした。
// いま実際にいちばん空いている車間を目的の数だけ選び、そこだけ広い車間を保たせる。
// 選ばれた車間はさらに広がるので、次の判定でも選ばれ続ける（正のフィードバック）。
// リング1周の長さは決まっているから、継ぎ目が広がったぶん残りは自動的に詰まる。
const SEAM_UPDATE_MS = 400;      // 継ぎ目を選び直す間隔
const CONVERGE_FLIP_DAMP = 0.5;  // 収束時、気まぐれな向き変更を弱める割合（群れを崩しすぎないため）
const REVERSE_STALL_RATIO = 0.35; // 区間のこの割合が止まったら、群れごと引き返す
const REVERSE_MIN_SIZE = 3;       // 群れごと引き返すのは、この本数以上ある区間だけ
const REVERSE_HOLD_MS = 4000;     // 引き返したあと、向きを据え置く時間
const SEAM_MAX_FACTOR = 30;      // 継ぎ目の車間の上限（minDistanceの倍数）
// 空いているぶんのうち、継ぎ目に配る割合。「リーダーの影響力」スライダーで変わる。
// 大きいほどグループの切れ目がはっきりし、小さいほど全体がゆるくつながる。
const SEAM_SHARE_MIN = 0.45;
const SEAM_SHARE_MAX = 0.85;
// 継ぎ目ではない車間を詰めにいく強さ（ずれ1pxあたりの目標速度の倍率）と、その上限。
const CLOSE_GAIN = 0.02;
const CLOSE_MAX = 1.7;
const SEAM_SLOW_MIN = 0.25;      // 継ぎ目を空けるための減速の下限（止まりきらないための床）
const SEAM_KEEP_BONUS = 1.4;     // いまある継ぎ目を選び続けやすくする係数
const SEAM_MIN_SEP_RATIO = 0.55; // 継ぎ目同士を、平均間隔のこの割合以上は離す
// 等間隔モードで、バーを自分のマスの中心へ寄せる強さ（ずれ1pxあたりの目標速度の倍率）と上下限
// 「等間隔の強さ」0%のときの寄せ方（ゆるい）
const EVEN_MOVE_GAIN = 0.006;
const EVEN_MOVE_MIN = 0.80;
const EVEN_MOVE_MAX = 1.25;
// 100%のときの寄せ方（きっちり）
const EVEN_MOVE_GAIN_MAX = 0.05;
const EVEN_MOVE_MIN_HARD = 0.25;
const EVEN_MOVE_MAX_HARD = 2.6;
const EVEN_SEAM_PULL = 0.7;     // 継ぎ目を等分の位置へどれだけ寄せるか（0＝寄せない）
const HEAD_ON_PULL = 0;       // 向かい合う相手へ詰めにいく補正の効き（1で通常どおり）
const EVEN_BAND = 0.15;         // 等分の間隔に対する「ちょうどよい範囲」の幅（±22%）
const EVEN_PHASE_EASE = 0.5;    // 格子の位相を前回からどれだけ動かすか（とびはね防止）
const EVEN_LATTICE_BAND = 0.05; // 格子点からのずれを、この幅ぶんは見逃す（等分間隔に対する比）
const EVEN_COH_FLOOR = 0.35;    // 向きが混ざった塊でも、これだけは効かせる
const EVEN_BLEND_MS = 4000;      // スイッチを切り替えたとき、効き目が入り／抜けきるまでの時間
let evenBlend = 0;               // 0＝補正なし、1＝全開。切り替え時になめらかに行き来する
let evenPhase = 0;               // 等分の格子をどこに置くか（レール上の距離）
let evenPhaseReady = false;      // 位相をすでに持っているか
let lastClusterCount = 0;        // 直近に数えた塊の数（等間隔モードに入る判定に使う）
const SPLIT_DURATION_MS = 6000;  // 塊を割るために生まれたリーダーが、前を空けにいく時間
const SPLIT_MIN_CLUSTER = 4;     // これ以上の本数がある塊だけ、割る対象にする
const LEADER_MOVE_INTERVAL = 4000; // リーダーの資格を移してから、次に移すまで空ける時間
let nextLeaderMoveAt = 0;
let nextSeamUpdateAt = 0;
let prevSeamMids = [];           // 前回選んだ継ぎ目の位置（arc長さ, px）

function seamShare() {
    const t = clamp((leaderInfluenceWeight - 1) / 9, 0, 1); // スライダーは1〜10
    return lerp(SEAM_SHARE_MIN, SEAM_SHARE_MAX, t);
}

// 継ぎ目で保ちたい車間。
// 1周ぶんの車間の本数は決まっている（レイヤーごとにバーの本数と同じ）ので、
// そのうち継ぎ目がいくつで、残りの車間をどこまで詰めたいかが決まれば、
// 継ぎ目の広さは割り算で出る。
//   ideal  … 継ぎ目以外をぎりぎりまで詰めたときの、継ぎ目1つぶんの広さ
//   uniform… 全部が均等に散らばったときの車間（＝いちばんゆるい状態）
// 「リーダーの影響力」スライダーで、この2つのあいだを行き来する。
// グループ数が多いと継ぎ目の本数が増えて ideal が小さくなるので、
// 12グループのように細かく分けるときでも自動的につじつまが合う。
function groupSeamGap() {
    const L = perimeterLength;
    const n = layers.length > 0 ? layers[0].boids.length : 0;
    if (n === 0) return minDistance;
    const seams = Math.max(1, Math.min(targetGroupCount, n));
    const tightGap = minDistance + headwayMin;              // 詰めたときの車間
    const packed = Math.max(0, n - seams) * tightGap;       // 継ぎ目以外が占める長さ
    const ideal = Math.max(tightGap, (L - packed) / seams);
    const uniform = L / n;
    const seam = lerp(uniform, ideal, seamShare());
    return Math.min(seam, minDistance * SEAM_MAX_FACTOR);
}

// いま空いている場所を目的の数だけ選び、各レイヤーでそこにあたる車間に印をつける。
// boid.seamAhead は「自分と、arcFractionが次のバーとのあいだが継ぎ目」という意味。
// レイヤー内では追い抜きが起きないので並び順は変わらず、この印は安定して持ち回れる。
// --- 「グループを等間隔に」---
// 収束そのものの動き（継ぎ目・向きの多数決・合体や分裂）には手を入れず、
// できあがった塊の「位置」だけを均す。
//
// 1周を等分した「持ち場」へ引っぱる書き方もできるが、それだと格子と流れが
// 綱引きになって効きが薄れる。ここでは、となりのリーダーとの車間だけを見る。
//   前のリーダーとの間隔と、後ろのリーダーとの間隔を測る
//   → どちらも「ちょうどよい範囲」に入っていれば、なにもしない
//   → 片方が広すぎ／狭すぎなら、はみ出したぶんだけそちらへ寄る
// となり同士のやりとりだけで、1周ぜんぶが自然にならされていく。
//
// 基準をリーダーにしているのが要点。塊の重心を基準にすると、1本きりの塊と
// 十数本の塊が同じ1票になり、しかも塊の数自体が数え方で±2ゆれるので、
// グループ数が少ないときほど基準そのものが暴れて偏りが出ていた。
// リーダーの数はグループ数ぴったりで動かないので、基準として安定している。
// 求めたずれは、そのリーダーと同じ塊にいるバー全員で共有する（隊列ごと動かす）。
//
// 「ちょうどよい範囲」は等分の間隔の ±EVEN_BAND。この幅があるので
// きっちり整列はせず、ある程度の範囲でゆらぎながら保たれる。
// 効き目は evenBlend で 0〜1 に絞られ、スイッチの切り替えは数秒かけて溶ける。
// 「ちょうどよい範囲」からはみ出したぶんだけを返す（範囲内なら0＝なにもしない）
function outsideBand(v, band) {
    if (v > band) return v - band;
    if (v < -band) return v + band;
    return 0;
}

function updateEvenSpacing(all, L) {
    for (const b of all) b.groupShift = 0;
    if (evenBlend <= 0.001 || targetGroupCount <= 0) return;

    const K = targetGroupCount;
    const step = L / K;

    // 1周をKでぴったり割る「格子」を置く。格子とは、レール上に等間隔に並べた
    // K個の目印のこと。リーダーとは関係がなく、群れの側の都合でもない。
    // どこに置くかだけは群れから決める——1周をK周期の波と見たとき、
    // いちばん密なところがどこに来ているかを測る（円周上の重心をK倍の角度で取る）。
    // こうすると格子はいまの並びのいちばん近くに置かれ、群れが流れれば
    // 格子も一緒に流れるので、止まって見えることがない。
    let cx = 0;
    let cy = 0;
    for (const b of all) {
        const a = Math.PI * 2 * K * b.arcFraction;
        cx += Math.cos(a);
        cy += Math.sin(a);
    }
    let phase = (Math.atan2(cy, cx) / (Math.PI * 2 * K)) * L;
    phase = ((phase % step) + step) % step;
    if (evenPhaseReady) {
        // 位相が毎回とびはねないよう、前回の位相から少しずつ寄せる
        let d = (((phase - evenPhase) % step) + step) % step;
        if (d > step / 2) d -= step;
        phase = ((((evenPhase + d * EVEN_PHASE_EASE) % step) + step) % step);
    }
    evenPhase = phase;
    evenPhaseReady = true;

    // バー1本ずつに持ち場を配る。並び順のまま前からK等分し、
    // k番目のグループは格子点のまわりに、詰めた車間で肩を寄せて並ぶ。
    // レイヤーの中では追い抜きが起きないので、並び順は入れ替わらない。
    // どのバーを先頭と見るかだけは、全員の移動がいちばん小さくなる回し方を選ぶ。
    const tightGap = minDistance + headwayMin;
    for (const layer of layers) {
        const bs = layer.boids.slice().sort((a, b) => a.arcFraction - b.arcFraction);
        const n = bs.length;
        if (n === 0) continue;
        let bestCost = Infinity;
        let bestShift = null;
        for (let o = 0; o < n; o++) {
            const shift = new Array(n);
            let cost = 0;
            for (let j = 0; j < n; j++) {
                const k = Math.floor((j * K) / n);
                const from = Math.ceil((k * n) / K);
                const cnt = Math.ceil(((k + 1) * n) / K) - from;
                const idx = j - from;
                const t = (((phase + (k + 1) * step
                    + (idx - (cnt - 1) / 2) * tightGap) % L) + L) % L;
                const si = (o + j) % n;
                let d = t - bs[si].arcFraction * L;
                if (d > L / 2) d -= L;
                if (d < -L / 2) d += L;
                shift[si] = d;
                cost += d * d;
            }
            if (cost < bestCost) { bestCost = cost; bestShift = shift; }
        }
        for (let i = 0; i < n; i++) bs[i].groupShift = bestShift[i];
    }
}

function updateSeams(elapsedMs) {
    const all = layers.flatMap((l) => l.boids);
    if (targetGroupCount <= 0) {
        for (const b of all) { b.seamAhead = false; b.groupDir = 0; }
        return;
    }
    if (elapsedMs < nextSeamUpdateAt) return;
    nextSeamUpdateAt = elapsedMs + SEAM_UPDATE_MS;

    const L = perimeterLength;
    // 1) 上下のレイヤーをまとめて見て、空いている場所の中心を目的の数だけ選ぶ。
    //    まとめて見るのは、上下で継ぎ目の位置がずれると重ねたときに隙間が埋まってしまうため。
    const merged = all.slice().sort((a, b) => a.arcFraction - b.arcFraction);
    if (merged.length === 0) return;
    const holes = [];
    for (let i = 0; i < merged.length; i++) {
        const a = merged[i];
        const b = merged[(i + 1) % merged.length];
        let d = (b.arcFraction - a.arcFraction) * L;
        if (d <= 0) d += L;
        holes.push({ d, mid: ((a.arcFraction * L + d / 2) % L + L) % L });
    }
    // すでに継ぎ目になっている場所には下駄をはかせる。
    // こうしないと、少し空いた別の場所に判定が飛び移って、せっかくできた
    // 切れ目が毎回作り直しになってしまう（＝グループの形が落ち着かない）。
    const near = groupSeamGap();
    for (const h of holes) {
        let bonus = 1;
        for (const p of prevSeamMids) {
            let dm = Math.abs(h.mid - p);
            if (dm > L / 2) dm = L - dm;
            if (dm < near) { bonus = SEAM_KEEP_BONUS; break; }
        }
        h.score = h.d * bonus;
    }
    holes.sort((x, y) => y.score - x.score);
    // 広い順に選ぶが、すでに選んだ継ぎ目の近くは飛ばす。
    // 単に広い順だと、たまたま空いている一角に継ぎ目が固まってしまい、
    // 残りが1本の長い列になる（＝グループ数が多いときに効いてくる）。
    const minSep = (L / Math.max(1, targetGroupCount)) * SEAM_MIN_SEP_RATIO;
    const ringGap = (a, b) => {
        let dm = Math.abs(a - b);
        return dm > L / 2 ? L - dm : dm;
    };
    let chosen = [];
    for (const h of holes) {
        if (chosen.length >= targetGroupCount) break;
        if (chosen.every((c) => ringGap(h.mid, c) >= minSep)) chosen.push(h.mid);
    }
    // それでも数が足りなければ、間隔の条件を外して広い順に埋める
    for (const h of holes) {
        if (chosen.length >= targetGroupCount) break;
        if (!chosen.includes(h.mid)) chosen.push(h.mid);
    }

    // 1b) 「グループを等間隔に」がONのときは、継ぎ目をリーダーとリーダーの中間へ寄せる。
    //     基準をリーダーにするのは、リーダーの数がグループ数ぴったりで動かないから。
    //     塊の重心を基準にすると、1本きりの塊と十数本の塊が同じ1票になってしまい、
    //     グループ数が少ないときほど偏りが大きく出ていた。
    //     evenBlend を掛けているのでスイッチの切り替えでも飛ばない。
    if (evenBlend > 0.001 && chosen.length === targetGroupCount
        && targetGroupCount > 1 && evenPhaseReady) {
        // 塊を引き寄せている格子と、同じ格子の上に継ぎ目を置く。
        // ここがずれていると、片方が「この空きを広げよう」、もう片方が
        // 「群れをあちらへ動かそう」と別々に引っぱり、いつまでも落ち着かない。
        const gstep = L / targetGroupCount;
        const mids = [];
        for (let k = 0; k < targetGroupCount; k++) {
            mids.push(((evenPhase + (k + 0.5) * gstep) % L + L) % L);
        }
        mids.sort((a, b) => a - b);
        chosen.sort((a, b) => a - b);
        const near = (d) => {
            let x = d % L;
            if (x > L / 2) x -= L;
            if (x < -L / 2) x += L;
            return x;
        };
        // どの継ぎ目をどの格子点に対応させるか。輪なので、並べ替えただけでは
        // 「どこを先頭と見るか」が決まらない。回し方をK通り試して、
        // 全体の移動がいちばん小さいものを選ぶ。
        // （ここを決めずに番号順で組むと、継ぎ目が一か所に寄っているときに
        //   対応がまるごとずれて、格子とは逆向きに引っぱってしまう）
        const K2 = targetGroupCount;
        let bestO = 0;
        let bestCost = Infinity;
        for (let o = 0; o < K2; o++) {
            let cost = 0;
            for (let i = 0; i < K2; i++) {
                const d = near(mids[(i + o) % K2] - chosen[i]);
                cost += d * d;
            }
            if (cost < bestCost) { bestCost = cost; bestO = o; }
        }
        const pull = EVEN_SEAM_PULL * evenBlend;
        chosen = chosen.map((mid, i) => {
            const d = near(mids[(i + bestO) % K2] - mid);
            return (((mid + d * pull) % L) + L) % L;
        });
    }

    prevSeamMids = chosen;

    // 2) 継ぎ目で区切られた区間ごとに、進む向きの多数派を出す。
    //    群れが向かい合ったまま固まってしまうのを防ぐための「整列」で、
    //    詰まって止まったバーだけが、この向きに合わせて反転する。
    //    上下のレイヤーをまたいで多数決するので、重なった2層が同じ向きに流れる。
    const bounds = chosen.slice().sort((a, b) => a - b);
    const sectorOf = (arcPos) => {
        if (bounds.length === 0) return 0;
        let k = bounds.length - 1;          // 最後の継ぎ目から先は0番へ回り込む
        for (let i = 0; i < bounds.length; i++) {
            if (arcPos < bounds[i]) { k = (i - 1 + bounds.length) % bounds.length; break; }
        }
        return k;
    };
    const sectorCount = Math.max(1, bounds.length);
    const tally = new Array(sectorCount).fill(0);
    const stalled = new Array(sectorCount).fill(0);
    const size = new Array(sectorCount).fill(0);
    for (const b of all) {
        const k = sectorOf(b.arcFraction * L);
        tally[k] += b.direction;
        size[k]++;
        if (b.speed < BOUNCE_SPEED_EPSILON * motionScale) stalled[k]++;
    }
    // 行き先を塞がれて群れごと動けなくなった区間は、群れごと向きを変えて引き返す。
    // 逆向きの群れ同士がぶつかったとき、片方が相手に吸収されて
    // 最後は全体が同じ向きに揃ってしまう（＝いつも時計回りに見える）のを防ぐための仕掛け。
    for (const b of all) {
        if (b.dirHoldUntil > elapsedMs) continue;      // 反転した直後はしばらく据え置く
        const k = sectorOf(b.arcFraction * L);
        // 多数派がはっきりしないうちは、いまの向きのままにしておく
        const decisive = Math.abs(tally[k]) >= size[k] * 0.5;
        const major = decisive ? (tally[k] > 0 ? 1 : -1) : b.direction;
        // 群れごとの引き返しは、ある程度の本数がある区間だけ。
        // 1〜2本しかない区間まで対象にすると、1本止まっただけで反転が起きてしまう。
        const stuck = size[k] >= REVERSE_MIN_SIZE
            && stalled[k] / size[k] >= REVERSE_STALL_RATIO;
        b.groupDir = stuck ? -major : major;
        if (stuck) b.dirHoldUntil = elapsedMs + REVERSE_HOLD_MS;
    }

    // 「グループを等間隔に」の補正値を配る（+はarcの進む向き）
    updateEvenSpacing(all, L);

    // 3) 各レイヤーで、選ばれた位置をまたぐ車間に印をつける
    for (const layer of layers) {
        const bs = layer.boids.slice().sort((a, b) => a.arcFraction - b.arcFraction);
        for (const b of bs) b.seamAhead = false;
        if (bs.length === 0) continue;
        for (const m of chosen) {
            for (let i = 0; i < bs.length; i++) {
                const s = bs[i].arcFraction * L;
                const e = bs[(i + 1) % bs.length].arcFraction * L;
                const inSeg = (i === bs.length - 1) ? (m >= s || m < e) : (m >= s && m < e);
                if (inSeg) { bs[i].seamAhead = true; break; }
            }
        }
    }
}

// 収束なしのときの「影響力」が届く範囲（mm）。
// レールは1辺800mmなので、だいたい半辺ぶん先のリーダーまで気配が届く感覚。
const LEADER_INFLUENCE_RANGE_MM = 400;

// 進行方向の前方にいる、いちばん近い「同じ向きに走るリーダー」からの影響の強さを
// 0〜1で返す（すぐ前なら1、届く範囲の端で0）。
// リーダーは上下どちらのレイヤーのものでも構わない。レイヤー同士はすり抜けるので
// 物理的には干渉しないが、勢いにつられる、という関係だけは層をまたいで効く。
function leaderPullAhead(boid, dir, leadersList) {
    const L = perimeterLength;
    const range = LEADER_INFLUENCE_RANGE_MM * mmToPx;
    let nearest = Infinity;
    for (const l of leadersList) {
        if (l === boid) continue;
        if (l.direction !== dir) continue;          // 向かい合って来るリーダーにはつられない
        let d = (l.arcFraction - boid.arcFraction) * dir * L;
        d = ((d % L) + L) % L;                      // 進行方向に測った前方距離
        if (d < nearest) nearest = d;
    }
    if (nearest >= range) return 0;
    return 1 - nearest / range;
}

function leaderSpacingGain() {
    const t = clamp((leaderInfluenceWeight - 1) / 9, 0, 1); // スライダーは1〜10
    return lerp(LEADER_SPACING_MIN_GAIN, LEADER_SPACING_MAX_GAIN, t);
}

let maxTiltDeg = 45;             // バーを進行方向と逆向きに傾ける最大角度（度）

// リーダー同士が連続で並ばないよう、少し広めの車間を取らせる
// （minDistance は画面サイズに応じて変わるので、そのつど計算する）
const LEADER_MIN_GAP_FACTOR = 2;
const boidRadius = 4;     // ドットが少ない分、1つ1つを少し大きく描画

// --- バーの傾き ---
// バーは「ドットに軸で吊り下がった棒」のように振る舞い、慣性で加速度と逆向きに倒れる。
// 　加速中（前へ加速）→ バーは後ろへ倒れる
// 　減速中（ブレーキ）→ バーは前へ振り出される
// つまり傾きは速度ではなく「加速度」に比例する。
const ACCEL_SMOOTH = 0.08;        // 加速度のノイズをならす度合い（0に近いほど滑らか）

// バーの先端が隣のバーとぶつからないよう、傾きによる「先端のレール方向へのずれ」を
// 前後の車間の半分未満に抑える。両隣が同じ制限を守るので、隣り合うバー同士が
// 交差することは原理的に起こらない。
const BAR_TIP_GAP_SAFETY = 0.45;  // 車間に対して先端のずれに許す割合（0.5未満なら非交差が保証される）

// バーの回転は角速度を持たせて動かす。限界角に近づいたら角速度を先読みで落とし、
// 「限界に触れた瞬間に角速度がいきなり0になる」のを避ける。
const TILT_MAX_VEL = 0.02;        // 角速度の上限（ラジアン/フレーム）
const TILT_ANGULAR_ACCEL = 0.0015; // 角加速度の上限（ラジアン/フレーム²）
const TILT_BRAKE = TILT_ANGULAR_ACCEL * 1.5; // 限界角への先読み減速に使う角減速度
const TILT_GAIN = 0.15;           // 目標角へ近づく速さ（比例制御のゲイン）
// 隣が近づいて限界角が縮んでいるとき、何フレーム先の限界角を見て退き始めるか
const LIMIT_LOOKAHEAD_FRAMES = 20;
// 限界角に押された場合に限り、角加速度の上限を何倍まで緩めるか
const TILT_WALL_ACCEL_FACTOR = 3;

// --- 進む方向（時計回り/反時計回り）にランダム性を持たせる ---
const BOUNCE_SPEED_EPSILON = 0.05; // これ未満の速度になったら「詰まっている」とみなす
const BOUNCE_CHANCE = 0.04;        // 詰まっている間、1フレームごとに向きを反転させて抜け出す確率
const FLIP_COOLDOWN_FRAMES = 40;   // 向きを変えた直後、次に向きを変えられるまでの待ちフレーム数
                                   // （反転直後は速度0なので、これがないと連続で反転してしまう）

// 詰まっていなくても、ごくたまに自発的に向きを変える。これがないと、時間が
// 経つにつれて衝突（対向）が淘汰され、最終的に全員が同じ向きに収束して
// 固定化してしまう（一度全員が同じ向きになると、もう詰まる場面が起きず
// BOUNCE_CHANCEも働かなくなるため）。
const RANDOM_DIRECTION_FLIP_CHANCE = 0.0001;

// レイヤーごとに色のセットを用意する（バーの線はドット本体より控えめにする）。
// レイヤー内ではリーダーとフォロワーを同系色にまとめ、
// 明度の差（フォロワーが明るい）に加えて色相も少しだけずらす。
// 大きな色相の違い＝レイヤーの区別、

// 色相は黒背景と同じ（青緑系／橙系）のまま、明るい背景に埋もれないよう

// レイヤーの色分けを使わずにリーダーだけを表示しているときは、
// フォロワーを黒のままにしてリーダーだけが色で浮き上がるようにする

let vibAmpMul = 0.2;             // 震えの大きさの倍率（スライダー中央＝0.2）
let vibSpeedMul = 0.2;           // 震えの速さの倍率（スライダー中央＝0.2）
// 小刻みで速い震えは、ふだんの角加速度の上限では追いつかない。
// 振れ幅が小さいあいだだけ、角の動きの上限をゆるめて、細かく速く震えられるようにする。
const VIB_ACCEL_BOOST = 10;

// ===== MODE10 ライフゲーム（連続版） =====
// ライフゲームの「過疎・適正・過密」という三つの状態を、生死ではなく
// 動きの強さへ翻訳したモード。バーは消えないし、本数も色も変わらない。
//   適正 … 居心地がいいので、その場に落ち着いて止まる
//   過密 … 息苦しいので、群れと反対の向きへ速く離れる
//   過疎 … さみしいので、いちばん近い群れのほうへゆっくり寄っていく
// 本家のライフゲームが B3/S23（生まれる条件より生き続ける条件のほうがゆるい）
// という非対称さを持っているのと同じように、ここでも
// 「すでに落ち着いているバーは多少混んでも動じない（帯が広い）」
// 「動いているバーは条件がそろわないと落ち着かない（帯が狭い）」とした。
// この非対称さがあるおかげで、群れはいったん出来ると粘り、
// 限界を超えたところで一気にほどけ、散ったバーが別の場所で次の種になる。
let lifeRangeMm = 420;        // ここまでの距離にいるバーを「まわり」とみなす
// 居心地のいい混み具合を、「全体に均等に散らばったときの本数」の何倍かで指定する。
// 本数そのもので指定すると、バーの数やレールの大きさを変えたとたんに
// 全部が過密（または全部が過疎）に振り切れてしまう。
// 平均より多めを望ませると、バーは寄り集まろうとし、
// 集まりすぎたところで耐えきれずにほどける、という往復が生まれる。
let lifeDensityMul = 1.3;
let lifeTolerance = 1.5;      // その本数からどれだけ外れても平気か（本）
let lifeSettleSec = 1.2;      // 落ち着く／落ち着かなくなるまでの時間（世代の速さ）
let lifeBoredSec = 16;        // 落ち着いたままだと、これくらいで飽きてくる
let lifeFleeMul = 1.0;        // 過密のときに離れる速さ
let lifeSeekMul = 0.45;       // 過疎のときに寄っていく速さ
// 「まわり」の内側と外側の境目をぼかす幅（範囲に対する割合）。
// きっちり数えると、バーが1本出入りしただけで本数が飛んで動きがガタつく。
const LIFE_KERNEL_SOFT = 0.4;

// 距離が近いほど1に近く、範囲の外で0になる、なめらかな重み
function lifeNeighbourWeight(dAbs, range) {
    if (dAbs >= range) return 0;
    const inner = range * (1 - LIFE_KERNEL_SOFT);
    if (dAbs <= inner) return 1;
    const t = (dAbs - inner) / Math.max(1e-6, range - inner);
    return 1 - t * t * (3 - 2 * t);
}

// 全部が1周に均等に散らばっていたときの「まわりの本数」。
// 混み具合の目標を、この値の何倍かで決めるための基準になる。
function lifeUniformCount(total, range) {
    if (total <= 1) return 0;
    const s = perimeterLength / total;   // 均等に並んだときの車間
    let sum = 0;
    for (let k = 1; k * s < range; k++) sum += lifeNeighbourWeight(k * s, range);
    return sum * 2;                      // 前後の両側ぶん
}

// 毎フレーム、まわりの本数と「落ち着き具合」を更新する
function lifeUpdateState(elapsedMs, dtMs) {
    const all = layers.flatMap((l) => l.boids);
    const L = perimeterLength;
    const range = Math.max(1, lifeRangeMm * mmToPx);

    // 1) まわりに何本いるか、そしてその重心がどちら側にあるか。
    // バーは実際にそこで場所を取っているので、落ち着いていようが
    // 動いていようが、同じ1本として数える。
    for (const b of all) {
        let sum = 0;
        let comNum = 0;
        for (const o of all) {
            if (o === b) continue;
            let d = (o.arcFraction - b.arcFraction) * L;
            if (d > L / 2) d -= L;
            if (d < -L / 2) d += L;
            const w = lifeNeighbourWeight(Math.abs(d), range);
            if (w <= 0) continue;
            sum += w;
            comNum += w * d;
        }
        b.lifeNb = sum;
        b.lifeCom = sum > 0 ? comNum / sum : 0;
        b.lifeHasNb = sum > 0;
    }

    // 2) 落ち着き具合（lifeVal）と、帯からのはみ出し量を進める
    const lifeIdeal = lifeUniformCount(all.length, range) * lifeDensityMul;
    const tol = Math.max(0.15, lifeTolerance);
    const step = dtMs / Math.max(60, lifeSettleSec * 1000);
    for (const b of all) {
        // 落ち着いているバーほど帯が広い（生存）、動いているバーは狭い（誕生）。
        // さらに、落ち着いたまま時間が経つほど帯が狭まっていく（飽き）。
        // 飽きがないと、全部が居心地のいい並びに落ち着いた時点で
        // 二度と動かなくなってしまう。
        const half = tol * (0.6 + 0.9 * b.lifeVal) * (1 - 0.7 * b.lifeRest);
        const lo = lifeIdeal - half;
        const hi = lifeIdeal + half;
        const inBand = b.lifeNb >= lo && b.lifeNb <= hi;
        b.lifeVal = clamp(b.lifeVal + (inBand ? step : -step), 0, 1);
        // 飽きは、落ち着いているあいだにだけ溜まり、動き出すと早く抜ける。
        // 溜まる速さはバーごとに少しずつ違うので、全部がいっせいに
        // 飽きて動き出すことはない。
        const boreStep = dtMs / Math.max(1000, lifeBoredSec * 1000 * b.lifeBoreMul);
        b.lifeRest = clamp(b.lifeRest
            + (inBand && b.lifeVal > 0.6 ? boreStep : -boreStep * 2.5), 0, 1);
        // 帯からどれだけはみ出しているか（＝動きたい強さ）
        b.lifePress = Math.max(0, b.lifeNb - hi) / Math.max(0.3, tol);   // 過密
        b.lifeStarve = Math.max(0, lo - b.lifeNb) / Math.max(0.3, tol);  // 過疎
    }
}

// ===== MODE11 結晶する文様（反応拡散） =====
// 同じルールでも、最初のゆらぎが違えば違う模様に落ち着く——という、
// 対称性の破れをそのまま動きにしたモード。
// 各バーは「濃度」をひとつ持ち、近くのバーとは高め合い、少し離れた
// バーとは抑え合う（近距離は興奮、遠距離は抑制）。この綱引きから、
// 輪の上に自然と山と谷の並びが立ち上がる。
// 素の反応拡散は波長が一意に決まるので、毎回おなじ調子の縞になりやすい。
// そこで毎周、次の四つでばらつきを作っている。
//   1. 核から育てる … 数も位置も強さもランダムな種を置き、
//      育った領域どうしがぶつかった境目に継ぎ目（粒界）が残る
//   2. 冷却の速さ   … 速く冷やすほど、継ぎ目や波長の乱れが抜けきる前に凍る
//   3. 地形の個体差 … バーごとに濃度の出やすさを毎周引き直す。
//      一様な輪だと位相しか変わらないので、引っかかりを作る
//   4. 粗密との往復 … 濃度が車間を変え、車間が変わると隣との距離、
//      つまり効き合う強さが変わって濃度に返ってくる。
//      細胞が動かないふつうの反応拡散にはない、この装置ならではの部分
let rdFineMm = 150;       // 興奮の届く距離。これが文様の細かさを決める
let rdTiltDeg = 26;       // 濃度が作る傾きの振れ幅
let rdDensity = 0.55;     // 濃度が車間をどれだけ変えるか
let rdCoolSec = 26;       // 冷えて結晶しきるまでの時間
let rdHoldSec = 12;       // 結晶したまま保つ時間
let rdSeedVar = 1.0;      // 核のばらつき（0＝毎回ほぼ同じ、大きいほど多様）
const RD_INHIB_RATIO = 2.2;   // 抑制が届く距離は、興奮の何倍か
const RD_INHIB_GAIN = 1.3;    // 全体としては抑制が勝つようにする（これで山谷が立つ）
const RD_RELAX = 0.10;        // 濃度が目標へ寄っていく速さ（1フレームあたり）
// 車間が「だいたい望みどおり」とみなす幅（最小車間に対する割合）。
// ここを狭くすると、目標を行き過ぎるたびに向きを変え直すことになり、
// 文様が固まらずに小刻みな動きが残る。
const RD_DEAD_ZONE = 0.35;
const RD_GAIN = 2.4;          // 飽和の効き。大きいほど白黒がはっきりする

let rdTemp = 1;               // いまの「熱」。1＝ゆらぎが大きい、0＝凍結
let rdPhase = 'cool';         // cool＝冷やしている、hold＝結晶を保っている
let rdPhaseStart = 0;
let rdCycle = 0;              // 何回目の結晶か
// 結晶ごとに、文様の細かさそのものを振る倍率。
// 反応拡散は放っておくと波長が一意に決まってしまい、毎回おなじ本数の縞になる
// （初期ノイズで変わるのは位相だけで、輪の上では回転にしか見えない）。
// 結晶するたびに条件のほうを少し変えることで、縞の本数から変わるようにする。
// 実際の結晶でも、そのときの温度や濃度で粒の大きさが変わるのと同じ考え方。
let rdFineJitter = 1;

// 濃度の種をまき直す（＝焼きなましの再加熱）
function rdSeed(nowMs) {
    const all = layers.flatMap((l) => l.boids);
    const L = perimeterLength;
    // 今回の結晶の「細かさ」を決める。ばらつきを0にすると毎回同じ細かさになる。
    rdFineJitter = Math.exp((Math.random() * 2 - 1) * 0.5 * rdSeedVar);
    // 核の数そのものも毎回変える
    const nucleiBase = 2 + Math.floor(Math.random() * 5);            // 2〜6個
    const nuclei = Math.max(1, Math.round(nucleiBase * (0.5 + rdSeedVar * 0.5)));
    const sites = [];
    for (let i = 0; i < nuclei; i++) {
        sites.push({
            frac: Math.random(),
            // 核ごとに大きさを大きく振ると、育った領域の細かさがそれぞれ違い、
            // ぶつかった境目に継ぎ目（粒界）が残りやすくなる
            frac2: 0,
            strength: (0.5 + Math.random() * 0.9) * (Math.random() < 0.5 ? -1 : 1),
            width: (0.3 + Math.random() * 1.9) * rdFineMm * rdFineJitter * mmToPx,
        });
    }
    for (const b of all) {
        // 地形の個体差。毎周引き直すので、同じ核の置き方でも育ち方が変わる
        b.rdBias = (Math.random() * 2 - 1) * 0.25 * rdSeedVar;
        let u = (Math.random() * 2 - 1) * 0.05;
        for (const s of sites) {
            let d = (b.arcFraction - s.frac) * L;
            if (d > L / 2) d -= L;
            if (d < -L / 2) d += L;
            u += s.strength * Math.exp(-(d * d) / (s.width * s.width));
        }
        b.rdU = clamp(u, -1, 1);
        b.rdErr = 0;
    }
    rdTemp = 1;
    rdPhase = 'cool';
    rdPhaseStart = nowMs;
    rdCycle++;
}

// 毎フレーム、濃度と熱を進める
function rdUpdateState(elapsedMs, dtMs) {
    const all = layers.flatMap((l) => l.boids);
    if (all.length === 0) return;
    const L = perimeterLength;

    // --- 熱の進み（焼きなまし）---
    const phaseMs = elapsedMs - rdPhaseStart;
    if (rdPhase === 'cool') {
        const p = clamp(phaseMs / Math.max(500, rdCoolSec * 1000), 0, 1);
        // 最初はゆっくり、終わりに向けて一気に冷える
        rdTemp = Math.pow(1 - p, 1.7);
        if (p >= 1) { rdPhase = 'hold'; rdPhaseStart = elapsedMs; rdTemp = 0; }
    } else {
        rdTemp = 0;
        if (phaseMs > Math.max(500, rdHoldSec * 1000)) rdSeed(elapsedMs);
    }

    // --- 濃度を進める ---
    // 近距離は高め合い（興奮）、遠距離は抑え合う（抑制）。
    // 距離はいまの実際の並びで測るので、バーが動けば効き合う強さも変わる。
    // 濃度が変われば車間が変わり、車間が変わればまた濃度が変わる——という
    // 輪になっているので、この系にはそのままでは静止点がない。
    // 冷えるにつれて濃度の動きそのものを鈍らせ、保つあいだは完全に止めることで、
    // 結晶しきったところで文様が固定される（実際に冷えれば原子も動けなくなる）。
    const relax = rdPhase === 'hold' ? 0 : RD_RELAX * (0.25 + 0.75 * rdTemp);
    if (relax <= 0) {
        // 濃度が動かないなら、望む車間も変わらない。
        // 下の車間合わせだけを続けて、バーを目標へ収めきる。
        rdUpdateGaps(all, L);
        return;
    }
    const ra = Math.max(1, rdFineMm * rdFineJitter * mmToPx);
    const rb = ra * RD_INHIB_RATIO;
    const bIn = (ra / rb) * RD_INHIB_GAIN;
    const next = new Float64Array(all.length);
    for (let i = 0; i < all.length; i++) {
        const b = all[i];
        let s = 1 - bIn;                       // 自分自身のぶん（距離0）
        s *= b.rdU;
        for (let j = 0; j < all.length; j++) {
            if (j === i) continue;
            const o = all[j];
            let d = (o.arcFraction - b.arcFraction) * L;
            if (d > L / 2) d -= L;
            if (d < -L / 2) d += L;
            const e = Math.exp(-(d * d) / (ra * ra));
            const h = Math.exp(-(d * d) / (rb * rb));
            if (e < 1e-4 && h < 1e-4) continue;
            s += (e - bIn * h) * o.rdU;
        }
        // 飽和させて -1〜1 に収め、熱のぶんだけゆらがせる
        const target = Math.tanh(RD_GAIN * (s + b.rdBias)
            + (Math.random() * 2 - 1) * 0.9 * rdTemp);
        next[i] = b.rdU + (target - b.rdU) * relax;
    }
    for (let i = 0; i < all.length; i++) all[i].rdU = clamp(next[i], -1, 1);

    rdUpdateGaps(all, L);
}

// --- 濃度から「望む車間」を決めて、いまの車間とのずれを出す ---
// 濃いところは詰まり、薄いところは空く。これが粗密の文様になる。
// ぶつからないための最小車間は、共通の追従ルールが守ってくれるので、
// ここでは「どちらへ動きたいか」だけを作ればよい。
function rdUpdateGaps(all, L) {
    for (const layer of layers) {
        const bs = layer.boids.slice().sort((a, b) => a.arcFraction - b.arcFraction);
        const n = bs.length;
        if (n < 2) continue;
        const baseGap = L / n;
        // まず、各すき間について「こうなってほしい広さ」を出す
        const want = new Float64Array(n);      // want[i] ＝ bs[i] と bs[i+1] のあいだ
        let wantSum = 0;
        for (let i = 0; i < n; i++) {
            const u = (bs[i].rdU + bs[(i + 1) % n].rdU) * 0.5;
            want[i] = baseGap * clamp(1 - rdDensity * u, 0.25, 2.2);
            wantSum += want[i];
        }
        // すき間の合計は必ず一周ぶんになるので、そこへ合わせて正規化しておく。
        // これをしないと「全部のすき間を望みどおりにする」ことが原理的に
        // 不可能な注文になり、どのバーも永久にずれを抱えて動き続けてしまう。
        const norm = wantSum > 0 ? L / wantSum : 1;
        for (let i = 0; i < n; i++) want[i] *= norm;
        for (let i = 0; i < n; i++) {
            const b = bs[i];
            let gapPrev = (b.arcFraction - bs[(i - 1 + n) % n].arcFraction) * L;
            if (gapPrev < 0) gapPrev += L;
            let gapNext = (bs[(i + 1) % n].arcFraction - b.arcFraction) * L;
            if (gapNext < 0) gapNext += L;
            // 前が望みより空いていれば前へ、後ろが空いていれば後ろへ
            let err = (gapNext - want[i]) - (gapPrev - want[(i - 1 + n) % n]);
            // 熱いあいだは、ずれとは関係なくふらつく（凝り固まらないように）
            err += (Math.random() * 2 - 1) * baseGap * 0.6 * rdTemp;
            b.rdErr = err;
        }
    }
}

// そのバーの、いまの車間から決まる震えの振れ幅と速さ
function vibParamsFor(boid) {
    const roomMm = (boid.roomPx || VIB_REF_GAP_MM * mmToPx) / mmToPx;
    const r = clamp(roomMm / VIB_REF_GAP_MM, 0.25, 3);
    return {
        pos: Math.min(VIB_POS_MAX_MM, roomMm * VIB_ROOM_RATIO) * mmToPx * vibAmpMul,
        // 角度の震えも車間しだい。先端が動く量を車間の一部に抑えることで、
        // 詰まるほど自然に細かくなり、隣とぶつからずにすむ。
        tilt: Math.min((VIB_TILT_MAX_DEG * Math.PI) / 180,
            Math.asin(clamp((roomMm * mmToPx * VIB_TILT_ROOM_RATIO)
                / Math.max(1, getNormalLineLength()), 0, 1))) * vibAmpMul,
        // 立ち上がりのあいだは、本来の速さよりゆっくりから始める
        freq: lerp(VIB_START_FREQ, 1, dialVibFade)
            * Math.pow(1 / r, VIB_FREQ_POW) * vibSpeedMul,
    };
}
let dialVibFreq = 1;             // 表示・計測用の、震えの速さの代表値
let dialFreeze = 0;              // 爆発直前の静止（0〜1）
let dialVibFade = 0;             // 震えの立ち上がり（0〜1）
let shrinkSpeedMul = 1;          // 「収縮の速さ」スライダー（1＝一巡の長さぴったり）
const FRAME_MS = 16.7;           // 1フレームのだいたいの長さ（速さはフレームあたりのpx）
const BANG_V0 = 6.5;             // 爆発の初速（巡航速度に対する倍率）
const BANG_DECAY = 0.972;        // 初速が抜けていく速さ（1フレームあたり）
// 広がったあと、輪がゆっくり1周する時間。
// ここで漂ったまま待つので、バーが無理なくついていける速さにしてある。
const DIAL_SPIN_MS = 240000;

// リング上の2点を、近いほうまわりで補間する
function blendFrac(a, b, t, L) {
    let d = (b - a) * L;
    if (d > L / 2) d -= L;
    if (d < -L / 2) d += L;
    return (((a + (d * t) / L) % 1) + 1) % 1;
}

// 収縮の行き先。数字ごとに、その数字の中心へ画が寄り集まる。
// 画を等間隔に並べ直すのではなく、いまの位置を中心に向かって一律に縮める。
// こうすると、どの画も中心へ近づくだけで、外へ戻る画が出ない
// （並べ直すと、もともと中心寄りにいた画がわざわざ外へ動いてしまう）。
// 数字の中の車間もすべて同じ割合で狭まるので、広がる車間もできない。
const PACK_SCALE = 0.38;         // 収縮しきったときの、数字の幅の縮み方
function packDialTargets() {
    const L = perimeterLength;
    const safe = minDistance * 1.15;      // 縮みきっても、これだけは空けておく
    const offOf = (frac, centre) => {
        let off = frac - centre;
        if (off > 0.5) off -= 1;
        if (off < -0.5) off += 1;
        return off;
    };
    for (const layer of layers) {
        // 塊ごとに、中心から等間隔で詰めなおした場所を行き先にする。
        // 「いまの並びを縮尺する」だけだと、もともと詰まっている1組に引きずられて
        // 塊全体がほとんど縮まないので、間隔をそろえてから詰める。
        const groups = new Map();
        for (const b of layer.boids) {
            if (b.dialFrac === null || b.dialCentre === undefined || b.dialCentre === null) {
                b.packFrac = null;
                continue;
            }
            if (!groups.has(b.dialCentre)) groups.set(b.dialCentre, []);
            groups.get(b.dialCentre).push(b);
        }
        for (const [centre, arr] of groups) {
            arr.sort((x, y) => offOf(x.dialFrac, centre) - offOf(y.dialFrac, centre));
            const m = arr.length;
            if (m === 1) {
                arr[0].packFrac = ((centre % 1) + 1) % 1;
                continue;
            }
            const offs = arr.map((b) => offOf(b.dialFrac, centre) * L);
            const span = offs[m - 1] - offs[0];
            // 縮めたあとの車間。詰めすぎて重ならないよう、最小の車間は必ず空ける。
            const gap = Math.max(safe, (span / (m - 1)) * PACK_SCALE);
            for (let i = 0; i < m; i++) {
                const off = (i - (m - 1) / 2) * gap;
                arr[i].packFrac = ((centre + off / L) % 1 + 1) % 1;
            }
        }
    }
}

// 爆発のあとの行き先。上下あわせて36本が、1周にほぼ等間隔で並ぶように配る。
// 上のレイヤーは半目盛りずらして、重ならないようにする。
function spreadDialTargets() {
    const L = perimeterLength;
    for (let li = 0; li < layers.length; li++) {
        const bs = layers[li].boids.slice().sort((a, b) => a.arcFraction - b.arcFraction);
        const n = bs.length;
        if (n === 0) continue;
        const step = 1 / n;
        const phase = (li * 0.5) * step;
        // いまの並びから、いちばん動かずにすむ回し方を選ぶ（追い抜かないため）
        let bestO = 0;
        let bestCost = Infinity;
        for (let o = 0; o < n; o++) {
            let cost = 0;
            for (let j = 0; j < n; j++) {
                let d = (phase + j * step - bs[(o + j) % n].arcFraction) * L;
                if (d > L / 2) d -= L;
                if (d < -L / 2) d += L;
                cost += d * d;
            }
            if (cost < bestCost) { bestCost = cost; bestO = o; }
        }
        for (let j = 0; j < n; j++) {
            bs[(bestO + j) % n].evenFrac = ((phase + j * step) % 1 + 1) % 1;
        }
    }
}

// レールの中心から見た「放射状」を、バーの倒し方（接線方向の成分）で表す。
// これを dialLean と同じ扱いにすれば、傾きの計算はそのまま使える。
function radialLeanAt(arcFraction) {
    const pt = getPointOnPerimeter(arcFraction);
    const cx = (bounds.left + bounds.right) / 2;
    const cy = (bounds.top + bounds.bottom) / 2;
    let rx = pt.x - cx;
    let ry = pt.y - cy;
    const len = Math.hypot(rx, ry) || 1;
    rx /= len; ry /= len;
    const tx = -pt.ny;      // レールの接線（arcが増える向き）
    const ty = pt.nx;
    return clamp(rx * tx + ry * ty, -1, 1);
}

// 両隣の「実際の倒れ方」から、先端が追い越さない範囲へ角度を収める。
// 車間ぶんだけ隣より倒れてよい、という考え方。
// 2本のバーのあいだで、レールの法線がどれだけ回っているか（ラジアン・符号なし）。
// 角をまたぐと法線は90度回るので、同じ「倒し方」でも先端は遠く離れる。
function normalTurnBetween(a, b) {
    const pa = getPointOnPerimeter(a.arcFraction);
    const pb = getPointOnPerimeter(b.arcFraction);
    if (!pa || !pb) return 0;
    return Math.abs(Math.atan2(pb.nx * pa.ny - pb.ny * pa.nx,
        pb.nx * pa.nx + pb.ny * pa.ny));
}

// clampLeanToNeighbours は先端の横ずれ（sin）だけで見ているので、
// バーが長く、大きく倒れているときには、先端より手前で線どうしが交わることがある。
// 同じ高さでの横位置（tan）で比べて、どの高さでも追い越さない範囲へ収める。
// 天板を出して長いバーにしたとき（MODE25）のためのもの
function clampLeanTan(tilt, prevB, nextB, gapPrev, gapNext, dir) {
    const barLen = getNormalLineLength();
    if (barLen <= 0) return tilt;
    const m = minDistance * 0.6;
    const tanOf = (lean) => { const a = Math.asin(clamp(lean, -0.99, 0.99)); return Math.tan(a); };
    const leanOf = (b) => -Math.sin(b.tilt) * b.direction;
    const hi = tanOf(leanOf(nextB)) + Math.max(0, gapNext - m) / barLen;
    const lo = tanOf(leanOf(prevB)) - Math.max(0, gapPrev - m) / barLen;
    let T = tanOf(-Math.sin(tilt) * dir);
    T = clamp(T, Math.min(lo, hi), Math.max(lo, hi));
    const lean = Math.sin(Math.atan(T));
    return Math.asin(clamp(-lean * dir, -1, 1));
}

function clampLeanToNeighbours(shaped, prevB, nextB, gapPrev, gapNext, dir, curB) {
    const barLen = getNormalLineLength();
    if (barLen <= 0) return shaped;
    const leanOf = (b) => -Math.sin(b.tilt) * b.direction;
    // 先端に残す余白。車間が広いときほど大きめに取る。
    const m = clamp(Math.min(gapPrev, gapNext) * 0.1,
        minDistance * 0.2, minDistance * 1.2);
    // 隣の「倒し方」は、その場所の法線を基準にした値。角をまたいで法線が
    // 回っているぶんは、比べる前に見込んでおく（そうしないと、角の前後で
    // 放射状に開いているだけのバーまで、ぶつかる扱いになってしまう）。
    const tp = curB ? Math.abs(Math.sin(normalTurnBetween(curB, prevB))) : 0;
    const tn = curB ? Math.abs(Math.sin(normalTurnBetween(curB, nextB))) : 0;
    const hiLean = leanOf(nextB) + Math.max(0, gapNext - m) / barLen + tn;
    const loLean = leanOf(prevB) - Math.max(0, gapPrev - m) / barLen - tp;
    let lean = -Math.sin(shaped) * dir;
    lean = clamp(lean, Math.min(loLean, hiLean), Math.max(loLean, hiLean));
    return Math.asin(clamp(-lean * dir, -1, 1));
}

// バー1本を線分として取り出す（描画とまったく同じ向きの決め方）
function barSegmentAt(frac, tiltValue, dir, len) {
    const p = getPointOnPerimeter(frac);
    const tmx = -p.ny * dir;
    const tmy = p.nx * dir;
    const c = Math.cos(tiltValue);
    const s = Math.sin(tiltValue);
    return {
        x1: p.x, y1: p.y,
        x2: p.x + (p.nx * c - tmx * s) * len,
        y2: p.y + (p.ny * c - tmy * s) * len,
    };
}

function segmentsHit(a, b) {
    const o = (px, py, qx, qy, rx, ry) =>
        Math.sign((qx - px) * (ry - py) - (qy - py) * (rx - px));
    const o1 = o(a.x1, a.y1, a.x2, a.y2, b.x1, b.y1);
    const o2 = o(a.x1, a.y1, a.x2, a.y2, b.x2, b.y2);
    const o3 = o(b.x1, b.y1, b.x2, b.y2, a.x1, a.y1);
    const o4 = o(b.x1, b.y1, b.x2, b.y2, a.x2, a.y2);
    return o1 !== o2 && o3 !== o4 && o1 !== 0 && o2 !== 0 && o3 !== 0 && o4 !== 0;
}

// 車間からの見積もりは、レールがまっすぐな前提の近似なので、
// 大きく倒す文字盤モードでは、曲がり角のあたりで足りないことがある。
// そこで最後に、実際の線分が両隣と交わらないところまで角度を戻す。
function tiltWithoutCross(boid, dir, safeTilt, wantTilt, prevB, nextB) {
    const len = getNormalLineLength();
    const frac = Number.isFinite(boid.nextArcFraction)
        ? boid.nextArcFraction : boid.arcFraction;
    const others = [];
    for (const o of [prevB, nextB]) {
        if (!o || o === boid) continue;
        // 相手がこのフレームで決まっていれば、その新しい姿と比べる
        const fresh = o.tiltStamp === simFrameId;
        others.push(barSegmentAt(
            fresh ? o.nextArcFraction : o.arcFraction,
            fresh ? o.nextTilt : o.tilt,
            fresh ? o.nextDirection : o.direction, len));
    }
    if (others.length === 0) return wantTilt;
    const hits = (tv) => {
        const seg = barSegmentAt(frac, tv, dir, len);
        for (const s of others) if (segmentsHit(seg, s)) return true;
        return false;
    };
    if (!hits(wantTilt)) return wantTilt;
    let lo = safeTilt;
    let hi = wantTilt;
    if (hits(lo)) {
        // いまの角度でも交わっているとき。立てる向き（0）まで下げて、
        // そこから交わらないぎりぎりを探す。
        if (hits(0)) return safeTilt;   // どうにもならないときは動かさない
        lo = 0;
    }
    for (let k = 0; k < 6; k++) {
        const mid = (lo + hi) / 2;
        if (hits(mid)) hi = mid; else lo = mid;
    }
    return lo;
}

// 0〜1のなめらかな立ち上がり
function ramp01(v, a, b) {
    const t = clamp((v - a) / Math.max(1e-6, b - a), 0, 1);
    return t * t * (3 - 2 * t);
}

// 12個の数字ぶんの画を、レール上の位置と傾きとして組み立てる
function buildDialTargets() {
    const lean = Math.sin((dialLeanDeg * Math.PI) / 180);
    // 板に隠れるぶんだけ、数字の組み立ての起点を外へずらす。
    // V は足元を狭め、X は交点が帯の真ん中あたりに来るよう足元を広げる。
    const feet = dialFeet(lean, dialUnitMm());
    // 1画ぶんの間隔を「1周に対する割合」に直す
    const unit = (dialUnitMm() * mmToPx) / perimeterLength;
    const top = (straightLength / 2) / perimeterLength; // 12時＝上辺の中央
    const list = [];
    for (let h = 1; h <= 12; h++) {
        const glyphs = ROMAN_NUMERALS[h - 1].split('');
        const widths = glyphs.map((g) => (g === 'I' ? 1 : DIAL_VX_WIDTH));
        const total = widths.reduce((a, b) => a + b, 0)
            + DIAL_GLYPH_GAP * (glyphs.length - 1);
        const centre = top + h / 12;
        const parts = [];
        let cur = -total / 2;
        for (let gi = 0; gi < glyphs.length; gi++) {
            const gc = cur + widths[gi] / 2;
            if (glyphs[gi] === 'I') {
                parts.push({ off: gc, lean: 0 });
            } else if (glyphs[gi] === 'V') {
                // 末広がり：左の画は左へ、右の画は右へ倒す
                parts.push({ off: gc - feet.v, lean: -lean });
                parts.push({ off: gc + feet.v, lean: +lean });
            } else {
                // 交差：左の画は右へ、右の画は左へ倒すと真ん中で交わる
                parts.push({ off: gc - feet.x, lean: +lean });
                parts.push({ off: gc + feet.x, lean: -lean });
            }
            cur += widths[gi] + DIAL_GLYPH_GAP;
        }
        for (const q of parts) {
            list.push({ frac: (((centre + q.off * unit) % 1) + 1) % 1, lean: q.lean,
                numeral: h, centreFrac: ((centre % 1) + 1) % 1 });
        }
    }
    list.sort((a, b) => a.frac - b.frac);
    // 並び順に上下へ交互。Xの2画は必ず隣り合うので、自動的に別レイヤーになる。
    for (let i = 0; i < list.length; i++) list[i].layer = i % 2;
    dialTargets = list;
}

// explosion で「元の並びに戻す」ときの割り当て直し。
// 戻り先（seedExplosionTargets で決めた持ち場）はそのままに、
// どのバーがどこへ戻るかだけを、いまの位置からいちばん動かずにすむ形に選び直す。
function reassignHomeSlots() {
    const L = perimeterLength;
    for (const layer of layers) {
        const bs = layer.boids.slice().sort((a, b) => a.arcFraction - b.arcFraction);
        const homes = layer.boids
            .filter((b) => b.dialFrac !== null && b.dialFrac !== undefined)
            .map((b) => ({ frac: b.dialFrac, centre: b.dialCentre, num: b.dialNumeral }))
            .sort((a, b) => a.frac - b.frac);
        const n = Math.min(bs.length, homes.length);
        if (n === 0) continue;
        let bestO = 0;
        let bestCost = Infinity;
        for (let o = 0; o < n; o++) {
            let cost = 0;
            for (let j = 0; j < n; j++) {
                let d = (homes[j].frac - bs[(o + j) % n].arcFraction) * L;
                d = ((d % L) + L) % L;
                if (d > L / 2) d -= L;
                cost += Math.abs(d);
            }
            if (cost < bestCost) { bestCost = cost; bestO = o; }
        }
        for (let j = 0; j < n; j++) {
            const b = bs[(bestO + j) % n];
            b.dialFrac = homes[j].frac;
            b.dialCentre = homes[j].centre;
            b.dialNumeral = homes[j].num;
        }
    }
}

// explosion（MODE6）の下ごしらえ。
// 文字盤は作らず、いまバーが並んでいるところをそのまま持ち場にする。
// 近くにいるものどうしを1つの塊とみなし、その塊の中心へ縮んでいく。
function seedExplosionTargets() {
    const L = perimeterLength;
    const all = layers.flatMap((l) => l.boids);
    if (all.length === 0 || L <= 0) return;
    // その場に留まるモードなので、重なったまま入ってきたぶんはここでほどいておく
    spaceOutStart();
    // レールの1辺ぶん（直線＋そのあとの角）。これを「まとまりの数」で割る。
    const side = straightLength + arcLength;
    const per = clamp(Math.round(explodeGroupsPerSide), 1, 8);
    const spanLen = side / per;
    // 角のまんなかで区切ると数字が辺をまたぐので、辺の中央がまとまりの中心に
    // なるように、半分の角ぶんだけずらしてから割る。
    const shift = arcLength / 2;
    for (const b of all) {
        const s = (((b.arcFraction * L + shift) % L) + L) % L;
        const idx = Math.min(4 * per - 1, Math.floor(s / spanLen));
        const centreS = (((idx + 0.5) * spanLen - shift) % L + L) % L;
        b.dialFrac = b.arcFraction;
        b.dialCentre = centreS / L;
        b.dialNumeral = idx + 1;
    }
    spaceOutHomes();
    packDialTargets();
}

// 持ち場どうしが近すぎないように、少しだけ押し広げる。
// いまの並びをそのまま持ち場にすると、重なったままのところが残ってしまうため。
function spaceOutHomes() {
    const L = perimeterLength;
    const safe = minDistance * 1.1;
    for (const layer of layers) {
        const bs = layer.boids.filter((b) => b.dialFrac !== null)
            .sort((a, b) => a.dialFrac - b.dialFrac);
        const n = bs.length;
        if (n < 2 || safe * n >= L) continue;
        for (let it = 0; it < 8; it++) {
            let worst = 0;
            for (let i = 0; i < n; i++) {
                const a = bs[i];
                const c = bs[(i + 1) % n];
                let g = (c.dialFrac - a.dialFrac) * L;
                if (g <= 0) g += L;
                if (g < safe) {
                    const push = (safe - g) / 2 / L;
                    a.dialFrac = ((a.dialFrac - push) % 1 + 1) % 1;
                    c.dialFrac = ((c.dialFrac + push) % 1 + 1) % 1;
                    worst = Math.max(worst, safe - g);
                }
            }
            if (worst === 0) break;
        }
    }
}

// いまいる位置からいちばん動かずにすむ組み合わせで、バーを持ち場に割り当てる。
// レイヤー内では追い抜けないので、並び順を保ったまま「何番ずらすか」だけを選ぶ。
function assignDialSlots() {
    if (dialTargets.length === 0) buildDialTargets();
    const L = perimeterLength;
    for (let li = 0; li < layers.length; li++) {
        const targets = dialTargets.filter((t) => t.layer === li);
        const bs = layers[li].boids.slice().sort((a, b) => a.arcFraction - b.arcFraction);
        const n = Math.min(bs.length, targets.length);
        if (n === 0) continue;
        let bestO = 0;
        let bestCost = Infinity;
        for (let o = 0; o < n; o++) {
            let cost = 0;
            for (let j = 0; j < n; j++) {
                let d = (targets[j].frac - bs[(o + j) % n].arcFraction) * L;
                if (d > L / 2) d -= L;
                if (d < -L / 2) d += L;
                cost += d * d;
            }
            if (cost < bestCost) { bestCost = cost; bestO = o; }
        }
        for (const b of layers[li].boids) { b.dialFrac = null; b.dialLean = 0; b.dialNumeral = 0; }
        for (let j = 0; j < n; j++) {
            const b = bs[(bestO + j) % n];
            b.dialFrac = targets[j].frac;
            // 放射は「数字ひとかたまり」の向きとして与える。画ごとに測ると、
            // 端の画ほど強く倒れて V・X の形が崩れてしまう（カルティエの
            // 文字盤も、数字ごとに向きを変え、字の中の形はそのまま）。
            // 角度どうしを足すので、V・X はブロックの軸に対して左右対称になる。
            const blockRad = Math.asin(clamp(
                radialLeanAt(targets[j].centreFrac) * DIAL_RADIAL_MIX, -1, 1));
            const strokeRad = Math.asin(clamp(targets[j].lean, -1, 1));
            b.dialLean = clamp(Math.sin(blockRad + strokeRad), -0.95, 0.95);
            b.dialNumeral = targets[j].numeral;
            b.dialCentre = targets[j].centreFrac;
        }
    }
}

// ============ MODE9：ニュートンのゆりかご ============
// 文字盤(ローマ数字)の上で、1画ぶんの「欠け」を数字から数字へ玉突きのように渡していく。
// Iから出た画がIIにぶつかると、IIにいた画のうち先頭(次の数字に近い側)の1本が
// IIIへ弾き出され…という具合に、輪をひとまわりする。
// 速さ・加減速は既存の「最高速度」「加減速の強さ」スライダーがそのまま効く
// （行き先(dialFrac)を書き換えるだけで、動き自体はローマ数字モードと同じ仕組みに乗せている）。
// ゆりかごが動きはじめる数字。XII（真上）の右端の画から出発する
const NEWTON_START_NUMERAL = 12;
let newtonLoopForever = false;   // false＝1周したら止まる／true＝くり返す
let newton = null;
// 弾かれて飛び出す1本だけを「パチン」という手応えにするための専用パラメータ。
// 全modeで共通の「最高速度」「加減速の強さ」スライダーはそのままに、
// この1本だけ、一定の速さで走って衝突の瞬間まで減速しないようにする
// （運動エネルギーを目減りさせず、次の1本にそのまま渡すため）。
// ただし受け渡しを何周も繰り返すと、計算の誤差やはずみで少しずつ速さが
// ずれていく（増え続けることがある）ので、下限・上限で挟んでおく。
// これがないと、稀に極端に速くなって着地の間に合わなくなり、
// 途中で止まって見えることがあった。
// ローマ数字は画数（線の本数）が数字ごとに違うので、隣どうしの間隔（＝1本が
// 実際に走る距離）も数字によって変わる（画数が多い数字は間隔が詰まり、
// 画数が少ない数字は間隔が空く）。以前は「どの区間もだいたい同じ時間で
// 着く」ように距離に応じて速さを変えていたが、そうすると毎区間ぴったり
// 同じリズムになってしまい単調とのことだったので、速さそのものは
// 区間によらず常に一定にする（＝下のNEWTON_SNAP_SPEED_MULT倍のまま）。
// 間隔が広い区間は自然とそのぶん時間がかかり、狭い区間はすぐ着く、
// という距離なりのばらつきをそのまま見せる。
const NEWTON_SNAP_SPEED_MULT = 2.0;     // 受け渡しで飛び出す速さ（巡航速度の何倍か）
const NEWTON_ACCEL_BOOST = 8;        // その1本だけ、加速・減速そのものを強くする（発進の鋭さ・受け渡し後の止まりの効き）
// 静止した文字盤から最初の1本が動き出すときだけ、さらにゆったり
// 立ち上がらせるための専用の弱い加速倍率（1未満＝ふつうの「動き出しの
// 加速度」よりもっとゆっくり）。数値を小さくするほど、立ち上がりが長くなる。
const NEWTON_SOFT_START_ACCEL_MUL = 0.5;
// 何かの拍子に、飛んでいる1本がいつまでも次の数字へ着けなくなることがある場合の安全弁。
// これだけ待っても着かなければ、無理に足止めせずその場で収めて先へ進める。
const NEWTON_STALL_TIMEOUT_MS = 6000;
// プレビュー環境などで描画そのものが数秒まるごと止まり、次のフレームが
// 遅れて来ることがある（本人は「詰まって動けない」わけではなく、単に
// 描画が一時的に止まっていただけ）。これをそのまま経過時間として扱うと、
// 再開した瞬間に「6秒も経った＝詰まっている」と誤判定して、本来は
// 詰まっていない1本を無理やり目的地へワープさせてしまう
// （＝「止まって見えて、次の瞬間ワープする」という見え方の正体）。
// これを防ぐため、ニュートンのゆりかごの経過時間だけは実時間をそのまま
// 使わず、1フレームあたりの進みに上限を設けた「体感時間」で数える。

// 実際の物理（stepSimulation側のdtMs）はもともと64msで頭打ちにしている
// ので、それと同じ考え方をここでも使うだけで、他の動き方は変えない。
const NEWTON_CLOCK_STEP_CAP_MS = 200;
let newtonSimClock = 0;
let newtonLastRealMs = null;

function newtonBoidsAt(numeral) {
    return layers.flatMap((l) => l.boids).filter((b) => b.dialNumeral === numeral);
}

// numeral の持ち場(dialTargets)へ、いまそこにいるバーたちを動きの少ない順に割り当て直す
function newtonSettleNumeral(numeral, elapsedMs) {
    const targets = dialTargets.filter((t) => t.numeral === numeral)
        .slice().sort((a, b) => a.frac - b.frac);
    const bs = newtonBoidsAt(numeral).slice().sort((a, b) => a.arcFraction - b.arcFraction);
    const n = Math.min(targets.length, bs.length);
    for (let i = 0; i < n; i++) {
        const t = targets[i];
        const blockRad = Math.asin(clamp(radialLeanAt(t.centreFrac) * DIAL_RADIAL_MIX, -1, 1));
        const strokeRad = Math.asin(clamp(t.lean, -1, 1));
        const newLean = clamp(Math.sin(blockRad + strokeRad), -0.95, 0.95);
        // 着いた瞬間の角度をいきなり切り替えず、いまの値から新しい値へ
        // じわっと（TURN_RISE_MSかけて）混ぜていく。着いた本人だけでなく、
        // 合流先ですでに休んでいた画も、詰め直しで持ち場が変わることがあるので
        // 同じ扱いにしておく。
        bs[i].dialLeanFrom = bs[i].dialLean;
        bs[i].dialLeanBlendStart = Number.isFinite(elapsedMs) ? elapsedMs : 0;
        bs[i].dialFrac = t.frac;
        bs[i].dialLean = newLean;
        bs[i].dialCentre = t.centreFrac;
        bs[i].dialNumeral = numeral;
    }
}

// numeral にいるバーのうち、いちばん先(＝次の数字に近い側)にいる1本を、次の数字へ弾き出す。
// 発進の速さは、この関数の中で区間の距離から決める（下のhopSpeed）。
// initialSpeed は現在は使っていない（以前は受け渡し元の速さをそのまま引き継いでいたが、
// 区間ごとの距離のばらつきで「間隔が広い数字のところだけ遅い」という見え方になって
// いたため、距離に応じた速さの計算に置き換えた）。呼び出し側の引数はそのまま残してある。
function newtonLaunch(numeral, initialSpeed, elapsedMs, soft) {
    const toNumeral = (numeral % 12) + 1;
    const residents = newtonBoidsAt(numeral).slice()
        .sort((a, b) => a.arcFraction - b.arcFraction);
    const leaving = residents[residents.length - 1];
    if (!leaving) return false;
    // 行き先の、いちばん手前（進行方向でいちばん近い側）の画のすぐ手前を目指す。
    // ちょうどそこに「ぶつかる」形になり、すでにいる画とぴったり重なる心配がない
    // （中心をそのまま狙うと、画数が奇数の数字では真ん中の画とぴったり重なって
    // 車間を詰めきれず、いつまでも「到着」できなくなることがあるため）。
    const L = perimeterLength;
    const destResidents = newtonBoidsAt(toNumeral).slice()
        .sort((a, b) => a.arcFraction - b.arcFraction);
    let targetFrac;
    if (destResidents.length > 0) {
        const nearest = destResidents[0];
        const approachGap = (minDistance * 1.6) / L;
        targetFrac = ((nearest.dialFrac - approachGap) % 1 + 1) % 1;
    } else {
        const t = dialTargets.find((tt) => tt.numeral === toNumeral);
        targetFrac = t ? t.centreFrac : leaving.dialFrac;
    }
    leaving.dialNumeral = toNumeral;
    leaving.dialFrac = targetFrac;
    // 向きは「次の数字へ進む向き」に直接そろえておく。
    // 休んでいたときの向きのまま（逆向き）だと、いったん止まって向きを変える
    // 一般ロジックが働いてしまい、せっかく渡した速さがそこで無駄になる。
    let toDiff = (targetFrac - leaving.arcFraction) * L;
    if (toDiff > L / 2) toDiff -= L;
    if (toDiff < -L / 2) toDiff += L;
    const newDir = toDiff >= 0 ? 1 : -1;
    if (newDir !== leaving.direction) {
        // 傾き（tilt）は「進む向きから見て」の角度なので、向きをここで
        // 直接変えるときは、普段の一般ロジック（stepSimulation内の反転処理）が
        // やっているのと同じように傾きの符号も反転させ、加速度の履歴も
        // リセットしておく。これをしないと、休んでいたときの角度が
        // 新しい向きでは逆の意味になってしまい、動き出した瞬間に
        // 角度がカクッと跳んで見える。
        leaving.tilt = -leaving.tilt;
        leaving.tiltVel = -leaving.tiltVel;
        leaving.smoothAccel = 0;
    }
    leaving.direction = newDir;
    leaving.flipIntent = false;
    leaving.nextFlipIntent = false;
    // 「持ち場に着いた時刻」も、ここでいったんリセットしておく。
    // これをしないと、直前の数字にずっと留まっていた分の古い時刻が残ったままになり、
    // 弾き出されたその1フレームだけ「とっくに着いている」扱いになって、
    // 古い数字の（もう関係ない）角度のまま一瞬だけ数字の形に見えてしまう。
    leaving.dialArrivedAt = 0;
    // 発進の速さは区間の距離によらず常に一定（巡航速度の
    // NEWTON_SNAP_SPEED_MULT倍）。間隔が広い数字ほど着くまで時間がかかり、
    // 狭い数字はすぐ着く——という、距離なりの自然なばらつきをそのまま見せる
    // （全区間を同じ時間で揃えると、逆にリズムが単調になるとのことだったため）。
    const stableBaseForHop = maxSpeed * motionScale;
    const hopSpeed = stableBaseForHop * NEWTON_SNAP_SPEED_MULT;
    // 静止した文字盤から最初の1本が動き出すときだけ、「ふわっとゆっくり」
    // 動き出してほしいという要望に合わせ、ここではまだ勢いを渡さない
    // （0から、下のnewtonAccelMulの弱い専用加速でじわっと立ち上がらせる）。
    // 2本目以降のふつうの受け渡しは、これまでどおり瞬時に全速へ切り替えて
    // 「パチン」という手応えを保つ。
    leaving.speed = soft ? 0 : hopSpeed;
    newton.hopSpeed = hopSpeed;
    newton.softStart = !!soft;
    newton.traveler = leaving;
    newton.toNumeral = toNumeral;
    newton.travelStart = elapsedMs;
    return true;
}

function newtonReset(nowMs) {
    if (numBoids !== 18) {
        numBoids = 18;
        const el = document.getElementById('numBoidsSlider');
        if (el) { el.value = '18'; el.dispatchEvent(new Event('input')); }
    }
    buildDialTargets();
    assignDialSlots();
    // 体感時間（newtonSimClock）もここで実時間に合わせて作り直す。
    // newtonLastRealMsをnullに戻しておくことで、次にnewtonUpdateStateが
    // 呼ばれた瞬間に「前回からの実時間差」がリセット直後のごく小さい値から
    // 数え直され、モード切り替え前の空白がそのまま体感時間に混ざらない。
    newtonSimClock = nowMs;
    newtonLastRealMs = null;
    newton = { formPending: true, formFrom: nowMs, traveler: null, toNumeral: 0, lap: 0 };
}

// 毎フレーム呼ばれる、ニュートンのゆりかごの進行役
function newtonUpdateState(elapsedMs, all) {
    // 「詰まっていないか」の判定に使う経過時間だけは、実時間をそのまま使わず
    // 1フレームあたりの進みに上限をかけた体感時間（newtonSimClock）で数える。
    // 理由はNEWTON_CLOCK_STEP_CAP_MSの定義側コメントを参照。
    if (newtonLastRealMs === null) newtonLastRealMs = elapsedMs;
    const rawDelta = elapsedMs - newtonLastRealMs;
    newtonLastRealMs = elapsedMs;
    newtonSimClock += clamp(rawDelta, 0, NEWTON_CLOCK_STEP_CAP_MS);
    const simMs = newtonSimClock;

    if (!newton) newtonReset(simMs);
    if (newton.formPending) {
        let sum = 0;
        let worst = 0;
        for (const b of all) {
            const d = Math.abs(dialOffsetFor(b)) / mmToPx;
            sum += d;
            worst = Math.max(worst, d);
        }
        const mean = all.length > 0 ? sum / all.length : 0;
        const formed = all.length > 0
            && mean < DIAL_FORMED_MEAN_MM && worst < DIAL_FORMED_MAX_MM;
        if (formed || simMs - newton.formFrom > DIAL_WAIT_LIMIT_MS) {
            newton.formPending = false;
            // XII（真上）の右端の1本から出発する。
            // 弧の順でいうと XI → XII → I → II … と時計回りなので、
            // XIIの持ち場のいちばん後ろ＝画面では右端の画が最初に動く。
            // 静止からの最初の1本だけ、ふわっと立ち上がらせる
            newtonLaunch(NEWTON_START_NUMERAL, undefined, simMs, true);
        }
    } else if (newton.traveler) {
        const d = Math.abs(dialOffsetFor(newton.traveler)) / mmToPx;
        // 何らかの理由（他の画との詰まりなど）で、いつまで経っても着かないことがある。
        // その場合は無理に待たず、いまの1本をその場で持ち場へ収めて先へ進める
        // （見た目が止まったまま固まってしまうのを防ぐ安全弁）。
        const stuck = simMs - (newton.travelStart || 0) > NEWTON_STALL_TIMEOUT_MS;
        if (d <= DIAL_ARRIVE_MM || stuck) {
            const arrivedAt = newton.toNumeral;
            if (stuck) {
                // 目標の場所まで直接収める（衝突判定を挟まず、その場へ収まる形にする）
                newton.traveler.arcFraction = newton.traveler.dialFrac;
            }
            // ぶつかってきた側が着いた瞬間の速さを、次に弾き出す1本へそのまま渡す
            // （詰まって強制的に進めた場合は、勢いを引き継がず落ち着いた状態からにする）
            const carrySpeed = stuck ? undefined : newton.traveler.speed;
            newtonSettleNumeral(arrivedAt, elapsedMs);
            newton.traveler = null;
            // 一周したかどうかは、出発した数字へ戻ってきたかで数える。
            // 出発点を変えたときにここを直し忘れると、最初の1手で
            // 「一周した」ことになって止まってしまう
            if (arrivedAt === NEWTON_START_NUMERAL) {
                newton.lap++;
                if (!newtonLoopForever) {
                    dialCollapse = 0; dialCollapsePrev = 0; dialVib = 0; dialVibFade = 0;
                    dialContract = 0; dialFreeze = 0; dialBurst = 0; dialRadial = 0;
                    dialSpin = 0; dialBanged = false;
                    for (const b of all) { b.ego = 0; b.reform = 0; b.burstSpeed = 0; b.isLeader = false; }
                    return; // 1周で停止。文字盤のまま静止する
                }
            }
            newtonLaunch(arrivedAt, carrySpeed, simMs);
        }
    } else if (newtonLoopForever) {
        // 止まっていても、あとから「くり返す」がONにされたら再開する。
        // これも静止した文字盤からの再出発なので、最初の1本と同じくふわっと立ち上がらせる。
        newtonLaunch(NEWTON_START_NUMERAL, undefined, simMs, true);
    }
    dialCollapse = 0; dialCollapsePrev = 0; dialVib = 0; dialVibFade = 0;
    dialContract = 0; dialFreeze = 0; dialBurst = 0; dialRadial = 0; dialSpin = 0; dialBanged = false;
    for (const b of all) { b.ego = 0; b.reform = 0; b.burstSpeed = 0; b.isLeader = false; }
}

// 震えのぶんだけ、持ち場そのものが前後に揺れる。
// 振れ幅が車間に近づくと隣とぶつかりはじめ、そこが秩序の限界になる。
function dialVibOffset(boid, elapsedMs) {
    if (dialVib <= 0) return 0;
    const v = vibParamsFor(boid);
    return Math.sin(elapsedMs * boid.vibFreq * v.freq + boid.vibPhase) * v.pos * dialVib;
}

// いま目指すべき場所。
//   収縮まで … 文字盤の持ち場から、その数字の中心へ寄っていく
//   爆発から … 1周に等間隔な場所へ
//   結晶しなおし … そこからまた文字盤の持ち場へ（1画ずつ）
function dialGoalFrac(boid) {
    if (boid.dialFrac === null || boid.dialFrac === undefined) return null;
    const L = perimeterLength;
    if (!dialBanged) {
        if (dialContract <= 0 || boid.packFrac === null) return boid.dialFrac;
        return blendFrac(boid.dialFrac, boid.packFrac, dialContract, L);
    }
    if (boid.evenFrac === null) return boid.dialFrac;
    const spun = ((boid.evenFrac + dialSpin) % 1 + 1) % 1;
    if (boid.reform <= 0) return spun;
    return blendFrac(spun, boid.dialFrac, boid.reform, L);
}

// 縮みきったときの場所（packFrac）までの、符号つきのずれ（px）
function packOffsetFor(boid) {
    if (boid.packFrac === null || boid.packFrac === undefined) return 0;
    const L = perimeterLength;
    let d = (boid.packFrac - boid.arcFraction) * L;
    if (d > L / 2) d -= L;
    if (d < -L / 2) d += L;
    return d;
}

// 持ち場までの、進行方向で測ったずれ（px）
function dialOffsetFor(boid) {
    const goal = dialGoalFrac(boid);
    if (goal === null) return 0;
    const L = perimeterLength;
    let d = (goal - boid.arcFraction) * L;
    if (d > L / 2) d -= L;
    if (d < -L / 2) d += L;
    return d;
}

function activeMode() { return motionMode; }

// 文字盤を使うモード（MODE5 ローマ数字 と MODE6 explosion）。
// 数字の作り方・持ち場の追い方は共通で、時間の進め方だけが違う。
function isDialMode(m) { return m === 5 || m === 6 || m === 9; }

// 各モードの内部状態を1フレームぶん進める
// 漂いのぶつかり方。正面からぶつかれば跳ね返り、同じ向きなら押し合う。
// 漂いを出たあとのなじませ中も、これをそのまま続ける。
function driftContacts() {
        // 正面から来た相手とぶつかったら、壁に当たったように跳ね返る。
        // 向きだけ反転して、速さ（勢い）はそのまま持っていく。
        {
            const L = perimeterLength;
            const hitGap = minDistance * 1.8;
            for (const layer of layers) {
                const bs = layer.boids.slice().sort((a, b) => a.arcFraction - b.arcFraction);
                const n = bs.length;
                for (let i = 0; i < n; i++) {
                    const a = bs[i];
                    const c = bs[(i + 1) % n];
                    // c は a の「arcの進む向き側」の隣。向かい合っているのはこの並びのとき
                    if (a.direction !== 1 || c.direction !== -1) continue;
                    if (a.flipCooldown > 0 || c.flipCooldown > 0) continue;
                    let g = (c.arcFraction - a.arcFraction) * L;
                    if (g <= 0) g += L;
                    if (g > hitGap) continue;
                    for (const b of [a, c]) {
                        b.direction = -b.direction;
                        b.nextDirection = b.direction;
                        // 傾きは進行方向を基準にした角度なので、
                        // 符号を入れ替えて画面上の向きを保つ
                        b.tilt = -b.tilt;
                        b.tiltVel = -b.tiltVel;
                        b.speed = Math.max(b.speed, b.driftCoast || 0);
                        b.nextSpeed = b.speed;
                        b.flipIntent = false;
                        b.nextFlipIntent = false;
                        b.flipCooldown = BOUNCE_HOLD_FRAMES;
                        b.nextFlipCooldown = b.flipCooldown;
                    }
                }
            }
        }
        // 同じ向きで追いついたバーは向きを変えず、前のバーを押していく。
        // ぶつかったぶんだけ勢いが分けあわれ、くっついた組はやがて同じ速さになる。
        const L = perimeterLength;
        const pushGap = minDistance * 2.2;
        const share = 0.02;                       // 1フレームでどれだけ揃うか
        for (const layer of layers) {
            const bs = layer.boids.slice().sort((a, b) => a.arcFraction - b.arcFraction);
            const n = bs.length;
            for (let i = 0; i < n; i++) {
                const a = bs[i];
                const c = bs[(i + 1) % n];
                if (a.direction !== c.direction) continue;   // 正面どうしは押し合わない
                let g = (c.arcFraction - a.arcFraction) * L;
                if (g <= 0) g += L;
                if (g > pushGap) continue;
                const mid = ((a.driftCoast || 0) + (c.driftCoast || 0)) / 2;
                a.driftCoast = (a.driftCoast || 0) + (mid - (a.driftCoast || 0)) * share;
                c.driftCoast = (c.driftCoast || 0) + (mid - (c.driftCoast || 0)) * share;
            }
        }
}

function updateModeState(elapsedMs, dtMs) {
    if (motionMode === 2) {
        const period = (WAVE_BASE_PERIOD_MS / Math.max(0.01, waveSpeedMul));
        wavePhase = (wavePhase + dtMs / period) % 1;
    } else if (motionMode === 3) {
        if (elapsedMs >= nextStartleAt) {
            nextStartleAt = elapsedMs + startleRateSec * 1000 * (0.5 + Math.random());
            const all = layers.flatMap((l) => l.boids);
            if (all.length > 0) {
                // 驚きは、たまたま1本のバーから始まる
                const b = all[Math.floor(Math.random() * all.length)];
                startles.push({ arc: b.arcFraction * perimeterLength, t0: elapsedMs });
            }
        }
        startles = startles.filter((s) => elapsedMs - s.t0 < STARTLE_LIFE_MS);
    } else if (motionMode === 7) {
        driftContacts();
    } else if (motionMode === 10) {
        lifeUpdateState(elapsedMs, dtMs);
    } else if (motionMode === 11) {
        rdUpdateState(elapsedMs, dtMs);
    } else if (isDialMode(motionMode)) {
        const all = layers.flatMap((l) => l.boids);
        // 「持ち場に着いた時刻」を覚えておく（首振りのタイミングで使う）
        for (const b of all) {
            const dMm = Math.abs(dialOffsetFor(b)) / mmToPx;
            if (dMm <= DIAL_ARRIVE_MM) {
                if (!b.dialArrivedAt) b.dialArrivedAt = elapsedMs;
            } else {
                b.dialArrivedAt = 0;
            }
        }
        // ローマ数字は、まず文字盤ができあがるのを待つ
        if (motionMode === 5 && dialFormPending) {
            let sum = 0;
            let worst = 0;
            for (const b of all) {
                const d = Math.abs(dialOffsetFor(b)) / mmToPx;
                sum += d;
                worst = Math.max(worst, d);
            }
            const mean = all.length > 0 ? sum / all.length : 0;
            const formed = all.length > 0
                && mean < DIAL_FORMED_MEAN_MM && worst < DIAL_FORMED_MAX_MM;
            if (formed || elapsedMs - dialWaitFrom > DIAL_WAIT_LIMIT_MS) {
                dialFormPending = false;
                dialClockStart = elapsedMs;
            }
            dialCollapse = 0;
            dialCollapsePrev = 0;
            dialVib = 0;
            dialVibFade = 0;
            dialContract = 0;
            dialFreeze = 0;
            dialBurst = 0;
            dialRadial = 0;
            dialBanged = false;
            for (const b of all) { b.ego = 0; b.reform = 0; b.burstSpeed = 0; b.isLeader = false; }
            startles = [];
            predator = null;
            return;
        }
        if (motionMode === 5) {
            // ローマ数字モードは、文字盤になってそのまま静かに保つところまで。
            // 震えから拡散までの物語は MODE6（explosion）のしごと。
            dialCollapse = 0;
            dialCollapsePrev = 0;
            dialVib = 0;
            dialVibFade = 0;
            dialContract = 0;
            dialFreeze = 0;
            dialBurst = 0;
            dialRadial = 0;
            dialSpin = 0;
            dialBanged = false;
            for (const b of all) { b.ego = 0; b.reform = 0; b.burstSpeed = 0; b.isLeader = false; }
            return;
        }
        if (motionMode === 9) {
            newtonUpdateState(elapsedMs, all);
            return;
        }
        dialCollapsePrev = dialCollapse;
        // 物語が端（拡散）まで来ているか
        const storyDone = dialAuto
            ? (elapsedMs - dialClockStart) >= dialCycleSec * 1000
            : dialCollapseManual >= 0.999;
        // 「元の並びに戻す」が入っていれば、拡散しきったところで戻しに入る
        if (dialReformOn && !dialReturning && dialBanged && storyDone) {
            dialReturning = true;
            if (motionMode === 6) reassignHomeSlots(); else assignDialSlots();
        }
        if (dialReturning) {
            // 1本ずつ元の場所へ。戻りきったら、そのままもう一度はじめから走る。
            dialCollapse = Math.min(1, dialCollapse + dtMs * REFORM_RATE_PER_MS);
            if (dialCollapse >= 1) {
                dialCollapse = 0;
                dialReturning = false;
                dialClockStart = elapsedMs;
                dialCollapseManual = 0;
                const sl = document.getElementById('dialCollapseSlider');
                if (sl && !dialAuto) { sl.value = '0'; sl.dispatchEvent(new Event('input')); }
            }
        } else if (dialAuto) {
            // 一方通行の物語。静止から拡散まで行ったら、そこで漂ったまま待つ。
            const f = (elapsedMs - dialClockStart) / (dialCycleSec * 1000);
            dialCollapse = clamp(f, 0, 1) * P_FREE_TO;
        } else {
            dialCollapse = dialCollapseManual * P_FREE_TO;
        }
        const p = dialCollapse;
        // 一巡したら、収縮の行き先（数字ごとの中心）を作り直す
        if (p < dialCollapsePrev || (all.length > 0 && all[0].packFrac === null)) {
            packDialTargets();
            dialBanged = false;
            dialSpin = 0;
        }
        // 震えの有無だけをここで決める。速さと振れ幅は車間まかせ。
        dialFreeze = ramp01(p, P_FREEZE_FROM, P_FREEZE_FROM + 0.02);
        // 震えはフェードインさせる。はじめはゆっくり・小さく、
        // そこから車間で決まる本来の震えへ移っていく。
        dialVibFade = ramp01(p, 0.03, VIB_FADE_TO);
        dialVib = dialVibFade * (1 - dialFreeze);
        dialVibFreq = all.length > 0
            ? all.reduce((a, b) => a + vibParamsFor(b).freq, 0) / all.length : 1;
        // 数字ごとの中心へ寄っていく度合い
        // はじめはゆっくり、終わりで一気に縮む。
        // 車間が縮むほど震えが速くなるので、これがそのまま高まりになる。
        dialContract = Math.pow(ramp01(p, P_SHRINK_FROM, P_SHRINK_FULL), 2.2);
        // 爆発の瞬間：行き先を「1周に等間隔」に切り替え、初速を与える
        if (!dialBanged && p >= P_SHRINK_TO) {
            dialBanged = true;
            dialSpin = 0;
            spreadDialTargets();
            const v0 = maxSpeed * motionScale * BANG_V0;
            for (const b of all) b.burstSpeed = v0 * (0.75 + Math.random() * 0.5);
        }
        if (p < P_SHRINK_TO) { dialBanged = false; for (const b of all) b.burstSpeed = 0; }
        // 初速は慣性のように抜けていく（ふわっと広がる）
        for (const b of all) b.burstSpeed *= BANG_DECAY;
        // 広がりきったあとも、輪ごとゆっくり回りつづける（止まって見えないように）。
        // 文字盤に戻しはじめたら、割り当てがずれないよう回転を止める。
        if (dialBanged && !dialReturning) dialSpin = (dialSpin + dtMs / DIAL_SPIN_MS) % 1;
        dialBurst = all.length > 0
            ? clamp(all[0].burstSpeed / Math.max(1e-6, maxSpeed * motionScale * BANG_V0), 0, 1) : 0;
        // 放射状に向くのは、爆発してから結晶しなおすまで
        dialRadial = ramp01(p, P_SHRINK_TO, P_SHRINK_TO + 0.06);
        for (const b of all) {
            const from = P_FREE_TO + b.egoRank * (1 - REFORM_WIDTH - P_FREE_TO);
            b.reform = ramp01(p, from, from + REFORM_WIDTH);
            b.ego = 0;
            b.isLeader = p >= P_SHRINK_TO && b.reform < 0.5;
        }
        dialChaos = 0;
    } else if (motionMode === 4) {
        const all = layers.flatMap((l) => l.boids);
        if (all.length > 0 && (!predator || !all.includes(predator))) {
            predator = all[Math.floor(Math.random() * all.length)];
        }
        // 「リーダーを表示」をONにしたとき、捕食者だけ色が変わるようにしておく
        for (const b of all) b.isLeader = (b === predator);
    } else if (motionMode === 8) {
        mlUpdateCycle(elapsedMs);
    } else if (motionMode === 12) {
        nsUpdateState(elapsedMs, dtMs);
    } else if (motionMode === 13) {
        personaUpdateState(elapsedMs, dtMs);
    } else if (motionMode === 15) {
        waUpdateState(elapsedMs, dtMs);
    } else if (motionMode === 16) {
        chiUpdateState(elapsedMs, dtMs);
    } else if (motionMode === 17) {
        todaUpdateState(elapsedMs, dtMs);
    } else if (motionMode === 18) {
        frsUpdateState(elapsedMs, dtMs);
    } else if (motionMode === 19) {
        avaUpdateState(elapsedMs, dtMs);
    } else if (motionMode === 20) {
        cpgUpdateState(elapsedMs, dtMs);
    } else if (motionMode === 21) {
        gesUpdateState(elapsedMs, dtMs);
    } else if (motionMode === 22) {
        trfUpdateState(elapsedMs, dtMs);
    } else if (motionMode === 23) {
        ffUpdateState(elapsedMs, dtMs);
    } else if (motionMode === 24) {
        psUpdateState(elapsedMs, dtMs);
    } else if (motionMode === 25) {
        nrUpdateState(elapsedMs, dtMs);
    } else if (motionMode === 26) {
        m22UpdateState(elapsedMs);
    }
    if (motionMode !== 3) startles = [];
    if (motionMode !== 4) predator = null;

    // 漂いを出たあとも、フェードのあいだは同じぶつかり方を続ける。
    // ここをやめてしまうと、正面から来ていた組が急に止まってしまう。
    if (motionMode !== 7 && prevMotionMode === 7
        && layers.some((l) => l.boids.some((b) => (b.handoff || 0) < 1))) driftContacts();
}

// MODE3で、その位置にいまどれだけ驚きが届いているか（0〜1）
function startleAmountAt(arcPos) {
    if (startles.length === 0) return 0;
    const L = perimeterLength;
    const width = STARTLE_WIDTH_MM * mmToPx;
    const speed = STARTLE_WAVE_MM_PER_MS * mmToPx * startleSpeedMul;
    let amp = 0;
    for (const s of startles) {
        const age = performance.now() - startTime - s.t0;
        if (age < 0) continue;
        let d = Math.abs(arcPos - s.arc);
        if (d > L / 2) d = L - d;
        const front = age * speed;                       // 波がいま届いている距離
        const off = Math.abs(d - front);
        if (off > width) continue;
        const shape = 1 - off / width;                   // 波の厚みの中でなだらかに
        const fade = 1 - age / STARTLE_LIFE_MS;          // 遠くなるほど弱く
        amp = Math.max(amp, shape * Math.max(0, fade));
    }
    return amp;
}

// MODE1以外の「どれくらいの速さで走りたいか」。base は共通の巡航速度。
function modePreferredSpeed(boid, dir, base, elapsedMs) {
    const L = perimeterLength;
    const s = boid.arcFraction * L;
    if (motionMode === 2) {
        // 波の谷にいるバーは減速して詰まり、山にいるバーは加速してひろがる
        const w = Math.sin(Math.PI * 2 * (waveCount * boid.arcFraction - wavePhase * waveCount));
        // 谷では思い切り遅く、山ではほどほどに速く。
        // 左右対称に上下させるより、遅い側を深くしたほうが密がはっきり出る。
        const f = w >= 0 ? 1 + w * waveDepth * 0.9 : 1 + w * waveDepth * 0.98;
        return base * Math.max(0.02, f);
    }
    if (motionMode === 3) {
        const amp = startleAmountAt(s);
        const calm = 1 - startleCalm;                    // ふだんの速さ
        return base * (calm + amp * (1 - calm) * 2.2);
    }
    if (isDialMode(motionMode)) {
        // 持ち場に近づくほどゆっくり、着いたら止まる。
        // 目を覚ましたバーは持ち場をあきらめて、自分の速さで歩きだす。
        const d = Math.abs(dialOffsetFor(boid) + dialVibOffset(boid, elapsedMs));
        if (motionMode === 9 && newton && boid === newton.traveler) {
            // ニュートンのゆりかご：ぶつかってきた側の運動エネルギーを、
            // 減速で目減りさせずにそのまま次の1本へ渡す（newtonLaunchで速さを直接引き継がせる）。
            // 実物のゆりかごが「衝突の直前まで一定速度→当たった瞬間に止まって
            // 相手が同じ速さで飛び出す」のと同じにしたいので、着く手前で
            // わざと減速はしない＝ここでは新しい目標速度を作らず、
            // いま持っている速さをそのまま保つ「コースト」（漂いモードに近い考え方）。
            // 実際に止まる・向きを合わせる処理は、到着判定後の一般ロジックに任せる。
            // 最初の1本（受け渡し元がいない発進）だけは、下の床値で押し出す。
            // 何周も受け渡しが続いても、上限だけは超えないようにする。
            // 床・上限は base（＝そのバー個体のばらつき・ゆらぎ込みの巡航速度）ではなく、
            // 個体差の乗らない基準速度から計算する。base を使うと、たまたま
            // 「速度のばらつき」で遅めに生まれ変わったバーが弾かれる番のときだけ
            // 極端に遅くなり、受け渡しごとに速さがバラバラになってしまう
            // （見た目には「たまにある場所で急に止まって見える」という形で現れていた）。
            // 床・上限は、発進のときに決めておいたnewton.hopSpeed
            // （＝区間の距離によらず常に一定の、受け渡しの速さ）を使う。
            // 区間ごとの距離はそのまま「着くまでの時間」の違いとして表れる
            // （間隔が広い数字は時間がかかり、狭い数字はすぐ着く）。
            if (d <= 0) return 0;
            const hopSpeed = Number.isFinite(newton.hopSpeed) ? newton.hopSpeed
                : maxSpeed * motionScale * NEWTON_SNAP_SPEED_MULT;
            return clamp(boid.speed, hopSpeed * 0.85, hopSpeed * 1.2);
        }
        // 震えているあいだは、小さなずれでもきびきび追いかけないと形にならないので、
        // 減速に入る距離を短くして、動きの権限を上げる
        const ramp = DIAL_RAMP_MM * mmToPx * (1 - 0.45 * dialVib);
        const settle = DIAL_SETTLE_MM * mmToPx;
        let hold = d <= settle ? 0 : base * clamp(d / ramp, 0.12, 1);
        // 収縮のあいだは「一巡の長さ」から逆算した歩幅で進む。
        // 縮みきる時刻（沈黙に入る手前）にちょうど着くようにしておくと、
        // 縮みきる前に爆発してしまうことがない。
        // 「収縮の速さ」は、その基準に対する早め・遅めの調整。
        if (dialContract > 0 && !dialBanged) {
            const remainMs = Math.max(0.02, P_SHRINK_FULL - dialCollapse) / P_FREE_TO
                * Math.max(1, dialCycleSec) * 1000;
            const need = Math.abs(packOffsetFor(boid)) / Math.max(1, remainMs / FRAME_MS)
                * shrinkSpeedMul;
            hold = Math.max(hold, Math.min(need, base * 6));
        }
        // 爆発の初速は、行き先へ向かう速さに上乗せして、あとは慣性のように抜けていく
        return hold + boid.burstSpeed;
    }
    if (motionMode === 7) {
        // 宇宙を漂う感じ。入ったときの勢いをそのまま保つだけ。
        // 行き先も相手も見ていないので、速さは自分からは変えない。
        //（前が詰まっていれば、共通の追従ルールが勝手に速さを抑える）
        const coast = Math.max(boid.driftCoast || 0, base * DRIFT_MIN_COAST);
        // 入った瞬間は前と同じ速さのまま。そこからゆっくり漂いへ移る
        return lerp(boid.speed, coast, driftEase(elapsedMs));
    }
    if (motionMode === 4) {
        if (boid === predator) return base * predatorSpeedMul;
        if (!predator) return base * 0.5;
        const range = fleeRangeMm * mmToPx;
        let d = (predator.arcFraction - boid.arcFraction) * L;
        d = ((d % L) + L) % L;
        if (d > L / 2) d -= L;                           // 近いほうまわりで測る
        const near = Math.max(0, 1 - Math.abs(d) / range);
        return base * (0.45 + near * (fleeBurst - 0.45));
    }
    if (motionMode === 8) {
        return mlPreferredSpeed(boid, dir, base, elapsedMs);
    }
    if (motionMode === 12) {
        return nsPreferredSpeed(boid, dir, base, elapsedMs);
    }
    if (motionMode === 13) {
        return personaPreferredSpeed(boid, dir, base, elapsedMs);
    }
    if (motionMode === 14) {
        const v = Math.abs(soloDrive(boid, elapsedMs));
        const cruise = Math.max(1e-6, maxSpeed * motionScale);
        if (v < cruise * 0.04) return 0;      // ほぼ出したい速さがないなら止まる
        return Math.min(v, base * 1.8);
    }
    if (motionMode === 15) {
        const v = Math.abs(waDrive(boid, elapsedMs));
        const cruise = Math.max(1e-6, maxSpeed * motionScale);
        // 止まりぎわのしきい値を大きくすると、全員が数mm手前で止まり、
        // 4辺の並びがわずかにずれて見えた
        if (v < cruise * 0.008) return 0;
        return Math.min(v, base * 1.8);
    }
    if (motionMode === 26) return m22StructSpeed(boid, dir);
    if (motionMode >= 22 && motionMode <= 25) {
        // この3つは、個体ごとの速さのばらつきを使わない（模型の速さそのものを追う）
        const cruise = Math.max(1e-6, maxSpeed * motionScale);
        let v = modeChainDrive(boid, elapsedMs);
        // 渋滞では車線の向きにしか進まない。目標を行き過ぎたら、止まって待つ
        v = motionMode === 22 ? Math.max(0, v * (boid.trfLaneDir || 1)) : Math.abs(v);
        if (v < cruise * 0.04) return 0;
        return Math.min(v, cruise * 3.4);
    }
    if (motionMode >= 16 && motionMode <= 21) {
        const v = Math.abs(modeChainDrive(boid, elapsedMs));
        const cruise = Math.max(1e-6, maxSpeed * motionScale);
        if (v < cruise * 0.04) return 0;
        return Math.min(v, base * 1.8);
    }
    if (motionMode === 10) {
        const press = boid.lifePress || 0;
        const starve = boid.lifeStarve || 0;
        if (press <= 0 && starve <= 0) {
            // 帯の中＝居心地がいいので、その場に止まる。
            // 落ち着ききっていないうちは、ごくわずかに進む余地を残しておく
            // （完全に0にすると、動き出しが固くなってカクつくため）
            return base * 0.03 * (1 - boid.lifeVal);
        }
        // 過密なら強く、過疎ならおだやかに。強いほうの気持ちが勝つ
        const urge = Math.max(press * lifeFleeMul, starve * lifeSeekMul);
        // 落ち着いているあいだは、多少はみ出しても腰が重い
        // （群れが一度にほどけず、こらえてから弾けるようになる）
        const hold = 1 - boid.lifeVal * 0.8;
        return base * clamp(urge * hold, 0, 2.5);
    }
    if (motionMode === 11) {
        // 望む車間とのずれが大きいほど速く、ほぼ合っていれば止まる。
        // 「ほぼ」の幅（不感帯）を十分にとっておくのが大事で、ここが狭いと
        // 目標を行き過ぎるたびに向きを変え直すことになり、
        // いつまでも小刻みに動き続けて文様が固まらない。
        const err = Math.abs(boid.rdErr || 0) / Math.max(1, minDistance);
        if (err < RD_DEAD_ZONE) return 0;
        // 不感帯のふちで0から始まるので、止まりぎわで速さが跳ねない
        return base * clamp((err - RD_DEAD_ZONE) * 0.5, 0, 1.8);
    }
    return base;
}

// MODE1以外で「どちらを向いていたいか」。0＝いまの向きのまま。
function modeDesiredDir(boid, elapsedMs) {
    const L = perimeterLength;
    if (motionMode === 3) {
        // 驚きが届いたら、そのきっかけの場所から遠ざかる向きへ散る
        if (startles.length === 0) return 0;
        const s = boid.arcFraction * L;
        if (startleAmountAt(s) < 0.35) return 0;
        let best = null;
        let bestD = Infinity;
        for (const st of startles) {
            let d = s - st.arc;
            if (d > L / 2) d -= L;
            if (d < -L / 2) d += L;
            if (Math.abs(d) < bestD) { bestD = Math.abs(d); best = d; }
        }
        if (best === null || bestD < minDistance) return 0;
        return best > 0 ? 1 : -1;
    }
    if (isDialMode(motionMode)) {
        const d = dialOffsetFor(boid) + dialVibOffset(boid, elapsedMs);
        if (Math.abs(d) <= DIAL_SETTLE_MM * mmToPx) return 0;
        return d > 0 ? 1 : -1;      // 持ち場のあるほうを向く
    }
    if (motionMode === 4 && predator && boid !== predator) {
        // 捕食者が進行方向の前にいるなら、回れ右して逃げる
        const range = fleeRangeMm * mmToPx;
        let d = (predator.arcFraction - boid.arcFraction) * L;
        d = ((d % L) + L) % L;
        if (d > L / 2) d -= L;
        if (Math.abs(d) > range) return 0;
        return d > 0 ? -1 : 1;       // 捕食者と反対側へ
    }
    if (motionMode === 8) return mlDesiredDir(boid);
    if (motionMode === 12) return nsDesiredDir(boid);
    if (motionMode === 14) {
        const v = soloDrive(boid, elapsedMs);
        const cruise = Math.max(1e-6, maxSpeed * motionScale);
        if (Math.abs(v) < cruise * 0.04) return 0;
        return v > 0 ? 1 : -1;
    }
    if (motionMode === 15) {
        const v = waDrive(boid, elapsedMs);
        const cruise = Math.max(1e-6, maxSpeed * motionScale);
        if (Math.abs(v) < cruise * 0.008) return 0;
        return v > 0 ? 1 : -1;
    }
    if (motionMode === 26) return m22DesiredDir(boid);
    if (motionMode === 22) return boid.trfLaneDir || 1;
    if (motionMode >= 16 && motionMode <= 25) {
        const v = modeChainDrive(boid, elapsedMs);
        const cruise = Math.max(1e-6, maxSpeed * motionScale);
        if (Math.abs(v) < cruise * 0.04) return 0;
        return v > 0 ? 1 : -1;
    }
    if (motionMode === 10) {
        const press = boid.lifePress || 0;
        const starve = boid.lifeStarve || 0;
        if (press <= 0 && starve <= 0) return 0;   // 居心地がいいので、向きはそのまま
        if (!boid.lifeHasNb) return 0;             // まわりに誰もいない＝いまの向きのまま探しにいく
        const com = boid.lifeCom || 0;
        // 重心がほぼ真横（前後が同じくらい混んでいる）なら、どちらへ動いても同じ
        if (Math.abs(com) < minDistance * 0.3) return 0;
        if (press >= starve) return com > 0 ? -1 : 1;  // 過密：重心と反対へ離れる
        return com > 0 ? 1 : -1;                       // 過疎：重心のほうへ寄る
    }
    if (motionMode === 11) {
        const err = boid.rdErr || 0;
        if (Math.abs(err) < minDistance * RD_DEAD_ZONE) return 0;
        return err > 0 ? 1 : -1;   // 空いているほうへ寄っていく
    }
    return 0;
}

// ============ MODE8：学習中の群れ（boidsのルールを手で書かず、ネットワークに探させる） ============
// 各バーは同じ小さなニューラルネット（重み共有）で「加速するか」「向きを変えたいか」を決める。
// その重みを、いまの重みから少しだけ揺らした「候補」に置き換えて数秒間走らせてみて、
// 直前の候補より結果が良ければ採用、悪ければ元に戻す……という単純な山登り法
// （(1+1)進化戦略に近い）でその場で鍛えていく。乱数のシードは固定していないので、
// MODEに入るたびに同じ「ぎこちない→それらしくなる」という物語の"型"は繰り返しつつ、
// 細部の動きは毎回変わる。

const ML_IN = 4;      // 入力：[間隔のずれ, 速さのずれ, 個体ごとのゆらぎ, 進行方向]
const ML_HIDDEN = 8;
const ML_OUT = 2;     // 出力：[速さの変調, 向きたい方向]
const ML_WEIGHT_COUNT = (ML_IN + 1) * ML_HIDDEN + (ML_HIDDEN + 1) * ML_OUT;
const ML_EVAL_WINDOW_MS = 3000; // この時間ぶん試してから、良し悪しを判定する
const ML_SIGMA = 0.4;           // 重みを揺らす大きさ（大きいほど探索が荒くなる）

let mlFlock = null;

function mlRandomWeights(scale) {
    const w = new Float64Array(ML_WEIGHT_COUNT);
    for (let i = 0; i < w.length; i++) w[i] = (Math.random() * 2 - 1) * scale;
    return w;
}

function mlPerturb(weights, sigma) {
    const w = new Float64Array(weights.length);
    for (let i = 0; i < weights.length; i++) {
        w[i] = weights[i] + (Math.random() * 2 - 1) * sigma;
    }
    return w;
}

// 入力4→隠れ8→出力2、活性化はtanhだけの小さなネットワーク
function mlForward(weights, inputs) {
    let idx = 0;
    const hidden = new Float64Array(ML_HIDDEN);
    for (let h = 0; h < ML_HIDDEN; h++) {
        let sum = weights[idx++];
        for (let i = 0; i < ML_IN; i++) sum += weights[idx++] * inputs[i];
        hidden[h] = Math.tanh(sum);
    }
    const out = new Float64Array(ML_OUT);
    for (let o = 0; o < ML_OUT; o++) {
        let sum = weights[idx++];
        for (let h = 0; h < ML_HIDDEN; h++) sum += weights[idx++] * hidden[h];
        out[o] = Math.tanh(sum);
    }
    return out;
}

function mlUpdateStatusLabel() {
    const el = document.getElementById('mlStatusValue');
    if (el && mlFlock) el.textContent = mlFlock.lastVerdict;
}

// MODE8に入るたび（＝毎回）、重みを乱数から作り直して学習をゼロから始める
function mlResetFlock(nowMs) {
    const base = mlRandomWeights(0.5);
    mlFlock = {
        accepted: base,                          // 直前まで「採用」されている重み
        candidate: mlPerturb(base, ML_SIGMA),     // いま試している重み
        sigma: ML_SIGMA,
        windowStart: nowMs,
        fitnessSum: 0,
        fitnessCount: 0,
        bestFitness: -Infinity,
        hasBaseline: false,
        cycles: 0,
        lastVerdict: '学習を開始しました…',
    };
    mlUpdateStatusLabel();
}

// このフレームでの「良さ」を測って積算しつつ、いまの候補ネットワークで速さを決める
function mlPreferredSpeed(boid, dir, base, elapsedMs) {
    if (!mlFlock) mlResetFlock(elapsedMs);
    const targetGap = minDistance * 2.2;   // これくらいの間隔を「心地よい」とみなす
    const gapError = clamp((boid.roomPx - targetGap) / targetGap, -1.5, 1.5);
    const speedRatio = clamp((boid.speed / Math.max(1e-6, base)) - 1, -1, 1);
    const personal = Math.sin(elapsedMs * boid.wobbleFreq + boid.wobblePhase);
    const out = mlForward(mlFlock.candidate, [gapError, speedRatio, personal, dir]);
    boid._mlOut = out; // modeDesiredDirで使い回す（同じフレーム・同じboidなので計算し直さない）

    const gapScore = 1 - Math.min(1, Math.abs(gapError));
    const speedScore = Math.min(1, boid.speed / Math.max(1e-6, base * 0.6));
    mlFlock.fitnessSum += gapScore * 0.6 + speedScore * 0.4;
    mlFlock.fitnessCount++;

    return base * clamp(1 + out[0] * 0.7, 0.15, 1.8);
}

function mlDesiredDir(boid) {
    const out = boid._mlOut;
    if (!out) return 0;
    if (out[1] > 0.35) return 1;
    if (out[1] < -0.35) return -1;
    return 0;
}

// 評価の窓（ML_EVAL_WINDOW_MS）が終わるたびに、今回の候補を採用するか元に戻すかを決め、
// 次の候補（採用中の重みを少しだけ揺らしたもの）を用意する
function mlUpdateCycle(elapsedMs) {
    if (!mlFlock) { mlResetFlock(elapsedMs); return; }
    if (elapsedMs - mlFlock.windowStart < ML_EVAL_WINDOW_MS) return;
    const avg = mlFlock.fitnessCount > 0 ? mlFlock.fitnessSum / mlFlock.fitnessCount : 0;
    mlFlock.cycles++;
    if (!mlFlock.hasBaseline) {
        mlFlock.accepted = mlFlock.candidate;
        mlFlock.bestFitness = avg;
        mlFlock.hasBaseline = true;
        mlFlock.lastVerdict = `${mlFlock.cycles}回目：最初の動きを基準に設定`;
    } else if (avg >= mlFlock.bestFitness) {
        mlFlock.accepted = mlFlock.candidate;
        mlFlock.bestFitness = avg;
        mlFlock.lastVerdict = `${mlFlock.cycles}回目：良くなったので採用（評価 ${avg.toFixed(2)}）`;
    } else {
        mlFlock.lastVerdict = `${mlFlock.cycles}回目：今回は不採用（評価 ${avg.toFixed(2)}）`;
    }
    mlFlock.candidate = mlPerturb(mlFlock.accepted, mlFlock.sigma);
    mlFlock.windowStart = elapsedMs;
    mlFlock.fitnessSum = 0;
    mlFlock.fitnessCount = 0;
    mlUpdateStatusLabel();
}

// ============ MODE12：新規性探索（ゴールを決めない探索） ============
// MODE8と同じ小さなネットワークで群れを動かすが、評価のしかたが正反対。
// MODE8は「boidsらしさ」という目標を決めて、そこへ近づくほど高得点にしている。
// だから学習が進むほどboidsに似ていき、最後は落ち着いて止まる。
// こちらは目標を置かない。評価するのは「これまでに見たどの動きとも違うか」だけ。
// 試した動きは記述子（6つの数値）にして記憶に貯めていき、新しい候補の点数は
// 「記憶のなかの近いものまでの距離」で決まる。
// 大事なのは、この点数が動きそのものの性質ではなく、履歴で決まることで、
// うまくやった動きほど記憶に刻まれ、次の瞬間からは「もう見た」に変わって
// 点数が下がっていく。登りきるべき山が固定されていないので、終点が存在しない。
// ただし何でも新しければ採用、では装置が壊れるので、最低条件を別に課してある
// （ほとんど動かない／向きを変えすぎる、は新しくても棄却）。
const NS_DESC = 6;        // 行動の記述子の次元
const NS_KNN = 5;         // 新しさを測るときに見る、近い記憶の数
let nsWindowSec = 4.0;    // ひとつの候補を試す時間
let nsSigma = 0.45;       // 重みを揺らす大きさ（探索の荒さ）
let nsArchiveMax = 120;   // 覚えておく数。超えたら古いものから忘れていく
let nsFlipLimit = 1.2;    // 最低条件：1本あたり1秒間に許す向き変えの回数
let nsMinMove = 0.06;     // 最低条件：これ以下しか動いていなければ棄却
let nsFlock = null;

function nsResetFlock(nowMs) {
    const base = mlRandomWeights(0.5);
    nsFlock = {
        accepted: base,
        candidate: mlPerturb(base, nsSigma),
        acceptedDesc: null,
        archive: [],              // これまでに見た動きの記述子
        recent: [],               // 直近に試した動きの新しさ（採否の基準に使う）
        windowStart: nowMs,
        acc: new Float64Array(NS_DESC),
        accCount: 0,
        flipCount: 0,
        cycles: 0,
        lastVerdict: '探索を始めました…',
    };
    for (const b of layers.flatMap((l) => l.boids)) b.nsPrevDir = 0;
    nsUpdateStatusLabel();
}

function nsUpdateStatusLabel() {
    const el = document.getElementById('nsStatusValue');
    if (el && nsFlock) el.textContent = nsFlock.lastVerdict;
}

// 記憶のなかで近いものまでの距離の平均＝新しさ。
// skipSelf は「その記述子自身がすでに記憶に入っている」場合に、
// 距離0の自分自身を1件だけ除くための指定。
function nsNovelty(desc, archive, skipSelf) {
    if (!archive || archive.length === 0) return 1;
    const ds = [];
    for (const a of archive) {
        let s = 0;
        for (let k = 0; k < NS_DESC; k++) { const d = desc[k] - a[k]; s += d * d; }
        ds.push(Math.sqrt(s));
    }
    ds.sort((x, y) => x - y);
    let from = 0;
    if (skipSelf && ds.length > 1 && ds[0] < 1e-9) from = 1;
    const k = Math.min(NS_KNN, ds.length - from);
    if (k <= 0) return 1;
    let sum = 0;
    for (let i = 0; i < k; i++) sum += ds[from + i];
    return sum / k;
}

// いまの群れの様子を、6つの数値に要約する（すべて0〜1に正規化）。
// ここに何を入れるかで、探索が「何を新しさとみなすか」が決まる。
// 位置そのもののような、見た目が同じでも数値が変わるものは入れない
// （いくらでも新しさを稼げてしまい、探索がそこへ吸い込まれる）。
function nsDescribe(all) {
    const n = all.length;
    const L = perimeterLength;
    const cruise = Math.max(1e-6, maxSpeed * motionScale);
    const d = new Float64Array(NS_DESC);
    if (n === 0) return d;

    let sSum = 0;
    for (const b of all) sSum += Math.abs(b.speed);
    const sMean = sSum / n;
    let sVar = 0;
    for (const b of all) sVar += (Math.abs(b.speed) - sMean) ** 2;
    d[0] = clamp(sMean / cruise, 0, 1);                              // 動きの量
    d[1] = clamp(Math.sqrt(sVar / n) / cruise, 0, 1);                // 速さのばらつき

    // 車間のムラ（＝粗密のはっきりさ）と、かたまりの数
    const sorted = all.slice().sort((a, b) => a.arcFraction - b.arcFraction);
    const gaps = [];
    for (let i = 0; i < n; i++) {
        let g = (sorted[(i + 1) % n].arcFraction - sorted[i].arcFraction) * L;
        if (g < 0) g += L;
        gaps.push(g);
    }
    const gMean = L / n;
    let gVar = 0;
    let clusters = 0;
    for (let i = 0; i < n; i++) {
        gVar += (gaps[i] - gMean) ** 2;
        // 前が空いていて、後ろが詰まっていれば、そこがかたまりの先頭
        if (gaps[(i - 1 + n) % n] > gMean && gaps[i] <= gMean) clusters++;
    }
    // 正規化の範囲は、実際に走らせて測った値に合わせてある。
    // ここが合っていないと、どんな動きでも同じ数字になってしまい（＝飽和）、
    // その記述子は「新しさ」を測る役に立たなくなる。
    // 粗密のムラは、実測でおよそ0.9〜1.4の範囲に収まる
    d[2] = clamp((Math.sqrt(gVar / n) / gMean - 0.8) / 0.8, 0, 1);    // 粗密のムラ
    d[3] = clamp(clusters / (n * 0.5), 0, 1);                        // かたまりの数

    // 加減速の荒さ。ゆったり流れているか、小刻みに加速と減速をくり返しているか。
    // バーの傾きはこの加速度から作られるので、傾きの振れもここに含まれている。
    let aSum = 0;
    for (const b of all) aSum += Math.abs(b.smoothAccel);
    d[4] = clamp(aSum / n / Math.max(1e-9, maxAccel * motionScale * 0.2), 0, 1);

    // 向きの偏り（そろって一方向へ流れているか、ばらばらか）
    let dirSum = 0;
    for (const b of all) dirSum += b.direction;
    d[5] = clamp(Math.abs(dirSum) / n, 0, 1);
    return d;
}

// 毎フレーム、いまの様子を積算しておく
function nsUpdateState(elapsedMs, dtMs) {
    if (!nsFlock) { nsResetFlock(elapsedMs); return; }
    const all = layers.flatMap((l) => l.boids);
    if (all.length === 0) return;
    for (const b of all) {
        if (b.nsPrevDir && b.nsPrevDir !== b.direction) nsFlock.flipCount++;
        b.nsPrevDir = b.direction;
    }
    const d = nsDescribe(all);
    for (let k = 0; k < NS_DESC; k++) nsFlock.acc[k] += d[k];
    nsFlock.accCount++;
    nsUpdateCycleNS(elapsedMs, all.length);
}

// 試す時間が終わるたびに、今回の動きを採用するか捨てるかを決める
function nsUpdateCycleNS(elapsedMs, barCount) {
    const winMs = Math.max(800, nsWindowSec * 1000);
    if (elapsedMs - nsFlock.windowStart < winMs) return;
    const desc = new Float64Array(NS_DESC);
    if (nsFlock.accCount > 0) {
        for (let k = 0; k < NS_DESC; k++) desc[k] = nsFlock.acc[k] / nsFlock.accCount;
    }
    const flipsPerBarSec = nsFlock.flipCount / Math.max(1, barCount) / (winMs / 1000);
    nsFlock.cycles++;

    // 最低条件。ここを満たさないものは、どれだけ新しくても採らないし、
    // 記憶にも入れない（装置に無理をさせる動きを「新しい」として残さないため）
    const alive = desc[0] >= nsMinMove;
    const gentle = flipsPerBarSec <= nsFlipLimit;
    if (!alive || !gentle) {
        nsFlock.lastVerdict = `${nsFlock.cycles}回目：棄却（`
            + (!alive ? 'ほとんど動いていない' : '向きを変えすぎ')
            + `）／記憶 ${nsFlock.archive.length}件`;
    } else {
        const nov = nsNovelty(desc, nsFlock.archive, false);
        // 採るかどうかの基準は、直近に試した動きの新しさの中央値にする。
        // 「いま採用中の動きの点数」と比べる作りにすると探索が止まってしまう。
        // 採用された動きは「たまたま高く出た一回の測定」なので、以後の候補は
        // その当たり値を超えられず、いつまでも見送りが続くため
        // （同じ重みで走らせても、測るたびに記述子は多少ばらつく）。
        // 直近の実測から基準を作れば、探索がどこにいても自動で釣り合いが取れ、
        // 行き止まりにならない。記憶が「もう見た」領域の点数を下げてくれるので、
        // 採用が続いても、行き先はまだ通っていないほうへ偏っていく。
        const recent = nsFlock.recent;
        const sortedRecent = recent.slice().sort((a, b) => a - b);
        const bar = sortedRecent.length >= 4
            ? sortedRecent[Math.floor(sortedRecent.length / 2)] : -1;
        if (nov >= bar) {
            nsFlock.accepted = nsFlock.candidate;
            nsFlock.acceptedDesc = desc;
            nsFlock.lastVerdict = `${nsFlock.cycles}回目：採用（新しさ ${nov.toFixed(2)}`
                + `／目安 ${Math.max(0, bar).toFixed(2)}）／記憶 ${nsFlock.archive.length + 1}件`;
        } else {
            nsFlock.lastVerdict = `${nsFlock.cycles}回目：見送り（新しさ ${nov.toFixed(2)}`
                + `／目安 ${bar.toFixed(2)}）／記憶 ${nsFlock.archive.length + 1}件`;
        }
        recent.push(nov);
        while (recent.length > 12) recent.shift();
        // 採否によらず、見たものは記憶する。これが「もう見た」を増やしていく
        nsFlock.archive.push(desc);
        // 一杯になったら忘れる。ここで単純に古い順に捨てると、いま探している
        // あたりの記憶ばかりが残って、そこが永久に「もう見た」のままになる。
        // 古いほうの半分からランダムに1件抜くことで、直前の記憶は保ったまま
        // 昔たどった場所が少しずつ「また新しい」に戻り、長い周期で巡り直せる。
        const cap = Math.max(10, Math.round(nsArchiveMax));
        while (nsFlock.archive.length > cap) {
            const half = Math.max(1, Math.floor(nsFlock.archive.length / 2));
            nsFlock.archive.splice(Math.floor(Math.random() * half), 1);
        }
    }
    nsFlock.candidate = mlPerturb(nsFlock.accepted, nsSigma);
    nsFlock.windowStart = elapsedMs;
    nsFlock.acc = new Float64Array(NS_DESC);
    nsFlock.accCount = 0;
    nsFlock.flipCount = 0;
    nsUpdateStatusLabel();
}

// 動かし方そのものはMODE8と同じネットワーク（同じ「語彙」で比べられるようにしてある）
function nsPreferredSpeed(boid, dir, base, elapsedMs) {
    if (!nsFlock) nsResetFlock(elapsedMs);
    const targetGap = minDistance * 2.2;
    const gapError = clamp((boid.roomPx - targetGap) / targetGap, -1.5, 1.5);
    const speedRatio = clamp((boid.speed / Math.max(1e-6, base)) - 1, -1, 1);
    const personal = Math.sin(elapsedMs * boid.wobbleFreq + boid.wobblePhase);
    const out = mlForward(nsFlock.candidate, [gapError, speedRatio, personal, dir]);
    boid._nsOut = out;
    return base * clamp(1 + out[0] * 0.7, 0.15, 1.8);
}

function nsDesiredDir(boid) {
    const out = boid._nsOut;
    if (!out) return 0;
    if (out[1] > 0.35) return 1;
    if (out[1] < -0.35) return -1;
    return 0;
}

// ============ MODE13：個性が育つ ============
// 36本すべてが、まったく同じ性質から始まる。
// そこから、それぞれが自分の身に起きたことを覚えていき、少しずつ癖がついていく。
//
// 「最初から一本ずつ違う値を配る」のとは別物にしたいので、
// 分かれていく仕組みそのものを作ってある。核になるのは次の三つ。
//
//   1. 仲間と比べる … 癖は「自分の経験そのもの」ではなく
//      「まわりの平均からどれだけ外れていたか」を足し込んで育てる。
//      平均との差を積み上げるので、ごくわずかな偶然が戻らない差になっていく。
//      群れ全体の平均は勝手に真ん中に留まるので、全員が同じ方向へ暴走しない。
//   2. 正のフィードバック … 育った癖はふるまいを変え、変わったふるまいが
//      また次の経験を呼ぶ。広い車間を好みはじめたバーは隣を押しのけて
//      空間を得て、その経験がさらに好みを広げる。この輪がないと、
//      経験はただ平均へ均されて、いつまでも全員同じままになる。
//   3. 自由なときだけ数える … 前が詰まっているときの速さは、そのバーの
//      性格ではなく行列の都合。自分で選べた場面だけを経験として数えることで、
//      「その個体がどうしたかったか」だけが癖になる。
//
// さらに、若いうちは変わりやすく、時を重ねるほど変わりにくくしてある（硬化）。
// これがないと性格が数十秒で入れ替わって、誰が誰だか分からなくなる。
// 観る側が個体を見分けられるかどうかは、この安定性で決まる。
const PERSONA_TRAITS = 5;   // 車間・速さ・落ち着きのなさ・傾きの癖・揺れの速さ
let personaHardenSec = 90;  // この時間くらいで癖が固まってくる
let personaStrength = 1.0;  // 癖がふるまいに出る強さ
let personaSpread = 1.0;    // 分かれ方の激しさ（経験の差をどれだけ強く積むか）
let personaShow = false;    // 確認用：性格を色で見せる（実機では使えない表示）
let personaClock = 0;       // このモードに入ってからの経過（秒）
let personaLastMs = null;
let personaLastGrow = 0;    // 前回、癖を育てた時刻

function personaReset(nowMs) {
    for (const b of layers.flatMap((l) => l.boids)) {
        for (let k = 0; k < PERSONA_TRAITS; k++) b.persona[k] = 0;
        b.perExp = new Float64Array(PERSONA_TRAITS);
        b.perExpW = new Float64Array(PERSONA_TRAITS);
        b.perEma = new Float64Array(PERSONA_TRAITS);
        b.perEmaOn = new Float64Array(PERSONA_TRAITS);
        b.perPrevDir = b.direction;
    }
    personaClock = 0;
    personaLastMs = nowMs;
}

// 若さ（1＝まだ何にでもなれる、0に近いほど固まっている）
function personaPlasticity() {
    return 1 / (1 + personaClock / Math.max(1, personaHardenSec));
}

function personaUpdateState(elapsedMs, dtMs) {
    const all = layers.flatMap((l) => l.boids);
    if (all.length === 0) return;
    if (personaLastMs === null) personaLastMs = elapsedMs;
    personaLastMs = elapsedMs;
    personaClock += dtMs / 1000;

    const cruise = Math.max(1e-6, maxSpeed * motionScale);
    const gapRef = Math.max(1e-6, minDistance * 3);

    // --- 1) このフレームの経験を、バーごとに溜める ---
    for (const b of all) {
        const room = b.roomPx || 0;
        // 後ろから押されていないときだけ、「自分で選んだ車間」として数える
        const freeGap = clamp(room / gapRef, 0, 2);
        b.perExp[0] += freeGap; b.perExpW[0] += 1;

        // 前に空きがあるときだけ、「自分で選んだ速さ」として数える。
        // 詰まっているときの速さは行列の都合であって、その個体の性格ではない
        const freeAhead = clamp((room - minDistance) / gapRef, 0, 1);
        if (freeAhead > 0.15) {
            b.perExp[1] += (Math.abs(b.speed) / cruise) * freeAhead;
            b.perExpW[1] += freeAhead;
        }

        // 実際に向きを変えた回数
        if (b.perPrevDir && b.perPrevDir !== b.direction) b.perExp[2] += 1;
        b.perPrevDir = b.direction;
        b.perExpW[2] += dtMs / 1000;

        // 倒れぐせ（tiltは進行方向から見た角度なので、向きが変わっても意味は同じ）
        b.perExp[3] += b.tilt; b.perExpW[3] += 1;

        // 手持ち無沙汰の度合い。止められている時間が長いほど、小刻みに揺れたくなる
        b.perExp[4] += (Math.abs(b.speed) < cruise * 0.12) ? 1 : 0;
        b.perExpW[4] += 1;
    }

    // --- 2) ときどき、仲間の平均と比べて癖を育てる ---
    if (elapsedMs - (personaLastGrow || 0) < 500) return;
    personaLastGrow = elapsedMs;
    const plas = personaPlasticity();
    const mean = new Float64Array(PERSONA_TRAITS);
    const vals = [];
    for (const b of all) {
        const v = new Float64Array(PERSONA_TRAITS);
        for (let k = 0; k < PERSONA_TRAITS; k++) {
            const sample = b.perExpW[k] > 1e-9 ? b.perExp[k] / b.perExpW[k] : 0;
            // 直近0.5秒ぶんの経験をそのまま使うと、たまたまの出来事に
            // 引っ張られて性格が数十秒ごとに入れ替わってしまう。
            // 数秒ぶんをならした「その個体のふだんの様子」で癖を育てる。
            if (!b.perEmaOn[k]) { b.perEma[k] = sample; b.perEmaOn[k] = 1; }
            else b.perEma[k] += (sample - b.perEma[k]) * 0.12;
            v[k] = b.perEma[k];
            mean[k] += v[k];
        }
        vals.push(v);
    }
    for (let k = 0; k < PERSONA_TRAITS; k++) mean[k] /= all.length;

    // 経験のばらつきを見て、差の大きさをそろえる。
    // そうしないと、もともと数字の幅が小さい軸だけ、いつまでも癖がつかない
    const sd = new Float64Array(PERSONA_TRAITS);
    for (let i = 0; i < all.length; i++) {
        for (let k = 0; k < PERSONA_TRAITS; k++) sd[k] += (vals[i][k] - mean[k]) ** 2;
    }
    for (let k = 0; k < PERSONA_TRAITS; k++) sd[k] = Math.sqrt(sd[k] / all.length);

    for (let i = 0; i < all.length; i++) {
        const b = all[i];
        for (let k = 0; k < PERSONA_TRAITS; k++) {
            const dev = sd[k] > 1e-9 ? (vals[i][k] - mean[k]) / sd[k] : 0;
            // 平均からの外れを積み上げる（relaxではなく積分なので、差が育つ）
            const grow = dev * 0.055 * personaSpread;
            // 最初はみんな同じなので、分かれるきっかけの偶然もここで与える
            const seed = (Math.random() * 2 - 1) * 0.02;
            // 端に近づくほど強く引き戻す。これがないと、癖の強い軸では
            // 全員が±1に張り付いてしまい、「両極端しかいない」状態になる。
            // 3乗なので、真ん中あたりではほとんど効かず、階調は保たれる。
            const pull = 0.15 * Math.pow(b.persona[k], 3);
            b.persona[k] = clamp(b.persona[k] + (grow + seed - pull) * plas, -1, 1);
        }
        b.perExp = new Float64Array(PERSONA_TRAITS);
        b.perExpW = new Float64Array(PERSONA_TRAITS);
    }
    personaUpdateStatusLabel(all);
}

// どれくらい性格が分かれてきたかを、そのまま数字で見せる
function personaUpdateStatusLabel(all) {
    const el = document.getElementById('personaStatusValue');
    if (!el) return;
    const names = ['車間', '速さ', '落ち着きのなさ', '倒れぐせ', '揺れの速さ'];
    const parts = [];
    for (let k = 0; k < PERSONA_TRAITS; k++) {
        let lo = Infinity;
        let hi = -Infinity;
        for (const b of all) { lo = Math.min(lo, b.persona[k]); hi = Math.max(hi, b.persona[k]); }
        parts.push(`${names[k]} ${(hi - lo).toFixed(2)}`);
    }
    el.textContent = `${Math.round(personaClock)}秒　`
        + `若さ ${(personaPlasticity() * 100).toFixed(0)}%　`
        + `ばらけ具合［${parts.join('／')}］`;
}

// 癖がふるまいに出る量（personaStrengthで全体を強弱できる）
function personaOf(boid, k) {
    return (boid.persona ? boid.persona[k] : 0) * personaStrength;
}

function personaPreferredSpeed(boid, dir, base, elapsedMs) {
    // 速さの好み。それ以外の群れのルールは載せていないので、
    // 見えている粗密や行列は、すべて個性のぶつかり合いから出てくる
    return base * clamp(1 + personaOf(boid, 1) * 0.55, 0.2, 1.9);
}

// ============ MODE15：偶然から広がる文様 ============
// 一周は短く、三つの時間でできている。
//
//   カオス … 全バーが自由に動き回る。この最中に、
//             (1) いまの並びを「段階の列」として読み取り、
//             (2) たまたま似た組（XV など）が何度も出ているものを覚え、
//             (3) 覚えた組を、まわりのバーへ伝染させて広げ、
//             (4) 決まって同じ続き方をしているなら、その先まで含めた
//                 長い組（XV∧）へ育てる、
//             ということを 0.4秒ごとにくり返している。
//   組み上げ … 育った組を一周ぶんへ割り当てて、数秒で一気に決める。
//   保持   … 出来上がった文様をしばらく見せる。
//
// 一周が終わったら、覚えたものは全部捨てて、またカオスから始める。
// 世代をまたいで柄を磨いていく作りは、1世代に数分かかってしまい、
// シーケンスの一項目としては長すぎた。いまは「学習」を一周の中へ畳んである。
// 直前までに出した文様だけは覚えていて、同じ柄が続かないようにしている。
const WA_LEAN_LEVELS = [-2, 0, 2];          // 左へいっぱい・直立・右へいっぱい
const WA_GAP_LEVELS = [0.55, 1.0, 1.65, 0.3];    // 車間の「余りの配り方」
// 4段目は「交差」。上下を編み込んだ列でこの段が来た車間は、足元をかなり寄せる。
// そこに向き合う倒し方が来れば X、片方だけ倒れていれば微妙な X、それ以外は寄り添う2本になる。
// 列で隣り合う2本はいつも上下別のレイヤーなので、寄せてもぶつからない
const WA_CROSS = 3;
const WA_CROSS_GAP_RATIO = 0.4;     // 交差の段の車間（最小車間に対する割合）
// 車間の段を「狭い順の並び」に直す（交差がいちばん狭い）。柄どうしの近さを測るときに使う
function waGapOrd(g) { return g === WA_CROSS ? -1 : g; }
// 1レイヤーだけで組むときは、交差の段は「詰める」として扱う
function waGapSolo(g) { return g === WA_CROSS ? 0 : clamp(g, 0, 2); }
const WA_LEAN_CHARS = ['\\', 'ヽ', '|', 'ノ', '/'];
const WA_SIM_OK = 0.80;            // 「同じ並びが出た」とみなす近さ
const WA_SAME = 0.88;              // 「同じ組だ」とみなす近さ（覚え直さない）
const WA_DEAD_ZONE = 0.10;         // 車間のずれを許す幅（minDistance比）

let waMeltSec = 1;        // 文様がほどけるまでの時間（カオスの頭に含まれる）
let waChaosSec = 20;      // 自由に動き回る時間
let waBuildSec = 2;       // 組み上がるまでの時間
let waHoldSec = 2;        // 文様を保つ時間（0なら、組み上がった瞬間にほどけはじめる）
let waNovelty = 0.6;      // 直前までの文様と違うことをどれだけ重んじるか
let waTiltDeg = 30;       // 倒し方の振れ幅
// くり返しの多さをどれだけ重んじるか。
// 放っておくと長い単位のほうが選ばれやすい（自由度が高く、起伏を稼ぎやすい）。
// ただ単位9本×2回では、一周にくり返しが2回しか現れず、柄としては読めない。
let waRepeat = 0.35;
let waFlock = null;

// この装置で実際に出せる倒し方の振れ幅。
// 天板を出すと、バーは先端が板の下まで伸びる長いもの（200mm→532mm）になり、
// 同じ車間でも倒せる角度がぐっと小さくなる。
// スライダーの角度をそのまま使っていたときは、出せもしない角度を狙い続けたうえ、
// 読み取りのしきい値にも誰も届かず、柄がひとつも見つからなかった。
// 交互に倒す柄（V∧）が成り立つ上限から、出せる範囲を割り出しておく
function waAmp() {
    const barLen = getNormalLineLength();
    const n = layers[0] ? layers[0].boids.length : 18;
    const want = Math.sin((waTiltDeg * Math.PI) / 180);
    if (barLen <= 0 || n < 2) return want;
    // 交互に倒す柄では、一単位が「広い車間＋狭い車間」の2つぶんを使える。
    // 見込みを1本ぶんの車間で立てていたときは半分に見積もってしまい、
    // 天板なしでも17°ほどしか倒れなかった
    const room = (2 * perimeterLength) / n - minDistance * 2.8;
    return clamp(Math.min(want, room / (2 * barLen)), 0.04, 1);
}

// その柄を、この装置でいちばん大きく倒して見せられる振れ幅。
//
// 隣り合う倒し方の差が大きい組ほど車間を食う。
//     必要な車間ᵢ = (倒し方ᵢ − 倒し方ᵢ₊₁) × バー長 × 振れ幅 + 余裕
// これを一周ぶん足したものが周長に収まる最大の振れ幅を、二分法で求める。
//
// 上の waAmp() は「交互に倒す柄」を前提にした一律の見積もりで、
// 天板を出すとバーが200mm→532mmになるため、そこでは16°ほどまで落ちる。
// だが倒すバーがまばらな柄なら、同じ条件でも倍近く倒せる。
// 柄ごとに解かないと、見せられるはずの柄まで一律に潰れてしまう
function waAmpFor(m, n, off) {
    const want = Math.sin((waTiltDeg * Math.PI) / 180);
    const barLen = getNormalLineLength();
    const L = perimeterLength;
    if (!m || barLen <= 0 || n < 2) return want;
    // 辺ごとに組めるなら、そちらの見積もりを使う。
    // 一周まとめての見積もりでは、本数の多い辺が入りきらないことがある
    if (waIsWoven(m, n, null)) {
        const w = waWovenSolve(m, n, L);
        if (w) return w.amp;
    }
    const lay = waSideSolve(m, n, off, L);
    if (lay) return lay.amp;
    const d = new Float64Array(n);
    for (let i = 0; i < n; i++) {
        const a = clamp(m.leans[(i + off) % m.period], -2, 2) / 2;
        const b = clamp(m.leans[(((i + 1) % n) + off) % m.period], -2, 2) / 2;
        d[i] = a - b;
    }
    const g0 = minDistance * 1.5;
    const mg = minDistance * 1.3;
    const need = (A) => {
        let sum = 0;
        for (let i = 0; i < n; i++) sum += Math.max(g0, d[i] * barLen * A + mg);
        return sum;
    };
    if (need(want) <= L) return want;
    let lo = 0;
    let hi = want;
    for (let k = 0; k < 22; k++) {
        const mid = (lo + hi) * 0.5;
        if (need(mid) <= L) lo = mid; else hi = mid;
    }
    return clamp(lo, 0.03, 1);
}

// ============ 辺の中で完結させる ============
// レールは角丸の正方形なので、辺は4つある。
// 単位（柄のひとかたまり）が角をまたぐと、そこで柄が折れて読めなくなる。
// 角のところで文様が切れて見えるのが自然なので、単位は辺の中だけで完結させる。
//
// やり方は単純で、
//   ・単位の数を4辺へできるだけ均等に配る
//   ・辺ごとに「その辺の長さ」で車間を配り直す（一周まとめてではなく）
//   ・柄の役は、一周の通し番号ではなく「その辺の何本目か」で決める
//   ・角をまたぐ車間は、平均より少し広く取る
// これで、どの辺も単位の頭から始まって単位の終わりで閉じる。
const WA_CORNER_GAP = 1.3;    // 角をまたぐ車間は、平均車間のこの倍を目安に

// 単位の数を4辺へ配る。
// 余りは「向かい合う辺」から先に足していく。18本・単位3本なら 2・1・2・1 となり、
// 上下が同じ・左右が同じになる。隣どうしへ寄せると（2・2・1・1）、
// 密なほうと疎なほうがそれぞれ隣り合ってしまい、傾いた絵に見えた
const WA_SIDE_ORDER = [0, 2, 1, 3];
function waSideCounts(n, k) {
    const u = Math.floor(n / k);
    if (u < 4) return null;                 // 4辺へ配れない＝この単位では組めない
    const base = Math.floor(u / 4);
    const out = [base, base, base, base];
    for (let t = 0; t < u % 4; t++) out[WA_SIDE_ORDER[t]] += 1;
    for (let j = 0; j < 4; j++) out[j] *= k;
    // 単位で割り切れないぶん（本数が素数のときなど）は、1本ずつ足して吸収する
    let left = n - k * u;
    for (let t = 0; left > 0; t = (t + 1) % 4, left--) out[WA_SIDE_ORDER[t]] += 1;
    return out;
}

// 上下のレイヤーで別々の並びを解くので、控えは数件ぶん持っておく
const waLayoutCache = new Map();
let waMotifSerial = 0;

// その柄を4辺へ組んだときの、席ごとの「位置・車間・倒し方」と、出せる振れ幅。
// 振れ幅は、いちばん本数の多い辺が収まるところまで二分法で落とす。
// flips は辺ごとの「裏返し」（ビットjが立っている辺は、並びを逆順にして倒し方も反転）。
// sign は柄全体の倒し方の向き（-1 で鏡写し）
function waSideSolve(m, n, off, L, flips, sign, stride, parity, countUnit) {
    if (!m || !(L > 0) || n < 4) return null;
    const fl = flips | 0;
    const sg = sign === -1 ? -1 : 1;
    // 編み込みのときは、上下を合わせた列の何番目か（stride=2・parity=0/1）で役を決める
    const st = stride === 2 ? 2 : 1;
    const par = st === 2 ? (parity | 0) : 0;
    const cu = countUnit || m.period;
    const barLen = getNormalLineLength();
    const tiltRef = waTiltDeg;
    if (!m._id) m._id = ++waMotifSerial;
    const ck = `${m._id}|${n}|${off}|${L.toFixed(2)}|${barLen.toFixed(2)}|${tiltRef}|`
        + `${minDistance.toFixed(3)}|${fl}|${sg}|${st}|${par}|${cu}`;
    if (waLayoutCache.has(ck)) return waLayoutCache.get(ck);
    const k = m.period;
    const counts = waSideCounts(n, cu);
    const keep = (out) => {
        if (waLayoutCache.size > 24) waLayoutCache.clear();
        waLayoutCache.set(ck, out);
        return out;
    };
    if (!counts) return keep(null);
    const lean = new Float64Array(n);
    const lvl = new Int8Array(n);
    const start = [];
    let s0 = 0;
    for (let j = 0; j < 4; j++) {
        start.push(s0);
        for (let t = 0; t < counts[j]; t++) {
            // 役は「その辺の何本目か」で決める。ここが一周の通し番号だったときは、
            // 辺のまんなかで単位が切り替わり、角で柄が折れていた
            // 裏返した辺は、辺の中で並びを逆にして倒し方も反転させる。
            // 隣どうしの倒し方の差（＝要る車間）はそのまま保たれる
            const flip = (fl >> j) & 1;
            const tt = flip ? counts[j] - 1 - t : t;
            const idx = (st * tt + par + off) % k;
            lean[s0] = sg * (flip ? -1 : 1) * clamp(m.leans[idx], -2, 2) / 2;
            // 車間の役は「自分と次のバーのあいだ」。逆順ではひとつ手前の役になる
            const gi = flip ? (((st * (tt - 1) + par + off) % k) + k) % k : idx;
            if (st === 2) {
                // 編み込みでは、同じレイヤーの次のバーまでに上下の列の車間が2つ入る
                const g2 = m.gaps[(idx + 1) % k];
                lvl[s0] = clamp(Math.round((waGapSolo(m.gaps[idx]) + waGapSolo(g2)) / 2), 0, 2);
            } else {
                lvl[s0] = waGapSolo(m.gaps[gi]);
            }
            s0++;
        }
    }
    const Lside = L / 4;
    const g0 = minDistance * 1.5;
    const mg = minDistance * 1.3;
    const needAt = (i, A) => Math.max(g0,
        (lean[i] - lean[(i + 1) % n]) * barLen * A + mg);
    const lastOf = (j) => start[j] + counts[j] - 1;
    const fits = (A) => {
        for (let j = 0; j < 4; j++) {
            let sum = (needAt(lastOf((j + 3) % 4), A) + needAt(lastOf(j), A)) * 0.5;
            for (let t = 0; t < counts[j] - 1; t++) sum += needAt(start[j] + t, A);
            if (sum > Lside) return false;
        }
        return true;
    };
    const wantA = Math.sin((tiltRef * Math.PI) / 180);
    let amp = wantA;
    if (!fits(wantA)) {
        let lo = 0;
        let hi = wantA;
        for (let q = 0; q < 22; q++) {
            const mid = (lo + hi) * 0.5;
            if (fits(mid)) lo = mid; else hi = mid;
        }
        amp = clamp(lo, 0.02, 1);
    }
    const mean = L / n;
    const corner = new Float64Array(4);
    for (let j = 0; j < 4; j++) {
        corner[j] = Math.max(needAt(lastOf(j), amp), mean * WA_CORNER_GAP);
    }
    // 本数の多い辺では、角の贅沢から先に削る
    for (let q = 0; q < 4; q++) {
        for (let j = 0; j < 4; j++) {
            let inner = 0;
            for (let t = 0; t < counts[j] - 1; t++) inner += needAt(start[j] + t, amp);
            const jm = (j + 3) % 4;
            const over = inner + (corner[jm] + corner[j]) * 0.5 - Lside;
            if (over <= 0) continue;
            const roomA = Math.max(0, corner[jm] - needAt(lastOf(jm), amp));
            const roomB = Math.max(0, corner[j] - needAt(lastOf(j), amp));
            const tot = roomA + roomB;
            if (tot <= 0) continue;
            const cut = Math.min(over * 2, tot);
            corner[jm] -= cut * (roomA / tot);
            corner[j] -= cut * (roomB / tot);
        }
    }
    const gap = new Float64Array(n);
    const pos = new Float64Array(n);
    // 辺の切れ目は角のまんなか。0は上辺の始まりなので、半分の角ぶん手前から
    let cs = -arcLength / 2;
    for (let j = 0; j < 4; j++) {
        const cnt = counts[j];
        const jm = (j + 3) % 4;
        const budget = Lside - (corner[jm] + corner[j]) * 0.5;
        let nd = 0;
        let ex = 0;
        for (let t = 0; t < cnt - 1; t++) {
            nd += needAt(start[j] + t, amp);
            ex += WA_GAP_LEVELS[lvl[start[j] + t]];
        }
        const rest = budget - nd;
        let used = 0;
        for (let t = 0; t < cnt - 1; t++) {
            const i = start[j] + t;
            gap[i] = rest > 0
                ? needAt(i, amp) + (ex > 0 ? (rest / ex) * WA_GAP_LEVELS[lvl[i]]
                    : rest / Math.max(1, cnt - 1))
                : needAt(i, amp) * (nd > 0 ? budget / nd : 1);
            used += gap[i];
        }
        // 1本しか座らない辺では、余りを両端へ半分ずつ。辺の中央に置くため
        const slack = Math.max(0, budget - used);
        gap[lastOf(j)] = corner[j] + slack * 0.5;
        let pp = cs + corner[jm] * 0.5 + slack * 0.5;
        for (let t = 0; t < cnt; t++) {
            const i = start[j] + t;
            pos[i] = ((pp % L) + L) % L;
            pp += gap[i];
        }
        cs += Lside;
    }
    return keep({ pos, gap, lean, amp, counts, anchored: true });
}

// 4辺へ配れないときの予備。これまでどおり一周まとめて組む
function waRingSolve(m, n, off, L) {
    const want = waWantGaps(m, n, off, L);
    const pos = new Float64Array(n);
    const lean = new Float64Array(n);
    let acc = 0;
    for (let i = 0; i < n; i++) {
        pos[i] = acc;
        acc += want[i];
        lean[i] = clamp(m.leans[(i + off) % m.period], -2, 2) / 2;
    }
    return { pos, gap: want, lean, amp: waAmpFor(m, n, off), counts: null, anchored: false };
}

// 組み上げに入る瞬間に、その柄で改めて席割りを選び直す。
// カオスで広げていた組と、最後に組む柄が違うことがある（拾えずに引き直した場合など）。
// 古い席割りのまま組みにいくと、全員が一斉に長い距離を歩くことになり、
// 追い越せないバーどうしが押し合って車間が潰れることがあった
function waRefitShift(L) {
    if (!waFlock || !waFlock.candidate) return;
    if (!waFlock.shift) waFlock.shift = [];
    for (let li = 0; li < layers.length; li++) {
        const layer = layers[li];
        const n = layer.boids.length;
        if (n < 2) continue;
        const lay = waLayerLay(li, waFlock.candidate, n, waFlock.phaseOffset, L,
            waFlock.rel, true);
        if (!lay || !lay.anchored) continue;
        const bySlot = new Array(n);
        const bs = layer.boids.slice().sort((a, b) => a.arcFraction - b.arcFraction);
        let ok = true;
        for (const b of layer.boids) {
            const sl = Number.isFinite(b.waSlot) ? clamp(Math.round(b.waSlot), 0, n - 1) : -1;
            if (sl < 0 || bySlot[sl]) { ok = false; break; }
            bySlot[sl] = b;
        }
        if (!ok) for (let i = 0; i < n; i++) bySlot[i] = bs[i];
        waFlock.shift[li] = waBestShift(bySlot, lay.pos, n, L,
            Number.isFinite(waFlock.shift[li]) ? waFlock.shift[li] : 0);
    }
}

// 席は辺に釘づけなので、どのバーがどの席に座るかだけが自由。
// いまの並びからいちばん動かずに済む回し方をひとつ選ぶ。
// いまの選びを少し贔屓しておかないと、僅差で席割りが入れ替わってちらつく
function waBestShift(bySlot, pos, n, L, cur) {
    let best = 0;
    let bestC = Infinity;
    for (let r = 0; r < n; r++) {
        let cost = 0;
        for (let i = 0; i < n; i++) {
            const b = bySlot[i];
            if (!b) continue;
            let d = pos[(i + r) % n] - b.arcFraction * L;
            d -= Math.round(d / L) * L;
            cost += Math.abs(d);
        }
        if (r === cur) cost *= 0.85;
        if (cost < bestC) { bestC = cost; best = r; }
    }
    return best;
}

// 実際に出ている倒し方を、3段階のどれかへ読み取る。
// しきい値は「出せる範囲」に対する割合。絶対値で決めてしまうと、
// 天板つきのように倒せる角度が小さい設定で、全部が直立あつかいになる
function waSnapLean(lean, cap) {
    const th = 0.4 * (cap || waAmp());
    return lean < -th ? -2 : (lean > th ? 2 : 0);
}

// 柄を、目で読める記号の並びにする（パネル表示用）
function waGlyphs(m) {
    if (!m) return '-';
    let s = '';
    for (let i = 0; i < m.period; i++) {
        s += WA_LEAN_CHARS[clamp(m.leans[i], -2, 2) + 2];
        if (m.gaps[i] === 2) s += '  ';
        else if (m.gaps[i] === 1) s += ' ';
        else if (m.gaps[i] === WA_CROSS) s += '×';
    }
    return s;
}

// 一周をちょうど割り切る単位の長さ（継ぎ目のない文様にするため）。
// くり返しが4回未満になる長さは外す。レールの辺は4つあり、
// どの辺にも単位がひとつは入らないと「辺の中で完結する」形にならない。
// 18本なら単位2本（9回）・3本（6回）・4本（辺ごとに 5・4・5・4 本）まで。
// 割り切れない長さも入れてある。辺の中で完結させているので、
// 余りの1本は辺の終わりで単位の頭をもう一度打つだけになり、継ぎ目は出ない。
// 割り切れる長さだけに絞っていたころは、18本では2本か3本の単位しかなく、
// どの周も似た柄になっていた
function waUnitLengths(n) {
    const out = [];
    for (let k = 2; k <= 9; k++) if (n / k >= 4) out.push(k);
    return out.length ? out : [2];
}

function waRandomMotif(period) {
    const g = new Int8Array(period);
    const l = new Int8Array(period);
    for (let i = 0; i < period; i++) {
        g[i] = Math.floor(Math.random() * WA_GAP_LEVELS.length);
        l[i] = WA_LEAN_LEVELS[Math.floor(Math.random() * WA_LEAN_LEVELS.length)];
    }
    return { period, gaps: g, leans: l };
}

// 柄として読める起伏があるか。
// 車間と倒し方のばらつきに加えて、倒し方が右へ左へ振れているかを見る。
// V∧V∧ のように向きが入れ替わる並びは記号として読みやすく、
// 逆に全部同じ向きへ倒れているのは、傾いてはいても柄にはならない
function waContrast(m) {
    const k = m.period;
    let gm = 0;
    let lm = 0;
    for (let i = 0; i < k; i++) { gm += waGapOrd(m.gaps[i]); lm += m.leans[i]; }
    gm /= k; lm /= k;
    let gv = 0;
    let lv = 0;
    for (let i = 0; i < k; i++) {
        gv += (waGapOrd(m.gaps[i]) - gm) ** 2;
        lv += (m.leans[i] - lm) ** 2;
    }
    let zig = 0;
    for (let i = 0; i < k; i++) {
        const a = m.leans[i];
        const b = m.leans[(i + 1) % k];
        if (a * b < 0) zig += 1;              // 右倒しの隣が左倒し
        else if (a !== b) zig += 0.4;         // 段階が違うだけ
    }
    zig /= k;
    return clamp(Math.sqrt(gv / k) / 0.75, 0, 1) * 0.26
        + clamp(Math.sqrt(lv / k) / 1.1, 0, 1) * 0.34
        + clamp(zig, 0, 1) * 0.40;
}

// 覚える値打ちがあるか。
// 隣り合って逆向きに倒れる組（先端が向き合う V、背中合わせの ∧）が
// 最低ひとつ入っていることを求める。1本ずつの傾きがそろっているだけの並びは、
// くり返してもゆるい縞にしかならず、「模様」としては読めなかった
function waUsable(motif) {
    const k = motif.period;
    let nonZero = false;
    let figure = false;
    const leanKinds = new Set();
    const gapKinds = new Set();
    for (let i = 0; i < k; i++) {
        if (motif.leans[i] !== 0) nonZero = true;
        if (motif.leans[i] * motif.leans[(i + 1) % k] < 0) figure = true;
        leanKinds.add(motif.leans[i]);
        gapKinds.add(motif.gaps[i]);
    }
    // 隣り合って逆向きに倒れる組（V・∧）は必ず含める
    return nonZero && figure && waContrast(motif) >= 0.26;
}

function waDescribe(m) {
    const d = new Float64Array(36);
    for (let i = 0; i < 18; i++) {
        const j = i % m.period;
        d[i] = (waGapOrd(m.gaps[j]) + 1) / 3;
        d[i + 18] = (m.leans[j] + 2) / 4;
    }
    return d;
}

function waNoveltyOf(desc, archive) {
    if (!archive || archive.length === 0) return 1;
    const ds = archive.map((a) => {
        let s = 0;
        for (let k = 0; k < a.length; k++) { const x = desc[k] - a[k]; s += x * x; }
        return Math.sqrt(s / a.length);
    });
    ds.sort((x, y) => x - y);
    const k = Math.min(3, ds.length);
    let sum = 0;
    for (let i = 0; i < k; i++) sum += ds[i];
    return sum / k;
}

// 柄の新しさ。回して重ねたなかでいちばん近いもので測る。
// 同じ柄でも一周のどこから数えるかで記述が変わるので、
// そのままでは「前と同じ柄」を新しいと見誤っていた
function waMotifNovelty(m, archive) {
    if (!archive || archive.length === 0) return 1;
    const k = m.period;
    const ds = archive.map((a) => {
        let best = Infinity;
        for (let r = 0; r < k; r++) {
            let s2 = 0;
            for (let i = 0; i < 18; i++) {
                const j = (i + r) % k;
                const x = (waGapOrd(m.gaps[j]) + 1) / 3 - a[i];
                const y = (m.leans[j] + 2) / 4 - a[i + 18];
                s2 += x * x + y * y;
            }
            best = Math.min(best, Math.sqrt(s2 / 36));
        }
        return best;
    });
    ds.sort((x, y) => x - y);
    // いちばん近い記憶を重く見る。直前に出した柄とほぼ同じなら、ほぼ0になる
    const k3 = Math.min(3, ds.length);
    let sum = 0;
    for (let i = 0; i < k3; i++) sum += ds[i];
    return 0.6 * ds[0] + 0.4 * (sum / k3);
}

// 1本ぶんの近さ。倒し方を重く、車間を軽く見る
function waCellSim(x, y) {
    return 1 - (Math.abs(x.l - y.l) / 4) * 0.72
        - (Math.abs(waGapOrd(x.g) - waGapOrd(y.g)) / 3) * 0.28;
}

// 同じ長さの二つの組の近さ。ずらして重ねた中でいちばん近いところを採る
// （「XV」と「VX」は、一周に並べれば同じ文様になるので、同じ組とみなす）
function waMotifSimRot(a, b) {
    const k = a.period;
    let best = -1;
    for (let r = 0; r < k; r++) {
        let s = 0;
        for (let i = 0; i < k; i++) {
            s += waCellSim({ l: a.leans[(i + r) % k], g: a.gaps[(i + r) % k] },
                { l: b.leans[i], g: b.gaps[i] });
        }
        best = Math.max(best, s / k);
    }
    return best;
}

// ---- カオスのあいだ：覚える・広げる・育てる ----

// いまの並びを、そのまま段階の列として読み取る（席番号の順に並べる）
function waReadRing(layer) {
    const L = perimeterLength;
    const bs = layer.boids.slice().sort((a, b) => a.arcFraction - b.arcFraction);
    const n = bs.length;
    if (n < 4) return null;
    const gaps = new Float64Array(n);
    let sum = 0;
    for (let i = 0; i < n; i++) {
        let d = (bs[(i + 1) % n].arcFraction - bs[i].arcFraction) * L;
        if (d < 0) d += L;
        gaps[i] = d; sum += d;
    }
    const mean = sum / n;
    const cap = waAmp();
    const seq = new Array(n);
    for (let i = 0; i < n; i++) {
        const b = bs[i];
        const sl = Number.isFinite(b.waSlot) ? clamp(b.waSlot, 0, n - 1) : i;
        const r = mean > 0 ? gaps[i] / mean : 1;
        seq[sl] = {
            // 平均よりかなり狭い車間は「交差」の段として読む
            g: r < 0.5 ? WA_CROSS : (r < 0.82 ? 0 : (r > 1.26 ? 2 : 1)),
            l: waSnapLean(clamp(-Math.sin(b.tilt) * b.direction, -1, 1), cap),
        };
    }
    for (let i = 0; i < n; i++) if (!seq[i]) return null;   // 席番号が壊れている
    return seq;
}

// 位置 s から長さ k の並びが、そのまま何回つづけてくり返されているか
function waRunLength(seq, s, k) {
    const n = seq.length;
    let reps = 1;
    for (let r = 1; r * k + k <= n; r++) {
        let sim = 0;
        for (let i = 0; i < k; i++) sim += waCellSim(seq[(s + i) % n], seq[(s + r * k + i) % n]);
        if (sim / k < WA_SIM_OK) break;
        reps++;
    }
    return reps;
}

// 覚えている組の強さ。
// 何度も見かけた組ほど強い（1回きりの偶然は弱い）。
// そこへ「柄として読めるか」「くり返しが何回出るか」「直前の文様と違うか」を掛ける
function waPoolScore(e) {
    const n = layers[0] ? layers[0].boids.length : 18;
    // 編み込みになる柄は、上下を合わせた本数でくり返しを数える
    const nEff = waIsWoven(e.motif, n, null) ? 2 * n : n;
    const rep = 1 + waRepeat * clamp((nEff / e.motif.period - 2) / 7, 0, 1);
    const nov = waMotifNovelty(e.motif, waFlock.memory);
    // この装置でどれだけ大きく倒して見せられるか。
    // 天板を出すとバーが長くなり、隣り合って向き合う組ばかりの柄は
    // 角度を削られてほとんど直立の帯になってしまう。
    // 見せられない柄を選んでも仕方がないので、ここで効かせる。
    // 天板なしではほとんどの柄が満点になるので、選び方は変わらない
    const want = Math.sin((waTiltDeg * Math.PI) / 180);
    const shown = want > 1e-6
        ? clamp(waAmpFor(e.motif, n, 0) / want, 0, 1) : 1;
    // 直前に出した柄とほとんど同じものは、ほかがどれだけ良くても大きく下げる
    const stale = nov < 0.1 ? 1 - 0.8 * clamp(waNovelty, 0, 1) : 1;
    return clamp(e.hits / 8, 0, 1) * (0.25 + 0.75 * waContrast(e.motif))
        * rep * e.agree * (1 + waNovelty * 3 * nov) * stale * (0.3 + 0.7 * shown);
}

// 見かけた組を覚える。すでに覚えているものと近ければ、回数を足すだけ。
// 「似たパターンが複数見つかる」は、ここで同じ組の回数として積み上がる
function waPoolAdd(motif, agree) {
    if (!waUsable(motif)) return null;
    const tick = waFlock.tick;
    for (const e of waFlock.pool) {
        if (e.motif.period !== motif.period) continue;
        if (waMotifSimRot(e.motif, motif) >= WA_SAME) {
            // 数えるのは「何回の走査で見かけたか」。
            // 一度の走査の中では、区画の切り方ちがいで同じ組が何度も出るので、
            // そのまま足すと回数が跳ね上がり、どの組も満点になってしまう
            if (e.seen !== tick) { e.seen = tick; e.hits += 1; }
            if (agree > e.agree) e.agree = agree;
            return e;
        }
    }
    const e = { motif, hits: 1, agree, seen: tick };
    waFlock.pool.push(e);
    if (waFlock.pool.length > 10) {
        waFlock.pool.sort((x, y) => waPoolScore(y) - waPoolScore(x));
        waFlock.pool.length = 10;
    }
    return e;
}

// 一周を k本ずつの区画に切って、区画まるごとで見比べる。
// 「ほかのどの区画にもいちばん似ている区画」を、そのまま組として拾う。
// 位置ごとに多数決を取ると、1本目はAの区画から、2本目はBの区画から、と
// 継ぎはぎの柄になってしまい、/\ のような「組」がばらばらに壊れる
function waScanRing(seq) {
    const n = seq.length;
    for (const k of waUnitLengths(n)) {
        if (k * 2 > n) continue;
        for (let s = 0; s < k; s++) {
            const m0 = Math.floor((n - s) / k);
            if (m0 < 2) continue;
            let bestA = -1;
            let bestJ = -1;
            for (let a = 0; a < m0; a++) {
                let sum = 0;
                for (let b = 0; b < m0; b++) {
                    if (b === a) { sum += 1; continue; }
                    let sim = 0;
                    for (let i = 0; i < k; i++) {
                        sim += waCellSim(seq[s + a * k + i], seq[s + b * k + i]);
                    }
                    sum += sim / k;
                }
                const avg = sum / m0;
                if (avg > bestA) { bestA = avg; bestJ = a; }
            }
            // ここのしきい値は低めにしてある。素のカオスはそもそも乱れていて、
            // 高くすると何も拾えないまま時間が過ぎてしまう。
            // 弱い候補も覚えたうえで、回数と起伏で選び直す
            if (bestJ < 0 || bestA < 0.55) continue;
            const g = new Int8Array(k);
            const l = new Int8Array(k);
            for (let i = 0; i < k; i++) {
                g[i] = seq[s + bestJ * k + i].g;
                l[i] = seq[s + bestJ * k + i].l;
            }
            waPoolAdd({ period: k, gaps: g, leans: l }, bestA);
        }
        // その場で二度三度つづけて出た並びは、はっきりした偶然なので強めに数える
        for (let s = 0; s < n; s++) {
            const reps = waRunLength(seq, s, k);
            if (reps < 2) continue;
            const g = new Int8Array(k);
            const l = new Int8Array(k);
            for (let i = 0; i < k; i++) { g[i] = seq[(s + i) % n].g; l[i] = seq[(s + i) % n].l; }
            waPoolAdd({ period: k, gaps: g, leans: l }, 0.86);
        }
    }
}

// いちばん強い組が、決まって同じ続き方をしているなら、
// その先まで含めた長い組へ育てる。XV がいつも ∧ を連れているなら XV∧ を作る。
// 育てた組も「覚えている組」のひとつとして並ぶだけなので、
// 続き方が毎回ばらばらなら回数が伸びず、そのうち消える
function waExtend(seq, champ) {
    if (!champ || champ.hits < 3) return;
    const n = seq.length;
    const k = champ.motif.period;
    const longer = waUnitLengths(n).filter((x) => x > k);
    if (!longer.length) return;
    const k2 = longer[0];
    if (k2 * 2 > n) return;
    let bestSim = -1;
    let bestS = -1;
    for (let s = 0; s < n; s++) {
        let sim = 0;
        for (let i = 0; i < k; i++) {
            sim += waCellSim(seq[(s + i) % n],
                { l: champ.motif.leans[i], g: champ.motif.gaps[i] });
        }
        sim /= k;
        if (sim > bestSim) { bestSim = sim; bestS = s; }
    }
    if (bestSim < 0.85 || bestS < 0) return;
    const g = new Int8Array(k2);
    const l = new Int8Array(k2);
    for (let i = 0; i < k2; i++) {
        g[i] = seq[(bestS + i) % n].g;
        l[i] = seq[(bestS + i) % n].l;
    }
    const e = waPoolAdd({ period: k2, gaps: g, leans: l }, 0.8);
    // 親の手柄をいくらか受け継ぐ（長いほうが最初から不利にならないように）
    if (e && e.hits <= 1) e.hits = Math.max(1, Math.round(champ.hits * 0.6));
}

// その組を、いまの並びのどこに当てはめるのがいちばん近いか
function waAlignOffset(seq, motif) {
    const n = seq.length;
    const k = motif.period;
    let best = 0;
    let bestS = -Infinity;
    for (let off = 0; off < k; off++) {
        let s = 0;
        for (let i = 0; i < n; i++) {
            const j = (i + off) % k;
            s += waCellSim(seq[i], { l: motif.leans[j], g: motif.gaps[j] });
        }
        if (s > bestS) { bestS = s; best = off; }
    }
    return best;
}

// いちばん強い組が、まわりのバーへどれだけ染みているかを更新する。
// 自分がすでにその形に近ければ強く染まり、近くなくても両隣が染まっていれば
// 引きずられる。これで、たまたまできた組が一周へ広がっていく。
// 染まったバーは下の waApplyMotif で実際にその形を取りにいくので、
// 広がりはそのまま見た目に出る
function waSpread(seq, motif, off) {
    const n = seq.length;
    const k = motif.period;
    const cur = (waFlock.adopt && waFlock.adopt.length === n)
        ? waFlock.adopt : new Float64Array(n);
    const next = new Float64Array(n);
    for (let i = 0; i < n; i++) {
        const j = (i + off) % k;
        const fit = clamp(1 - (Math.abs(seq[i].l - motif.leans[j]) / 4) * 1.25, 0, 1);
        const nb = 0.5 * (cur[(i - 1 + n) % n] + cur[(i + 1) % n]);
        const tgt = clamp(Math.max(fit, nb * 0.92), 0, 1);
        next[i] = cur[i] + (tgt - cur[i]) * 0.35;
    }
    waFlock.adopt = next;
}

// b が a の頭をそのまま含んでいて、より長いか（XV → XV∧ の関係か）。
// 「育った形」への乗り換えは、頭がそのまま残るので見た目が飛ばない
function waIsGrowthOf(b, a) {
    if (!b || !a || b.motif.period <= a.motif.period) return false;
    let sim = 0;
    for (let i = 0; i < a.motif.period; i++) {
        sim += waCellSim({ l: b.motif.leans[i], g: b.motif.gaps[i] },
            { l: a.motif.leans[i], g: a.motif.gaps[i] });
    }
    return sim / a.motif.period >= 0.85;
}

function waObserve(elapsedMs) {
    waFlock.tick = (waFlock.tick || 0) + 1;
    for (const layer of layers) {
        const seq = waReadRing(layer);
        if (!seq) continue;
        waScanRing(seq);
    }
    // 強さの順に並べ直して、先頭を「いま広げている組」にする
    waFlock.pool.sort((x, y) => waPoolScore(y) - waPoolScore(x));
    const champ = waFlock.pool[0] || null;
    const seq0 = layers[0] ? waReadRing(layers[0]) : null;
    if (champ && seq0) {
        waExtend(seq0, champ);
        waFlock.pool.sort((x, y) => waPoolScore(y) - waPoolScore(x));
    }
    // 乗り換えてよいのは、広がりがまだ浅いうちだけ。
    // ここを最後まで開けておくと、6秒かけて半分まで広がった柄が、
    // 組み上げの直前に別の柄へ差し替わることがあった。
    // 見ている側には「途中まで出ていた模様が、最後に無関係な模様へ飛ぶ」
    // という切れ方に見えるので、深く広がったあとは今の柄で押し通す
    const locked = waFlock.champ && waFlock.grip > 0.5;
    let top = waFlock.pool[0] || waFlock.champ || null;
    let growth = false;
    if (locked && top !== waFlock.champ) {
        // 深く広がったあとに乗り換えてよいのは「いまの柄がそのまま伸びた形」だけ。
        // XV が XV∧ になるのは頭が残るので続きに見えるが、
        // 無関係な柄への差し替えは、途中まで出ていた模様が消える切れ方になる
        growth = waIsGrowthOf(top, waFlock.champ);
        if (!growth) top = waFlock.champ;
    }
    if (top) {
        if (waFlock.champ !== top && waFlock.adopt) {
            // 広げる組が入れ替わったら、染まり具合はいったん薄める。
            // ただし伸びた形への乗り換えは続きなので、染まりはそのまま引き継ぐ
            if (!growth) {
                for (let i = 0; i < waFlock.adopt.length; i++) waFlock.adopt[i] *= 0.35;
            }
            waFlock.champOff = null;
        }
        waFlock.champ = top;
        if (seq0) {
            // 当てはめる位置も、広げはじめたら動かさない。
            // 毎回いちばん近い位置へ付け替えていると、役がひとつずれるたびに
            // 全バーの狙いが飛んで、広がりかけの形が崩れる
            if (waFlock.champOff === null || waFlock.grip <= 0.001) {
                waFlock.champOff = waAlignOffset(seq0, top.motif);
            }
            // 広げはじめるのはカオスの中ほどから。
            // 最初から広げると、いちばん最初に見かけた組がそのまま居座り、
            // 何周まわしても同じ文様しか出てこなかった。
            // 前半を素のカオスのままにしておくと、いくつもの組が同じくらいの
            // 回数で競り合い、そこから伸びたものが勝つ
            if (waFlock.grip > 0.001) waSpread(seq0, top.motif, waFlock.champOff);
        }
    }
}

// ---- 一周のしくみ ----

// keep が真のときは、いま出ている文様をそのまま引き継いで始める。
// 席順を振り直すと、同じ並びでも役がひとつずれて文様が飛んでしまうので、
// ほどけるあいだは前の席順のまま置いておく
// 編み込みの席割り。下のレイヤーが列の偶数番、上が奇数番を受け持つ。
// 上の席は、下の席とその次の席のあいだに、柄の車間の比で置く
// 上下の36本を1本の列として、1辺に同じ本数ずつ配る（18本×2なら1辺9本）。
// 役は「その辺の何本目か」だけで決めるので、4辺ともまったく同じ柄になる。
// 1辺の本数が単位で割り切れないときは、最後に単位の頭を添えて閉じる
// （単位4本・1辺9本なら「ABCD ABCD A」）。
// 同じレイヤーの隣どうし（列では2つ先）の先端がぶつからないよう、
// そのぶんの車間から出せる振れ幅を決める
const waWovenCache = new Map();
function waWovenSolve(m, n, L) {
    if (!m || !(L > 0) || n < 2) return null;
    const barLen = getNormalLineLength();
    if (!m._id) m._id = ++waMotifSerial;
    const ck = `${m._id}|${n}|${L.toFixed(2)}|${barLen.toFixed(2)}|${waTiltDeg}|${minDistance.toFixed(3)}`;
    if (waWovenCache.has(ck)) return waWovenCache.get(ck);
    const k = m.period;
    const N = 2 * n;
    const base = Math.floor(N / 4);
    // 4で割り切れないぶん（2本）は、向かい合う辺へ1本ずつ
    const C = [0, 1, 2, 3].map((j) => base + ((N % 4) && (j === 0 || j === 2) ? 1 : 0));
    const role = new Int32Array(N);
    const side = new Int32Array(N);
    const tIn = new Int32Array(N);
    const lean = new Float64Array(N);
    let g = 0;
    for (let j = 0; j < 4; j++) {
        for (let t = 0; t < C[j]; t++, g++) {
            role[g] = t % k;
            side[g] = j;
            tIn[g] = t;
            lean[g] = clamp(m.leans[t % k], -2, 2) / 2;
        }
    }
    const Lside = L / 4;
    const mean = L / N;
    // 交差の段の車間。辺の最後（角をまたぐところ）には置かず、2つ続いたら2つめは詰める段にする
    // （2つ続くと、同じレイヤーの隣どうしが近づきすぎるため）
    const XG = minDistance * WA_CROSS_GAP_RATIO;
    const cross = new Uint8Array(N);
    const lvlOf = new Int32Array(N);
    for (let q = 0; q < N; q++) {
        let lv = clamp(m.gaps[role[q]] | 0, 0, WA_CROSS);
        const last = tIn[q] === C[side[q]] - 1;
        if (lv === WA_CROSS && (last || (tIn[q] > 0 && cross[q - 1]))) lv = 0;
        lvlOf[q] = lv;
        cross[q] = lv === WA_CROSS ? 1 : 0;
    }
    // 各辺の柄は角ぎりぎりまで使う。ただし角をまたぐ車間（隣の辺のバーとの車間）は、
    // 柄の中でいちばん狭い車間より詰めない（最低でも最小車間の1.5倍）
    const cornerMin = minDistance * 1.5;
    const g0 = minDistance * 1.5;
    const mg = minDistance * 1.3;

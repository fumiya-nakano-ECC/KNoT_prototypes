    const wantA = Math.sin((waTiltDeg * Math.PI) / 180);
    const build = (needW, mix, corner) => {
        const Gc = new Float64Array(N);
        let gi = 0;
        for (let j = 0; j < 4; j++) {
            let nX = 0;
            for (let t = 0; t < C[j] - 1; t++) if (cross[gi + t]) nX++;
            const inner = Lside - corner - nX * XG;
            const w = [];
            let sum = 0;
            for (let t = 0; t < C[j] - 1; t++) {
                const q = gi + t;
                if (cross[q]) { w.push(0); continue; }
                let wt = lerp(WA_GAP_LEVELS[lvlOf[q]], 1, mix);
                if (needW) {
                    // 先端が向き合う組（列で2つ先と逆向き）をまたぐ車間は広めに
                    const dA = lean[q] - lean[(q + 2) % N];
                    const dB = lean[(q - 1 + N) % N] - lean[(q + 1) % N];
                    wt *= 1 + 1.5 * Math.max(0, dA, dB);
                }
                w.push(wt);
                sum += wt;
            }
            for (let t = 0; t < C[j] - 1; t++) {
                Gc[gi + t] = cross[gi + t] ? XG : (sum > 0 ? inner * w[t] / sum : inner);
            }
            Gc[gi + C[j] - 1] = corner;
            gi += C[j];
        }
        let amp = wantA;
        let okMin = true;
        for (let q = 0; q < N; q++) {
            const D = Gc[q] + Gc[(q + 1) % N];
            if (D < g0) okMin = false;
            const d = lean[q] - lean[(q + 2) % N];
            if (d > 1e-6 && barLen > 0) amp = Math.min(amp, (D - mg) / (d * barLen));
        }
        // 辺の中でいちばん狭い車間。角の車間をこれに合わせる
        let innerMin = Infinity;
        let gi2 = 0;
        for (let j = 0; j < 4; j++) {
            // 交差の段は上下別のレイヤーどうしなので、角の車間の基準には入れない
            for (let t = 0; t < C[j] - 1; t++) {
                if (!cross[gi2 + t]) innerMin = Math.min(innerMin, Gc[gi2 + t]);
            }
            gi2 += C[j];
        }
        return { Gc, amp: clamp(amp, 0.02, 1), okMin, innerMin, corner };
    };
    // 角の車間を、柄の中のいちばん狭い車間に合わせて詰める（数回で落ち着く）
    const buildTight = (needW, mix) => {
        let corner = mean;
        let r = null;
        for (let it = 0; it < 6; it++) {
            r = build(needW, mix, corner);
            const next = Math.max(cornerMin, Number.isFinite(r.innerMin) ? r.innerMin : mean);
            if (Math.abs(next - corner) < 0.5) break;
            corner = next;
        }
        return r;
    };
    let best = null;
    for (const mix of [0, 0.35, 0.7, 1]) {
        for (const needW of [false, true]) {
            const r = buildTight(needW, mix);
            if (!r.okMin) continue;
            // 車間の柄（粗密）を保ちつつ、倒し方が大きく出るほうを採る
            const score = r.amp * (needW ? 0.87 : 1) * (1 - 0.15 * mix);
            if (!best || score > best.score) best = { ...r, score };
        }
        if (best) break;
    }
    if (!best) best = buildTight(false, 1);
    // ---- 柄の自然な幅 ----
    // 辺の端まで使ってよいが、使い切る必要はない。
    // 柄ごとに「先端が向き合っても狙いの角度まで倒せる、いちばん詰めた幅」を出し、
    // それに柄ごとのゆとり（m._spread）を掛けた幅で、辺の中央に置く。
    // 辺に収まらない柄だけ、上の「角ぎりぎりまで広げた並び」を使う
    if (!Number.isFinite(m._spread)) m._spread = 0.45 + Math.random() * 0.4;
    let nat = null;
    for (const needW of [false, true]) {
        const Gc = new Float64Array(N);
        const cornerPer = [0, 0, 0, 0];
        let gi = 0;
        let fits = true;
        for (let j = 0; j < 4; j++) {
            const w = [];
            let wsum = 0;
            for (let t = 0; t < C[j] - 1; t++) {
                const q = gi + t;
                if (cross[q]) { w.push(0); continue; }
                let wt = WA_GAP_LEVELS[lvlOf[q]];
                if (needW) {
                    const dA = lean[q] - lean[(q + 2) % N];
                    const dB = lean[(q - 1 + N) % N] - lean[(q + 1) % N];
                    wt *= 1 + 1.5 * Math.max(0, dA, dB);
                }
                w.push(wt);
                wsum += wt;
            }
            // 同じレイヤーの隣どうし（列で2つ先）が、狙いの角度で先端をぶつけない最小の刻み
            let sNeed = 0;
            for (let t = 0; t + 1 < C[j] - 1; t++) {
                const q = gi + t;
                const d = lean[q] - lean[q + 2];
                const need = Math.max(g0, d * barLen * wantA + mg);
                // 交差の段は幅が決まっているので、残りを刻みで稼ぐ
                const F = (cross[q] ? XG : 0) + (cross[q + 1] ? XG : 0);
                const W = w[t] + w[t + 1];
                if (W > 0) sNeed = Math.max(sNeed, (need - F) / W);
            }
            // 1本ずつの最小車間も守る（交差の段は上下別のレイヤーどうしなので外す）
            let nW = 0;
            for (let t = 0; t < C[j] - 1; t++) {
                if (cross[gi + t]) continue;
                sNeed = Math.max(sNeed, cornerMin / w[t]);
                nW++;
            }
            const avgW = nW > 0 ? wsum / nW : 1;
            const sFloor = (mean * m._spread) / avgW;
            const sc = Math.max(sNeed, sFloor);
            let innerSum = 0;
            for (let t = 0; t < C[j] - 1; t++) {
                Gc[gi + t] = cross[gi + t] ? XG : sc * w[t];
                innerSum += Gc[gi + t];
            }
            const corner = Lside - innerSum;
            // 角をまたぐ車間は、辺の中のいちばん狭い車間より詰めない（交差の段は除く）
            let innerMin = Infinity;
            for (let t = 0; t < C[j] - 1; t++) {
                if (!cross[gi + t]) innerMin = Math.min(innerMin, Gc[gi + t]);
            }
            if (corner < Math.max(cornerMin, Number.isFinite(innerMin) ? innerMin : 0)) fits = false;
            cornerPer[j] = corner;
            Gc[gi + C[j] - 1] = corner;
            gi += C[j];
        }
        if (!fits) continue;
        let amp = wantA;
        for (let q = 0; q < N; q++) {
            const D = Gc[q] + Gc[(q + 1) % N];
            const d = lean[q] - lean[(q + 2) % N];
            if (d > 1e-6 && barLen > 0) amp = Math.min(amp, (D - mg) / (d * barLen));
        }
        let width = 0;
        for (let j = 0; j < 4; j++) width += Lside - cornerPer[j];
        if (!nat || width < nat.width) nat = { Gc, amp: clamp(amp, 0.02, 1), cornerPer, width };
    }
    if (nat) {
        // 辺ごとに中央へ置くので、角をまたぐ実際の車間は両側の余りの半分ずつの和になる
        let gl = 0;
        for (let j = 0; j < 4; j++) {
            gl += C[j];
            nat.Gc[gl - 1] = (nat.cornerPer[j] + nat.cornerPer[(j + 1) % 4]) / 2;
        }
        best = { Gc: nat.Gc, amp: nat.amp, cornerPer: nat.cornerPer };
    }
    const cornerOf = (j) => (best.cornerPer ? best.cornerPer[(j + 3) % 4] : best.corner);
    const pos = new Float64Array(N);
    let gg = 0;
    for (let j = 0; j < 4; j++) {
        // 辺の始まりから、前の角の車間の半分だけ進んだところが1本目
        let pp = -arcLength / 2 + j * Lside + cornerOf(j) / 2
            + (best.cornerPer ? (best.cornerPer[j] - best.cornerPer[(j + 3) % 4]) / 2 : 0);
        for (let t = 0; t < C[j]; t++, gg++) {
            pos[gg] = ((pp % L) + L) % L;
            pp += best.Gc[gg];
        }
    }
    const out = { N, C, pos, lean, Gc: best.Gc, amp: best.amp, side, tIn };
    if (waWovenCache.size > 24) waWovenCache.clear();
    waWovenCache.set(ck, out);
    return out;
}

// 編み込みの列から、そのレイヤーのぶんだけを取り出す（偶数番が下、奇数番が上）
function waWovenLay(li, m, n, off, L) {
    const w = waWovenSolve(m, n, L);
    if (!w) return null;
    const par = li === 0 ? 0 : 1;
    const pos = new Float64Array(n);
    const gap = new Float64Array(n);
    const lean = new Float64Array(n);
    const counts = [0, 0, 0, 0];
    let i = 0;
    for (let q = par; q < w.N && i < n; q += 2, i++) {
        pos[i] = w.pos[q];
        gap[i] = w.Gc[q] + w.Gc[(q + 1) % w.N];
        lean[i] = w.lean[q];
        counts[w.side[q]]++;
    }
    return { pos, gap, lean, amp: w.amp, counts, anchored: true };
}

// ---- 上下のレイヤーの関係 ----
// これまでは上下が同じ柄・同じ席で組まれていたので、36本あっても
// 上下のバーがぴったり重なり、18本ぶんの柄にしか見えなかった。
// 下のレイヤーを基準に、上のレイヤーを毎周ちがう関係で組む。
// どの関係でも、上の席は下の席のあいだ（車間のなかほど）へずらしてあるので、
// 上下がそっくり重なることはない。
const WA_RELS = [
    { key: 'interleave', name: '互い違い', w: 1.0, shift: 0.5 },
    { key: 'mirror', name: '鏡写し', w: 1.3, shift: 0.5, sign: -1 },
    { key: 'phase', name: '役ずらし', w: 1.1, shift: 0.5, phase: true },
    { key: 'sides', name: '逆向きに並べる', w: 0.9, shift: 0.5, flipAll: true },
    { key: 'counter', name: '別の柄を重ねる', w: 1.3, shift: 0.5, counter: true },
    { key: 'pair', name: '寄り添う二本', w: 0.8, shift: 0.28 },
    { key: 'woven', name: '編み込み', w: 1.2, shift: 0.5 },
];
// 辺どうしは、どの辺も同じ並びにしておく（柄のくり返しが読みやすいように）
const WA_SYMS = [
    { flips: 0, name: '回転', w: 1 },
];

function waPickWeighted(list, avoidKey) {
    const cand = list.filter((r) => r.key !== avoidKey);
    const pool = cand.length ? cand : list;
    let tot = 0;
    for (const r of pool) tot += r.w || 1;
    let x = Math.random() * tot;
    for (const r of pool) { x -= r.w || 1; if (x <= 0) return r; }
    return pool[pool.length - 1];
}

function waPickRel(prev) {
    const r = waPickWeighted(WA_RELS, prev ? prev.key : null);
    let sym = waPickWeighted(WA_SYMS, null);
    // 関係も対称も前の周と同じなら、対称のほうを引き直す
    if (prev && prev.key === r.key && prev.flips0 === sym.flips) {
        sym = WA_SYMS[(WA_SYMS.indexOf(sym) + 1) % WA_SYMS.length];
    }
    return {
        key: r.key,
        name: r.name,
        symName: sym.name,
        shift: r.shift,
        sign: r.sign || 1,
        phase: r.phase ? 1 + Math.floor(Math.random() * 8) : 0,
        counter: !!r.counter,
        flips0: sym.flips,
        flips1: r.flipAll ? (sym.flips ^ 0b1111) : sym.flips,
        m2: null,
        off2: 0,
    };
}

// そのレイヤーの席割り。li=0 は基準、li>=1 は rel にしたがって組み直す。
// useM2 が真のときだけ「別の柄を重ねる」の2つめの柄を使う
// （カオスの最中はまだ決まっていないので、同じ柄をずらして使う）
// 上下を1本の列として編み込むかどうか。
// 1レイヤーだけだと1辺に4〜5本しかなく、単位3本以上では1辺に1回しか入らない。
// そういう柄は上下を交互に使って1辺に約9本とし、辺の中で2回以上くり返す
function waGcd(a, b) { return b ? waGcd(b, a % b) : a; }
function waWovenUnit(k) { return k / waGcd(k, 2); }
function waIsWoven(m, n, rel) {
    // 1レイヤーだけでは1辺の本数が割り切れず（18本なら4.5本）、辺ごとに柄が変わってしまう。
    // 上下が揃っているときは、つねに編み込みで組む
    return !!m && layers.length >= 2 && n >= 2;
}

// 1辺の中で柄が何回くり返すか（表示用）
function waRepsPerSide(m, n, rel) {
    if (!waIsWoven(m, n, rel)) {
        const cnts = waSideCounts(n, m.period);
        if (!cnts) return '-';
        const r = cnts.map((c) => Math.floor(c / m.period));
        return `${Math.min(...r)}〜${Math.max(...r)}回`;
    }
    const w = waWovenSolve(m, n, perimeterLength);
    if (!w) return '-';
    const c = w.C[1];
    const reps = Math.floor(c / m.period);
    const extra = c % m.period;
    return `${reps}回${extra ? `＋頭${extra}本` : ''}（1辺${c}本・4辺とも同じ）`;
}

function waLayerLay(li, m, n, off, L, rel, useM2) {
    if (!m) return null;
    if (waIsWoven(m, n, rel)) return waWovenLay(li, m, n, off, L);
    let mm = m;
    let o = off || 0;
    let flips = rel ? rel.flips0 : 0;
    let sign = 1;
    let shiftF = 0;
    if (li > 0 && rel) {
        if (useM2 && rel.counter && rel.m2) { mm = rel.m2; o = rel.off2 || 0; }
        if (rel.phase) {
            let ph = rel.phase % mm.period;
            if (ph === 0) ph = 1;
            o += ph;
        }
        flips = rel.flips1;
        sign = rel.sign;
        shiftF = rel.shift || 0;
    }
    o = ((o % mm.period) + mm.period) % mm.period;
    const base = waSideSolve(mm, n, o, L, flips, sign) || waRingSolve(mm, n, o, L);
    if (!base || !shiftF) return base;
    // まず、下のレイヤーの席のあいだへ入れてみる。
    // 下の席 i と i+1 のあいだ（shiftF の割合のところ）に上の席 i を置く。
    // 上の柄が要る車間をそこで確保できるなら、この置き方を採る
    const low = li > 0 ? waLayerLay(0, m, n, off, L, rel, useM2) : null;
    if (low && low.pos.length === n && base.anchored) {
        const barLen = getNormalLineLength();
        const pos = new Float64Array(n);
        for (let i = 0; i < n; i++) {
            let g = low.pos[(i + 1) % n] - low.pos[i];
            if (g <= 0) g += L;
            pos[i] = (((low.pos[i] + g * shiftF) % L) + L) % L;
        }
        const gap = new Float64Array(n);
        let ok = true;
        for (let i = 0; i < n; i++) {
            let g = pos[(i + 1) % n] - pos[i];
            if (g <= 0) g += L;
            gap[i] = g;
            const need = Math.max(minDistance * 1.5,
                (base.lean[i] - base.lean[(i + 1) % n]) * barLen * base.amp
                + minDistance * 1.3);
            if (g < need * 0.97) { ok = false; break; }
        }
        if (ok) {
            return { pos, gap, lean: base.lean, amp: base.amp,
                counts: base.counts, anchored: true };
        }
    }
    // 入りきらないときは、自分の席を自分の車間のなかほどへずらすだけにする
    const pos = new Float64Array(n);
    for (let i = 0; i < n; i++) {
        const g = base.gap ? base.gap[i] : L / n;
        pos[i] = (((base.pos[i] + g * shiftF) % L) + L) % L;
    }
    return { pos, gap: base.gap, lean: base.lean, amp: base.amp,
        counts: base.counts, anchored: base.anchored };
}

function waReset(nowMs, keep) {
    const mem = waFlock ? waFlock.memory : [];
    const prevMotif = keep && waFlock ? waFlock.candidate : null;
    const prevOff = keep && waFlock ? waFlock.phaseOffset : 0;
    const prevRel = keep && waFlock ? waFlock.rel : null;
    const lastRel = waFlock ? waFlock.rel : null;
    // 漂うテンポと位相を1本ずつ配り直す。カオスの時間はここが素になる
    for (const layer of layers) {
        const bs = layer.boids.slice().sort((a, b) => a.arcFraction - b.arcFraction);
        for (let i = 0; i < bs.length; i++) {
            const b = bs[i];
            if (!keep) b.waSlot = i;
            // ほどける順番は1本ずつ違う。いっせいに解けるより、
            // ぱらぱらと手を離していくほうが「ほどける」ように見える
            b.waMeltOrder = Math.random();
            b.soloFreq = (0.16 + Math.random() * 0.22) / 1000 * (0.6 + Math.random() * 1.0);
            b.soloPhase1 = Math.random() * Math.PI * 2;
            b.soloPhase2 = Math.random() * Math.PI * 2;
            b.soloPhase3 = Math.random() * Math.PI * 2;
            b.soloPhase4 = Math.random() * Math.PI * 2;
            b.waTemp = 1;
        }
    }
    // 車間をここで入れておく。本数が増えた直後のバーは0のままで、
    // 「寄りすぎない上限」がその1周ぶん効かなかった
    const L0 = perimeterLength;
    for (const layer of layers) {
        const bs = layer.boids.slice().sort((a, b) => a.arcFraction - b.arcFraction);
        const nn = bs.length;
        for (let i = 0; i < nn; i++) {
            let gp = (bs[i].arcFraction - bs[(i - 1 + nn) % nn].arcFraction) * L0;
            if (gp < 0) gp += L0;
            let gn = (bs[(i + 1) % nn].arcFraction - bs[i].arcFraction) * L0;
            if (gn < 0) gn += L0;
            bs[i].waGapPrev = gp;
            bs[i].waGapNext = gn;
            bs[i].waErr = 0;
        }
    }
    const n = layers[0] ? layers[0].boids.length : 18;
    waFlock = {
        n,                        // この周のあいだの1レイヤーの本数
        barLen: getNormalLineLength(),
        pool: [],                 // このカオスで覚えた組
        champ: null,              // いま広げている組
        champOff: null,
        adopt: new Float64Array(n),
        grip: 0,                  // 見つけた組をどれだけ広げるか（カオス後半で立つ）
        melt: prevMotif ? 0 : 1,  // 直前の文様がどれだけほどけたか
        prevMotif,                // ほどけかけの文様（引き継いだもの）
        prevOff,
        prevRel,                  // ほどけかけの文様の、上下の関係
        rel: waPickRel(lastRel),  // この周の上下の関係（カオスのうちから効かせる）
        // 席の回し方は引き継ぐ。ここを捨てると、ほどけはじめた瞬間に
        // 一周ぶんの並びがぐるりと回ってしまう
        shift: waFlock && waFlock.shift ? waFlock.shift.slice() : [],
        tick: 0,
        memory: mem || [],        // 直前までに出した文様（同じ柄が続かないように）
        candidate: null,
        cycles: 0,
        phaseOffset: 0,
        phase: 'chaos',
        phaseStart: nowMs,
        lastObserve: nowMs,
        temp: 1,
        lastVerdict: prevMotif ? '文様がほどけていきます…'
            : '自由に動き回っています。似た組が出るのを見ています…',
    };
    waUpdateStatusLabel();
}

function waUpdateStatusLabel() {
    const el = document.getElementById('waStatusValue');
    if (el && waFlock) el.textContent = waFlock.lastVerdict;
}

// 倒し方が決まれば、隣り合うバーの先端がぶつからない最小の車間も、そこで決まる。
// 先端が向き合う組（V）は広く要り、背中合わせの組（∧）は狭くてよい。
// 車間の遺伝子は「必要量の上に、余りをどう配るか」だけを決める役にしてある。
// こうすると、どの柄も必ず組める形になり、狙った倒し方がそのまま出る
function waWantGaps(m, n, off, L) {
    const barLen = getNormalLineLength();
    const amp = waAmpFor(m, n, off);
    const need = new Float64Array(n);
    const extra = new Float64Array(n);
    let needSum = 0;
    let extraSum = 0;
    for (let i = 0; i < n; i++) {
        const a = (clamp(m.leans[(i + off) % m.period], -2, 2) / 2) * amp;
        // 隣は「単位の次の役」ではなく「一周のうえで実際に次に来るバー」。
        // 単位が本数を割り切らないとき（本数が素数のときなど）は継ぎ目ができ、
        // ここを取り違えると継ぎ目の車間だけが足りず、先端がぶつかっていた
        const b = (clamp(m.leans[(((i + 1) % n) + off) % m.period], -2, 2) / 2) * amp;
        need[i] = Math.max(minDistance * 1.5, (a - b) * barLen + minDistance * 1.3);
        extra[i] = WA_GAP_LEVELS[waGapSolo(m.gaps[(i + off) % m.period])];
        needSum += need[i];
        extraSum += extra[i];
    }
    const want = new Float64Array(n);
    const rest = L - needSum;
    if (rest <= 0) {
        const k = needSum > 0 ? L / needSum : 1;
        for (let i = 0; i < n; i++) want[i] = need[i] * k;
    } else {
        const k = extraSum > 0 ? rest / extraSum : 0;
        for (let i = 0; i < n; i++) want[i] = need[i] + extra[i] * k;
    }
    return want;
}

// 各バーへ「望む位置」と「倒し方」を配る。
// カオスの最中は、いま広げている組へ染まっているぶんだけ配る（染まり具合＝adopt）。
// 組み上げと保持では、全バーへ一律に配る。
//
// 狙いの位置はレールの角に釘づけにしてある（辺の中で柄を完結させるため）。
// 自由に回せたころは、単位がどこで切り替わるかがそのつど変わり、
// 角のまんなかで柄が折れることがあった
function waApplyMotif(elapsedMs) {
    const L = perimeterLength;
    const chaos = waFlock.phase === 'chaos';
    // ほどけている最中は、まだ前の文様を狙いに使う。
    // 引く力は下の (1-熱さ)^0.6 で効くので、熱さが上がるにつれて自然に緩み、
    // バーは自分のテンポへ戻っていく
    const melting = chaos && waFlock.melt < 1 && waFlock.prevMotif;
    const m = melting ? waFlock.prevMotif
        : (chaos ? (waFlock.champ ? waFlock.champ.motif : null) : waFlock.candidate);
    const off = melting ? waFlock.prevOff
        : (chaos ? waFlock.champOff : waFlock.phaseOffset);
    const rel = melting ? waFlock.prevRel : waFlock.rel;
    const buildT = waFlock.temp;
    if (!waFlock.shift) waFlock.shift = [];
    for (let li = 0; li < layers.length; li++) {
        const layer = layers[li];
        const bs = layer.boids.slice().sort((a, b) => a.arcFraction - b.arcFraction);
        const n = bs.length;
        if (n < 2) continue;
        const adopt = (waFlock.adopt && waFlock.adopt.length === n) ? waFlock.adopt : null;
        const lay = m ? waLayerLay(li, m, n, off, L, rel, melting || !chaos) : null;
        // この柄で実際に出せる振れ幅。傾きを描くときにも同じ値を使う
        const ampNow = lay ? lay.amp : waAmp();
        // 席番号 → バー
        let bySlot = null;
        if (lay) {
            bySlot = new Array(n);
            let ok = true;
            for (const b of layer.boids) {
                const sl = Number.isFinite(b.waSlot)
                    ? clamp(Math.round(b.waSlot), 0, n - 1) : -1;
                if (sl < 0 || bySlot[sl]) { ok = false; break; }
                bySlot[sl] = b;
            }
            if (!ok) for (let i = 0; i < n; i++) bySlot[i] = bs[i];
        }
        // 席の回し方。角に釘づけの並びでは、これだけが自由に選べる。
        // 組み上げに入ったらもう動かさない（つなぎ目で並びが回らないように）
        let shift = Number.isFinite(waFlock.shift[li]) ? waFlock.shift[li] : 0;
        if (lay && lay.anchored) {
            // 席割りを変えていいのは、まだ広げはじめる前だけ。
            // 広がりだしてから回すと、全員の狙いが一斉に隣の席へ飛び、
            // 追い越せないバーどうしが押し合って車間が潰れた
            if (chaos && (waFlock.grip || 0) < 0.5) {
                shift = waBestShift(bySlot, lay.pos, n, L, shift);
            }
            waFlock.shift[li] = shift;
        } else {
            shift = 0;
        }
        // 角に釘づけにしない予備の組み方だけ、これまでどおり
        // 「いまの並びといちばん近い回転位置」へ一周ぶんをずらす
        let phi = 0;
        if (lay && !lay.anchored) {
            let sx = 0;
            let sy = 0;
            for (const b of layer.boids) {
                const sl = Number.isFinite(b.waSlot) ? clamp(b.waSlot, 0, n - 1) : 0;
                const w = adopt
                    ? 0.05 + adopt[sl] * (chaos ? (waFlock.grip || 0) : 1) : 1;
                const ang = ((b.arcFraction * L - lay.pos[sl]) / L) * Math.PI * 2;
                sx += Math.cos(ang) * w; sy += Math.sin(ang) * w;
            }
            phi = (Math.atan2(sy, sx) / (Math.PI * 2)) * L;
        }
        for (let i = 0; i < n; i++) {
            const b = bs[i];
            let gapPrev = (b.arcFraction - bs[(i - 1 + n) % n].arcFraction) * L;
            if (gapPrev < 0) gapPrev += L;
            let gapNext = (bs[(i + 1) % n].arcFraction - b.arcFraction) * L;
            if (gapNext < 0) gapNext += L;
            b.waGapNext = gapNext;
            b.waGapPrev = gapPrev;
            const sl = Number.isFinite(b.waSlot) ? clamp(b.waSlot, 0, n - 1) : i;
            b.waAmpCur = ampNow;
            const a = chaos ? (adopt ? adopt[sl] * (waFlock.grip || 0) : 0) : 1;
            // ほどける順番の個体差。前のほうの番のバーから先に手を離す
            const mOrd = Number.isFinite(b.waMeltOrder) ? b.waMeltOrder : 0.5;
            const mt = melting
                ? clamp(((waFlock.melt || 0) - 0.4 * mOrd) / 0.6, 0, 1) : 1;
            if (!lay) {
                b.waLean = waChaosLean(b, elapsedMs);
                b.waWantGap = 0;
                b.waErr = 0;
                b.waTemp = 1;
                continue;
            }
            const seat = (sl + shift) % n;
            const wantLean = lay.lean[seat];
            // 染まっているぶんだけ、その形へ。まだなら自分のテンポで揺れている。
            // ほどけ中は逆で、前の文様の形から自分のテンポへ戻していく
            b.waLean = melting
                ? lerp(wantLean, waChaosLean(b, elapsedMs), mt)
                : (chaos ? lerp(waChaosLean(b, elapsedMs), wantLean, a) : wantLean);
            b.waWantGap = melting ? 0 : lay.gap[seat];
            let d = lay.pos[seat] + phi - b.arcFraction * L;
            d -= Math.round(d / L) * L;
            b.waErr = d;
            // 組み上がったあと、目標のすぐ近くまで来たバーは静かに吸い寄せて止める。
            // 速さと向き替えだけで合わせにいくと、数mmの行き過ぎと向き替えを
            // くり返して止まりきらず、4辺の並びがわずかにずれて見えた
            if (!chaos && b.waTemp < 0.05 && Math.abs(d) < minDistance * 0.5) {
                const nudge = d * 0.08;
                b.arcFraction = (((b.arcFraction + nudge / L) % 1) + 1) % 1;
                b.nextArcFraction = b.arcFraction;
                b.speed *= 0.8;
                b.flipIntent = false;
                b.waErr = d - nudge;
                if (Math.abs(b.waErr) < minDistance * 0.3) b.waErr = 0;
            }
            // 熱さは1本ずつ。染まったバーから順に、動き回るのをやめて位置へ収まる。
            // 組み上げでは、いまの熱さより上げない。
            // 一律に1へ戻していたときは、カオスの終わりにもう静かになっていた
            // バーが組み上げの頭でいっせいに動き出し、そこで絵がいったん崩れてから
            // 組み直る、という段差ができていた
            const wantTemp = melting ? mt : (chaos ? 1 - 0.9 * a : buildT);
            b.waTemp = chaos ? wantTemp
                : Math.min(Number.isFinite(b.waTemp) ? b.waTemp : 1, wantTemp);
        }
    }
}

// カオスのあいだ、まだ染まっていないバーは倒し方も自分のテンポで揺らす。
// ここが固まっていると、読み取れるのは車間の偶然だけになってしまい、
// V∧ のような「倒し方の並び」は永遠に生まれない
function waChaosLean(boid, elapsedMs) {
    const t = elapsedMs * boid.soloFreq * 1.35;
    return clamp(1.25 * Math.sin(t + boid.soloPhase2)
        + 0.55 * Math.sin(t * 1.47 + boid.soloPhase3), -1, 1);
}

// そのバーが、いま出したい速さ（符号つき）。
// 熱いあいだは柄を無視して自由に動き回り、冷えるにつれて位置へ収まっていく。
// 熱さは1本ずつ持っているので、染まったバーから順に落ち着いていく
function waDrive(boid, elapsedMs) {
    const cruise = Math.max(1e-6, maxSpeed * motionScale);
    const T = Number.isFinite(boid.waTemp) ? boid.waTemp : (waFlock ? waFlock.temp : 0);
    let v = 0;

    if (T > 0.01) {
        // 自由に動き回る成分。MODE14と同じ、比の割り切れない波の重ね合わせ。
        // 遅い成分が効いているので、同じ向きへしばらく押し続けて大きく流れる
        const t = elapsedMs * boid.soloFreq * 1.2;
        v += T * soloWave(boid, t) * cruise * 1.35;
        // 動き回っているあいだも、詰まって固まらないように軽く避け合う
        const ref = minDistance * 3;
        const gp = Math.max(minDistance * 0.6, boid.waGapPrev || ref);
        const gn = Math.max(minDistance * 0.6, boid.waGapNext || ref);
        v += T * clamp(Math.min(2, ref / gp) - Math.min(2, ref / gn), -2, 2) * cruise * 0.5;
    }

    // 詰まりすぎたら、熱さに関係なく押し返す。
    // 狙いの位置を辺に釘づけにしたぶん、遠くまで動くバーが出る。
    // 追い越せないので、前が動けないと後ろが押し込んでしまう。
    // しきい値は柄がいちばん詰まるところ（最小車間の1.5倍）より下に置いてあるので、
    // 組み上がった柄そのものには触らない
    {
        const gp = boid.waGapPrev || 0;
        const gn = boid.waGapNext || 0;
        const safe = minDistance * 1.35;
        if (gp > 0 && gn > 0 && (gp < safe || gn < safe)) {
            const floor = minDistance * 0.5;
            const push = Math.min(3, safe / Math.max(floor, gp))
                - Math.min(3, safe / Math.max(floor, gn));
            v += clamp(push, -3, 3) * cruise * 0.7;
        }
    }

    if (T < 0.99) {
        const err = boid.waErr || 0;
        const dead = minDistance * WA_DEAD_ZONE;
        if (Math.abs(err) > dead) {
            const e = (Math.abs(err) - dead) * Math.sign(err);
            v += Math.pow(1 - T, 0.6) * clamp(e / (minDistance * 3.2), -1.8, 1.8) * cruise;
        }
    }

    // 最後に、寄りすぎない上限をかける。
    // 狙いの位置を辺に釘づけにしてからは、前へ行きたいバーと後ろへ戻りたいバーが
    // 隣り合うことがある。どちらも「残りの車間の一部」までしか踏み込まないようにすると、
    // 何があっても下限を割らない。組み上げを1秒に詰めたとき、ここがないと
    // まれに車間が6mmまで潰れていた
    {
        const floorGap = minDistance * 1.25;
        // 減速しきれる速さの上限。相手も向かってくる場合を考えて、
        // 残りの空きは半分しか自分のぶんに数えない。
        // 速さの上限だけでなく「止まりきれるか」で抑えるのは、
        // 加速度に上限があるぶん、目標を0にしても数フレームは流れていくため。
        // 実際に出せる減速はもっと鈍いので、見積もりは半分に取ってある
        const brake = Math.max(1e-6, maxAccel * motionScale * 0.5);
        const cap = (room) => Math.min(Math.max(0, room) * 0.35,
            Math.sqrt(2 * brake * Math.max(0, room) * 0.5));
        const gp = boid.waGapPrev || 0;
        const gn = boid.waGapNext || 0;
        if (v > 0 && gn > 0) v = Math.min(v, cap(gn - floorGap));
        if (v < 0 && gp > 0) v = Math.max(v, -cap(gp - floorGap));
    }
    return v;
}

// 出来上がった文様の採点（表示用。学習には使わない）
function waEvaluate() {
    const m = waFlock.candidate;
    if (!m) return { feasible: 0, contrast: 0, reps: 0 };
    let errSum = 0;
    let cnt = 0;
    let tiltErr = 0;
    for (const layer of layers) {
        for (const b of layer.boids) {
            if (!Number.isFinite(b.waWantGap) || b.waWantGap <= 0) continue;
            const amp = Number.isFinite(b.waAmpCur) ? b.waAmpCur : waAmp();
            errSum += Math.abs((b.waGapNext || 0) - b.waWantGap) / b.waWantGap;
            const wantLean = clamp((b.waLean || 0) * amp, -0.95, 0.95);
            const gotLean = -Math.sin(b.tilt) * b.direction;
            tiltErr += Math.abs(gotLean - wantLean);
            cnt++;
        }
    }
    const gapFit = cnt > 0 ? clamp(1 - errSum / cnt, 0, 1) : 0;
    const tiltFit = cnt > 0 ? clamp(1 - (tiltErr / cnt) / 0.55, 0, 1) : 0;
    const n0 = layers[0] ? layers[0].boids.length : 18;
    return {
        feasible: gapFit * 0.5 + tiltFit * 0.5,
        contrast: waContrast(m),
        reps: n0 / m.period,
    };
}

// 覚えている組を、そのまま記号で並べて見せる
function waPoolLine() {
    return waFlock.pool.slice(0, 3)
        .map((e) => `${waGlyphs(e.motif)}(${e.hits})`).join('　');
}

function waUpdateState(elapsedMs, dtMs) {
    if (!waFlock) { waReset(elapsedMs); return; }
    // 本数が変わったら席番号が合わなくなる（同じ席に二本が座ってしまう）。
    // そのまま続けると、二本が同じ狙いの位置へ行こうとしてぶつかるので、
    // いったんカオスからやり直す
    const nNow = layers[0] ? layers[0].boids.length : 0;
    if (waFlock.n !== nNow) {
        const mem = waFlock.memory;
        const cycles = waFlock.cycles;
        waReset(elapsedMs);
        waFlock.memory = mem;
        waFlock.cycles = cycles;
        return;
    }
    // 天板の出し入れでバーの長さが変わると（200mm ⇔ 532mm）、
    // いま組んでいる文様の倒し方はもう入らない。目標はすぐ小さくなるが、
    // 実際の傾きは角速度で追うので、詰め直すあいだ先端どうしが重なって見える。
    // ここで一度だけ、いまの車間で入る角度まで直に詰めておく
    const lenNow = getNormalLineLength();
    if (!Number.isFinite(waFlock.barLen)) waFlock.barLen = lenNow;
    if (lenNow > waFlock.barLen * 1.05 && lenNow > 0) {
        const L2 = perimeterLength;
        for (const layer of layers) {
            const bs = layer.boids.slice().sort((a, b) => a.arcFraction - b.arcFraction);
            const nn = bs.length;
            for (let i = 0; i < nn; i++) {
                let gp = (bs[i].arcFraction - bs[(i - 1 + nn) % nn].arcFraction) * L2;
                if (gp < 0) gp += L2;
                let gn = (bs[(i + 1) % nn].arcFraction - bs[i].arcFraction) * L2;
                if (gn < 0) gn += L2;
                const lim = Math.asin(clamp(
                    (Math.min(gp, gn) * BAR_TIP_GAP_SAFETY) / lenNow, 0, 1));
                bs[i].tilt = clamp(bs[i].tilt, -lim, lim);
                bs[i].tiltVel = 0;
            }
        }
    }
    waFlock.barLen = lenNow;

    const phaseMs = elapsedMs - waFlock.phaseStart;

    if (waFlock.phase === 'chaos') {
        waFlock.temp = 1;
        // 直前の文様がほどけていく度合い。
        // 0 なら文様のまま、1 で完全に自由
        // ほどけ切る前に広げはじめると、前の文様と新しい組が取り合いになる。
        // カオスの半分を超えないところで打ち切っておく
        // 0秒も選べるようにしてある（1フレームだけ下限を置く）
        const meltMs = Math.max(16, Math.min(waMeltSec, waChaosSec * 0.5) * 1000);
        const mp = clamp(phaseMs / meltMs, 0, 1);
        waFlock.melt = Math.max(waFlock.melt, mp * mp * (3 - 2 * mp));
        const cp = clamp(phaseMs / Math.max(1000, waChaosSec * 1000), 0, 1);
        const gp = clamp((cp - 0.35) / 0.45, 0, 1);
        waFlock.grip = gp * gp * (3 - 2 * gp);
        // 前の文様がほどけ切るまでは、探さない。
        // まだ立っている文様をそのまま拾ってしまい、何周まわしても
        // 同じ柄が選ばれ続けていた（5周のうち4周が同じ柄になった）
        if (waFlock.melt >= 0.999 && elapsedMs - waFlock.lastObserve > 320) {
            waFlock.lastObserve = elapsedMs;
            waObserve(elapsedMs);
            let spread = 0;
            if (waFlock.adopt) {
                for (let i = 0; i < waFlock.adopt.length; i++) spread += waFlock.adopt[i];
                spread /= Math.max(1, waFlock.adopt.length);
            }
            waFlock.lastVerdict = (waFlock.melt < 0.999 && waFlock.prevMotif
                ? `前の文様がほどけています（${((waFlock.melt || 0) * 100).toFixed(0)}%）\n`
                : '')
                + `見つけた組：${waPoolLine() || '（まだ）'}`
                + `\n${waFlock.grip < 0.01 ? 'まだ見ているだけ' : `広がり ${(spread * (waFlock.grip || 0) * 100).toFixed(0)}%`}`
                + `　覚えている組 ${waFlock.pool.length}種`;
            waUpdateStatusLabel();
        }
        if (phaseMs > Math.max(1000, waChaosSec * 1000)) {
            let m = waFlock.champ ? waFlock.champ.motif : null;
            let note;
            if (m) {
                note = `カオスから育った柄：${waGlyphs(m)}`
                    + `（${waFlock.champ.hits}回見かけた組）`;
            } else {
                // 何も拾えなかったときの予備。柄として読める形になるまで引き直す
                const ks = waUnitLengths(layers[0] ? layers[0].boids.length : 18);
                for (let t = 0; t < 40 && !m; t++) {
                    const c = waRandomMotif(ks[Math.floor(Math.random() * ks.length)]);
                    if (waUsable(c)) m = c;
                }
                if (!m) {
                    m = { period: 2, gaps: Int8Array.from([0, 2]), leans: Int8Array.from([2, -2]) };
                }
                note = 'くり返しは見つからなかったので、でたらめな柄から';
            }
            waFlock.candidate = m;
            waFlock.phaseOffset = (waFlock.champ && waFlock.champOff !== null)
                ? waFlock.champOff : Math.floor(Math.random() * m.period);
            waFlock.phase = 'build';
            waFlock.phaseStart = elapsedMs;
            waFlock.temp = 1;
            const nBar = layers[0] ? layers[0].boids.length : 18;
            // 「別の柄を重ねる」なら、上のレイヤーの柄をここで決める。
            // カオスで覚えた組のうち、下の柄と違うものを選ぶ（なければ引く）
            const rel = waFlock.rel;
            if (rel && waIsWoven(m, nBar, rel)) { rel.counter = false; rel.m2 = null; }
            if (rel && rel.counter) {
                let m2 = null;
                for (const e of waFlock.pool) {
                    if (e.motif === m) continue;
                    if (e.motif.period === m.period && waMotifSimRot(e.motif, m) >= WA_SAME) continue;
                    if (waUsable(e.motif)) { m2 = e.motif; break; }
                }
                const ks = waUnitLengths(nBar);
                for (let t = 0; t < 40 && !m2; t++) {
                    const c = waRandomMotif(ks[Math.floor(Math.random() * ks.length)]);
                    if (waUsable(c) && !(c.period === m.period && waMotifSimRot(c, m) >= WA_SAME)) m2 = c;
                }
                rel.m2 = m2;
                rel.off2 = m2 ? Math.floor(Math.random() * m2.period) : 0;
                if (!m2) rel.counter = false;
            }
            waRefitShift(perimeterLength);
            const woven = waIsWoven(m, nBar, rel);
            waFlock.lastVerdict = `${note}\n単位${m.period}本　1辺に${waRepsPerSide(m, nBar, rel)}`
                + `\n上下：${woven ? '編み込み' : (rel ? rel.name : '-')}`
                + (rel && rel.counter && rel.m2 ? `（上は ${waGlyphs(rel.m2)}）` : '')

                + '　いま4辺へ配っています…';
            waUpdateStatusLabel();
        }
    } else if (waFlock.phase === 'build') {
        const p = clamp(phaseMs / Math.max(300, waBuildSec * 1000), 0, 1);
        waFlock.temp = 1 - p * p * (3 - 2 * p);
        if (p >= 1) { waFlock.phase = 'hold'; waFlock.phaseStart = elapsedMs; waFlock.temp = 0; }
    } else {
        waFlock.temp = 0;
        // 0秒なら、組み上がった瞬間からほどけはじめる
        if (phaseMs >= Math.max(0, waHoldSec * 1000)) {
            const r = waEvaluate();
            const m = waFlock.candidate;
            waFlock.cycles++;
            // 出した文様だけは覚えておく（次のカオスで、同じ柄へ寄らないように）
            if (m) {
                waFlock.memory.push(waDescribe(m));
                while (waFlock.memory.length > 12) waFlock.memory.shift();
            }
            const mem = waFlock.memory;
            const cycles = waFlock.cycles;
            // 覚えた組は全部捨てて、またカオスから。
            // ただし文様そのものは引き継ぐ。ここで捨ててしまうと、
            // 止まっていたバーが次の瞬間に全速で散り、切り替わりが乱暴に見えた
            waReset(elapsedMs, true);
            waFlock.memory = mem;
            waFlock.cycles = cycles;
            const relDone = waFlock.prevRel;
            const nDone = layers[0] ? layers[0].boids.length : 18;
            waFlock.lastVerdict = `${waGlyphs(m)}　単位${m ? m.period : 0}本`
                + `　1辺に${m ? waRepsPerSide(m, nDone, relDone) : '-'}`
                + `　上下：${m && waIsWoven(m, nDone, relDone) ? '編み込み' : (relDone ? relDone.name : '-')}`
                + `　組めた度 ${(r.feasible * 100).toFixed(0)}%`
                + `　起伏 ${(r.contrast * 100).toFixed(0)}%`
                + `\n──ほどいて、またカオスから（${cycles}回目まで）`;
            waUpdateStatusLabel();
        }
    }
    waApplyMotif(elapsedMs);
}

// この5つを、速さ・向き・傾きの三つの窓口へまとめてつなぐ
function modeChainDrive(boid, elapsedMs) {
    if (motionMode === 22) return trfDrive(boid);
    if (motionMode === 23) return ffDrive(boid);
    if (motionMode === 24) return psDrive(boid);
    if (motionMode === 25) return nrDrive(boid);
    if (motionMode === 21) return gesDrive(boid);
    if (motionMode === 16) return evenDrive(boid, 0.3);
    if (motionMode === 17) return todaDrive(boid);
    if (motionMode === 18) return evenDrive(boid, 0.3);
    if (motionMode === 19) return avaDrive(boid);
    if (motionMode === 20) return cpgDrive(boid);
    return 0;
}

function modeChainLean(boid) {
    if (motionMode === 22) return clamp(boid.trfLean || 0, -1, 1);
    if (motionMode === 23) return clamp(boid.ffLean || 0, -1, 1);
    if (motionMode === 24) return clamp(boid.psLean || 0, -1, 1);
    if (motionMode === 25) return clamp(boid.nrLean || 0, -1, 1);
    if (motionMode === 21) return clamp(boid.gesLean || 0, -1, 1);
    if (motionMode === 16) return clamp(boid.chiLean || 0, -1, 1);
    if (motionMode === 17) return clamp(boid.todaLean || 0, -1, 1);
    if (motionMode === 18) return clamp(boid.frsLean || 0, -1, 1);
    if (motionMode === 19) return clamp(boid.avaLean || 0, -1, 1);
    if (motionMode === 20) return clamp(boid.cpgLean || 0, -1, 1);
    return 0;
}

function modeChainTiltDeg() {
    if (motionMode === 22) return trfTiltDeg;
    if (motionMode === 23) return ffTiltDeg;
    if (motionMode === 24) return psTiltDeg;
    // 数字の形そのものを倒し方として渡しているので、振れ幅はかけない
    if (motionMode === 25) return 90;
    if (motionMode === 21) {
        // 演じている所作で実際に出せる角度まで。
        // 車間がいちばん詰まる瞬間に先端がぶつからない範囲を、
        // 所作そのものから逆算してある
        const a = gesFlock && gesFlock.ampLean > 0 ? gesFlock.ampLean
            : Math.sin((gesTiltDeg * Math.PI) / 180);
        return (Math.asin(clamp(a, 0, 1)) * 180) / Math.PI;
    }
    if (motionMode === 16) return chiTiltDeg;
    if (motionMode === 17) return todaTiltDeg;
    if (motionMode === 18) return frsTiltDeg;
    if (motionMode === 19) return avaTiltDeg;
    if (motionMode === 20) return cpgTiltDeg;
    return 0;
}

// ============ MODE16〜20 共通の下ごしらえ ============
// この5つはどれも「閉じた1次元の鎖」を土台にしている。
// レールが輪になっていること、バーが追い越せないこと、車間の合計が
// 一周ぶんで決まっていること——ふだんは制約でしかないものを、
// ここでは現象を起こす仕掛けそのものとして使う。

// 弧の順に並べた席（レイヤー内）
function ringOf(layer) {
    return layer.boids.slice().sort((a, b) => a.arcFraction - b.arcFraction);
}

// 上下をまとめて弧の順に並べた席（一周36本ぶんの鎖として扱いたいとき）
function ringAll() {
    return layers.flatMap((l) => l.boids).slice()
        .sort((a, b) => a.arcFraction - b.arcFraction);
}

// 車間をそろえる向きの、ごく弱い流れ。
// 位置そのものが主役でないモードで、団子にならないよう下敷きに使う
function evenDrive(boid, gain) {
    const cruise = Math.max(1e-6, maxSpeed * motionScale);
    const gp = boid.gapPrevPx || 0;
    const gn = boid.gapNextPx || 0;
    if (gp <= 0 || gn <= 0) return 0;
    let v = 0;
    // どちらかが詰まりすぎているときは、必ず空いているほうへ逃げる。
    // 差を均すだけだと、前後とも詰まった状態でつり合ってしまい、
    // そこから動けなくなる（本数を増やした直後に、実際に車間が
    // 11mmまで潰れたまま止まった）
    const safe = minDistance * 1.8;
    if (gp < safe || gn < safe) {
        const floor = minDistance * 0.5;
        const push = Math.min(3, safe / Math.max(floor, gp))
            - Math.min(3, safe / Math.max(floor, gn));
        v += clamp(push, -3, 3) * cruise * 0.5;
    }
    const e = (gn - gp) / Math.max(1, minDistance * 6);
    if (Math.abs(e) >= 0.04) v += clamp(e, -1, 1) * cruise * gain;
    return v;
}

// 位置の目標へ向かう速さ（符号つき）。輪の近いほうまわりで測る
function towardArc(boid, targetPx, gain) {
    const L = perimeterLength;
    const cruise = Math.max(1e-6, maxSpeed * motionScale);
    let d = targetPx - boid.arcFraction * L;
    d -= Math.round(d / L) * L;
    const dead = minDistance * 0.12;
    if (Math.abs(d) < dead) return 0;
    const e = (Math.abs(d) - dead) * Math.sign(d);
    return clamp(e / (minDistance * 3.2), -1.8, 1.8) * cruise * gain;
}

// ============ MODE16：キメラ（そろう／そろわないが同居する） ============
// リング状に並べた振動子を「近くの何本かとだけ、少し位相をずらして」
// 結合させると、一部がぴったりそろい、残りはばらばらのまま、
// その状態が壊れずに共存することがある。2002年に見つかった現象で、
// 全部そろうか全部ばらけるかの二択しかないと思われていたところへ、
// 「同じ規則に従う同じ振動子の集団が、勝手に二つの相へ分かれる」
// という第三の答えが出てきた。
//
// この装置は上下あわせて36本が輪に並んでいて、傾きで揺れる。
// つまりリング状の振動子列そのもの。土台をそのまま使える。
//
// 効くのは三つ。
//   ・結合が「近所だけ」であること（全員と結ぶと必ず全部そろってしまう）
//   ・位相のずれ α が 90° より少し手前であること（ここが要）
//   ・初期条件（一様な乱数からは出にくいので、片側だけ乱した種を置く）
const CHI_TWO_PI = Math.PI * 2;
let chiK = 1.0;          // 結合の強さ
let chiRange = 0.30;     // 結合の届く範囲（一周に対する割合）
let chiLagDeg = 82;      // 位相のずれ α（度）。90°の少し手前がキメラの窓
let chiRate = 1.0;       // 揺れの速さ
let chiTiltDeg = 26;     // 倒し方の振れ幅
let chiFlock = null;

function chiReset(nowMs) {
    const all = ringAll();
    const n = all.length;
    for (let i = 0; i < n; i++) {
        // 定番の初期条件。一周の一部だけを強く乱し、残りはほぼそろえておく。
        // 一様な乱数から始めると、たいてい全部そろってしまって何も起きない
        let u = i / n - 0.5;
        const bump = Math.exp(-26 * u * u);
        all[i].chiPhase = 6 * bump * (Math.random() - 0.5);
        all[i].chiLean = 0;
    }
    chiFlock = { coh: 0, span: 0, note: '…', syncSince: 0, poke: null };
}

function chiUpdateState(elapsedMs, dtMs) {
    if (!chiFlock) { chiReset(elapsedMs); return; }
    const all = ringAll();
    const n = all.length;
    if (n < 6) return;
    const R = clamp(Math.round(n * clamp(chiRange, 0.05, 0.5)), 1, Math.floor(n / 2) - 1);
    const lag = (chiLagDeg * Math.PI) / 180;
    const dt = Math.min(50, dtMs) / 1000;
    const ph = new Float64Array(n);
    for (let i = 0; i < n; i++) ph[i] = Number.isFinite(all[i].chiPhase) ? all[i].chiPhase : 0;
    const nx = new Float64Array(n);
    for (let i = 0; i < n; i++) {
        let s = 0;
        for (let d = -R; d <= R; d++) {
            if (d === 0) continue;
            s += Math.sin(ph[i] - ph[(i + d + n) % n] + lag);
        }
        nx[i] = ph[i] + dt * (chiRate * 2.4 - (chiK * 2.4 / (2 * R)) * s);
    }
    // そろい具合を席ごとに測る（近所だけの秩序変数）。
    // これが高い区間と低い区間が同時にあれば、それがキメラ
    const W = Math.max(2, Math.round(n / 8));
    let hi = 0;
    let lo = 0;
    for (let i = 0; i < n; i++) {
        all[i].chiPhase = nx[i];
        all[i].chiLean = Math.sin(nx[i]);
        let sx = 0;
        let sy = 0;
        for (let d = -W; d <= W; d++) {
            const p = nx[(i + d + n) % n];
            sx += Math.cos(p); sy += Math.sin(p);
        }
        const r = Math.sqrt(sx * sx + sy * sy) / (2 * W + 1);
        all[i].chiCoh = r;
        if (r > 0.85) hi++;
        else if (r < 0.6) lo++;
    }
    chiFlock.coh = hi / n;
    chiFlock.span = lo / n;
    // 輪が小さいと、キメラはいつかは全部そろってしまう（本数が多いほど長持ちする）。
    // 一度そろうと二度と崩れないので、そのままでは展示として成立しない。
    // 全部そろった状態がしばらく続いたら、一部をつついて崩す。
    // いきなり乱数を入れ直すと角度が飛ぶので、1秒かけてじわりと差し込む
    if (hi > n * 0.96) {
        if (!chiFlock.syncSince) chiFlock.syncSince = elapsedMs;
    } else {
        chiFlock.syncSince = 0;
    }
    if (!chiFlock.poke && chiFlock.syncSince && elapsedMs - chiFlock.syncSince > 2200) {
        const w = Math.max(2, Math.round(n / 5));
        const c = Math.floor(Math.random() * n);
        const kick = [];
        for (let d = -w; d <= w; d++) {
            kick.push({ i: (c + d + n) % n, amt: (Math.random() * 2 - 1) * 3.2
                * Math.exp(-2.2 * (d / w) * (d / w)) });
        }
        chiFlock.poke = { kick, t0: elapsedMs, dur: 1100 };
        chiFlock.syncSince = 0;
    }
    if (chiFlock.poke) {
        const pk = chiFlock.poke;
        const step = Math.min(1, dt / (pk.dur / 1000));
        for (const k of pk.kick) all[k.i].chiPhase += k.amt * step;
        if (elapsedMs - pk.t0 > pk.dur) chiFlock.poke = null;
    }
    chiFlock.note = `そろっている ${((hi / n) * 100).toFixed(0)}%`
        + `　ばらばら ${((lo / n) * 100).toFixed(0)}%`
        + (hi > n * 0.15 && lo > n * 0.15 ? '　←同居しています'
            : (chiFlock.poke ? '　←そろいきったので、つつき直しています' : ''));
    const el = document.getElementById('chiStatusValue');
    if (el) el.textContent = chiFlock.note;
}

// ============ MODE17：ソリトン（すり抜けても消えない波） ============
// 戸田格子。1次元に並んだ粒が、縮むほど強く押し返す指数的なばねで
// 結ばれている鎖で、厳密に解ける数少ない模型のひとつ。
// ここには「ソリトン」——形を保ったまま進み、ぶつかっても壊れず、
// すれ違ったあとに何事もなかったように元の形で出てくる波——がある。
//
// MODE9（ニュートンのゆりかご）とは別物で、あちらは離散的な衝突。
// こちらは滑らかな密集の帯が輪を回り続け、別の帯とすれ違って生き延びる。
//
// バーそのものを鎖として動かすと、装置側のブレーキや最小車間に阻まれて
// 波が保たない。そこで理想の鎖を内側で回し、バーはその席を追いかける形にする。
// 追いつけないぶんは「装置には出せなかった量」として素直に出る。
let todaSeeds = 2;       // 押し込む場所の数（1か所につき左右2本の波が出る）
let todaAmp = 0.45;      // 押し込みの深さ
let todaRate = 1.0;      // 進む速さ
let todaTiltDeg = 30;    // 倒し方の振れ幅
let todaState = null;

function todaReset(nowMs) {
    const L = perimeterLength;
    todaState = layers.map((layer, li) => {
        const bs = ringOf(layer);
        const n = bs.length;
        if (n < 4) return null;
        const r0 = L / n;
        const x = new Float64Array(n);
        const v = new Float64Array(n);
        const r = new Float64Array(n);
        // すき間の並びを作る。何か所かを sech² の形にへこませる
        const kk = 1.1;
        let sum = 0;
        for (let i = 0; i < n; i++) {
            let dip = 0;
            for (let s = 0; s < Math.max(1, todaSeeds); s++) {
                const c = ((s + 0.5) / Math.max(1, todaSeeds)) * n + li * 0.5;
                let d = i - c;
                if (d > n / 2) d -= n;
                if (d < -n / 2) d += n;
                const sh = 1 / Math.cosh(kk * d);
                dip += sh * sh;
            }
            r[i] = r0 * (1 - clamp(todaAmp, 0, 0.8) * clamp(dip, 0, 1.2));
            sum += r[i];
        }
        // すき間の合計は一周ぶんちょうどでなければならない
        const norm = L / sum;
        for (let i = 0; i < n; i++) r[i] *= norm;
        let acc = bs[0].arcFraction * L;
        for (let i = 0; i < n; i++) { x[i] = acc; acc += r[i]; bs[i].todaSite = i; }
        return { x, v, n, r0, base: bs[0].arcFraction * L };
    });
}

function todaUpdateState(elapsedMs, dtMs) {
    if (!todaState || todaState.length !== layers.length || todaState.some((s, i) => s
        && s.n !== layers[i].boids.length)) {
        todaReset(elapsedMs);
        return;
    }
    const L = perimeterLength;
    // 刻みを細かく取る。粗いままだと指数のばねが一気に効いて数値が発散し、
    // 速さが実測で6桁まで飛んだ（そのぶんは最小車間の番人が吸収していたが、
    // 波はとっくに壊れていた）
    const sub = 10;
    const dt = (Math.min(40, dtMs) / 1000) * clamp(todaRate, 0.1, 3) / sub;
    for (const st of todaState) {
        if (!st) continue;
        const { x, v, n, r0 } = st;
        const f = new Float64Array(n);
        for (let s = 0; s < sub; s++) {
            for (let i = 0; i < n; i++) {
                let r = x[(i + 1) % n] - x[i];
                if (i === n - 1) r += L;
                // 縮むほど強く押し返す。ここが指数なのが戸田格子の要で、
                // このおかげで波が形を保ち、すれ違っても壊れない
                f[i] = Math.exp(-2.0 * ((r - r0) / r0)) - 1;
            }
            // 速さには蓋をしておく。1秒に3席ぶんより速い波は、
            // どのみちバーが追いかけられないし、数値も荒れる
            const vcap = r0 * 3;
            for (let i = 0; i < n; i++) {
                v[i] += dt * (f[i] - f[(i - 1 + n) % n]) * 14 * r0;
                v[i] = clamp(v[i] * 0.9998, -vcap, vcap);
            }
            for (let i = 0; i < n; i++) {
                x[i] += dt * v[i];
                if (!Number.isFinite(x[i]) || !Number.isFinite(v[i])) { x[i] = i * r0; v[i] = 0; }
            }
        }
        // 席の順番が入れ替わらないよう、最小のすき間だけは守らせる
        for (let pass = 0; pass < 2; pass++) {
            for (let i = 0; i < n; i++) {
                let r = x[(i + 1) % n] - x[i];
                if (i === n - 1) r += L;
                const need = minDistance * 1.25;
                if (r < need) {
                    const push = (need - r) * 0.5;
                    x[i] -= push;
                    x[(i + 1) % n] += push;
                    v[i] *= 0.5; v[(i + 1) % n] *= 0.5;
                }
            }
        }
    }
    // バーへ配る
    let vmax = 1e-6;
    for (const st of todaState) {
        if (!st) continue;
        for (let i = 0; i < st.n; i++) vmax = Math.max(vmax, Math.abs(st.v[i]));
    }
    for (let li = 0; li < layers.length; li++) {
        const st = todaState[li];
        if (!st) continue;
        const bs = ringOf(layers[li]);
        for (let i = 0; i < bs.length; i++) {
            const b = bs[i];
            const site = Number.isFinite(b.todaSite) ? clamp(b.todaSite, 0, st.n - 1) : i;
            b.todaTarget = ((st.x[site] % L) + L) % L;
            b.todaLean = clamp(st.v[site] / vmax, -1, 1);
        }
    }
    const el = document.getElementById('todaStatusValue');
    if (el) {
        el.textContent = `波の速さ ${(vmax / (perimeterLength / 18)).toFixed(2)} 席/秒`
            + `　押し込み ${Math.max(1, todaSeeds)}か所（左右へ ${Math.max(1, todaSeeds) * 2}本の波）`;
    }
}

function todaDrive(boid) {
    if (!Number.isFinite(boid.todaTarget)) return 0;
    return towardArc(boid, boid.todaTarget, 1.35);
}

// ============ MODE18：フラストレーション（決して満たされない） ============
// 隣どうしが「決まった角度ぶんずれていたい」とする。
// ずれ Δ を一周ぶん足し合わせると n·Δ になるが、輪は閉じているので
// これが一回転の整数倍でないと辻褄が合わない。
// 合わないぶんはどこかに押しつけられ、必ず「破れ目」がひとつ残る。
// 消せないので、彷徨うだけ。
//
// これは幾何学的フラストレーションと呼ばれる状況で、
// 乱数を使わずに「永遠に落ち着かない」を作れるのが面白いところ。
// ねじれのスライダーを整数比に合わせると破れ目は消え、
// 少しずらすと戻ってくる。
let frsTwist = 0.20;     // ねじれ Δ（1本あたり何回転ぶんか）
let frsK = 1.0;          // そろえようとする強さ
let frsNoise = 0.10;     // ゆらぎ（破れ目が動く素）
let frsTiltDeg = 26;
let frsFlock = null;

function frsReset(nowMs) {
    for (const layer of layers) {
        const bs = ringOf(layer);
        for (let i = 0; i < bs.length; i++) {
            bs[i].frsPhase = Math.random() * CHI_TWO_PI;
            bs[i].frsLean = 0;
            bs[i].frsDefect = 0;
        }
    }
    frsFlock = { mismatch: 0, at: -1, note: '…' };
}

function frsUpdateState(elapsedMs, dtMs) {
    if (!frsFlock) { frsReset(elapsedMs); return; }
    const dt = Math.min(50, dtMs) / 1000;
    const D = frsTwist * CHI_TWO_PI;
    let worst = 0;
    let worstAt = -1;
    let worstLayer = 0;
    for (let li = 0; li < layers.length; li++) {
        const bs = ringOf(layers[li]);
        const n = bs.length;
        if (n < 4) continue;
        const ph = new Float64Array(n);
        for (let i = 0; i < n; i++) {
            ph[i] = Number.isFinite(bs[i].frsPhase) ? bs[i].frsPhase : 0;
        }
        const nx = new Float64Array(n);
        for (let i = 0; i < n; i++) {
            // 前の隣とは Δ ぶん進んでいたい、後ろの隣とは Δ ぶん遅れていたい
            const back = Math.sin(ph[(i - 1 + n) % n] + D - ph[i]);
            const fwd = Math.sin(ph[(i + 1) % n] - D - ph[i]);
            nx[i] = ph[i] + dt * (frsK * 3.0 * (back + fwd)
                + frsNoise * 3.0 * (Math.random() * 2 - 1));
        }
        for (let i = 0; i < n; i++) {
            bs[i].frsPhase = nx[i];
            bs[i].frsLean = Math.sin(nx[i]);
        }
        // 破れ目を探す。望みのずれ Δ からいちばん外れている継ぎ目
        for (let i = 0; i < n; i++) {
            let d = nx[(i + 1) % n] - nx[i] - D;
            d -= Math.round(d / CHI_TWO_PI) * CHI_TWO_PI;
            const m = Math.abs(d);
            bs[i].frsDefect = clamp(m / Math.PI, 0, 1);
            if (m > worst) { worst = m; worstAt = i; worstLayer = li; }
        }
    }
    frsFlock.mismatch = worst;
    frsFlock.at = worstAt;
    // 一周ぶんのねじれが一回転の整数倍なら、辻褄が合って破れ目は消える
    const n0 = layers[0] ? layers[0].boids.length : 18;
    const turns = frsTwist * n0;
    const off = Math.abs(turns - Math.round(turns));
    frsFlock.note = `一周のねじれ ${turns.toFixed(2)}回転`
        + `（整数からのずれ ${off.toFixed(2)}）`
        + `\n破れ目 ${(worst * 180 / Math.PI).toFixed(0)}°`
        + (off < 0.06 ? '　辻褄が合っています（破れ目なし）'
            : `　${worstLayer === 0 ? '下' : '上'}の ${worstAt + 1} 本目あたり`);
    const el = document.getElementById('frsStatusValue');
    if (el) el.textContent = frsFlock.note;
}

// ============ MODE19：雪崩（自己組織化臨界） ============
// バーは前へ進みたがっているが、摩擦で止まっている。
// 待たされるほど歪みが溜まり、限界を超えると一本だけがすべる。
// すべった衝撃は両隣へ渡るので、隣もつられて限界を超えることがある。
// ほとんどは一本で収まるが、ごくまれに一周を駆け抜ける。
//
// 地震の模型（Olami-Feder-Christensen）と同じ作り。
// 受け渡す割合を1/2より小さくしてある——つまり衝撃は渡すたびに目減りする——
// のが要で、これがあると雪崩の大きさが特定の値に集まらず、
// 小さいものから大きいものまで連続的に出る。平均という概念が働かない。
let avaRate = 1.0;       // 歪みが溜まる速さ
let avaAlpha = 0.42;     // 隣へ渡る割合（0.5未満で目減りする）
let avaStep = 0.30;      // 一度すべるときに進む量（minDistance比）
let avaTiltDeg = 28;
let avaState = null;

function avaReset(nowMs) {
    const L = perimeterLength;
    avaState = layers.map((layer) => {
        const bs = ringOf(layer);
        const n = bs.length;
        if (n < 4) return null;
        const z = new Float64Array(n);
        const shift = new Float64Array(n);
        for (let i = 0; i < n; i++) {
            z[i] = Math.random() * 0.85;          // ばらばらの歪みから始める
            bs[i].avaSite = i;
            bs[i].avaSlip = 0;
            bs[i].avaTarget = bs[i].arcFraction * L;
        }
        return { z, shift, n, base: bs.map((b) => b.arcFraction * L), last: 0, biggest: 0, count: 0 };
    });
}

function avaUpdateState(elapsedMs, dtMs) {
    if (!avaState || avaState.length !== layers.length
        || avaState.some((s, i) => s && s.n !== layers[i].boids.length)) {
        avaReset(elapsedMs);
        return;
    }
    const L = perimeterLength;
    const dt = Math.min(50, dtMs) / 1000;
    const hop = minDistance * clamp(avaStep, 0.05, 1.2);
    for (let li = 0; li < layers.length; li++) {
        const st = avaState[li];
        if (!st) continue;
        const bs = ringOf(layers[li]);
        const n = st.n;
        const mean = L / n;
        // 溜まる。前が詰まっているバーほど早く溜まる
        for (let i = 0; i < n; i++) {
            const gn = bs[i].gapNextPx || mean;
            const squeeze = clamp((mean - gn) / mean, 0, 1);
            // 流し込みは素直に一定。詰まっているぶんだけ少し早める程度にする。
            // 詰まりに強く依存させていたときは、局所的にばかり崩れて
            // 大きな雪崩まで育たなかった（18本中せいぜい4本）
            st.z[i] += dt * 0.22 * clamp(avaRate, 0.1, 4) * (1 + 0.8 * squeeze);
        }
        // 崩れる。連鎖が続くかぎり繰り返す
        let moved = 0;
        for (let pass = 0; pass < 40; pass++) {
            let any = false;
            for (let i = 0; i < n; i++) {
                if (st.z[i] < 1) continue;
                st.z[i] = 0;
                st.shift[i] += hop;
                bs[i].avaSlip = 1;
                st.z[(i - 1 + n) % n] += avaAlpha;
                st.z[(i + 1) % n] += avaAlpha;
                moved++;
                any = true;
            }
            if (!any) break;
        }
        if (moved > 0) {
            st.last = moved;
            st.biggest = Math.max(st.biggest, moved);
            st.count++;
        }
        // 目標の位置を配る。全体の回転は自由にしたいので、
        // いまの並びといちばん近い回転位置へ寄せてから渡す
        let sx = 0;
        let sy = 0;
        const raw = new Float64Array(n);
        for (let i = 0; i < n; i++) {
            raw[i] = (i / n) * L + st.shift[i];
            const a = ((bs[i].arcFraction * L - raw[i]) / L) * CHI_TWO_PI;
            sx += Math.cos(a); sy += Math.sin(a);
        }
        const phi = (Math.atan2(sy, sx) / CHI_TWO_PI) * L;
        for (let i = 0; i < n; i++) {
            bs[i].avaTarget = ((raw[i] + phi) % L + L) % L;
            // すべった跡はしばらく残す。すぐ消すと、雪崩が走っても
            // 傾きの波として目に見えないまま終わってしまう
            bs[i].avaSlip = Math.max(0, (bs[i].avaSlip || 0) - dt * 1.1);
            bs[i].avaLean = clamp(bs[i].avaSlip, 0, 1);
        }
    }
    const el = document.getElementById('avaStatusValue');
    if (el && avaState[0]) {
        const a = avaState[0];
        el.textContent = `直前の雪崩 ${a.last}本　これまでの最大 ${a.biggest}本`
            + `　起きた回数 ${a.count}`;
    }
}

function avaDrive(boid) {
    if (!Number.isFinite(boid.avaTarget)) return 0;
    return towardArc(boid, boid.avaTarget, 1.1);
}

// ============ MODE20：拘束の伝播 ============
// この装置では、自分がどれだけ倒せるかが隣の倒れ方と車間で決まっている。
//
//     倒し方ᵢ － 倒し方ᵢ₊₁ ≦ 車間ᵢ ／ バー長
//
// だから一本が「思い切り倒したい」と言い出すと、隣は
// 「自分も倒れる」か「場所を空ける」かを迫られる。その隣もまた。
// 制約を解いていく計算そのものを、動きとして見せる。
//
// レールは閉じているので、要求が一周して自分自身と出会うことがある。
// そのとき辻褄が合わなければ、要求は解けずに消える。
let cpgAmp = 1.0;        // 要求の強さ
let cpgEverySec = 4;     // 要求が生まれる間隔
let cpgYield = 0.12;     // 「場所を空ける」で受け止める割合
let cpgWave = 3.0;       // 要求が伝わる速さ（1秒あたり何本ぶん）
let cpgTiltDeg = 30;
let cpgFlock = null;

function cpgReset(nowMs) {
    for (const layer of layers) {
        for (const b of layer.boids) { b.cpgReq = 0; b.cpgOpen = 0; }
    }
    cpgFlock = { reqs: [], nextAt: nowMs + 800, note: '…', reach: 0 };
}

function cpgUpdateState(elapsedMs, dtMs) {
    if (!cpgFlock) { cpgReset(elapsedMs); return; }
    const barLen = getNormalLineLength();
    const dt = Math.min(50, dtMs) / 1000;

    if (elapsedMs >= cpgFlock.nextAt) {
        cpgFlock.nextAt = elapsedMs
            + Math.max(700, cpgEverySec * 1000 * (0.6 + Math.random() * 0.8));
        const li = Math.floor(Math.random() * layers.length);
        const n = layers[li].boids.length;
        cpgFlock.reqs.push({
            li,
            origin: Math.floor(Math.random() * n),
            sign: Math.random() < 0.5 ? -1 : 1,
            born: elapsedMs,
        });
        if (cpgFlock.reqs.length > 3) cpgFlock.reqs.shift();
    }
    // 寿命の切れた要求は消える
    cpgFlock.reqs = cpgFlock.reqs.filter((r) => elapsedMs - r.born < 9000);

    let reach = 0;
    for (let li = 0; li < layers.length; li++) {
        const bs = ringOf(layers[li]);
        const n = bs.length;
        if (n < 3) continue;
        const req = new Float64Array(n);
        for (const r of cpgFlock.reqs) {
            if (r.li !== li) continue;
            // 生まれたては強く、時間とともに薄れる
            const age = (elapsedMs - r.born) / 9000;
            // 要求は瞬時には届かない。1秒に cpgWave 本ぶんずつ、先へ歩いていく。
            // ここを入れるまでは一周ぶんが同時に決まっていて、
            // 「伝わる」ようには見えなかった
            const front = ((elapsedMs - r.born) / 1000) * clamp(cpgWave, 0.2, 20);
            let q = clamp(cpgAmp, 0, 1.5) * clamp(1 - age * age, 0, 1);
            let k = 0;
            for (; k < n && k <= front && q > 0.02; k++) {
                const i = (r.origin + k) % n;
                // 先端はまだ半分しか届いていない
                const edge = clamp(front - k, 0, 1);
                const here = q * edge;
                if (Math.abs(here) > Math.abs(req[i])) req[i] = here * r.sign;
                // 隣は「倒れる」か「空ける」か。空けたぶんだけ要求は減る
                const gap = bs[i].gapNextPx || minDistance * 3;
                const room = (gap / Math.max(1, barLen)) * clamp(cpgYield, 0.02, 0.6);
                q -= room;
            }
            reach = Math.max(reach, k);
        }
        for (let i = 0; i < n; i++) {
            const b = bs[i];
            const target = req[i];
            // 要求は瞬時には伝わらない。1本ぶんずつ、じわりと届く
            b.cpgReq = lerp(Number.isFinite(b.cpgReq) ? b.cpgReq : 0, target,
                clamp(dt * 3.2, 0, 1));
            // 倒れるほど、前を空けたくなる
            b.cpgOpen = Math.abs(b.cpgReq);
            b.cpgLean = clamp(b.cpgReq, -1, 1);
        }
    }
    cpgFlock.reach = reach;
    cpgFlock.best = Math.max(cpgFlock.best || 0, reach);
    const el = document.getElementById('cpgStatusValue');
    if (el) {
        el.textContent = `いま動いている要求 ${cpgFlock.reqs.length}件`
            + `　いま届いている距離 ${reach}本`
            + `　これまでの最長 ${cpgFlock.best || 0}本`;
    }
}

function cpgDrive(boid) {
    const cruise = Math.max(1e-6, maxSpeed * motionScale);
    // 要求を受けているバーは前を空ける。同時に車間はそろえたい
    const open = boid.cpgOpen || 0;
    const gp = boid.gapPrevPx || 0;
    const gn = boid.gapNextPx || 0;
    let v = evenDrive(boid, 0.35);
    if (open > 0.02 && gp > minDistance * 1.6) v -= open * cruise * 0.9;
    if (gn < minDistance * 2.2) v -= cruise * 0.2;
    return v;
}

// ============ MODE21：偶然から広がる所作 ============
// MODE15（偶然から広がる文様）と同じ仕組みを、90度回したもの。
//
// あちらは「場所」どうしを見比べていた。一周を区画に切って、
// どの区画にもいちばん似ている区画を探す。
// こちらは「時刻」どうしを見比べる。探しているのはこれ。
//
//     7番のバーがいまやった動きは、3番が0.8秒前にやった動きと同じだ
//
// 見つかると、動きの単位（1〜2秒ぶんの速さと倒し方の波形）と、
// 隣へ渡るまでの時間差が、同時に手に入る。あとはそれを広げるだけで、
// 全バーが席順ぶんずつ遅れて同じ動きを演じる——進行波になる。
// 誰も振り付けていない所作が、毎回違う形で立ち上がる。
//
// カオスの動きは、正弦波の重ね合わせではなく雑音で作ってある。
// MODE14やMODE15と同じ波を使うと、それ自体がほぼ周期的なので、
// 「注入した波を再発見する」だけのインチキになってしまう。
// 一致の手がかりは、あくまでバーどうしの偶然だけにしてある。
const GES_DT = 100;        // 履歴を取る間隔(ms)
// 速さは1フレームあたりの量なので、サンプル1つぶん（GES_DT）で進む距離は
// その何フレームぶんかを掛けないといけない。ここを取り違えていたときは
// 所作の振れ幅が60分の1になり、演じても1秒に7mmしか動かなかった
const GES_FRAMES = GES_DT / (1000 / 60);
const GES_HIST = 80;       // 覚えておく長さ（8秒ぶん）
// バーの速さには上限がある（他のモードと同じ巡航速度）。
// 行って帰ってくる所作で稼げる距離は「速さ×時間」までなので、
// 1.2秒の所作では40mmしか動けない。見て分かる大きさにするには、
// 所作そのものを長めに取るしかない
const GES_WS = [16, 24, 32];       // 単位の長さ（1.6／2.4／3.2秒）
const GES_LAGS = [3, 5, 8, 11, 14, 18, 22];  // 隣へ渡るまでの時間差（サンプル）
const GES_DMAX = 3;        // 何本先まで見比べるか
const GES_SAME = 0.86;     // 「同じ所作だ」とみなす近さ

let gesChaosSec = 16;      // 自由に動く時間
let gesBuildSec = 2;       // 組み上がるまでの時間
let gesPlaySec = 10;       // 演じる時間
let gesMeltSec = 3;        // ほどける時間
let gesTravelPref = 0.7;   // 進行波の好み（0でユニゾンも可）
let gesNovelty = 0.6;      // 直前の所作と違うことをどれだけ重んじるか
let gesTiltDeg = 26;       // 倒し方の振れ幅
let gesFlock = null;

function gesRing() {
    return layers.flatMap((l) => l.boids).slice()
        .sort((a, b) => (a.gesSlot || 0) - (b.gesSlot || 0));
}

// t サンプル前の値（t=0 がいちばん新しい）
function gesAt(b, t) {
    const i = ((b.gesW - 1 - t) % GES_HIST + GES_HIST) % GES_HIST;
    return i;
}

function gesReset(nowMs) {
    const mem = gesFlock ? gesFlock.memory : [];
    const all = layers.flatMap((l) => l.boids).slice()
        .sort((a, b) => a.arcFraction - b.arcFraction);
    for (let i = 0; i < all.length; i++) {
        const b = all[i];
        b.gesSlot = i;
        b.gesHv = new Float32Array(GES_HIST);
        b.gesHl = new Float32Array(GES_HIST);
        b.gesW = 0;
        b.gesFill = 0;
        b.gesU = (Math.random() * 2 - 1) * 0.5;   // 速さの雑音
        b.gesUl = (Math.random() * 2 - 1) * 0.5;  // 倒し方の雑音
        b.gesLean = 0;
        b.gesTarget = NaN;
        b.gesVel = 0;
        b.gesAdopt = 0;
    }
    gesFlock = {
        n: all.length,
        pool: [],
        champ: null,
        memory: mem || [],
        phase: 'chaos',
        phaseStart: nowMs,
        lastSample: nowMs,
        lastScan: nowMs,
        tick: 0,
        grip: 0,
        melt: gesFlock && gesFlock.champ ? 0 : 1,
        prev: gesFlock ? gesFlock.champ : null,
        amp: 0,
        ampLean: 0,
        cycles: gesFlock ? gesFlock.cycles : 0,
        note: '自由に動いています。動きの一致が出るのを見ています…',
    };
    gesUpdateStatusLabel();
}

function gesUpdateStatusLabel() {
    const el = document.getElementById('gesStatusValue');
    if (el && gesFlock) el.textContent = gesFlock.note;
}

// ---- 履歴を取る ----
function gesRecord(elapsedMs) {
    const cruise = Math.max(1e-6, maxSpeed * motionScale);
    for (const layer of layers) {
        for (const b of layer.boids) {
            if (!b.gesHv) continue;
            const v = clamp((b.speed * b.direction) / cruise, -1.5, 1.5);
            const l = clamp(-Math.sin(b.tilt) * b.direction, -1, 1);
            b.gesHv[b.gesW] = v;
            b.gesHl[b.gesW] = l;
            b.gesW = (b.gesW + 1) % GES_HIST;
            b.gesFill = Math.min(GES_HIST, b.gesFill + 1);
        }
    }
}

// ---- 照合：バーどうしの偶然の一致を探す ----
function gesScan() {
    const all = gesRing();
    const n = all.length;
    if (n < 4) return;
    gesFlock.tick++;
    for (let d = 1; d <= Math.min(GES_DMAX, n - 1); d++) {
        for (let i = 0; i < n; i++) {
            const a = all[i];
            const b = all[(i + d) % n];
            if (a.gesFill < GES_HIST || b.gesFill < GES_HIST) continue;
            for (const lag of GES_LAGS) {
                for (const W of GES_WS) {
                    if (W + lag >= GES_HIST - 1) continue;
                    let sv = 0;
                    let sl = 0;
                    let amp = 0;
                    for (let k = 0; k < W; k++) {
                        const ta = W - 1 - k;
                        const ia = gesAt(a, ta);
                        const ib = gesAt(b, ta + lag);
                        sv += Math.abs(a.gesHv[ia] - b.gesHv[ib]);
                        sl += Math.abs(a.gesHl[ia] - b.gesHl[ib]);
                        amp += Math.abs(a.gesHv[ia]);
                    }
                    amp /= W;
                    // 止まっている同士が「一致」するのは当たり前なので外す
                    if (amp < 0.16) continue;
                    const sim = 1 - (sv / W) * 0.55 - (sl / W) * 0.45;
                    if (sim < 0.72) continue;
                    const g = { W, d, lag, v: new Float32Array(W), l: new Float32Array(W) };
                    let mean = 0;
                    for (let k = 0; k < W; k++) {
                        const ia = gesAt(a, W - 1 - k);
                        g.v[k] = a.gesHv[ia];
                        g.l[k] = a.gesHl[ia];
                        mean += g.v[k];
                    }
                    // 一周ぶんで行って帰ってくる所作にする。
                    // 平均を抜いておかないと、演じるたびに全体が流れていってしまう
                    mean /= W;
                    for (let k = 0; k < W; k++) g.v[k] -= mean;
                    if (!gesNormalize(g)) continue;
                    gesPoolAdd(g, sim);
                }
            }
        }
    }
}

// 覚えるのは「形と間合い」だけで、大きさは覚えない。
//
// カオスの最中のバーは、そもそも大きくは動いていない。録れたままの
// 大きさで演じると、見つけた所作がどれだけ良くても、1秒に8mmの
// 身じろぎにしかならなかった。大きさは装置の都合（車間とバーの長さ）で
// 決まるものなので、ここで形を単位の大きさへ直しておき、
// どれだけ大きく演じるかは gesFeas が車間から決める。
//
// 倒し方がほとんど入っていない所作まで引き伸ばすと雑音を拡大するだけなので、
// そこは伸ばさずに捨てる（形の中身がないものは、選ぶ段でも落ちる）
// 波形のとげを落とす（一周ぶんつながっているものとして均す）。
// とげは道すじにはほとんど効かないのに、速さの上限だけを食う。
// 均さずに演じたときは、上限に引っかかって40mmしか動けなかった
function gesSmooth(a, W, passes) {
    const t = new Float64Array(W);
    for (let q = 0; q < passes; q++) {
        for (let k = 0; k < W; k++) {
            const p0 = a[(k - 1 + W) % W];
            const p2 = a[(k + 1) % W];
            t[k] = (p0 + a[k] * 2 + p2) * 0.25;
        }
        for (let k = 0; k < W; k++) a[k] = t[k];
    }
}

function gesNormalize(g) {
    const W = g.W;
    gesSmooth(g.v, W, Math.max(2, Math.round(W / 8)));
    gesSmooth(g.l, W, Math.max(2, Math.round(W / 10)));
    let mv = 0;
    for (let k = 0; k < W; k++) mv += g.v[k];
    mv /= W;
    for (let k = 0; k < W; k++) g.v[k] -= mv;   // 均したぶんの流れを抜き直す
    let acc = 0;
    let lo = Infinity;
    let hi = -Infinity;
    for (let k = 0; k < W; k++) {
        acc += g.v[k];
        if (acc < lo) lo = acc;
        if (acc > hi) hi = acc;
    }
    const pp = hi - lo;
    if (!(pp > 0.02)) return false;   // 行って帰ってこない＝所作になっていない
    for (let k = 0; k < W; k++) g.v[k] /= pp;
    let lmax = 0;
    for (let k = 0; k < W; k++) lmax = Math.max(lmax, Math.abs(g.l[k]));
    const sl = lmax > 0.06 ? 1 / lmax : 0;
    for (let k = 0; k < W; k++) g.l[k] *= sl;
    g.lraw = lmax;
    return true;
}

// 所作どうしの近さ
function gesSim(x, y) {
    if (x.W !== y.W || x.d !== y.d) return 0;
    let s = 0;
    for (let k = 0; k < x.W; k++) {
        s += 1 - Math.abs(x.v[k] - y.v[k]) * 0.55 - Math.abs(x.l[k] - y.l[k]) * 0.45;
    }
    return s / x.W;
}

// この所作を、この装置でどれだけ大きく演じられるか。
// 全員が同じ波形を席番号ぶんずつ遅れて演じるので、隣との車間は
// 「波形の、時間差ぶんの差」で振れる。
//
// 効いてくる上限は3つある。
//   ・速さ　　いちばん速い瞬間でも巡航速度を超えられない
//   ・車間　　大きく動くほど、隣に寄る瞬間が深くなる
//   ・バー長　寄った瞬間に、先端どうしがぶつからない角度まで
// 位置と倒し方は同じ車間を取り合うので、配分をいくつか試して、
// 「動いて見える量」と「倒して見える角度」の合計がいちばん大きいものを選ぶ
function gesFeas(g, n) {
    const L = perimeterLength;
    const cruise = Math.max(1e-6, maxSpeed * motionScale);
    const barLen = getNormalLineLength();
    const W = g.W;
    const wantL = Math.sin((gesTiltDeg * Math.PI) / 180);
    const P = new Float64Array(W);
    let acc = 0;
    for (let k = 0; k < W; k++) { acc += g.v[k]; P[k] = acc; }
    // ぶつかる相手は「同じ段の隣」なので、席番号の刻みぶん先を見る。
    // 2段なら席は交互に並ぶので、隣は2つ先・時間差も2つぶん
    let most = 1;
    for (const layer of layers) most = Math.max(most, layer.boids.length);
    const stride = clamp(Math.round(n / most), 1, Math.max(1, n - 1));
    const step = g.lag / Math.max(1, g.d);
    const o = Math.round(step * stride);
    const dP = new Float64Array(W);
    const dL = new Float64Array(W);
    let swing = 0;
    for (let k = 0; k < W; k++) {
        const j = ((k - o) % W + W) % W;
        dP[k] = P[j] - P[k];
        dL[k] = Math.abs(g.l[j] - g.l[k]);
        swing = Math.max(swing, Math.abs(dP[k]));
    }
    const base = (L / Math.max(2, n)) * stride;    // 隣との車間
    const unit = cruise * GES_FRAMES;
    if (!(swing > 1e-6)) {
        return { amp: 0, ampLean: wantL, swing: 0, shown: 1, travelMm: 0 };
    }
    // 速さの上限。いちばん速い瞬間でも巡航速度を超えないところまで。
    // ここを見ていなかったときは、目標だけが先へ行ってしまい、
    // バーは20〜55mm遅れたまま追いかけるだけになっていた
    let vmax = 0;
    for (let k = 0; k < W; k++) vmax = Math.max(vmax, Math.abs(g.v[k]));
    const ampSpd = vmax > 1e-6 ? 0.92 / vmax : 1e3;
    // 移動の大きさと倒し方の大きさは、同じ車間を取り合う。
    // 大きく動けば隣に寄る瞬間が深くなり、そのぶん倒せなくなる。
    // どちらを取るかは所作ごとに違うので、配分をいくつか試して、
    // 「動いて見える量」と「倒して見える角度」の合計がいちばん大きい配分を選ぶ
    let best = null;
    const FRACS = [0.6, 0.48, 0.38, 0.28, 0.2, 0.13, 0.07];
    for (const frac of FRACS) {
        const amp = Math.min((base * frac) / (unit * swing), ampSpd);
        let capL = wantL;
        if (barLen > 0) {
            for (let k = 0; k < W; k++) {
                if (dL[k] < 1e-3) continue;
                const gap = base + amp * unit * dP[k];
                const room = Math.max(0, gap - minDistance * 1.25);
                capL = Math.min(capL, room / (barLen * dL[k]));
            }
        }
        const shown = wantL > 1e-6 ? clamp(capL / wantL, 0, 1) : 1;
        const travel = amp * unit * swing;
        const score = 0.45 * (travel / (base * FRACS[0])) + 0.55 * shown;
        if (!best || score > best.score) {
            best = {
                amp, ampLean: clamp(Math.min(wantL, capL), 0, 1),
                swing, shown, score, travelMm: travel / mmToPx,
            };
        }
    }
    return best;
}

// 所作の見分け。速さの並びではなく、通った道すじの形で見る。
// 大きさを揃えてあるので、ここで比べているのは形そのもの
function gesDescribe(g) {
    const d = new Float64Array(24);
    const W = g.W;
    const P = new Float64Array(W);
    let acc = 0;
    let mean = 0;
    for (let k = 0; k < W; k++) { acc += g.v[k]; P[k] = acc; mean += acc; }
    mean /= W;
    for (let i = 0; i < 12; i++) {
        const k = Math.floor((i / 12) * W);
        d[i] = clamp(P[k] - mean + 0.5, 0, 1);
        d[i + 12] = (g.l[k] + 1) / 2;
    }
    return d;
}

function gesNoveltyOf(desc, archive) {
    if (!archive || archive.length === 0) return 1;
    const ds = archive.map((a) => {
        let s = 0;
        for (let k = 0; k < a.length; k++) { const x = desc[k] - a[k]; s += x * x; }
        return Math.sqrt(s / a.length);
    });
    ds.sort((x, y) => x - y);
    const k = Math.min(3, ds.length);
    let sum = 0;
    for (let i = 0; i < k; i++) sum += ds[i];
    return sum / k;
}

function gesPoolAdd(g, agree) {
    const n = gesFlock.n;
    const f = gesFeas(g, n);
    if (!(f.amp > 0)) return null;     // 装置で演じられない所作
    const tick = gesFlock.tick;
    for (const e of gesFlock.pool) {
        if (gesSim(e.g, g) >= GES_SAME && Math.abs(e.g.lag - g.lag) <= 2) {
            if (e.seen !== tick) { e.seen = tick; e.hits += 1; }
            if (agree > e.agree) e.agree = agree;
            return e;
        }
    }
    const e = { g, hits: 1, agree, seen: tick, feas: f.amp, ampLean: f.ampLean,
        shown: f.shown, travelMm: f.travelMm };
    gesFlock.pool.push(e);
    if (gesFlock.pool.length > 10) {
        gesFlock.pool.sort((x, y) => gesPoolScore(y) - gesPoolScore(x));
        gesFlock.pool.length = 10;
    }
    return e;
}

function gesPoolScore(e) {
    const g = e.g;
    let lv = 0;
    for (let k = 0; k < g.W; k++) lv += Math.abs(g.l[k]);
    lv /= g.W;
    // 時間差が小さい＝全員が同じ瞬間に同じことをする（ユニゾン）。
    // MODE15でいう「全部同じ向きに倒れている柄」と同じ退屈さなので、
    // 進行波のほうを好むようにしてある
    const travel = clamp(g.lag / 8, 0, 1);
    const nov = gesNoveltyOf(gesDescribe(g), gesFlock.memory);
    // 大きさは揃えてあるので、ここで効くのは中身のほう。
    // 倒し方が入っているか、装置で狙いどおりの角度まで倒せるか、
    // どれだけ大きく動いて見えるか
    const lean = clamp(lv * 2.2, 0, 1);
    const shown = clamp(e.shown || 0, 0, 1);
    const move = clamp((e.travelMm || 0) / 70, 0.1, 1);
    return clamp(e.hits / 6, 0, 1)
        * (0.3 + 0.7 * lean)
        * (0.3 + 0.7 * shown)
        * (0.35 + 0.65 * move)
        * lerp(1, 0.25 + 0.75 * travel, clamp(gesTravelPref, 0, 1))
        * e.agree * (1 + gesNovelty * nov);
}

// ---- 広げる ----
function gesSpread(dt) {
    const all = gesRing();
    const n = all.length;
    const champ = gesFlock.champ;
    if (!champ) return;
    const g = champ.g;
    const step = g.lag / Math.max(1, g.d);
    const tau = gesFlock.tick * 1;
    // 覚えている所作は大きさを揃えてあるので、そのままでは履歴と桁が合わない。
    // 「この装置で演じたときの大きさ」に直してから見比べる
    const sc = gesFeas(g, n).amp;
    for (let i = 0; i < n; i++) {
        const b = all[i];
        // いまのこのバーの動きが、演じるべき所作にどれだけ近いか
        const o = Math.round(i * step);
        let s = 0;
        for (let k = 0; k < g.W; k++) {
            const ia = gesAt(b, g.W - 1 - k);
            const j = ((k - o - tau) % g.W + g.W) % g.W;
            s += 1 - clamp(Math.abs(b.gesHv[ia] - g.v[j] * sc) * 0.6, 0, 1);
        }
        const fit = clamp(s / g.W, 0, 1);
        const nb = 0.5 * ((all[(i - 1 + n) % n].gesAdopt || 0)
            + (all[(i + 1) % n].gesAdopt || 0));
        const tgt = clamp(Math.max(fit, nb * 0.92), 0, 1);
        b.gesAdopt = (b.gesAdopt || 0) + (tgt - (b.gesAdopt || 0)) * clamp(dt * 2.2, 0, 1);
    }
}

// ---- 演じる ----
// 位置そのものを目標にする。速さをそのまま渡すと、追いきれなかったぶんが
// 少しずつ溜まって全体が流れていってしまう
function gesApply(elapsedMs) {
    const L = perimeterLength;
    const champ = gesFlock.champ;
    const chaos = gesFlock.phase === 'chaos';
    const perform = gesFlock.perform || 0;
    const all = gesRing();
    const n = all.length;
    if (!champ || perform <= 0.001) {
        // カオスの最中。位置の目標は持たないが、倒し方は雑音のまま出す。
        // ここを空にしていたときは履歴に倒し方が入らず、
        // 見つかる所作が「傾きのない、ただの往復」ばかりになった
        for (const b of all) {
            b.gesTarget = NaN;
            b.gesVel = 0;
            b.gesLean = clamp(b.gesUl || 0, -1, 1);
        }
        return;
    }
    const g = champ.g;
    const cruise = Math.max(1e-6, maxSpeed * motionScale);
    const amp = gesFlock.amp * perform;
    const step = g.lag / Math.max(1, g.d);
    const P = new Float64Array(g.W);
    let acc = 0;
    for (let k = 0; k < g.W; k++) { acc += g.v[k]; P[k] = acc; }
    // いまの位相（連続値）。サンプル1つぶんが GES_DT ミリ秒
    const ph = ((elapsedMs - gesFlock.playFrom) / GES_DT) % g.W;
    const unit = cruise * GES_FRAMES;
    const raw = new Float64Array(n);
    let sx = 0;
    let sy = 0;
    for (let i = 0; i < n; i++) {
        const o = i * step;
        let x = ph - o;
        x = ((x % g.W) + g.W) % g.W;
        const k0 = Math.floor(x);
        const fr = x - k0;
        const p = lerp(P[k0 % g.W], P[(k0 + 1) % g.W], fr);
        raw[i] = (i / n) * L + amp * unit * p;
        const b = all[i];
        // いま目標がどちらへどれだけ動いているか。これを先に渡しておかないと、
        // ずれてから直すことになり、演じている間じゅう13mmほど遅れ続ける
        b.gesVel = amp * cruise * lerp(g.v[k0 % g.W], g.v[(k0 + 1) % g.W], fr);
        const w = 0.05 + (b.gesAdopt || 0);
        const a2 = ((b.arcFraction * L - raw[i]) / L) * Math.PI * 2;
        sx += Math.cos(a2) * w; sy += Math.sin(a2) * w;
        // 倒し方も同じ位相で
        const lv = lerp(g.l[k0 % g.W], g.l[(k0 + 1) % g.W], fr);
        b.gesLean = clamp(lv, -1, 1) * (b.gesAdopt || 0) * perform
            + b.gesUl * (1 - (b.gesAdopt || 0) * perform);
    }
    const phi = (Math.atan2(sy, sx) / (Math.PI * 2)) * L;
    for (let i = 0; i < n; i++) {
        all[i].gesTarget = ((raw[i] + phi) % L + L) % L;
    }
}

// ---- カオスの動き（雑音。周期を持たせない） ----
// カオスの雑音。1秒前後の相関時間を持たせてある。
// ここが速すぎると、バーは細かく震えるばかりで大きく移動しない。
// 所作は「速さの積み上げ」なので、同じ向きへしばらく押し続ける成分が
// ないと、見つかる所作の振れ幅が10mm程度にしかならなかった
function gesNoiseStep(dt) {
    const a = Math.exp(-dt / 1.7);
    const al = Math.exp(-dt / 2.2);
    const ka = Math.sqrt(Math.max(0, 1 - a * a)) * 1.5;
    const kl = Math.sqrt(Math.max(0, 1 - al * al)) * 1.3;
    for (const layer of layers) {
        for (const b of layer.boids) {
            b.gesU = clamp(b.gesU * a + (Math.random() * 2 - 1) * ka, -1.5, 1.5);
            b.gesUl = clamp(b.gesUl * al + (Math.random() * 2 - 1) * kl, -1.2, 1.2);
        }
    }
}

function gesDrive(boid) {
    const cruise = Math.max(1e-6, maxSpeed * motionScale);
    const perform = (gesFlock ? gesFlock.perform : 0) * (boid.gesAdopt || 0);
    let v = 0;
    if (perform > 0.01 && Number.isFinite(boid.gesTarget)) {
        v += ((boid.gesVel || 0) + towardArc(boid, boid.gesTarget, 1.5)) * perform;
    }
    if (perform < 0.99) {
        // 前後に余裕があるぶんだけ、雑音で動く。
        // 余裕を見ずに動かしていたときは、避け合う力より雑音が勝って
        // 車間が14mmまで潰れることがあった
        const gp = boid.gapPrevPx || minDistance * 3;
        const gn = boid.gapNextPx || minDistance * 3;
        const room = clamp(Math.min(gp, gn) / (minDistance * 2.6), 0, 1);
        v += (boid.gesU || 0) * cruise * 1.5 * room * (1 - perform);
        v += evenDrive(boid, 0.3) * (1 - perform);
    }
    return v;
}

function gesUpdateState(elapsedMs, dtMs) {
    if (!gesFlock || gesFlock.n !== layers.flatMap((l) => l.boids).length) {
        gesReset(elapsedMs);
        return;
    }
    const dt = Math.min(50, dtMs) / 1000;
    const phaseMs = elapsedMs - gesFlock.phaseStart;
    gesNoiseStep(dt);
    if (elapsedMs - gesFlock.lastSample >= GES_DT) {
        gesFlock.lastSample = elapsedMs;
        gesRecord(elapsedMs);
    }

    if (gesFlock.phase === 'chaos') {
        // 前の所作がほどけていく
        const mp = clamp(phaseMs / Math.max(300, Math.min(gesMeltSec, gesChaosSec * 0.5) * 1000), 0, 1);
        gesFlock.melt = Math.max(gesFlock.melt, mp * mp * (3 - 2 * mp));
        gesFlock.perform = gesFlock.prev ? (1 - gesFlock.melt) : 0;
        if (gesFlock.perform > 0.001) gesFlock.champ = gesFlock.prev;
        else gesFlock.prev = null;
        // ほどけ切っていても毎回通す。ここを飛ばしていたときは
        // カオス中の倒し方が配られず、履歴に傾きが入らないまま
        // 「傾きのない、ただの往復」しか見つからなかった
        gesApply(elapsedMs);
        const cp = clamp(phaseMs / Math.max(1000, gesChaosSec * 1000), 0, 1);
        const gp = clamp((cp - 0.4) / 0.4, 0, 1);
        gesFlock.grip = gp * gp * (3 - 2 * gp);
        // ほどけ切ってから探しはじめる
        if (gesFlock.melt >= 0.999 && elapsedMs - gesFlock.lastScan > 330) {
            gesFlock.lastScan = elapsedMs;
            gesScan();
            gesFlock.pool.sort((x, y) => gesPoolScore(y) - gesPoolScore(x));
            const top = gesFlock.pool[0] || null;
            if (top && (!gesFlock.champ || gesFlock.grip < 0.5)) {
                if (gesFlock.champ !== top) {
                    for (const b of layers.flatMap((l) => l.boids)) b.gesAdopt *= 0.35;
                }
                gesFlock.champ = top;
            }
            gesFlock.note = gesFlock.champ
                ? `見つけた所作 ${gesFlock.pool.length}種`
                    + `　いま広げている：${gesFlock.champ.g.W * GES_DT / 1000}秒の動きが`
                    + ` ${gesFlock.champ.g.d}本先へ ${(gesFlock.champ.g.lag * GES_DT / 1000).toFixed(1)}秒かけて`
                    + `（${gesFlock.champ.hits}回見かけた）`
                : `見つけた所作 ${gesFlock.pool.length}種（まだ広げていません）`;
            gesUpdateStatusLabel();
        }
        if (gesFlock.grip > 0.001 && gesFlock.champ) gesSpread(dt);
        if (phaseMs > Math.max(1000, gesChaosSec * 1000)) {
            if (!gesFlock.champ) {
                // 何も拾えなかった。もう少し見る
                gesFlock.phaseStart = elapsedMs - gesChaosSec * 1000 * 0.6;
            } else {
                const f = gesFeas(gesFlock.champ.g, gesFlock.n);
                gesFlock.amp = f.amp;
                gesFlock.ampLean = f.ampLean;
                gesFlock.travelMm = f.travelMm;
                gesFlock.playFrom = elapsedMs;
                gesFlock.phase = 'build';
                gesFlock.phaseStart = elapsedMs;
            }
        }
    } else if (gesFlock.phase === 'build') {
        const p = clamp(phaseMs / Math.max(300, gesBuildSec * 1000), 0, 1);
        gesFlock.perform = p * p * (3 - 2 * p);
        for (const b of layers.flatMap((l) => l.boids)) {
            b.gesAdopt = Math.max(b.gesAdopt || 0, gesFlock.perform);
        }
        gesApply(elapsedMs);
        if (p >= 1) {
            gesFlock.phase = 'play';
            gesFlock.phaseStart = elapsedMs;
            const g = gesFlock.champ.g;
            gesFlock.note = `${(g.W * GES_DT / 1000).toFixed(1)}秒の所作を`
                + `${g.d}本先へ${(g.lag * GES_DT / 1000).toFixed(1)}秒かけて渡しています`
                + `　振れ幅 ${Math.round(gesFlock.travelMm || 0)}mm`
                + `／傾き ${Math.round((Math.asin(clamp(gesFlock.ampLean, 0, 1)) * 180) / Math.PI)}°`;
            gesUpdateStatusLabel();
        }
    } else {
        gesFlock.perform = 1;
        gesApply(elapsedMs);
        if (phaseMs > Math.max(1000, gesPlaySec * 1000)) {
            const champ = gesFlock.champ;
            const mem = gesFlock.memory;
            const cycles = gesFlock.cycles + 1;
            if (champ) {
                mem.push(gesDescribe(champ.g));
                while (mem.length > 10) mem.shift();
            }
            gesReset(elapsedMs);
            gesFlock.memory = mem;
            gesFlock.cycles = cycles;
            gesFlock.prev = champ;
            gesFlock.champ = champ;
            gesFlock.melt = 0;
            const fb = champ ? gesFeas(champ.g, gesFlock.n) : null;
            gesFlock.amp = fb ? fb.amp : 0;
            gesFlock.ampLean = fb ? fb.ampLean : 0;
            gesFlock.travelMm = fb ? fb.travelMm : 0;
            gesFlock.note = '所作がほどけていきます…';
            gesUpdateStatusLabel();
        }
    }
}


// ============ MODE22〜24 共通 ============
// この3つは、内側で理想の模型を回し、バーはその席を追いかける形にしてある。
// 模型の中は実寸（mm・mm/秒）で持つので、表示サイズを変えても動きが変わらない。
function perimMm() { return perimeterLength / Math.max(1e-9, mmToPx); }
function cruiseMmS() { return (maxSpeed * motionScale * 60) / Math.max(1e-9, mmToPx); }
function wrapMm(x, Lmm) { return ((x % Lmm) + Lmm) % Lmm; }

// 目標の位置（mm）と、その目標の速さ（mm/秒）を追いかける。符号つき px/フレーム。
// 先に目標の速さを渡しておかないと、動いている目標にいつまでも遅れ続ける
function chaseMm(boid, targetMm, velMmS, gain) {
    const ff = ((velMmS || 0) * mmToPx) / 60;
    return ff + towardArc(boid, wrapMm(targetMm, perimMm()) * mmToPx, gain);
}

function setStatus(id, text) {

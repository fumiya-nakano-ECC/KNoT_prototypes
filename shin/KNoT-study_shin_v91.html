    const el = document.getElementById(id);
    if (el && el.textContent !== text) {
        el.textContent = text;
        nrHoldStatusHeight(el);
    }
}
// 状態の説明は、行数が増えても下の項目やスクロールの位置がずれないよう、
// はじめから数行ぶんの高さを取っておく（実際に見た最大の行数＋1行）。
// それを超えたときだけ広げ、いったん広げた高さは縮めない。
const STATUS_LINES = {
    mlStatusValue: 3, nsStatusValue: 3, personaStatusValue: 5, waStatusValue: 6,
    chiStatusValue: 3, todaStatusValue: 3, frsStatusValue: 4, avaStatusValue: 3,
    cpgStatusValue: 4, gesStatusValue: 4, trfStatusValue: 5, ffStatusValue: 4,
    psStatusValue: 4, nrStatusValue: 9, m22StatusValue: 3, nrCapNote: 4,
};
function nrHoldStatusHeight(el) {
    if (!el || !el.offsetParent) return;
    const h = el.getBoundingClientRect().height;
    const cur = parseFloat(el.dataset.holdPx || '0');
    if (h > cur + 0.5) {
        el.dataset.holdPx = String(h);
        el.style.minHeight = `${Math.ceil(h)}px`;
    }
}
for (const [id, n] of Object.entries(STATUS_LINES)) {
    const el = document.getElementById(id);
    if (el) el.style.minHeight = `calc(1.5em * ${n})`;
}
// setStatus を通らずに書き換える場所があっても、同じように高さを保つ
if (typeof MutationObserver === 'function') {
    const mo = new MutationObserver((list) => {
        for (const r of list) {
            const el = r.target.nodeType === 1 ? r.target : r.target.parentElement;
            if (el && STATUS_LINES[el.id] !== undefined) nrHoldStatusHeight(el);
        }
    });
    for (const id of Object.keys(STATUS_LINES)) {
        const el = document.getElementById(id);
        if (el) mo.observe(el, { childList: true, characterData: true, subtree: true });
    }
}

// ============ MODE22：幽霊渋滞 ============
// 全員が同じ速さで走りたいだけで、事故も工事もない。
// それでも、ある混み具合を超えると、誰か一人が一瞬ブレーキを踏んだだけで
// 渋滞が生まれ、しかも消えずに、車の流れと逆向きへ後ずさりしていく。
//
// 模型は「最適速度模型」（Bando ほか, 1995）。各車は前との車間だけを見て、
// その車間にふさわしい速さ V(車間) へ、反応の速さ a で近づこうとする。
// 反応が鈍い（a が小さい）ほど、前の減速に遅れて気づき、強く踏み込みすぎる。
// その行き過ぎが後ろへ後ろへと増幅されて、止まった車の塊になる。
// 上下のレイヤーは、ふだんは同じ向き（時計回り）の2車線。
// スイッチで上のレイヤーだけ反時計回り（対向車線）にもできる。
let trfSpeed = 1.6;      // 巡航速度（基準比）
let trfReact = 0.4;      // 反応の速さ a（1/秒）
let trfSafe = 1.0;       // 安全と感じる車間（平均の車間に対する比）
let trfDawdle = 5.0;     // うっかりブレーキ（一周ぶんで1分あたり何回）
let trfCycleSec = 20;    // 流れを整え直す間隔（0でしない）
let trfTiltDeg = 24;
let trfVariety = 0.15;   // 車ごとの速さのばらつき（±の割合）
let trfFastLane = 1.15;  // 上の車線（追越車線）の速さ（下の車線に対する倍率）
let trfOpposite = false;
let trfSingle = true;     // true＝上下を合わせて1本の車線にする（互いに追い越せない）
let trfBrakeSec = 2.0;    // うっかりブレーキを踏んでいる長さ  // true＝上のレイヤーを対向車線（反時計回り）にする
let trfState = null;
const TRF_CALM_SEC = 35;     // 整え直すときに、ゆとりを持って運転している時間
// 整え直しでは、何かを一気に切り替えることはしない。
// 反応を少しずつ速め、速さを少し控え、車間への敏感さを和らげていく——
// 「みんながゆとりを持って運転するようになる」だけ。そうなると渋滞は育たず、
// 先頭の車から順に抜けていって、自然にほどける。
const TRF_CALM_REACT = 1.4;  // ゆとりのあるときの反応の速さ
const TRF_CALM_SPEED = 0.85; // そのときの速さ（ふだんに対する割合）
const TRF_CALM_SOFT = 0.7;   // 車間への敏感さ（小さいほど鋭い。ふだんは0.3）
const TRF_CLEAR_MS = 3000;    // 止まっている車がいない状態がこれだけ続いたら、整え直しを終える
const TRF_CALM_MAX_SEC = 150; // 念のための上限
const TRF_EASE_SEC = 6;      // 運転の仕方が移り変わるのにかかる時間
const TRF_FIRST_BRAKE_MS = 8000;

// 車間 h に見合った速さ。安全車間 hs のところでいちばん敏感に変わる
// 渋滞で止まったときの車間。装置が許すいちばん狭いところ
// （最小車間＋上乗せの余裕）に、わずかな遊びだけを足してある
const TRF_JAM_MM = MIN_GAP_MM + HEADWAY_MIN_MM + 2;
// 速さは、止まったときの車間でちょうど0になり、そこから車間が広がるにつれて上がる。
// 0になる点を最小車間に合わせてあるので、渋滞ではぎりぎりまで詰めて並ぶ
function trfV(h, vmax, hs, soft) {
    const x = h - TRF_JAM_MM;
    if (x <= 0) return 0;
    const xs = Math.max(1, hs - TRF_JAM_MM);
    const w = xs * (soft || 0.3);
    const k = Math.tanh(xs / w);
    return vmax * Math.max(0, (Math.tanh((x - xs) / w) + k) / (1 + k));
}

// --- 見通し ---
// 直線では先まで見えるので、前の車が止まっていれば早めに気づいて、ゆるやかに減速する。
// カーブの先は、曲がりきるまで見えない。カーブを抜けたすぐ先に渋滞があると、
// 見えた瞬間にはもう近いので、急ブレーキになる。
// レールは「直線→角→直線→角…」のくり返し。角を曲がるにつれて視線が回り、
// 角を抜けきったところで、次の直線がまるごと見えるようになる。
const TRF_PEEK_MM = 30;          // 角の先を、わずかにのぞける距離
const TRF_BRAKE_COMF = 0.25;     // ふつうの減速（速さに対する割合／秒）。直線ではこれで手前から長く減速する
const TRF_BRAKE_HARD = 4.0;      // 急ブレーキの上限
function trfSight(uMm, dir, Lmm) {
    const S = Math.max(0, RAIL_SIDE_MM - 2 * CORNER_RADIUS_MM);
    const A = (Math.PI / 2) * CORNER_RADIUS_MM;
    const P = S + A;
    // 車線の座標 u を、「直線から始まる並び」の座標 y に直す。
    // 反時計回りの車線では、角が先に来るので角ひとつぶんずらす
    let y = dir > 0 ? wrapMm(uMm, Lmm) : wrapMm(uMm - A, Lmm);
    const off = y - Math.floor(y / P) * P;
    if (off < S) return (P - off) + TRF_PEEK_MM;          // 直線：次の角の出口まで
    // 角の中：抜けきる直前まで、その先はほとんど見えない。
    // 角を抜けたとたんに次の直線が見えて、そこに渋滞があれば急ブレーキになる
    const prog = (off - S) / Math.max(1e-6, A);
    return (P - off) + TRF_PEEK_MM + Math.pow(prog, 3) * S * 0.2;
}

function trfReset(nowMs) {
    const Lmm = perimMm();
    const vmax = Math.max(1, cruiseMmS() * trfSpeed);
    // 車線の組み方。ふだんは上下が別々の2車線。
    // 1本の車線にするときは、上下36本をまとめて弧の順に並べ、1列として扱う。
    // こうすると上下のバーも互いに追い越せなくなる（前がどちらの段でも詰まる）
    const groups = trfSingle
        ? [{ bars: ringAll(), fast: false, dir: 1, name: '' }]
        : layers.map((layer, li) => ({ bars: ringOf(layer), fast: li > 0,
            dir: (li === 0 || !trfOpposite) ? 1 : -1, name: li === 0 ? '下の車線で' : '上の車線で' }));
    trfState = {
        single: trfSingle,
        total: layers.reduce((a, l) => a + l.boids.length, 0),
        lanes: groups.map((g) => {
            let bs = g.bars;
            const n = bs.length;
            if (n < 3) return null;
            const dir = g.dir;
            if (dir < 0) bs = bs.slice().reverse();
            const r0 = Lmm / n;
            // 車線の座標 u は、その車線の進む向きに増える。
            // はじめは等間隔に並べ、いまの位置からいちばん動かずにすむ回し方を選ぶ
            let sx = 0;
            let sy = 0;
            for (let i = 0; i < n; i++) {
                const u = wrapMm(dir * bs[i].arcFraction * Lmm, Lmm);
                const a = ((u - i * r0) / Lmm) * Math.PI * 2;
                sx += Math.cos(a); sy += Math.sin(a);
            }
            const u0 = wrapMm((Math.atan2(sy, sx) / (Math.PI * 2)) * Lmm, Lmm);
            const u = new Float64Array(n);
            const v = new Float64Array(n);
            // 車ごとの速さの癖（-1〜1）。一生変わらない。
            // 遅い車の後ろには、自然と数台の列ができる
            const rnd = new Float64Array(n);
            for (let i = 0; i < n; i++) rnd[i] = Math.random() * 2 - 1;
            const laneMul = g.fast ? trfFastLane : 1;
            for (let i = 0; i < n; i++) {
                u[i] = u0 + i * r0;
                v[i] = trfV(r0, vmax * laneMul * (1 + trfVariety * rnd[i]), trfSafe * r0);
                bs[i].trfLaneDir = dir;
            }
            return { dir, n, u, v, rnd, bars: bs, fast: g.fast, name: g.name,
                acc: new Float64Array(n), lean: new Float64Array(n),
                brakeSite: -1, brakeUntil: 0 };
        }),
        phase: 'flow',
        phaseStart: nowMs,
        // 最初のひと踏みは早めに起こす。何も起きていない流れから、
        // 渋滞が生まれるところを見てもらうため
        nextDawdleAt: nowMs + TRF_FIRST_BRAKE_MS,
        dawdles: 0,
        lastBrake: '',
        statusAt: 0,
    };
}

function trfUpdateState(elapsedMs, dtMs) {
    if (!trfState || trfState.single !== trfSingle
        || trfState.total !== layers.reduce((a, l) => a + l.boids.length, 0)) {
        trfReset(elapsedMs);
        return;
    }
    const st = trfState;
    const Lmm = perimMm();
    const vmax = Math.max(1, cruiseMmS() * trfSpeed);
    const dt = Math.min(50, dtMs) / 1000;
    const phMs = elapsedMs - st.phaseStart;
    if (st.phase === 'flow' && trfCycleSec > 0 && phMs > trfCycleSec * 1000) {
        st.phase = 'calm';
        st.phaseStart = elapsedMs;
    } else if (st.phase === 'calm' && ((phMs > TRF_CALM_SEC * 1000
        && st.clearSince && elapsedMs - st.clearSince > TRF_CLEAR_MS)
        || phMs > TRF_CALM_MAX_SEC * 1000)) {
        st.phase = 'flow';
        st.phaseStart = elapsedMs;
        st.nextDawdleAt = elapsedMs + TRF_FIRST_BRAKE_MS;
    }
    const calm = st.phase === 'calm';
    // 運転の仕方は、いまの値から目標へなめらかに寄っていく
    const k = 1 - Math.exp(-dt / TRF_EASE_SEC);
    // 整え直しでは、渋滞が必ずほどける反応の速さを、いまの設定から計算して目標にする。
    // 最適速度模型では、反応の速さ a が「車間に見合う速さの傾き」の2倍を上回れば
    // 流れは安定し、揺れは育たずに消えていく。いちばん速い車に合わせて余裕を持たせる
    let aStable = 0;
    if (calm) {
        for (const ln of st.lanes) {
            if (!ln) continue;
            const r0 = Lmm / ln.n;
            const xs = Math.max(1, clamp(trfSafe, 0.2, 3) * r0 - TRF_JAM_MM);
            const w = xs * TRF_CALM_SOFT;
            const kk = Math.tanh(xs / w);
            const vTop = vmax * TRF_CALM_SPEED * (ln.fast ? trfFastLane : 1) * (1 + trfVariety);
            aStable = Math.max(aStable, 1.5 * 2 * vTop / (w * (1 + kk)));
        }
    }
    const tgtA = calm ? clamp(Math.max(TRF_CALM_REACT, trfReact, aStable), 0.02, 8)
        : clamp(trfReact, 0.02, 5);
    if (!Number.isFinite(st.aNow)) { st.aNow = tgtA; st.speedNow = 1; st.softNow = 0.3; }
    st.aNow += (tgtA - st.aNow) * k;
    st.speedNow += ((calm ? TRF_CALM_SPEED : 1) - st.speedNow) * k;
    st.softNow += ((calm ? TRF_CALM_SOFT : 0.3) - st.softNow) * k;
    // 見えない先に備える度合い。整え直しのあいだは、見通しの中で止まりきれる速さまで
    // 自分から落とす。ふだんは備えずに突っ込むので、カーブの先で急ブレーキになる
    if (!Number.isFinite(st.cautionNow)) st.cautionNow = 0;
    st.cautionNow += ((calm ? 1 : 0) - st.cautionNow) * k;
    const a = st.aNow;

    // うっかりブレーキ。一周のどこかで、誰か一人が1秒ちょっと踏む
    if (!calm && trfDawdle > 0 && elapsedMs >= st.nextDawdleAt) {
        const live = st.lanes.filter((ln) => ln);
        if (live.length) {
            const ln = live[Math.floor(Math.random() * live.length)];
            ln.brakeSite = Math.floor(Math.random() * ln.n);
            ln.brakeUntil = elapsedMs + trfBrakeSec * 1000;
            st.dawdles++;
            st.lastBrake = `${ln.name}1台がブレーキ`;
            st.lastBrakeAt = elapsedMs;
        }
        st.nextDawdleAt = elapsedMs + (60000 / trfDawdle) * (0.5 + Math.random());
    }

    const sub = 4;
    const h = dt / sub;
    for (let li = 0; li < st.lanes.length; li++) {
        const ln = st.lanes[li];
        if (!ln) continue;
        const { n, u, v, acc, rnd } = ln;
        const r0 = Lmm / n;
        // 上の車線は追越車線。車線全体を少し速くする
        const laneV = vmax * st.speedNow * (ln.fast ? trfFastLane : 1);
        const vmaxOf = (i) => laneV * Math.max(0.3, 1 + trfVariety * rnd[i]);
        const hs = clamp(trfSafe, 0.2, 3) * r0;
        const braking = elapsedMs < ln.brakeUntil;
        for (let s = 0; s < sub; s++) {
            for (let i = 0; i < n; i++) {
                const nxt = i === n - 1 ? u[0] + Lmm : u[i + 1];
                const gap = nxt - u[i];
                // 前の車が見えているか。見えていなければ、道は空いていると思って走る
                const sight = trfSight(u[i], ln.dir, Lmm);
                const seen = gap <= sight;
                let ai = a * (trfV(seen ? gap : 1e9, vmaxOf(i), hs, st.softNow) - v[i]);
                if (!seen && st.cautionNow > 0.01) {
                    const bComf = laneV * TRF_BRAKE_COMF;
                    const vSight = Math.sqrt(2 * bComf * Math.max(0, sight - TRF_JAM_MM));
                    const vCap = lerp(vmaxOf(i) * 1.3, vSight, st.cautionNow);
                    if (v[i] > vCap) ai = Math.min(ai, -Math.min(bComf, (v[i] - vCap) * 2));
                }
                if (seen) {
                    // 前の車の手前で止まりきれる速さを超えていたら、ブレーキを踏む。
                    // 早く気づけばゆるやかに、気づくのが遅ければ強く
                    const vl = v[(i + 1) % n];
                    const room = Math.max(3, gap - TRF_JAM_MM);
                    const bComf = laneV * TRF_BRAKE_COMF;
                    if (v[i] > Math.sqrt(vl * vl + 2 * bComf * room)) {
                        const need = (v[i] * v[i] - vl * vl) / (2 * room);
                        const dec = Math.min(laneV * TRF_BRAKE_HARD, Math.max(bComf, need));
                        ai = Math.min(ai, -dec);
                        if (need > bComf * 2.5) ln.hardAt = elapsedMs;
                    }
                }
                if (braking && i === ln.brakeSite) ai = Math.min(ai, -laneV * 0.9);
                acc[i] = ai;
            }
            for (let i = 0; i < n; i++) {
                v[i] = clamp(v[i] + acc[i] * h, 0, vmaxOf(i) * 1.3);
                u[i] += v[i] * h;
            }
            // 追突はしない。最小の車間より前には出られない
            for (let pass = 0; pass < 2; pass++) {
                for (let i = n - 1; i >= 0; i--) {
                    const nxt = i === n - 1 ? u[0] + Lmm : u[i + 1];
                    const gmin = TRF_JAM_MM + v[i] * 0.12;
                    if (nxt - u[i] < gmin) {
                        u[i] = nxt - gmin;
                        v[i] = Math.min(v[i], v[(i + 1) % n]);
                    }
                }
            }
        }
        if (!braking) ln.brakeSite = -1;
        // 座標がどこまでも大きくならないよう、ときどき一周ぶん引いておく
        if (u[0] > Lmm * 8) for (let i = 0; i < n; i++) u[i] -= Lmm * 8;
        for (let i = 0; i < n; i++) {
            if (!Number.isFinite(u[i]) || !Number.isFinite(v[i])) { trfReset(elapsedMs); return; }
        }
        // 傾きは慣性。加速すれば後ろへ、ブレーキを踏めば前へ倒れる。
        // 渋滞の尻ではみな前のめりになり、先頭ではのけぞって抜けていく
        // ふつうのブレーキはほどほどの前傾、急ブレーキでは大きく前のめりになる
        const accRef = laneV * 0.8;
        for (let i = 0; i < n; i++) {
            const tgt = clamp(-acc[i] / accRef, -1, 1);
            ln.lean[i] += (tgt - ln.lean[i]) * 0.12;
        }
    }

    // 止まっている車がいるか。整え直しは、これが0の状態がしばらく続くまで終えない
    let anyStopped = false;
    for (const ln of st.lanes) {
        if (!ln) continue;
        for (let i = 0; i < ln.n; i++) if (ln.v[i] < vmax * 0.15) { anyStopped = true; break; }
    }
    if (anyStopped) st.clearSince = 0;
    else if (!st.clearSince) st.clearSince = elapsedMs;

    for (const ln of st.lanes) {
        if (!ln) continue;
        for (let i = 0; i < ln.n; i++) {
            const b = ln.bars[i];
            b.trfLaneDir = ln.dir;
            b.trfTarget = wrapMm(ln.dir * ln.u[i], Lmm);
            b.trfVel = ln.dir * ln.v[i];
            b.trfLean = ln.lean[i] * ln.dir;
        }
    }

    if (elapsedMs - st.statusAt > 250) {
        st.statusAt = elapsedMs;
        let stopped = 0;
        let total = 0;
        let jams = 0;
        for (const ln of st.lanes) {
            if (!ln) continue;
            total += ln.n;
            const slow = [];
            for (let i = 0; i < ln.n; i++) slow.push(ln.v[i] < vmax * 0.15);
            for (let i = 0; i < ln.n; i++) {
                if (slow[i]) stopped++;
                if (slow[i] && !slow[(i - 1 + ln.n) % ln.n]) jams++;
            }
        }
        let text = `ほぼ止まっている ${stopped}/${total}本　渋滞 ${jams}か所`;
        if (st.lanes.some((ln) => ln && elapsedMs - (ln.hardAt || -1e9) < 1500)) {
            text += '　カーブの先の渋滞に気づいて急ブレーキ';
        }
        if (calm) {
            text += stopped > 0
                ? '\nみんながゆとりを持って運転しています（渋滞が先頭からほどけていきます）'
                : '\n渋滞がすべてほどけました。流れが落ち着くのを待っています';
        } else {
            if (st.lastBrake && elapsedMs - (st.lastBrakeAt || 0) < 2500) text += `\n${st.lastBrake}`;
            else text += `\nうっかりブレーキ これまで${st.dawdles}回`;
            if (trfCycleSec > 0) {
                const left = Math.max(0, Math.ceil(trfCycleSec - (elapsedMs - st.phaseStart) / 1000));
                text += `　あと${left}秒で整え直し`;
            }
        }
        setStatus('trfStatusValue', text);
    }
}

function trfDrive(boid) {
    if (!Number.isFinite(boid.trfTarget)) return 0;
    return chaseMm(boid, boid.trfTarget, boid.trfVel, 1.3);
}

// ============ MODE23：蛍の同期 ============
// 各バーは自分の周期で「溜めて」、いっぱいになると一瞬ぱっと倒れる（光る）。
// 光ると、近くの何本かの溜まり具合をほんの少しだけ押し上げる。
// それだけの取り決めで、ばらばらだった光りがいつのまにかそろっていく
// （パルス結合振動子。Mirollo と Strogatz が1990年に、そろうことを証明した）。
//
// 要は、溜まり方がだんだん鈍っていく（上に凸の）形になっていること。
// 同じ一押しでも、光る直前の個体ほど大きく前へ進むので、
// 押された側は押した側に吸い寄せられ、一度そろったものは二度と離れない。
// そろいきってしばらく経ったら、いったん周期をばらけさせて、またやり直す。
let ffPeriodSec = 2.5;   // 光る周期
let ffCouple = 0.04;     // 背中を押す強さ
let ffRange = 3;         // 届く範囲（両隣それぞれ何本まで。上下のレイヤーを合わせて数える）
let ffSpread = 0.06;     // 周期のばらつき
let ffHoldSec = 15;      // そろったまま保つ時間
let ffDrift = 0.2;       // 全体がゆっくり流れる速さ（巡航速度に対する比）
let ffTiltDeg = 30;
let ffState = null;
const FF_B = 3;              // 溜まり方の曲がり具合（大きいほどそろいやすい）
const FF_SCATTER_SEC = 8;    // ばらけさせる時間
const FF_SYNC_R = 0.92;      // これ以上を「そろった」とみなす

function ffF(phi) { return Math.log(1 + (Math.exp(FF_B) - 1) * phi) / FF_B; }
function ffFinv(x) { return (Math.exp(FF_B * x) - 1) / (Math.exp(FF_B) - 1); }

function ffReset(nowMs) {
    const all = layers.flatMap((l) => l.boids);
    for (const b of all) {
        b.ffPhi = Math.random();
        b.ffWr = Math.random() * 2 - 1;
        b.ffFireAt = -1e9;
        b.ffLean = 0;
        b.ffScatterW = 1;
    }
    ffState = { n: all.length, phase: 'sync', phaseStart: nowMs, syncMs: 0, r: 0,
        lastBurst: 0, lastBurstAt: -1e9, flashes: 0, statusAt: 0 };
}

function ffUpdateState(elapsedMs, dtMs) {
    const all = ringAll();
    const n = all.length;
    if (!ffState || ffState.n !== n) { ffReset(elapsedMs); return; }
    if (n < 3) return;
    const st = ffState;
    const dt = Math.min(50, dtMs) / 1000;
    if (st.phase === 'scatter' && elapsedMs - st.phaseStart > FF_SCATTER_SEC * 1000) {
        st.phase = 'sync';
        st.phaseStart = elapsedMs;
        st.syncMs = 0;
        for (const b of all) b.ffScatterW = 1;
    }
    const scatter = st.phase === 'scatter';
    const T = Math.max(0.3, ffPeriodSec);

    const queue = [];
    for (let i = 0; i < n; i++) {
        const b = all[i];
        if (!Number.isFinite(b.ffPhi)) b.ffPhi = Math.random();
        const w = (1 + ffSpread * (b.ffWr || 0)) * (scatter ? (b.ffScatterW || 1) : 1);
        b.ffPhi += (dt / T) * w;
        if (b.ffPhi >= 1) queue.push(i);
    }
    // 光りの連鎖。押されて光ったものも、同じ瞬間に光ったものとして扱う
    // （同じ連鎖の中では互いに押し合わない＝そこで一つに吸収される）
    const done = new Uint8Array(n);
    const R = clamp(Math.round(ffRange), 1, Math.max(1, Math.floor((n - 1) / 2)));
    let burst = 0;
    while (queue.length) {
        const i = queue.pop();
        if (done[i]) continue;
        done[i] = 1;
        burst++;
        const b = all[i];
        b.ffPhi = 0;
        b.ffFireAt = elapsedMs;
        if (scatter || ffCouple <= 0) continue;
        for (let d = -R; d <= R; d++) {
            if (d === 0) continue;
            const j = (i + d + n) % n;
            if (done[j]) continue;
            const o = all[j];
            const x = ffF(clamp(o.ffPhi, 0, 1)) + ffCouple;
            if (x >= 1) { o.ffPhi = 1; queue.push(j); } else o.ffPhi = ffFinv(x);
        }
    }
    if (burst > 0) {
        st.lastBurst = burst;
        st.lastBurstAt = elapsedMs;
        st.flashes++;
    }

    // そろい具合（位相をぐるりと並べたときの重心の近さ）
    let cx = 0;
    let cy = 0;
    for (const b of all) {
        const a = b.ffPhi * Math.PI * 2;
        cx += Math.cos(a); cy += Math.sin(a);
    }
    st.r = Math.hypot(cx, cy) / n;
    if (!scatter) {
        if (st.r > FF_SYNC_R) st.syncMs += dtMs;
        else st.syncMs = Math.max(0, st.syncMs - dtMs * 0.5);
        if (st.syncMs > ffHoldSec * 1000) {
            st.phase = 'scatter';
            st.phaseStart = elapsedMs;
            st.syncMs = 0;
            for (const b of all) b.ffScatterW = 0.55 + Math.random() * 0.9;
        }
    }

    // 倒し方。溜まるにつれて少しずつのけぞり（弓を引くように）、
    // 光った瞬間に反対側へぱっと倒れて、ゆっくり戻る。
    // 上下のレイヤーは逆向きに倒すので、そろうと一周がX字に開く
    for (const b of all) {
        const sgn = layers.indexOf(b.layer) === 0 ? 1 : -1;
        const age = (elapsedMs - (b.ffFireAt || -1e9)) / 1000;
        const flash = age < 0 ? 0 : (age < 0.25 ? 1 : Math.exp(-(age - 0.25) / 0.45));
        const x = ffF(clamp(b.ffPhi, 0, 1));
        b.ffLean = sgn * (flash - (1 - flash) * 0.4 * x);
    }

    if (elapsedMs - st.statusAt > 250) {
        st.statusAt = elapsedMs;
        let text = `そろい具合 ${(st.r * 100).toFixed(0)}%`;
        if (elapsedMs - st.lastBurstAt < 1500) text += `　いま一度に光った ${st.lastBurst}本`;
        if (scatter) {
            const left = Math.max(0, Math.ceil(FF_SCATTER_SEC - (elapsedMs - st.phaseStart) / 1000));
            text += `\nいったんばらけさせています（あと${left}秒）`;
        } else if (st.r > FF_SYNC_R) {
            const left = Math.max(0, Math.ceil(ffHoldSec - st.syncMs / 1000));
            text += `\nそろいました（あと${left}秒でばらけさせます）`;
        } else {
            text += '\nとなりに背中を押されながら、そろっていくところ';
        }
        setStatus('ffStatusValue', text);
    }
}

function ffDrive(boid) {
    const cruise = Math.max(1e-6, maxSpeed * motionScale);
    let v = cruise * ffDrift + evenDrive(boid, 0.35);
    // 流しているときは、逆向きには動かさない（向きの切り替えでがくつくため）
    if (ffDrift > 0.02) v = Math.max(0, v);
    return v;
}

// ============ MODE24：相分離と粗大化（オストワルド熟成） ============
// 散らばっていたバーが、急に冷やされたように小さな塊に分かれる。
// そこから、小さな塊ほど端のバーを手放しやすく、手放されたバーは
// となりの（できれば大きいほうの）塊まで渡っていって、その端にくっつく。
// 小さい塊はやせ細って消え、大きい塊はさらに太っていく。
// 最後にひとつの大きな塊になったら、また温めてほどき、最初から。
//
// 泡や油滴、合金の結晶粒が時間とともに粗くなっていくのと同じしくみ。
// 小さい粒ほど表面の割合が大きく、居心地が悪い（溶け出しやすい）ので、
// 平均すると「小さいほうから大きいほうへ」中身が流れていく。
// レールの上では追い越せないので、渡るバーは本当に隙間を一本で横切る。
const PS_PACK_MM = 58;   // 塊の中の車間
let psGrain = 3;         // はじめの粒の大きさ（本）
let psRate = 0.45;       // 溶け出す速さ（1本の塊で、1秒あたり）
let psGamma = 1.5;       // 大きいほど有利（溶け出しにくさ、引き寄せやすさ）
let psTravel = 1.0;      // 渡る速さ（巡航速度に対する比）
let psHoldSec = 10;      // ひとつにまとまってから保つ時間
let psGasSec = 8;        // ほどけている時間
let psTiltDeg = 22;
let psState = null;
const PS_RIPEN_MAX_SEC = 240;   // どれだけ待ってもまとまらないときの上限
const PS_FORM_MS = 3500;        // 冷やしたあと、粒ができるのを待つ時間

function psReset(nowMs) {
    const Lmm = perimMm();
    const bs0 = ringOf(layers[0]);
    const n = bs0.length;
    const pos = new Float64Array(n);
    for (let i = 0; i < n; i++) pos[i] = bs0[i].arcFraction * Lmm;
    for (const layer of layers) {
        const bs = ringOf(layer);
        for (let i = 0; i < bs.length; i++) bs[i].psSite = Math.min(i, n - 1);
    }
    psState = {
        n, pos, vel: new Float64Array(n), kind: new Int8Array(n).fill(2),
        tdir: new Int8Array(n), lean: new Float64Array(n),
        phase: 'gas', phaseStart: nowMs, gasBase: 0, holdSince: 0,
        events: 0, statusAt: 0, sizes: [], travelers: 0,
    };
    psStartGas(nowMs);
}

// ほどく（温める）。1周に等間隔で、ゆっくり流れる状態にする
function psStartGas(nowMs) {
    const st = psState;
    const Lmm = perimMm();
    const r0 = Lmm / st.n;
    let sx = 0;
    let sy = 0;
    for (let i = 0; i < st.n; i++) {
        const a = ((st.pos[i] - i * r0) / Lmm) * Math.PI * 2;
        sx += Math.cos(a); sy += Math.sin(a);
    }
    st.gasBase = wrapMm((Math.atan2(sy, sx) / (Math.PI * 2)) * Lmm, Lmm);
    st.kind.fill(2);
    st.phase = 'gas';
    st.phaseStart = nowMs;
    st.holdSince = 0;
}

// 急に冷やす。となり合う数本ずつを、その場で小さな粒にまとめる
function psQuench(nowMs) {
    const st = psState;
    const n = st.n;
    const Lmm = perimMm();
    const g0 = clamp(Math.round(psGrain), 1, 8);
    let k = Math.floor(Math.random() * n);
    let left = n;
    while (left > 0) {
        let m = clamp(g0 + Math.round((Math.random() * 2 - 1) * 0.9), 1, left);
        // 1本だけ取り残されるなら、その1本も入れてしまう
        if (left - m === 1 && m > 1) m++;
        m = Math.min(m, left);
        let sx = 0;
        let sy = 0;
        const ids = [];
        for (let j = 0; j < m; j++) {
            const i = (k + j) % n;
            ids.push(i);
            const a = (st.pos[i] / Lmm) * Math.PI * 2;
            sx += Math.cos(a); sy += Math.sin(a);
        }
        const c = wrapMm((Math.atan2(sy, sx) / (Math.PI * 2)) * Lmm, Lmm);
        for (let j = 0; j < m; j++) {
            const i = ids[j];
            st.pos[i] = wrapMm(c + (j - (m - 1) / 2) * PS_PACK_MM, Lmm);
            st.kind[i] = 0;
            st.vel[i] = 0;
        }
        k = (k + m) % n;
        left -= m;
    }
    st.phase = 'ripen';
    st.phaseStart = nowMs;
    st.holdSince = 0;
}

// いまの塊の並び。つながっている（車間が詰まっている）止まったバーのひと続き
function psRuns() {
    const st = psState;
    const { n, pos, kind } = st;
    const Lmm = perimMm();
    const fwd = (a) => wrapMm(pos[(a + 1) % n] - pos[a], Lmm);
    const same = (a) => kind[a] === 0 && kind[(a + 1) % n] === 0 && fwd(a) <= PS_PACK_MM * 1.5;
    let s0 = -1;
    for (let a = 0; a < n; a++) {
        if (!same((a - 1 + n) % n)) { s0 = a; break; }
    }
    if (s0 < 0) return kind[0] === 0 ? [{ start: 0, end: n - 1, size: n }] : [];
    const runs = [];
    let cur = null;
    for (let k = 0; k < n; k++) {
        const a = (s0 + k) % n;
        if (kind[a] !== 0) { cur = null; continue; }
        if (cur && same((a - 1 + n) % n)) { cur.size++; cur.end = a; } else {
            cur = { start: a, end: a, size: 1 };
            runs.push(cur);
        }
    }
    return runs;
}

function psUpdateState(elapsedMs, dtMs) {
    if (!psState || psState.n !== layers[0].boids.length
        || layers.some((l) => l.boids.length !== psState.n)) {
        psReset(elapsedMs);
        return;
    }
    const st = psState;
    const { n, pos, vel, kind, tdir, lean } = st;
    const Lmm = perimMm();
    const dt = Math.min(50, dtMs) / 1000;
    const phMs = elapsedMs - st.phaseStart;
    const cruise = Math.max(1, cruiseMmS());
    const fwd = (a) => wrapMm(pos[(a + 1) % n] - pos[a], Lmm);
    const want = new Float64Array(n);

    if (st.phase === 'gas') {
        const vGas = cruise * 0.15;
        st.gasBase = wrapMm(st.gasBase + vGas * dt, Lmm);
        const r0 = Lmm / n;
        for (let i = 0; i < n; i++) {
            pos[i] = wrapMm(st.gasBase + i * r0, Lmm);
            vel[i] = vGas;
            // 熱のあいだは、ばらばらに小さく揺れている
            want[i] = 0.35 * Math.sin(elapsedMs * 0.0011 * (1 + (i % 5) * 0.13) + i * 1.7);
        }
        if (phMs > Math.max(1, psGasSec) * 1000) psQuench(elapsedMs);
    } else {
        // --- 渡っているバーを進める ---
        const vT = Math.max(5, cruise * psTravel);
        for (let i = 0; i < n; i++) {
            if (kind[i] !== 1) continue;
            const d = tdir[i];
            const j = (i + d + n) % n;
            const gap = d > 0 ? fwd(i) : fwd(j);
            const room = gap - PS_PACK_MM;
            // 着く手前で、ふわっと減速する
            const sp = vT * clamp(room / (PS_PACK_MM * 3), 0.3, 1);
            const step = sp * dt;
            if (room <= step) {
                pos[i] = wrapMm(pos[j] - d * PS_PACK_MM, Lmm);
                if (kind[j] === 0 || (kind[j] === 1 && tdir[j] !== d)) {
                    kind[i] = 0; vel[i] = 0;
                    if (kind[j] === 1) { kind[j] = 0; vel[j] = 0; }
                } else {
                    vel[i] = vel[j];       // 前を渡っているバーの後ろにつく
                }
            } else {
                pos[i] = wrapMm(pos[i] + d * step, Lmm);
                vel[i] = d * sp;
            }
        }

        const runs = psRuns();
        let travelers = 0;
        for (let i = 0; i < n; i++) if (kind[i] === 1) travelers++;

        // --- 溶け出す ---
        const R = runs.length;
        if (R >= 2 && phMs > PS_FORM_MS) {
            for (let k = 0; k < R; k++) {
                if (travelers >= Math.max(1, Math.floor(n / 4))) break;
                const r = runs[k];
                const rate = psRate / Math.pow(r.size, psGamma);
                if (Math.random() >= rate * dt) continue;
                const wl = Math.pow(runs[(k - 1 + R) % R].size, psGamma);
                const wr = Math.pow(runs[(k + 1) % R].size, psGamma);
                // 大きいとなりのほうへ行きやすい（そちらのほうが居心地がいい）
                const d = Math.random() * (wl + wr) < wr ? 1 : -1;
                const edge = d > 0 ? r.end : r.start;
                // 同じ隙間を逆向きに渡っているバーがいたら、今回は見送る（すれ違えないため）
                let ok = true;
                let a = (edge + d + n) % n;
                for (let guard = 0; guard < n && kind[a] === 1; guard++) {
                    if (tdir[a] !== d) { ok = false; break; }
                    a = (a + d + n) % n;
                }
                if (!ok) continue;
                kind[edge] = 1;
                tdir[edge] = d;
                vel[edge] = d * vT * 0.3;
                travelers++;
                st.events++;
            }
        }

        // --- 傾き。塊は花束のように外へ開き、渡るバーは進む向きへ前のめり ---
        for (const r of runs) {
            const half = (r.size - 1) / 2;
            for (let j = 0; j < r.size; j++) {
                const i = (r.start + j) % n;
                want[i] = half > 0 ? ((j - half) / half) * 0.9 : 0;
            }
        }
        for (let i = 0; i < n; i++) if (kind[i] === 1) want[i] = tdir[i] * 0.7;

        // --- ひとつにまとまったら、しばらく見せてから温め直す ---
        if (R <= 1 && travelers === 0) {
            if (!st.holdSince) st.holdSince = elapsedMs;
            if (elapsedMs - st.holdSince > Math.max(1, psHoldSec) * 1000) psStartGas(elapsedMs);
        } else {
            st.holdSince = 0;
            if (phMs > PS_RIPEN_MAX_SEC * 1000) psStartGas(elapsedMs);
        }
        st.sizes = runs.map((r) => r.size).sort((x, y) => y - x);
        st.travelers = travelers;
    }

    for (let i = 0; i < n; i++) {
        if (!Number.isFinite(pos[i])) { psReset(elapsedMs); return; }
        lean[i] += (want[i] - lean[i]) * 0.1;
    }

    for (let li = 0; li < layers.length; li++) {
        // 上のレイヤーは半目盛りずらして、下のレイヤーのあいだに入る
        const off = li * PS_PACK_MM * 0.5;
        for (const b of layers[li].boids) {
            const i = clamp(Number.isFinite(b.psSite) ? b.psSite : 0, 0, n - 1);
            b.psTarget = wrapMm(pos[i] + off, Lmm);
            b.psVel = vel[i];
            b.psLean = lean[i];
        }
    }

    if (elapsedMs - st.statusAt > 250) {
        st.statusAt = elapsedMs;
        const nl = layers.length;
        let text;
        if (st.phase === 'gas') {
            const left = Math.max(0, Math.ceil(psGasSec - phMs / 1000));
            text = `温めてほどいています（あと${left}秒で冷やします）`;
        } else {
            const sizes = st.sizes.map((s) => s * nl);
            text = `塊 ${sizes.length}つ［${sizes.join('・') || '-'}本］`
                + `　渡っている ${st.travelers * nl}本`;
            if (st.holdSince) {
                const left = Math.max(0, Math.ceil(psHoldSec - (elapsedMs - st.holdSince) / 1000));
                text += `\nひとつにまとまりました（あと${left}秒で温め直します）`;
            } else if (phMs < PS_FORM_MS) {
                text += '\n冷やしたところ。小さな粒ができていきます';
            } else {
                text += `\n小さい塊から大きい塊へ移っています（${Math.floor(phMs / 1000)}秒）`;
            }
        }
        setStatus('psStatusValue', text);
    }
}

function psDrive(boid) {
    if (!Number.isFinite(boid.psTarget)) return 0;
    return chaseMm(boid, boid.psTarget, boid.psVel, 1.3);
}


// ============ MODE25：ローマン算術 ============
// 文字盤（MODE5 と同じ形）から始まり、となり合う2つの数字の「足し算」か、
// 1つの数字の「引き算（ふたつに分かれる）」を、一度に一か所ずつ起こしていく。
//
//   足し算 … となり合う2つの数字がひとつになる（V と III → VIII）。グループが1つ減る
//   引き算 … 1つの数字が、和がもとの数になる2つに分かれる（XX → X と X）。1つ増える
//
// どちらも、画数がそのまま収まる組み合わせだけを選ぶ（V + III = VIII は 2+3 = 5本）。
// バーの本数は変わらないので、余りや不足は出ない。
// どうしても収まる組み合わせがないときだけ、余りは新しい数字に、不足はとなりからもらう。
//
// 数字の位置は、グループ数ごとに1周を等分した場所で固定。
// 変化が起きてグループ数が変わったときだけ、全体の車間を詰めたり広げたりして並び直す。
// それ以外のあいだは数字は止まったまま、バーだけがわずかに揺れている。
//
// グループ数は、下限と上限のあいだを行き来する（12 → 下限 → 上限 → 下限 …）。
//
// 上下のレイヤーのバーを1本おきに並べた、ひとつながりの鎖（36本）として扱う。
// X の2画は必ずとなり合うので、自然に別々のレイヤーになり、交差できる。
let NR_MAX = 20;          // 数字の上限（XX〜XXXIX）
let nrMinGroups = 6;      // グループ数の下限
let nrMaxGroups = 12;     // グループ数の上限
let nrGasSec = 1;         // はじめに文字盤のまま保つ時間
let nrStepSec = 3;        // 1回の変化で並び直すのにかける時間
let nrGapSec = 3;         // 変化と変化のあいだに、止まって見せる時間
let nrSway = 1.0;         // バーの揺れ
let nrState = null;
const NR_ONES = ['', 'I', 'II', 'III', 'IIII', 'V', 'VI', 'VII', 'VIII', 'IX'];

function nrRoman(v) {
    const n = clamp(Math.round(v), 1, 39);
    return 'X'.repeat(Math.floor(n / 10)) + NR_ONES[n % 10];
}
function nrStrokes(v) {
    let s = 0;
    for (const c of nrRoman(v)) s += c === 'I' ? 1 : 2;
    return s;
}
let NR_BY_STROKES = {};
let NR_MIN_POSSIBLE = 6;
// 上限が変わったら、画数ごとの数字の一覧と、理屈の上での最少グループ数を作り直す
function nrRebuildTables() {
    const m = {};
    let most = 1;
    for (let v = 1; v <= NR_MAX; v++) {
        const k = nrStrokes(v);
        (m[k] || (m[k] = [])).push(v);
        most = Math.max(most, k);
    }
    NR_BY_STROKES = m;
    NR_MIN_POSSIBLE = Math.ceil((nrState ? nrState.N : 36) / most);
}
nrRebuildTables();

function nrRange() {
    const lo = Math.max(NR_MIN_POSSIBLE, Math.min(nrMinGroups, nrMaxGroups));
    const hi = Math.max(lo, Math.max(nrMinGroups, nrMaxGroups));
    return { lo, hi };
}

// その本数で書ける数字のうち、near にいちばん近いもの
function nrValueFor(k, near) {
    const list = NR_BY_STROKES[k];
    if (!list) return null;
    let best = list[0];
    for (const v of list) {
        const d = Math.abs(v - near) - Math.abs(best - near);
        if (d < 0 || (d === 0 && v < best)) best = v;
    }
    return best;
}

// 数字の字形：画ごとの「中心からのずれ（mm）」と「倒し方」。MODE5 の組み方と同じ
const nrGlyphCache = new Map();
function nrGlyph(v) {
    const unitMm = dialUnitMm();
    const key = `${v}|${dialLeanDeg}|${unitMm}|${showTopPlate}`;
    const hit = nrGlyphCache.get(key);
    if (hit) return hit;
    const lean = Math.sin((dialLeanDeg * Math.PI) / 180);
    const feet = dialFeet(lean, unitMm);
    const glyphs = nrRoman(v).split('');
    const widths = glyphs.map((g) => (g === 'I' ? 1 : DIAL_VX_WIDTH));
    const total = widths.reduce((a, b) => a + b, 0) + DIAL_GLYPH_GAP * (glyphs.length - 1);
    const offs = [];
    const leans = [];
    let cur = -total / 2;
    for (let i = 0; i < glyphs.length; i++) {
        const gc = cur + widths[i] / 2;
        if (glyphs[i] === 'I') { offs.push(gc); leans.push(0); }
        else if (glyphs[i] === 'V') {
            offs.push(gc - feet.v, gc + feet.v); leans.push(-lean, lean);
        } else {
            offs.push(gc - feet.x, gc + feet.x); leans.push(lean, -lean);
        }
        cur += widths[i] + DIAL_GLYPH_GAP;
    }
    const g = { offs: offs.map((o) => o * unitMm), leans, half: (total / 2) * unitMm };
    nrGlyphCache.set(key, g);
    return g;
}

function nrSite(k) { const N = nrState.N; return ((k % N) + N) % N; }
function nrWrapS(x, L) { let d = ((x % L) + L) % L; if (d >= L / 2) d -= L; return d; }

// 群れの並び（リングの順）。groups[i] は s0 から数えて連続する c 本を持つ
function nrStarts() {
    const st = nrState;
    const out = [];
    let at = st.s0;
    for (const g of st.groups) { out.push(at); at += g.c; }
    return out;
}

function nrLog(text) {
    const st = nrState;
    st.log.unshift(text);
    if (st.log.length > 3) st.log.length = 3;
}

// 並び直したあとの位置が、いまの位置からいちばん動かずにすむよう、
// 1周を等分した格子の置き場所（base）を選ぶ
function nrRebase() {
    const st = nrState;
    const L = perimMm();
    const m = st.groups.length;
    const starts = nrStarts();
    let sx = 0;
    let sy = 0;
    for (let i = 0; i < m; i++) {
        const g = st.groups[i];
        // その群れのいまの中心（持っているバーの位置の平均）
        let gx = 0;
        let gy = 0;
        for (let j = 0; j < g.c; j++) {
            const a = (st.pos[nrSite(starts[i] + j)] / L) * Math.PI * 2;
            gx += Math.cos(a); gy += Math.sin(a);
        }
        const c = (Math.atan2(gy, gx) / (Math.PI * 2)) * L;
        const a = ((c - (i * L) / m) / L) * Math.PI * 2;
        sx += Math.cos(a) * g.c; sy += Math.sin(a) * g.c;
    }
    st.base = wrapMm((Math.atan2(sy, sx) / (Math.PI * 2)) * L, L);
}

// 余り r 本を、v（c 本）の数字が受け取ったらどうなるか。
// r 本で書ける数 u のうち、v + u の画数がちょうど c + r 本になるものがあれば、足し算として成り立つ
function nrAbsorb(v, c, r) {
    const us = NR_BY_STROKES[r] || [];
    let best = null;
    for (const u of us) {
        const sum = v + u;
        if (sum <= NR_MAX && nrStrokes(sum) === c + r) {
            if (!best || Math.abs(u - r) < Math.abs(best.u - r)) best = { u, v2: sum, exact: true };
        }

    if (best) return best;
    const near = v + (nrValueFor(r, r) || r);
    const alt = nrValueFor(c + r, near);
    return alt && alt <= NR_MAX ? { u: null, v2: alt, exact: false } : null;

function nrMergeOptions() {

    for (let i = 0; i < m; i++) {
        const a = st.groups[i];

            const nx = st.groups[(i + 2) % m];

            const okN = nx !== a && nrAbsorb(nx.v, nx.c, r);
            const okP = pv !== b && nrAbsorb(pv.v, pv.c, r);
            exact = !!((okN && okN.exact) || (okP && okP.exact));

    const st = nrState;
    const out = [];
    st.groups.forEach((g, i) => {
        for (let a = 1; a < g.v; a++) {
            const b = g.v - a;
            if (nrStrokes(a) + nrStrokes(b) === g.c) out.push({ i, a, b, bal: Math.abs(a - b) });
        }

function nrPick(list, weight) {
    if (!list.length) return null;
    const w = list.map(weight);
    let r = Math.random() * w.reduce((x, y) => x + y, 0);
    for (let i = 0; i < list.length; i++) { r -= w[i]; if (r <= 0) return list[i]; }
    return list[list.length - 1];
}

    const place = (side, hsList, Rs) => {

                return sum + 2 * Math.max(0, (t - Z) / 2);

        const rv = nrValueFor(k, k) || 1;          // 余りの本数が表す数
        const idx = st.groups.indexOf(merged);
        const M = st.groups.length;
        const plan = (side) => {
            if (M < 2) return null;
            const ni = side > 0 ? (idx + 1) % M : (idx - 1 + M) % M;
            const nb = st.groups[ni];
            if (!nb || nb === merged) return null;
            const ab = nrAbsorb(nb.v, nb.c, r);
            return ab ? { side, ni, nb, v2: ab.v2, u: ab.u, exact: ab.exact } : null;
        };
        const cand = [plan(1), plan(-1)].filter(Boolean);
        // 足し算がぴったり成り立つほうを優先。どちらも同じなら、うしろ（b 側）へ
        cand.sort((x, y) => (y.exact - x.exact) || (y.side - x.side));
        const pl = cand[0];
        merged.c = need;
        if (pl) {
            const before = nrRoman(pl.nb.v);
            pl.nb.c += r;
            pl.nb.v = pl.v2;
            pl.nb.p = false;
            pl.nb.t = st.ev;
            // 輪のつなぎ目をまたいで受け渡すときは、先頭の位置を合わせる
            if (pl.side > 0 && pl.ni === 0) st.s0 = nrSite(st.s0 - r);
            if (pl.side < 0 && idx === 0) st.s0 = nrSite(st.s0 + r);
            st.recv = pl.nb;
            text += pl.exact
                ? `（余り${r}本を外へ → ${before} + ${nrRoman(pl.u)} = ${nrRoman(pl.v2)}）`
                : `（余り${r}本を外へ → ${before} に合流して ${nrRoman(pl.v2)}）`;
        } else {
            // どちらの隣にも収まらないときだけ、余りをその場で新しい数字にする
            const nv = rv;
            const cx = wrapMm(merged.cx + nrGlyphHalf(merged.v) + nrGapMm() + nrGlyphHalf(nv), L0);
            st.groups.splice(idx + 1, 0, { v: nv, c: r, cx });
            text += `（余り${r}本から ${nrRoman(nv)}）`;
        }
    } else if (merged.c < need) {
        // 不足は、うしろのとなりからもらう
        const k = need - merged.c;
        const idx = st.groups.indexOf(merged);
        const nb = st.groups[(idx + 1) % st.groups.length];
        if (nb && nb !== merged && nb.c >= k) {
            const before = nrRoman(nb.v);
            nb.c -= k;
            nb.p = false;
            merged.c += k;
            // もらう相手が輪のつなぎ目の向こう（先頭）にいるときは、先頭の位置もずらす
            if (st.groups.indexOf(nb) === 0 && idx === st.groups.length - 1) st.s0 = nrSite(st.s0 + k);
            if (nb.c <= 0) {
                st.groups.splice(st.groups.indexOf(nb), 1);
                text += `（${before} をまるごともらう）`;
            } else {
                nb.v = nrValueFor(nb.c, nb.v) || nb.v;
                text += `（${before} から${k}本もらって ${before}→${nrRoman(nb.v)}）`;
            }
        } else {
            merged.v = nrValueFor(merged.c, merged.v) || merged.v;
            text += `（足りないので ${nrRoman(merged.v)}）`;
        }
    }
    // 今回変わった数字（合流した数字・余りの数字・本数をもらった隣）に印をつける
    const tag = st.ev;
    merged.t = tag;
    const mi = st.groups.indexOf(merged);
    const after = st.groups[(mi + 1) % st.groups.length];
    if (after && after !== merged && !st.recv) after.t = tag;
    st.recv = null;
    st.lastPos = merged.cx;
    nrRemember(merged.cx);
    nrLog(text);
}

// 引き算。i が a と b に分かれる
function nrDoSplit(opt) {
    const st = nrState;
    nrPinCentres();
    const L0 = perimMm();
    const g = st.groups[opt.i];
    const ca = nrStrokes(opt.a);
    // 分かれた2つは、まずその場で少しだけ離れる
    const ha = nrGlyphHalf(opt.a);
    const hb = nrGlyphHalf(opt.b);
    const tot = 2 * ha + nrGapMm() + 2 * hb;
    st.groups.splice(opt.i, 1,
        { v: opt.a, c: ca, cx: wrapMm(g.cx - tot / 2 + ha, L0) },
        { v: opt.b, c: g.c - ca, cx: wrapMm(g.cx + tot / 2 - hb, L0) });
    st.lastKind = 'split';
    st.groups[opt.i].t = st.ev;
    st.groups[opt.i + 1].t = st.ev;
    st.lastPos = g.cx;
    nrRemember(g.cx);
    nrLog(`${nrRoman(g.v)} → ${nrRoman(opt.a)} + ${nrRoman(opt.b)}`);
}

// 直近に動いた場所（新しい順に2つ）
function nrRemember(pos) {
    const st = nrState;
    st.recent = [pos].concat(st.recent || []).slice(0, 2);
}

// 次の一手を選んで起こす。うまくいったら true
function nrStep() {
    const st = nrState;
    const { lo, hi } = nrRange();
    const m = st.groups.length;
    const L = perimMm();
    const prevTag = st.ev || 0;
    st.ev = prevTag + 1;
    // 直前に変わった数字は、続けて動かさない。
    // さらに、直前の場所から離れたところほど選ばれやすくする
    const fresh = (g) => prevTag > 0 && g.t === prevTag;
    const farW = (i) => {
        if (!Number.isFinite(st.lastPos)) return 1;
        const c = st.base + ((i + 0.5) * L) / Math.max(1, m);
        const d = Math.abs(nrWrapS(c - st.lastPos, L)) / (L / 2);
        return 0.15 + d * d;
    };
    // 候補の場所（いまの持ち場で測る）
    const lay = nrLayout();
    const posMerge = (o) => wrapMm(lay[o.i] + nrWrapS(lay[(o.i + 1) % m] - lay[o.i], L) / 2, L);
    const posSplit = (o) => lay[o.i];
    const D = L / Math.max(1, m);
    // 直前に動いた場所のまわり（となりの数字まで含む）と、その前に動いた場所は避ける。
    // 候補がなくなるときだけ、条件を順にゆるめる
    const avoid = (list, touched, where) => {
        const recent = st.recent || [];
        const tiers = [
            [Math.max(D * 1.6, 480), D * 1.1],
            [Math.max(D * 1.6, 480), 0],
            [D * 1.1, 0],
            [0, 0],
        ];
        for (const [r0, r1] of tiers) {
            const ok = list.filter((o) => {
                if (touched(o)) return false;
                const c = where(o);
                if (recent[0] !== undefined && Math.abs(nrWrapS(c - recent[0], L)) < r0) return false;
                if (recent[1] !== undefined && Math.abs(nrWrapS(c - recent[1], L)) < r1) return false;
                return true;
            });
            if (ok.length) return ok;
        }
        const ok = list.filter((o) => !touched(o));
        return ok.length ? ok : list;
    };
    if (m <= lo) st.dirCount = 1;
    if (m >= hi) st.dirCount = -1;
    const tryDown = () => {
        const touched = (o) => fresh(st.groups[o.i]) || fresh(st.groups[(o.i + 1) % m]);
        const ops = avoid(nrMergeOptions(), touched, posMerge);
        const exact = ops.filter((o) => o.exact);
        // 小さい数どうしの足し算ほど、直前の場所から遠いほど選ばれやすい
        const w = (o) => farW(o.i) / o.s;
        const pick = nrPick(exact, w) || nrPick(ops, w);
        if (!pick) return false;
        nrDoMerge(pick);
        return true;
    };
    const tryUp = () => {
        // 大きい数ほど、半分に近い分け方ほど選ばれやすい
        const ops = avoid(nrSplitOptions(), (o) => fresh(st.groups[o.i]), posSplit);
        const pick = nrPick(ops,
            (o) => (Math.pow(st.groups[o.i].v, 1.2) / (1 + o.bal)) * farW(o.i - 0.5));
        if (!pick) return false;
        nrDoSplit(pick);
        return true;
    };
    let ok = st.dirCount < 0 ? tryDown() : tryUp();
    if (!ok) {
        // この向きにはもう動けない。向きを変える
        st.dirCount = -st.dirCount;
        ok = st.dirCount < 0 ? tryDown() : tryUp();
    }
    return ok;
}

// 文字盤に組む（MODE5 と同じ形）。I〜XII の画数の合計がちょうど36本なので、
// 並び順のまま数字に割り振って、いちばん動かずにすむ回し方を選ぶ
function nrMakeDial(nowMs) {
    const st = nrState;
    const N = st.N;
    const L = perimMm();
    const top = (straightLength / 2) / Math.max(1, perimeterLength);
    st.groups = [];
    let total = 0;
    for (let h = 1; h <= 12; h++) total += nrStrokes(h);
    if (total !== N) {
        // 36本でないとき（ふつうは起きない）は、2本ずつの II で埋める
        for (let k = 0; k < N; ) { const c = Math.min(2, N - k); st.groups.push({ v: c, c }); k += c; }
        st.s0 = 0;
        st.base = 0;
    } else {
        const tg = [];
        for (let h = 1; h <= 12; h++) {
            const c = wrapMm((top + h / 12) * L, L);
            for (const off of nrGlyph(h).offs) tg.push(wrapMm(c + off, L));
        }
        let bestO = 0;
        let bestC = Infinity;
        for (let o = 0; o < N; o++) {
            let cost = 0;
            for (let i = 0; i < N; i++) {
                const d = nrWrapS(st.pos[nrSite(o + i)] - tg[i], L);
                cost += d * d;
            }
            if (cost < bestC) { bestC = cost; bestO = o; }
        }
        // p＝まだ MODE5 の形のままの数字。大きく動くまでは形の補正をかけない
        for (let h = 1; h <= 12; h++) {
            st.groups.push({ v: h, c: nrStrokes(h), p: true, home: wrapMm((top + h / 12) * L, L) });
        }
        st.s0 = bestO;
        st.base = wrapMm((top + 1 / 12) * L, L);
    }
    st.phase = 'dial';
    st.pristine = true;
    st.t0 = nowMs;
    st.dirCount = -1;
    st.log = [];
}

function nrReset(nowMs) {
    const n = layers[0].boids.length;
    const N = n * layers.length;
    nrState = {
        n, N, pos: new Float64Array(N), vel: new Float64Array(N), lean: new Float64Array(N),
        target: new Float64Array(N), want: new Float64Array(N),
        swayF: new Float64Array(N), swayP: new Float64Array(N), gid: new Int32Array(N),
        groups: [], s0: 0, base: 0, dirCount: -1,
        phase: 'dial', t0: nowMs, vCap: 0, statusAt: 0, log: [],
    };
    const st = nrState;
    for (let k = 0; k < N; k++) {
        st.swayF[k] = (0.0006 + Math.random() * 0.0006);
        st.swayP[k] = Math.random() * Math.PI * 2;
    }
    const L = perimMm();
    const r0 = L / N;
    const bs0 = ringOf(layers[0]);
    let sx = 0;
    let sy = 0;
    for (let j = 0; j < n; j++) {
        const a = ((bs0[j].arcFraction * L - 2 * j * r0) / L) * Math.PI * 2;
        sx += Math.cos(a); sy += Math.sin(a);
    }
    const base = wrapMm((Math.atan2(sy, sx) / (Math.PI * 2)) * L, L);
    for (let j = 0; j < n; j++) bs0[j].nrSite = 2 * j;
    for (let li = 1; li < layers.length; li++) {
        const bs = ringOf(layers[li]);
        let bestS = 0;
        let bestC = Infinity;
        for (let s = 0; s < n; s++) {
            let c = 0;
            for (let j = 0; j < n; j++) {
                const k = layers.length * ((j + s) % n) + li;
                const d = nrWrapS(bs[j].arcFraction * L - (base + k * r0), L);
                c += d * d;
            }
            if (c < bestC) { bestC = c; bestS = s; }
        }
        for (let j = 0; j < n; j++) bs[j].nrSite = layers.length * ((j + bestS) % n) + li;
    }
    for (const layer of layers) {
        for (const b of layer.boids) st.pos[b.nrSite] = b.arcFraction * L;
    }
    nrMakeDial(nowMs);
}

function nrUpdateState(elapsedMs, dtMs) {
    if (!nrState || layers.some((l) => l.boids.length !== nrState.n)
        || layers.some((l) => l.boids.some((b) => !Number.isFinite(b.nrSite)))) {
        nrReset(elapsedMs);
        return;
    }
    const st = nrState;
    const { N, pos, vel, target, want } = st;
    const L = perimMm();
    const dt = Math.min(50, dtMs) / 1000;
    const cruise = Math.max(1, cruiseMmS());
    const phMs = elapsedMs - st.t0;

    // --- 段取り：文字盤 → 止まって見せる → 一か所だけ変える → 並び直す → … ---
    if (st.phase === 'dial' && phMs > Math.max(1, nrGasSec) * 1000) {
        st.phase = 'wait'; st.t0 = elapsedMs; st.roomChecked = false; st.roomTries = 0;
    } else if (st.phase === 'wait' && phMs > 400 && !st.roomChecked) {
        // 並び終えたら一度だけ車間を確かめ、足りなければ押し広げて並べ直す
        st.roomChecked = true;
        if (nrCheckRoom(elapsedMs) && (st.roomTries || 0) < 3) {
            st.roomTries = (st.roomTries || 0) + 1;
            st.layKey = null;
            st.phase = 'move'; st.t0 = elapsedMs; st.vCap = 0; st.moveKind = 'plain'; st.gCap = null;
        }
    } else if (st.phase === 'wait' && phMs > Math.max(0.3, nrGapSec) * 1000) {
        if (nrStep()) {
            st.roomTries = 0;
            st.pristine = false;
            st.layKey = null;
            st.moveKind = 'plain';
            st.gCap = null;
            if (st.lastKind === 'split') {
                // 分裂は、全体の車間の調整と同時に行う（分かれた2つが、
                // それぞれ新しい持ち場まで大きく離れていくのが見えるように）
                nrRebase();
                for (const g of st.groups) delete g.cx;
                st.phase = 'move';
            } else {
                // 足し算は、まず合流する数字だけがその場で合流し、
                // 合流し終わった直後に、周りが車間を整えはじめる
                st.phase = 'merge';
            }
            st.t0 = elapsedMs;
            st.vCap = 0;
            st.settledAt = 0;
        } else {
            st.t0 = elapsedMs;
        }
    }

    // --- 持ち場：グループ数ごとに1周を等分した場所。数字の形は MODE5 と同じ ---
    const m = st.groups.length;
    const starts = nrStarts();
    const xPairs = [];
    const vPairs = [];
    for (let i = 0; i < m; i++) {
        const g = st.groups[i];
        const gl = nrGlyph(g.v);
        {
            let j = 0;
            for (const ch of nrRoman(g.v)) {
                if (ch === 'I') { j++; continue; }
                if (j + 1 < g.c && !(st.phase === 'dial' || g.p)) {
                    const pr = { a: nrSite(starts[i] + j), b: nrSite(starts[i] + j + 1),
                        s: Math.asin(clamp(gl.leans[j], -1, 1)) };
                    if (ch === 'X') xPairs.push(pr); else vPairs.push(pr);
                }
                j += 2;
            }
        }
        const centre = (st.phase === 'merge' && Number.isFinite(g.cx))
            ? nrClearCentre(g.cx, gl.half) : nrLayout()[i];
        // 数字ひとかたまりをレールの中心から放射状に向け、画の倒し方はそのまま足す（MODE5 と同じ）
        let block = Math.asin(clamp(radialLeanAt(centre / L) * DIAL_RADIAL_MIX, -1, 1));
        const need = gl.offs.length;
        // 天板の長いバーでは、数字が大きく傾く場所（角の近く）で、同じ数字の中の
        // 1本おきの画が先端で交わることがある。そのときは画の形はそのままに、
        // 数字ひとかたまりの傾き（放射状の向き）だけを少し起こす。
        if (!(st.phase === 'dial' || g.p)) {
            const barMm = getNormalLineLength() / Math.max(1e-9, mmToPx);
            const tn = (a) => Math.tan(clamp(a, -1.25, 1.25));
            const ok = (bk) => {
                for (let j = 0; j + 2 < Math.min(g.c, need); j++) {
                    const d = gl.offs[j + 2] - gl.offs[j];
                    const a = bk + Math.asin(clamp(gl.leans[j], -1, 1));
                    const b = bk + Math.asin(clamp(gl.leans[j + 2], -1, 1));
                    if ((tn(a) - tn(b)) * barMm > d - MIN_GAP_MM * 1.2) return false;
                }
                return true;
            };
            if (!ok(block)) {
                let lo = 0;
                let hi = 1;
                for (let it = 0; it < 12; it++) {
                    const mid = (lo + hi) / 2;
                    if (ok(block * mid)) lo = mid; else hi = mid;
                }
                block *= Math.max(0.35, lo);
            }
        }
        // 画の位置と倒し方は MODE5 の字形そのまま（ずらしたり曲げたりしない）
        const offs = [];
        const lw = [];
        for (let j = 0; j < g.c; j++) {
            offs.push(j < need ? gl.offs[j] : gl.offs[need - 1] + (j - need + 1) * dialUnitMm());
            lw.push(Math.sin(block + Math.asin(clamp(j < need ? gl.leans[j] : 0, -1, 1))));
        }
        for (let j = 0; j < g.c; j++) {
            const k = nrSite(starts[i] + j);
            st.gid[k] = i;
            const slot = Math.min(j, need - 1);
            const off = offs[j];
            const sl = j < need ? gl.leans[slot] : 0;
            // バーだけ、ごくわずかに揺らす（数字の位置は動かさない）
            const w = Math.sin(elapsedMs * st.swayF[k] + st.swayP[k]);
            target[k] = wrapMm(centre + off + w * 2.5 * nrSway, L);
            want[k] = clamp(Math.sin(block + Math.asin(clamp(sl, -1, 1)) + w * 0.035 * nrSway),
                -0.95, 0.95);
        }
    }

    // MODE5 の形のままの数字も、元の場所から大きく動いたら、形の補正をかけはじめる
    if (st.phase !== 'dial') {
        for (let i = 0; i < m; i++) {
            const g = st.groups[i];
            if (!g.p) continue;
            let x = 0;
            let y = 0;
            for (let j = 0; j < g.c; j++) {
                const a = (pos[nrSite(starts[i] + j)] / L) * Math.PI * 2;
                x += Math.cos(a); y += Math.sin(a);
            }
            const c = (Math.atan2(y, x) / (Math.PI * 2)) * L;
            if (!Number.isFinite(g.home) || Math.abs(nrWrapS(c - g.home, L)) > NR_KEEP_MM) g.p = false;
        }
    }

    // --- X の交点を、見えている帯（天板の縁〜ロの字の内縁）の真ん中にそろえる ---
    // 足元の間隔を字形で決め打ちにすると、角の近くではレールの向きが2本の足元で
    // ちがうぶん交点が板の下へ潜り（V や II に見える）、倒し方を戻した X では
    // 交点が上に寄って「^」に見えた。X ごとに、実際の向きから足元の間隔と開きを解き直す。
    const xMate = new Map();
    // V と X は2画でひと文字。ならすときは2画を一緒に回して、文字の形を保つ
    for (const pr of xPairs.concat(vPairs)) { xMate.set(pr.a, pr.b); xMate.set(pr.b, pr.a); }
    if (st.phase !== 'dial') nrFixX(xPairs, true);

    // --- 同じレイヤーのバーが、先端で交わらないように倒し方をならす ---
    // 数字の中は上で間を空けてあるが、となりの数字との境目（とくに角の近く）は、
    // 放射状の向きの差で交わることがある。交わる組だけ、倒し方を互いに少し戻す。
    // 角ではレールの向き自体が開いているので、そのぶんは差し引いて考える。
    if (st.phase !== 'dial') {
        const barMm = getNormalLineLength() / Math.max(1e-9, mmToPx);
        const tn = (l) => Math.tan(Math.asin(clamp(l, -0.95, 0.95)));
        const un = (t) => Math.sin(Math.atan(t));
        for (let pass = 0; pass < 4; pass++) {
            for (let k = 0; k < N; k++) {
                const j = (k + 2) % N;
                // 天板の長いバーでは、XV の X と V のように、同じ数字の中でも
                // 1本おきの画が交わる。V・X は2画まとめて回すので、文字の形は崩れない
                // MODE5 の形のままの数字の中は、さわらない
                if (st.gid[j] === st.gid[k] && st.groups[st.gid[k]] && st.groups[st.gid[k]].p) continue;
                const d = nrWrapS(target[j] - target[k], L);
                const pa = getPointOnPerimeter(target[k] / L);
                const pb = getPointOnPerimeter(target[j] / L);
                const turn = Math.abs(Math.atan2(pb.nx * pa.ny - pb.ny * pa.nx, pb.nx * pa.nx + pb.ny * pa.ny));
                const allow = (d - MIN_GAP_MM * 1.3) / barMm + Math.tan(Math.min(1.2, turn));
                const tk = tn(want[k]);
                const tj = tn(want[j]);
                const over = tk - tj - allow;
                if (over > 0) {
                    // X の画は、相方の画も同じだけ回して、X の開き（形）を保つ
                    const setW = (q, nw) => {
                        const mate = xMate.get(q);
                        if (mate !== undefined) {
                            const d = Math.asin(clamp(nw, -0.95, 0.95)) - Math.asin(clamp(want[q], -0.95, 0.95));
                            want[mate] = clamp(Math.sin(Math.asin(clamp(want[mate], -0.95, 0.95)) + d), -0.95, 0.95);
                        }
                        want[q] = nw;
                    };
                    setW(k, un(tk - over / 2));
                    setW(j, un(tj + over / 2));
                }
            }
        }
    }

    // 倒し方をならしたあとの傾きで、X の足元の間隔をもう一度解き直す
    if (st.phase !== 'dial') nrFixX(xPairs, false);

    // --- 模型を動かす。並び直しは、およそ nrStepSec 秒で終わる速さで ---
    if ((st.phase === 'move' || st.phase === 'merge') && !st.vCap) {
        let far = 0;
        let farT = 0;
        const gFar = new Float64Array(m);
        const touched = (i) => st.groups[i] && st.groups[i].t === st.ev;
        for (let k = 0; k < N; k++) {
            const d = Math.abs(nrWrapS(target[k] - pos[k], L));
            far = Math.max(far, d);
            const gi = st.gid[k];
            if (touched(gi)) farT = Math.max(farT, d);
            else gFar[gi] = Math.max(gFar[gi], d);
        }
        // 実際のバーが遅れずについてこられる速さまで（遅れると、となりと交わりやすい）
        if (st.moveKind === 'merge' && farT > 1) {
            // 合流する数字の速さで、合流にかかる時間 T を決める
            st.vCap = clamp((farT / Math.max(0.5, nrStepSec)) * 1.6, cruise * 0.3, cruise * 1.1);
            const T = farT / st.vCap;
            // 周りは少し遅れて動き出し、T のころに着く速さで（数字ごとにそろえて、形を崩さない）
            st.delayS = Math.min(0.5, T * 0.3);
            const span = Math.max(0.4, (T - st.delayS) * 0.85);
            st.gCap = Float64Array.from(gFar, (d) => clamp(d / span, cruise * 0.05, st.vCap));
        } else {
            st.vCap = clamp((far / Math.max(0.5, nrStepSec)) * 1.6, cruise * 0.3, cruise * 1.1);
            st.gCap = null;
        }
    }
    const vCap = (st.phase === 'move' || st.phase === 'merge') ? st.vCap : cruise * 1.2;
    const gain = 3 / Math.max(0.5, nrStepSec / 2);
    let worst = 0;
    for (let k = 0; k < N; k++) {
        const diff = nrWrapS(target[k] - pos[k], L);
        worst = Math.max(worst, Math.abs(diff));
        let cap = vCap;
        if (st.phase === 'move' && st.gCap) {
            const gi = st.gid[k];
            if (!(st.groups[gi] && st.groups[gi].t === st.ev)) {
                cap = phMs < st.delayS * 1000 ? 0 : (st.gCap[gi] || vCap);
            }
        }
        const v = clamp(diff * gain, -cap, cap);
        pos[k] = wrapMm(pos[k] + v * dt, L);
        vel[k] = v;
    }
    // 追い越しは起きないはずだが、念のため最小の間隔を守らせる
    const gmin = MIN_GAP_MM * 0.62;
    for (let pass = 0; pass < 2; pass++) {
        for (let k = 0; k < N; k++) {
            const k2 = (k + 1) % N;
            const d = nrWrapS(pos[k2] - pos[k], L);
            if (d < gmin) {
                const push = (gmin - d) / 2;
                pos[k] = wrapMm(pos[k] - push, L);
                pos[k2] = wrapMm(pos[k2] + push, L);
            }
        }
    }
    for (let k = 0; k < N; k++) {
        if (!Number.isFinite(pos[k])) { nrReset(elapsedMs); return; }
        st.lean[k] += (want[k] - st.lean[k]) * 0.1;
    }
    // 並び直しが終わったら（実際のバーも追いついたら）、また止まって見せる
    if (st.phase === 'move' || st.phase === 'merge') {
        let lag = 0;
        for (const layer of layers) {
            for (const b of layer.boids) {
                lag = Math.max(lag, Math.abs(nrWrapS(b.arcFraction * L - pos[b.nrSite], L)));
            }
        }
        const done = (worst < 4 && lag < 10) || phMs > Math.max(2, nrStepSec * 4) * 1000;
        if (st.phase === 'merge') {
            // 2) 合流・分裂が済んで、ひと呼吸おいたら、全体の車間を整える
            // 合流し終わったら、間をおかずに周りの車間調整へ
            const merged = (worst < 4 && lag < 14) || phMs > Math.max(2, nrStepSec * 4) * 1000;
            if (merged && !st.settledAt) st.settledAt = elapsedMs;
            if (st.settledAt) {
                nrRebase();
                for (const g of st.groups) delete g.cx;
                st.phase = 'move';
                st.t0 = elapsedMs;
                st.vCap = 0;
            }
        } else if (done) {
            st.phase = 'wait'; st.t0 = elapsedMs; st.roomChecked = false;
        }
    }
    for (const layer of layers) {
        for (const b of layer.boids) {
            const k = b.nrSite;
            b.nrTarget = pos[k];
            b.nrVel = vel[k];
            // 持ち場から遅れているバーは、そのぶん立て気味にする。
            // 遅れたまま大きく倒していると、となりの数字のバーと先端で交わるため
            const lag = Math.abs(nrWrapS(b.arcFraction * L - pos[k], L));
            b.nrLean = st.lean[k] * clamp(1 - (lag - 6) / 50, 0.25, 1);
        }
    }

    if (elapsedMs - st.statusAt > 250) {
        st.statusAt = elapsedMs;
        const { lo, hi } = nrRange();
        // 12時の位置から時計回りに読む
        const top = (straightLength / 2) / Math.max(1, perimeterLength);
        const order = st.groups.map((g, i) => ({ g, f: ((((st.base + (i * L) / m) / L - top) % 1) + 1) % 1 }))
            .sort((a, b) => a.f - b.f);
        let text = `${order.map((o) => nrRoman(o.g.v)).join(' · ')}`
            + `\n${m}グループ（範囲 ${lo}〜${hi}・いまは${st.dirCount < 0 ? '減らす' : '増やす'}向き）`;
        if (st.phase === 'dial') {
            text += `\n文字盤（あと${Math.max(0, Math.ceil(nrGasSec - phMs / 1000))}秒で動き出します）`;
        }
        if (st.log.length) text += `\n${st.log.join('\n')}`;
        setStatus('nrStatusValue', text);
    }
}

// 2本の画（足元 ua < ub の位置、傾き ta, tb[rad]）が交わる高さ（根元からの mm）
function nrCrossHeight(ua, ub, ta, tb, L) {
    const P = getPointOnPerimeter(wrapMm(ua, L) / L);
    const Q = getPointOnPerimeter(wrapMm(ub, L) / L);
    const k = 1 / Math.max(1e-9, mmToPx);
    const dA = { x: P.nx * Math.cos(ta) - P.ny * Math.sin(ta), y: P.ny * Math.cos(ta) + P.nx * Math.sin(ta) };
    const dB = { x: Q.nx * Math.cos(tb) - Q.ny * Math.sin(tb), y: Q.ny * Math.cos(tb) + Q.nx * Math.sin(tb) };
    const den = dA.x * dB.y - dA.y * dB.x;
    if (Math.abs(den) < 1e-9) return Infinity;
    const wx = (Q.x - P.x) * k;
    const wy = (Q.y - P.y) * k;
    const t = (wx * dB.y - wy * dB.x) / den;
    return t > 0 ? t : Infinity;
}
function nrPsi(u, L) { const P = getPointOnPerimeter(wrapMm(u, L) / L); return Math.atan2(P.ny, P.nx); }
function nrFixX(pairs, shape) {
    const st = nrState;
    const L = perimMm();
    const hid = dialHiddenMm();
    const band = showTopPlate ? dialBandMm() : BAR_LENGTH_SHORT_MM;
    const hGoal = hid + (showTopPlate ? DIAL_X_CROSS_PLATE : DIAL_X_CROSS) * band;
    const dMin = MIN_GAP_MM * 0.62 / 2 + 2;
    const dMax = dialUnitMm() * 1.6;
    for (const pr of pairs) {
        const { a, b } = pr;
        const c = wrapMm(st.target[a] + nrWrapS(st.target[b] - st.target[a], L) / 2, L);
        let half = Math.max(dMin, Math.abs(nrWrapS(st.target[b] - st.target[a], L)) / 2);
        // 2画の傾きの平均はそのまま、開きは字形どおり（角ではレールの向きの差を足して打ち消す）
        const mean = (Math.asin(clamp(st.want[a], -0.95, 0.95)) + Math.asin(clamp(st.want[b], -0.95, 0.95))) / 2;
        let ta = Math.asin(clamp(st.want[a], -0.95, 0.95));
        let tb = Math.asin(clamp(st.want[b], -0.95, 0.95));
        for (let it = 0; it < 2; it++) {
            if (shape) {
                const turn = nrWrapS(nrPsi(c + half, L) - nrPsi(c - half, L), Math.PI * 2);
                ta = mean + pr.s + turn / 2;
                tb = mean - pr.s - turn / 2;
            }
            // 足元の間隔を、交点がちょうど hGoal に来るよう二分法で決める
            let lo = dMin;
            let hi = dMax;
            if (nrCrossHeight(c - hi, c + hi, ta, tb, L) < hGoal) { half = hi; continue; }
            for (let q = 0; q < 16; q++) {
                const md = (lo + hi) / 2;
                if (nrCrossHeight(c - md, c + md, ta, tb, L) < hGoal) lo = md; else hi = md;
            }
            half = (lo + hi) / 2;
        }
        st.target[a] = wrapMm(c - half, L);
        st.target[b] = wrapMm(c + half, L);
        st.want[a] = clamp(Math.sin(ta), -0.95, 0.95);
        st.want[b] = clamp(Math.sin(tb), -0.95, 0.95);
    }
}

function nrDrive(boid) {
    if (!Number.isFinite(boid.nrTarget)) return 0;
    return chaseMm(boid, boid.nrTarget, boid.nrVel, 1.3);
}

// ============ MODE26：Boidsから文字盤へ ============
// Boidsで自由に群れていたバーが、等間隔の12グループにまとまり、
// そのグループがそのままローマ数字にほどける。
//
// 文字盤の12個の数字の中心は、もともと1周を12等分した位置にある。
// なので「等間隔の12グループ」の置き場所は、そのまま数字の置き場所になる。
// 大事なのはメンバーで、グループを作る時点で「どのバーがどの数字の何画目か」を
// 先に決めてしまう。レイヤーの中では追い抜きが起きないので、並び順のまま
// 数字の画を順に割り当てれば、グループの顔ぶれ＝数字の画、がずれずに保てる。
//
//   自由     … MODE1と同じBoids（収束なし）
//   まとまる … 12グループの格子が群れの流れる向きへ回りながら減速し、
//              数字の位置でぴたりと止まる。バーは自分のグループの席へ寄っていく
//   グループ … 数字ごとに詰めて並んだ、12の塊のまま保つ
//   数字     … 塊が数字の幅へ開き、画が倒れてローマ数字になる（XIIから時計回りに）
//   ほどく   … 逆をたどって塊へ戻り、Boidsへ返す
let m22FreeSec = 12;
let m22GatherSec = 16;
let m22GroupSec = 3;
let m22FormSec = 5;
let m22DialSec = 10;
let m22Loop = true;
const M22_RELEASE_SEC = 6;
const M22_PACK_RATIO = 0.85;     // グループ内の画の間隔（上下あわせて、最小車間に対する比）
const M22_GATHER_SPEED = 0.8;    // まとまりはじめの格子の速さ（巡航速度に対する比）
let m22 = null;
let m22W = 0;                    // 構造（グループ・数字）の効き。0＝Boidsのまま
let m22Phi = 0;                  // 格子の回転（1周に対する割合）
let m22LatVel = 0;               // 格子の速さ（px/フレーム、符号つき）

function m22Wrap(off) {
    let x = off % 1;
    if (x >= 0.5) x -= 1;
    if (x < -0.5) x += 1;
    return x;
}

// 数字ごとの画を、グループのときの位置・数字のときの位置・倒し方として並べる
function m22Shapes() {
    buildDialTargets();
    const L = perimeterLength;
    const G = (minDistance * M22_PACK_RATIO) / Math.max(1, L);
    const byNum = new Map();
    for (const t of dialTargets) {
        if (!byNum.has(t.numeral)) byNum.set(t.numeral, []);
        byNum.get(t.numeral).push(t);
    }
    const out = [];
    for (const [num, arr] of byNum) {
        arr.sort((a, b) => m22Wrap(a.frac - a.centreFrac) - m22Wrap(b.frac - b.centreFrac));
        const m = arr.length;
        arr.forEach((t, k) => {
            const blockRad = Math.asin(clamp(radialLeanAt(t.centreFrac) * DIAL_RADIAL_MIX, -1, 1));
            const strokeRad = Math.asin(clamp(t.lean, -1, 1));
            out.push({
                numeral: num, idx: k, layer: t.layer, centre: t.centreFrac,
                dialOff: m22Wrap(t.frac - t.centreFrac),
                packOff: (k - (m - 1) / 2) * G,
                lean: clamp(Math.sin(blockRad + strokeRad), -0.95, 0.95),
            });
        });
    }
    return out;
}

function m22Give(b, sh) {
    b.m22Numeral = sh.numeral;
    b.m22Idx = sh.idx;
    b.m22Centre = sh.centre;
    b.m22Pack = sh.packOff;
    b.m22Dial = sh.dialOff;
    b.m22Lean = sh.lean;
}

// 格子を phi だけ回した位置で、いちばん動かずにすむ割り当てを選ぶ。
// レイヤーの中の並び順は崩さない（何番ずらすかだけを選ぶ）
function m22Assign(phi) {
    const shapes = m22Shapes();
    const L = perimeterLength;
    for (let li = 0; li < layers.length; li++) {
        const ts = shapes.filter((x) => x.layer === li)
            .map((x) => ({ x, pos: (((x.centre + phi + x.packOff) % 1) + 1) % 1 }))
            .sort((a, b) => a.pos - b.pos);
        const bs = layers[li].boids.slice().sort((a, b) => a.arcFraction - b.arcFraction);
        const n = Math.min(bs.length, ts.length);
        for (const b of layers[li].boids) b.m22Centre = NaN;
        if (n === 0) continue;
        let bestO = 0;
        let bestCost = Infinity;
        for (let o = 0; o < n; o++) {
            let cost = 0;
            for (let j = 0; j < n; j++) {
                const d = m22Wrap(ts[j].pos - bs[(o + j) % n].arcFraction) * L;
                cost += d * d;
            }
            if (cost < bestCost) { bestCost = cost; bestO = o; }
        }
        for (let j = 0; j < n; j++) m22Give(bs[(bestO + j) % n], ts[j].x);
    }
}

// V・Xの開きなどを変えたとき。顔ぶれはそのままに、形だけ作り直す
function m22Refresh() {
    const shapes = m22Shapes();
    for (const b of layers.flatMap((l) => l.boids)) {
        if (!Number.isFinite(b.m22Centre)) continue;
        const sh = shapes.find((x) => x.numeral === b.m22Numeral && x.idx === b.m22Idx);
        if (sh) m22Give(b, sh);
    }
}

function m22Reset(nowMs) {
    m22 = { phase: 'free', t0: nowMs, dir: 1, phi0: 0, dFrac: 0, dPx: 0, cycle: 0 };
    m22W = 0;
    m22Phi = 0;
    m22LatVel = 0;
    for (const b of layers.flatMap((l) => l.boids)) {
        b.m22Form = 0;
        b.m22Jit = Math.random();
        b.m22Centre = NaN;
    }
}

function m22Smooth(x) { const t = clamp(x, 0, 1); return t * t * (3 - 2 * t); }

// バーごとに少しずつ時間をずらして、いっせいに号令がかかったように見せない
function m22BarW(b) {
    if (m22W <= 0) return 0;
    if (m22W >= 1) return 1;
    const j = (b.m22Jit || 0) * 0.35;
    return m22Smooth((m22W - j) / (1 - j));
}

// 数字への開き方は、XIIから時計回りに波のように伝わる
function m22FormOf(b, P) {
    const s = (((b.m22Numeral || 0) % 12) / 12) * 0.5;
    return m22Smooth((P - s) / 0.5);
}

function m22TargetPx(b) {
    const f = b.m22Form || 0;
    const frac = b.m22Centre + m22Phi + lerp(b.m22Pack, b.m22Dial, f);
    return ((frac % 1) + 1) % 1 * perimeterLength;
}

function m22Drive(b) {
    if (!Number.isFinite(b.m22Centre)) return 0;
    if (m22 && m22.phase === 'gather' && Number.isFinite(b.m22Aim)) {
        // まとまっているあいだは、群れ全体の流れに乗ったまま、
        // 仲間のほうへゆるく寄っていくだけ
        return m22LatVel + towardArc(b, b.m22Aim, 0.9);
    }
    return m22LatVel + towardArc(b, m22TargetPx(b), 1.35);
}

function m22StructSpeed(b, dir) {
    const cruise = Math.max(1e-6, maxSpeed * motionScale);
    const v = m22Drive(b);
    // 持ち場のすぐそばまで寄りきれるよう、止まるしきい値は小さめにしておく
    if (Math.abs(v) < cruise * 0.012) return 0;
    if ((v > 0 ? 1 : -1) !== dir) return 0;   // 逆へ行きたいなら、まず止まる
    return Math.min(Math.abs(v), cruise * 1.8);
}

function m22DesiredDir(b) {
    const cruise = Math.max(1e-6, maxSpeed * motionScale);
    const v = m22Drive(b);
    // 持ち場のすぐそばまで寄りきれるよう、止まるしきい値は小さめにしておく
    if (Math.abs(v) < cruise * 0.012) return 0;
    return v > 0 ? 1 : -1;
}

function m22Enter(phase, nowMs) {
    m22.phase = phase;
    m22.t0 = nowMs;
}

function m22StartGather(nowMs) {
    const all = layers.flatMap((l) => l.boids);
    // 群れがいま流れている向きへ、格子も回しはじめる
    let flow = 0;
    for (const b of all) flow += b.direction * Math.abs(b.speed);
    const dir = flow === 0 ? (Math.random() < 0.5 ? -1 : 1) : (flow > 0 ? 1 : -1);
    const cruise = Math.max(1e-6, maxSpeed * motionScale);
    // いまの群れの流れの速さを、そのまま引き継ぐ
    let along = 0;
    for (const b of all) along += Math.abs(b.speed) * b.direction * dir;
    const v0 = clamp(along / Math.max(1, all.length), cruise * 0.5, cruise * M22_GATHER_SPEED);
    // 速さ v0 から一定の割合で減速して止まると、進む距離は v0·T/2
    const dPx = 0.5 * v0 * (m22GatherSec * 1000 / FRAME_MS);
    m22.v0 = v0;
    // どの数字の群れから固まりはじめるかは、毎回ばらばら
    m22.gDelay = {};
    for (let h = 1; h <= 12; h++) m22.gDelay[h] = Math.random() * 0.35;
    m22.dir = dir;
    m22.dPx = dPx;
    m22.dFrac = dPx / Math.max(1, perimeterLength);
    m22.phi0 = -dir * m22.dFrac;
    m22Phi = m22.phi0;
    m22Assign(m22.phi0);
    for (const b of all) { b.m22Jit = Math.random(); b.m22Form = 0; }
    m22Enter('gather', nowMs);
}

const M22_PHASE_NAMES = {
    free: '自由に群れている', gather: '12グループにまとまっている',
    group: '12グループ', form: '数字になっている', dial: 'ローマ数字', release: 'ほどいている',
};

function m22UpdateState(elapsedMs) {
    if (!m22) m22Reset(elapsedMs);
    const all = layers.flatMap((l) => l.boids);
    // 途中でバーが作り直されたら、顔ぶれが合わなくなるのでやり直す
    if (m22.phase !== 'free' && all.some((b) => !Number.isFinite(b.m22Centre))) {
        m22Reset(elapsedMs);
    }
    const t = (elapsedMs - m22.t0) / 1000;
    let left = 0;
    if (m22.phase === 'free') {
        m22W = 0; m22Phi = 0; m22LatVel = 0;
        for (const b of all) b.m22Form = 0;
        left = m22FreeSec - t;
        if (t >= m22FreeSec) m22StartGather(elapsedMs);
    } else if (m22.phase === 'gather') {
        // 行き先を先に決めて向かわせるのではなく、
        //   ・群れ全体は、いまの流れのまま進み、ゆっくり速度を落としていく
        //   ・その流れの中で、同じ数字になる仲間どうしが寄り集まる（結束）
        //   ・固まった群れどうしが、たがいの間合いを均していく（等間隔）
        // という順で、群れの側から12のまとまりが立ち上がるようにしている。
        // 狙いの位置はすべて「いまの群れ」から測るので、全体がどこを流れていても
        // 引き戻す力は働かない。止まる場所だけは、流れる速さの落とし方で合わせる。
        const T = Math.max(1, m22GatherSec);
        const p = clamp(t / T, 0, 1);
        const L = perimeterLength;
        const TAU = Math.PI * 2;
        // 群れ全体がいま格子のどこにいるか（全員の平均で測る）
        let cx = 0;
        let cy = 0;
        for (const b of all) {
            const a = TAU * (b.arcFraction - (b.m22Centre + b.m22Pack));
            cx += Math.cos(a);
            cy += Math.sin(a);
        }
        const phiM = Math.atan2(cy, cx) / TAU;
        m22Phi = phiM;
        // 止まる場所までの残り（進む向きで測る）から、自然な減速で流れの速さを決める
        const alongPx = m22Wrap(0 - phiM) * m22.dir * L;
        const v0 = m22.v0 || maxSpeed * motionScale * 0.7;
        const aF = (v0 * v0) / (2 * Math.max(1, m22.dPx));
        let vF = Math.sign(alongPx) * Math.sqrt(2 * aF * Math.abs(alongPx));
        vF = clamp(vF, -v0 * 0.4, v0 * 1.1);
        // 時間の終わりに向けては、流れも確実に止める
        vF *= 1 - ramp01(p, 0.9, 1);
        m22LatVel = m22.dir * vF;
        // 数字ごとの群れの、いまの中心
        const gsum = {};
        for (const b of all) {
            const a = TAU * (b.arcFraction - b.m22Pack);
            const g = gsum[b.m22Numeral] || (gsum[b.m22Numeral] = { x: 0, y: 0 });
            g.x += Math.cos(a);
            g.y += Math.sin(a);
        }
        const wp = m22Smooth((p - 0.4) / 0.45);
        for (const b of all) {
            const g = gsum[b.m22Numeral];
            const gc = Math.atan2(g.y, g.x) / TAU;
            const wc = m22Smooth((p - (m22.gDelay[b.m22Numeral] || 0)) / 0.3);
            const coh = m22Wrap(gc + b.m22Pack - b.arcFraction);
            // 最後のひと呼吸だけ、止まる場所へそっと合わせる
            const phiEnd = phiM + m22Wrap(0 - phiM) * ramp01(p, 0.8, 1);
            const place = m22Wrap(b.m22Centre + phiEnd - gc);
            const aim = b.arcFraction + wc * coh + wp * place;
            b.m22Aim = (((aim % 1) + 1) % 1) * L;
        }
        m22W = m22Smooth(p / 0.5);
        left = T - t;
        if (p >= 1) {
            m22Phi = 0; m22LatVel = 0; m22W = 1;
            for (const b of all) b.isLeader = false;
            m22Enter('group', elapsedMs);
        }
    } else if (m22.phase === 'group') {
        m22W = 1; m22Phi = 0; m22LatVel = 0;
        left = m22GroupSec - t;
        if (t >= m22GroupSec) m22Enter('form', elapsedMs);
    } else if (m22.phase === 'form') {
        const P = clamp(t / Math.max(0.5, m22FormSec), 0, 1);
        for (const b of all) b.m22Form = m22FormOf(b, P);
        left = m22FormSec - t;
        if (P >= 1) m22Enter('dial', elapsedMs);
    } else if (m22.phase === 'dial') {
        for (const b of all) b.m22Form = 1;
        left = m22Loop ? m22DialSec - t : Infinity;
        if (m22Loop && t >= m22DialSec) m22Enter('release', elapsedMs);
    } else if (m22.phase === 'release') {
        const p = clamp(t / M22_RELEASE_SEC, 0, 1);
        const P = 1 - ramp01(p, 0, 0.55);
        for (const b of all) b.m22Form = m22FormOf(b, P);
        m22W = 1 - ramp01(p, 0.45, 1);
        left = M22_RELEASE_SEC - t;
        if (p >= 1) {
            m22.cycle++;
            m22W = 0;
            for (const b of all) { b.m22Form = 0; b.m22Centre = NaN; }
            m22Enter('free', elapsedMs);
        }
    }
    const el = document.getElementById('m22StatusValue');
    if (el) {
        const txt = M22_PHASE_NAMES[m22.phase]
            + (Number.isFinite(left) ? `　あと${Math.max(0, Math.ceil(left))}秒` : '');
        if (el.textContent !== txt) el.textContent = txt;
    }
}

// ============ MODE14：群れない ============
// 群れの逆。バーは隣を一切見ない。車間も測らないし、誰がどこにいるかも知らない。
// それぞれが自分の居場所のまわりを、自分だけのテンポで気ままに漂うだけ。
//
// ここで問題になるのは、「ばらけた状態」は放っておいて保たれる状態ではない、
// ということ。互いを見ないものをただ漂わせると、確率的に必ず偶然の塊ができる
// （均等に散っているほうが、むしろ整った状態にあたる）。
// 散らばりを保つには何かしらの情報が要るが、それを隣を測って得るなら
// 結局は群れのルール（分離）になってしまう。
// そこでここでは、あらかじめ散らばった住所をひとつずつ配っておき、
// そのまわりを漂わせている。バーどうしは最後まで一度も参照し合わないが、
// 住所が散っているおかげで、全体としてはばらけたままになる。
//
// 漂いは、比を割り切れない3つの波を重ねて作ってある。
// 周期がそろわないので同じ動きは二度と繰り返さず、
// 何本かが偶然そろう瞬間も訪れない。
const SOLO_R2 = 1.6180339887;   // 黄金比。割り切れない比にして、周期が戻らないようにする
const SOLO_R3 = 2.7182818285;
let soloRangeMm = 260;    // 住所からどれくらい離れて漂うか
let soloTempo = 1.0;      // 漂いの速さ
let soloVariety = 1.0;    // テンポの個体差
let soloKeep = 0;         // 住所を保つ強さ（0＝居場所に縛られず、ひたすら流れ続ける）
// 避け合う強さ。0なら隣を一切見ない（測らない版）。
// 上げていくと、boidsの三つのルールのうち「分離」だけを持った状態になる。
// 集まる力も、向きをそろえる力も入れていないので、群れは一度も生まれない。
// 住所を保つ強さを0にして、こちらだけを上げると、
// 「散らばりを保っているのは避け合いだけ」という純粋な分離ルールの状態になる。
let soloAvoid = 1.0;
let soloStartMs = 0;      // このモードに入った時刻

function soloReset(nowMs) {
    soloStartMs = nowMs;
    for (const layer of layers) {
        const bs = layer.boids.slice().sort((a, b) => a.arcFraction - b.arcFraction);
        const n = bs.length;
        // 住所は1周に等間隔。上のレイヤーは半目盛りずらして、重ならないようにする
        const li = layers.indexOf(layer);
        for (let i = 0; i < n; i++) {
            const b = bs[i];
            b.soloHome = ((i + li * 0.5) / n) % 1;
            // テンポと位相は1本ずつ違う。ここが「二度とそろわない」の素になる
            b.soloSpreadRnd = Math.random();
            b.soloFreqBase = (0.16 + Math.random() * 0.20) / 1000;
            b.soloFreq = b.soloFreqBase * (0.45 + b.soloSpreadRnd * 1.1 * soloVariety);
            b.soloPhase1 = Math.random() * Math.PI * 2;
            b.soloPhase2 = Math.random() * Math.PI * 2;
            b.soloPhase3 = Math.random() * Math.PI * 2;
            b.soloPhase4 = Math.random() * Math.PI * 2;
            b.soloHomeDrift = (Math.random() * 2 - 1) * 0.6;
        }
    }
}

// そのバーの、住所のまわりを漂う目標地点（住所を使うときだけ意味を持つ）
function soloTargetFrac(boid, elapsedMs) {
    const L = perimeterLength;
    const t = elapsedMs * boid.soloFreq * soloTempo;
    const w = soloWave(boid, t);
    return ((boid.soloHome + (w * soloRangeMm * mmToPx) / L) % 1 + 1) % 1;
}

// 比が割り切れない波の重ね合わせ。およそ -1〜1。
// 周期がそろわないので、同じ動きは二度と繰り返さない。
// いちばん遅い成分を強めに入れてあるのが要点で、これがあると
// 同じ向きへ1分以上押し続けることになり、隣を巻き込んで
// 帯ごと流れていく。速い成分だけだと、その場で往復するだけになって
// 動いている量のわりに「行き来しているだけ」に見えてしまう。
function soloWave(boid, t) {
    return (0.95 * Math.sin(t * 0.27 + boid.soloPhase4)
        + Math.sin(t + boid.soloPhase1)
        + 0.6 * Math.sin(t * SOLO_R2 + boid.soloPhase2)
        + 0.35 * Math.sin(t * SOLO_R3 + boid.soloPhase3)) / 2.9;
}

// そのバーが、いま出したい速さ（符号つき。+はarcの進む向き）。
// 三つの成分を足し合わせる。
//   1. 住所へ戻る力  … 決まった居場所の近くに留まる
//   2. 流れ続ける力  … 自分のテンポで、行きたい向きへ進み続ける
//   3. 避け合う力    … 両隣との車間を測って、詰まっているほうから離れる
// レールの上ではバー同士が追い越せないので、住所に縛ると動ける幅が
// 両隣までに限られて単調になる。住所を外して流れ続ける力を主にすると、
// 押し合いながら並びが入れ替わり続け、輪全体がゆっくり流れていく。
function soloDrive(boid, elapsedMs) {
    const L = perimeterLength;
    const cruise = Math.max(1e-6, maxSpeed * motionScale);
    let v = 0;

    // 1) 住所へ戻る力
    if (soloKeep > 0.001) {
        let d = (soloTargetFrac(boid, elapsedMs) - boid.arcFraction) * L;
        if (d > L / 2) d -= L;
        if (d < -L / 2) d += L;
        v += soloKeep * clamp(d / (minDistance * 4), -1.4, 1.4) * cruise;
    }

    // 2) 自分のテンポで流れ続ける力。住所が弱いほど主役になる。
    // いちばん遅い波の周期は数十秒あるので、そのあいだ同じ向きへ押し続ける。
    // 隣も押されて動くので、一本ぶんの移動では終わらず、
    // 帯ごとゆっくり流れるような大きな動きになる。
    const t = elapsedMs * boid.soloFreq * soloTempo;
    v += (1 - soloKeep) * soloWave(boid, t) * cruise * 1.25;

    // 3) 避け合う力（ここだけが隣を測っている）。
    // 距離の逆数で効かせるので、離れているあいだはほとんど働かず、
    // 近づいたときだけ強く押し返す。等間隔に整える力ではなく、
    // 「近づかれたら離れる」という反発として働く。
    // 集まる力も向きをそろえる力も入れていないので、群れは生まれない。
    if (soloAvoid > 0.001) {
        const ref = minDistance * 3;
        const gp = Math.max(minDistance * 0.6, boid.gapPrevPx || ref);
        const gn = Math.max(minDistance * 0.6, boid.gapNextPx || ref);
        const push = Math.min(2, ref / gp) - Math.min(2, ref / gn);
        v += soloAvoid * clamp(push, -2, 2) * cruise * 0.8;
    }
    return v;
}

function updateSpeedVariancePhase(elapsedMs) {
    const phase = (Math.sin((elapsedMs / cycleDuration) * Math.PI * 2) + 1) / 2;
    speedVarianceScale = lerp(LOW_VARIANCE_SCALE, HIGH_VARIANCE_SCALE, phase);
}

class Boid {
    constructor(layer) {
        this.layer = layer;    // どちらのレイヤーに属するか（色の出し分けに使う）
        this.isLeader = false; // リーダーは集団ができたときに動的に生まれる（生成時は全員一般boid）
        this.seamAhead = false; // 収束時、自分とarc順で次のバーとのあいだがグループの継ぎ目か
        this.groupDir = 0;      // 収束時、自分が属する区間の進む向きの多数派（0＝未設定）
        this.dirHoldUntil = 0;  // 群れごと引き返した直後、向きを据え置く時刻
        this.leaderSince = 0;   // リーダーになった時刻（先にいたリーダーを残すために使う）
        this.splitUntil = 0;    // 塊を割るために生まれたリーダーが、前を空けにいく期限
        this.groupShift = 0;    // 等間隔モードで、持ち場までのずれ（+はarcの進む向き）
        this.arcFraction = Math.random();       // トラック上の位置（0〜1、周回）
        this.direction = Math.random() < 0.5 ? 1 : -1; // 進む向き：+1=時計回り、-1=反時計回り
        this.speedFactor = Math.random() * 2 - 1; // 個体ごとの速さの癖（-1〜1）。生涯固定
        this.speed = 0;                          // 現在の速度の大きさ（トラック上のpx/フレーム）

        // 個体ごとに、周期の違う2つの速度の揺らぎを持たせる。
        // ゆっくりした揺らぎが「大きな流れ」を、速い揺らぎが「細かな加減速」を作り、
        // 2つの周期が噛み合わないので速度が一定に落ち着くことがない。
        this.wobblePhase = Math.random() * Math.PI * 2;
        this.wobbleFreq = (0.15 + Math.random() * 0.35) / 1000; // rad/ms（周期およそ 15〜40 秒）
        this.wobblePhase2 = Math.random() * Math.PI * 2;
        this.wobbleFreq2 = (1.2 + Math.random() * 2.0) / 1000;  // rad/ms（周期およそ 2〜5 秒）

        // 加速度が小さいときでもバーが静止しないようにする、ゆるやかな揺れ
        this.swayPhase = Math.random() * Math.PI * 2;
        this.swayFreq = (0.8 + Math.random() * 1.2) / 1000;     // rad/ms（周期およそ 4〜8 秒）

        // 文字盤モードで割り当てられる持ち場と、その画の倒し方
        this.dialFrac = null;
        this.dialLean = 0;
        // ニュートンのゆりかごで、着いた瞬間の古いdialLeanから新しい値へ
        // じわっと混ぜていくための一時的な状態（0＝混ぜていない）
        this.dialLeanFrom = 0;
        this.dialLeanBlendStart = 0;
        this.egoRank = Math.random();  // 持ち場を離れる順番（早い者から崩れていく）
        this.ego = 0;                  // いまどれだけ持ち場を離れているか（0〜1）
        this.packFrac = null;          // 収縮したときに入る場所（数字の中心）
        this.evenFrac = null;          // 爆発したあとに入る場所（1周に等間隔）
        this.burstSpeed = 0;           // 爆発の初速の残り
        this.reform = 0;               // 文字盤へ戻る進み（0〜1）
        this.dialNumeral = 0;          // どの数字の画か
        this.dialCentre = 0;           // その数字の中心
        // MODE7（漂い）で使う、とてもゆっくりした揺らぎ。
        // 個体ごとに癖と周期が少しずつ違うので、そろって動くことがない。
        this.driftCoast = 0;                                    // 漂いに入ったときの勢い
        this.driftRate = 0.6 + Math.random() * 0.9;             // 揺らぎの周期の個体差

// スライダーの「ここまで来ている」ぶんを色で塗る。
// 見た目だけの話なので、値の受け渡しには関わらない。
function paintRange(el) {
    const min = parseFloat(el.min || 0);
    const max = parseFloat(el.max || 100);
    const v = parseFloat(el.value);
    const pct = max > min ? ((v - min) / (max - min)) * 100 : 0;
    el.style.setProperty('--p', `${clamp(pct, 0, 100)}%`);
}

// ============================================================
// エフェクト・スロット（DAWのインサートと同じ考え方）
// ドローン／グレイン／マスターにそれぞれ3つ。直列につながっていて、
// スロットごとに「なし」を含む一種類を選ぶ。つまみは中身によって
// 意味が変わるので、名前も目盛りも選び直すたびに書き換える。
// ============================================================
const FX_SLOTS = 3;
const FX_PARAMS = 6;
const FX_SRCS = ['drone', 'grain', 'master'];
const fxLog = (v, lo, hi) => lo * Math.pow(hi / lo, clamp(sndSafe(v, 0), 0, 1));
const fxPct = (v) => `${Math.round(v * 100)}%`;

// 部屋の反応（インパルス応答）をつくる。
//   長さ     … 尾が消えるまでの秒数
//   ダンピング … 高いところがどれだけ早く吸われるか（布の多い部屋ほど深い）
//   初期反射  … 壁からの最初のいくつかの跳ね返り。空間の大きさが見える
//   広がり    … 左右をどれだけ別々にするか。0で真ん中、1でいっぱいに広がる
// 実際の部屋を測ったものではないが、遅延を回すよりずっと自然に散る。
function makeImpulse(sec, damp, early, width) {
    const rate = actx.sampleRate;
    const s = clamp(sndSafe(sec, 1.5), 0.15, 9);
    const dm = clamp(sndSafe(damp, 0.5), 0, 1);
    const er = clamp(sndSafe(early, 0.6), 0, 1);
    const wd = clamp(sndSafe(width, 0.8), 0, 1);
    const len = Math.max(1, Math.floor(rate * s));
    const buf = actx.createBuffer(2, len, rate);
    const L = buf.getChannelData(0);
    const R = buf.getChannelData(1);
    let lpL = 0;
    let lpR = 0;
    const k0 = 0.92 - 0.62 * dm;          // 鳴りはじめの明るさ
    const k1 = 0.18 + 0.42 * (1 - dm);    // 消えぎわの明るさ
    const pw = 2.0 + s * 0.35;
    for (let i = 0; i < len; i++) {
        const t = i / len;
        const k = k0 + (k1 - k0) * t;
        const env = Math.pow(1 - t, pw);
        lpL += ((Math.random() * 2 - 1) - lpL) * k;
        lpR += ((Math.random() * 2 - 1) - lpR) * k;
        L[i] = lpL * env;
        R[i] = (lpR * wd + lpL * (1 - wd)) * env;
    }
    const taps = [0.0075, 0.011, 0.019, 0.027, 0.041, 0.058, 0.079];
    for (let k = 0; k < taps.length; k++) {
        const a = (0.85 - k * 0.09) * er * 4;
        const iL = Math.floor(rate * taps[k]);
        const iR = Math.floor(rate * taps[k] * (1 + 0.16 * wd));
        if (iL < len) L[iL] += a;
        if (iR < len) R[iR] += a * (wd > 0.5 ? -1 : 1);
    }
    // 長さを変えても効き目が変わらないよう、全体の量をそろえておく
    let e = 0;
    for (let i = 0; i < len; i++) e += L[i] * L[i] + R[i] * R[i];
    // 長さを変えても効き目が変わらないよう、全体の量をそろえておく。
    // この値だと、ミックス100%のときに乾いた音とだいたい同じ大きさになる。
    const g = 1.0 / Math.sqrt(Math.max(1e-9, e / 2));
    for (let i = 0; i < len; i++) { L[i] *= g; R[i] *= g; }
    return buf;
}

function makeFxSlot() {
    const g = () => actx.createGain();
    const inp = g(), dry = g(), wetIn = g(), wetOut = g(), out = g();
    dry.gain.value = 1;
    wetOut.gain.value = 0;
    inp.connect(dry);
    dry.connect(out);
    inp.connect(wetIn);
    wetOut.connect(out);
    return { in: inp, dry, wetIn, wetOut, out, nodes: [], oscs: [], ref: {}, type: 'none' };
}

function makeFxRack() {
    const slots = [];
    for (let i = 0; i < FX_SLOTS; i++) slots.push(makeFxSlot());
    for (let i = 0; i + 1 < FX_SLOTS; i++) slots[i].out.connect(slots[i + 1].in);
    return { in: slots[0].in, out: slots[FX_SLOTS - 1].out, slots };
}

// 歪みの曲線。押し返して丸めるだけなので、切り落とした音にはならない。
function fxSatCurve(drive, bias) {
    const n = 2048, c = new Float32Array(n);
    const k = Math.max(1, drive), b = clamp(bias, 0, 1) * 0.6;
    const norm = Math.tanh(k * (1 + b)) || 1;
    for (let i = 0; i < n; i++) {
        const x = (i / (n - 1)) * 2 - 1;
        c[i] = Math.tanh(k * (x + b * x * x)) / norm;
    }
    return c;
}

// 段の粗さ。値を階段状に丸めると、古い機械のような濁りが出る。
function fxCrushCurve(bits) {
    const n = 4096, c = new Float32Array(n);
    const steps = Math.pow(2, clamp(bits, 2, 16)) / 2;
    for (let i = 0; i < n; i++) {
        const x = (i / (n - 1)) * 2 - 1;
        c[i] = Math.round(x * steps) / steps;
    }
    return c;
}

function fxClear(slot) {
    if (slot.ref.timer) { clearTimeout(slot.ref.timer); slot.ref.timer = null; }
    for (const o of slot.oscs) { try { o.stop(); } catch (e) { /* もう止まっている */ } }
    for (const n of slot.nodes) { try { n.disconnect(); } catch (e) { /* すでに外れている */ } }
    try { slot.wetIn.disconnect(); } catch (e) { /* まだ何もつながっていない */ }
    slot.nodes = [];
    slot.oscs = [];
    slot.ref = {};
}

// スロットの中身を建てる。つまみの値は p[0..5]（0〜1）で渡す。
function fxBuild(slot, type, p) {
    if (!actx) return;
    fxClear(slot);
    slot.type = FX_DEFS[type] ? type : 'none';
    if (slot.type === 'none') return;
    const N = slot.nodes, O = slot.oscs, R = slot.ref;
    const A = actx;
    const put = (...xs) => { for (const x of xs) N.push(x); };

    if (slot.type === 'reverb') {
        // 送り出しの手前に「先送り」と「低域カット」。
        // 部屋の反応そのものは2つ持っていて、形を変えるときに静かに入れ替える。
        const pre = A.createDelay(0.25);
        const hp = A.createBiquadFilter();
        hp.type = 'highpass';
        hp.Q.value = 0.7;
        const cA = A.createConvolver(), cB = A.createConvolver();
        cA.normalize = false;
        cB.normalize = false;
        const gA = A.createGain(), gB = A.createGain();
        gA.gain.value = 1;
        gB.gain.value = 0;
        slot.wetIn.connect(pre);
        pre.connect(hp);
        hp.connect(cA);
        cA.connect(gA);
        cB.connect(gB);
        gA.connect(slot.wetOut);
        gB.connect(slot.wetOut);
        put(pre, hp, cA, cB, gA, gB);
        R.pre = pre; R.hp = hp; R.cA = cA; R.cB = cB; R.gA = gA; R.gB = gB;
        R.useA = true; R.irKey = ''; R.timer = null;
    } else if (slot.type === 'delay') {
        const dL = A.createDelay(2.5), dR = A.createDelay(2.5);
        const fb = A.createGain();
        const lp = A.createBiquadFilter();
        lp.type = 'lowpass';
        lp.Q.value = 0.7;
        const pL = A.createStereoPanner(), pR = A.createStereoPanner();
        pL.pan.value = -0.6;
        pR.pan.value = 0.6;
        // 左→右→左と渡していく。輪はひとつだけなので、暴れて発振しない。
        slot.wetIn.connect(dL);
        dL.connect(pL); pL.connect(slot.wetOut);
        dL.connect(dR);
        dR.connect(pR); pR.connect(slot.wetOut);
        dR.connect(lp); lp.connect(fb); fb.connect(dL);
        put(dL, dR, fb, lp, pL, pR);
        R.dL = dL; R.dR = dR; R.fb = fb; R.lp = lp;
    } else if (slot.type === 'chorus') {
        R.depth = []; R.lfo = []; R.pan = [];
        for (let i = 0; i < 2; i++) {
            const d = A.createDelay(0.08);
            d.delayTime.value = 0.011 + i * 0.008;
            const lfo = A.createOscillator();
            const dg = A.createGain();
            const pan = A.createStereoPanner();
            lfo.connect(dg);
            dg.connect(d.delayTime);
            lfo.start();
            slot.wetIn.connect(d);
            d.connect(pan);
            pan.connect(slot.wetOut);
            put(d, dg, pan);
            O.push(lfo);
            R.depth.push(dg); R.lfo.push(lfo); R.pan.push(pan);
        }
    } else if (slot.type === 'phaser') {
        const lfo = A.createOscillator();
        const dg = A.createGain();
        lfo.connect(dg);
        lfo.start();
        O.push(lfo);
        put(dg);
        R.lfo = lfo; R.dg = dg; R.aps = [];
        let tail = slot.wetIn;
        for (let i = 0; i < 4; i++) {
            const ap = A.createBiquadFilter();
            ap.type = 'allpass';
            ap.frequency.value = 300 * Math.pow(2.1, i);
            dg.connect(ap.frequency);
            tail.connect(ap);
            tail = ap;
            put(ap);
            R.aps.push(ap);
        }
        tail.connect(slot.wetOut);
    } else if (slot.type === 'saturate') {
        const ws = A.createWaveShaper();
        ws.oversample = '4x';
        const tone = A.createBiquadFilter();
        tone.type = 'lowpass';
        tone.Q.value = 0.7;
        const trim = A.createGain();
        slot.wetIn.connect(ws);
        ws.connect(tone);
        tone.connect(trim);
        trim.connect(slot.wetOut);
        put(ws, tone, trim);
        R.ws = ws; R.tone = tone; R.trim = trim;
    } else if (slot.type === 'crush') {
        const ws = A.createWaveShaper();
        const tone = A.createBiquadFilter();
        tone.type = 'lowpass';
        tone.Q.value = 0.7;
        slot.wetIn.connect(ws);
        ws.connect(tone);
        tone.connect(slot.wetOut);
        put(ws, tone);
        R.ws = ws; R.tone = tone;
    } else if (slot.type === 'tremolo') {
        const lfo = A.createOscillator();
        lfo.start();
        O.push(lfo);
        R.lfo = lfo; R.dg = []; R.g = [];
        for (let i = 0; i < 2; i++) {
            const g = A.createGain();
            g.gain.value = 0.5;
            const dg = A.createGain();
            const pan = A.createStereoPanner();
            pan.pan.value = i ? 0.8 : -0.8;
            lfo.connect(dg);
            dg.connect(g.gain);
            slot.wetIn.connect(g);
            g.connect(pan);
            pan.connect(slot.wetOut);
            put(g, dg, pan);
            R.dg.push(dg); R.g.push(g);
        }
    } else if (slot.type === 'filter') {
        const f = A.createBiquadFilter();
        f.type = 'lowpass';
        const lfo = A.createOscillator();
        const dg = A.createGain();
        lfo.connect(dg);
        dg.connect(f.frequency);
        lfo.start();
        slot.wetIn.connect(f);
        f.connect(slot.wetOut);
        put(f, dg);
        O.push(lfo);
        R.f = f; R.lfo = lfo; R.dg = dg;
    } else if (slot.type === 'ring') {
        const g = A.createGain();
        g.gain.value = 0;
        const osc = A.createOscillator();
        osc.connect(g.gain);
        osc.start();
        slot.wetIn.connect(g);
        g.connect(slot.wetOut);
        put(g);
        O.push(osc);
        R.osc = osc;
    }
    fxTune(slot, p);
}

// 部屋の形を変えるのは重いので、つまみから手が離れてからまとめて作る。
// できたら、いま鳴っていない側へ入れて、静かに入れ替える。
function fxVerbRoom(slot, p) {
    const R = slot.ref;
    const key = [p[0], p[2], p[3], p[5]].map((v) => Math.round(sndSafe(v, 0) * 200)).join(',');
    if (key === R.irKey) return;
    if (R.timer) clearTimeout(R.timer);
    R.timer = setTimeout(() => {
        R.timer = null;
        if (!actx || slot.type !== 'reverb' || !R.cA) return;
        R.irKey = key;
        const now = actx.currentTime;
        const from = R.useA ? R.cA : R.cB;
        const to = R.useA ? R.cB : R.cA;
        const gFrom = R.useA ? R.gA : R.gB;
        const gTo = R.useA ? R.gB : R.gA;
        to.buffer = makeImpulse(fxLog(p[0], 0.2, 8), p[3], p[2], p[5]);
        R.hp.connect(to);
        setP(gTo.gain, 1, now, 0.12, 1);
        setP(gFrom.gain, 0, now, 0.12, 0);
        R.useA = !R.useA;
        // 消えきったら、前の側は切り離しておく（鳴らないものを畳み込まない）
        setTimeout(() => {
            if (slot.ref !== R || slot.type !== 'reverb') return;
            try { R.hp.disconnect(from); } catch (e) { /* すでに外れている */ }
            from.buffer = null;
        }, 700);
    }, 220);
}

// つまみを動かしたときは、建て直さずに中身の数値だけ入れ替える（音が途切れない）
function fxTune(slot, p) {
    if (!actx || slot.type === 'none') return;
    const t = actx.currentTime;
    const R = slot.ref;
    const a = clamp(sndSafe(p[0], 0.5), 0, 1);
    const b = clamp(sndSafe(p[1], 0.5), 0, 1);
    const c = clamp(sndSafe(p[2], 0.5), 0, 1);
    if (slot.type === 'reverb') {
        setP(R.pre.delayTime, b * 0.2, t, 0.05, 0.02);
        setP(R.hp.frequency, fxLog(clamp(sndSafe(p[4], 0.5), 0, 1), 20, 500), t, 0.05, 110);
        fxVerbRoom(slot, p);
    } else if (slot.type === 'delay') {
        const sec = fxLog(a, 20, 1200) / 1000;
        setP(R.dL.delayTime, sec, t, 0.08, 0.3);
        setP(R.dR.delayTime, sec, t, 0.08, 0.3);
        setP(R.fb.gain, b * 0.85, t, 0.08, 0.3);
        setP(R.lp.frequency, fxLog(c, 600, 12000), t, 0.08, 4000);
    } else if (slot.type === 'chorus') {
        for (let i = 0; i < 2; i++) {
            setP(R.depth[i].gain, 0.0008 + a * 0.008, t, 0.08, 0.003);
            setP(R.lfo[i].frequency, (0.05 + b * 2.5) * (i ? 1.31 : 1), t, 0.08, 0.4);
            setP(R.pan[i].pan, (i ? 1 : -1) * c, t, 0.08, 0);
        }
    } else if (slot.type === 'phaser') {
        setP(R.lfo.frequency, 0.03 + a * 3, t, 0.08, 0.4);
        setP(R.dg.gain, 120 + b * 1500, t, 0.08, 600);
        for (const ap of R.aps) setP(ap.Q, 0.5 + c * 11, t, 0.08, 1);
    } else if (slot.type === 'saturate') {
        R.ws.curve = fxSatCurve(1 + a * 24, c);
        setP(R.tone.frequency, fxLog(b, 800, 16000), t, 0.08, 6000);
        setP(R.trim.gain, 1 / (1 + a * 2.2), t, 0.08, 1);
    } else if (slot.type === 'crush') {
        R.ws.curve = fxCrushCurve(2 + Math.round(a * 12));
        setP(R.tone.frequency, fxLog(b, 700, 16000), t, 0.08, 6000);
    } else if (slot.type === 'tremolo') {
        setP(R.lfo.frequency, 0.1 + a * 11.9, t, 0.08, 4);
        for (let i = 0; i < 2; i++) {
            // 左右のずれが1に近づくと、左右が逆に振れて「行き来する」動きになる
            const sign = i === 0 ? 1 : 1 - 2 * c;
            setP(R.dg[i].gain, 0.5 * b * sign, t, 0.08, 0);
        }
    } else if (slot.type === 'filter') {
        setP(R.f.frequency, fxLog(a, 150, 9000), t, 0.08, 1500);
        setP(R.f.Q, 0.7 + b * 18, t, 0.08, 1);
        setP(R.lfo.frequency, Math.max(0.01, c * 5), t, 0.08, 1);
        setP(R.dg.gain, c * fxLog(a, 150, 9000) * 0.7, t, 0.08, 0);
    } else if (slot.type === 'ring') {
        setP(R.osc.frequency, fxLog(a, 20, 2000), t, 0.08, 200);
    }
}

// --- 画面がわ ---
const FX_CAP = { drone: 'Drone', grain: 'Grain', master: 'Master' };
const fxCap = (src) => FX_CAP[src] || 'Drone';

function fxIds(src, i) {
    const k = `soundFx${fxCap(src)}${i + 1}`;
    const ps = [];
    for (let n = 1; n <= FX_PARAMS; n++) ps.push(`${k}P${n}`);
    return { type: `${k}Type`, p: ps, mix: `${k}Mix` };
}

function fxReadSlot(src, i) {
    const id = fxIds(src, i);
    const g = (x) => {
        const el = document.getElementById(x);
        return el ? parseFloat(el.value) / 100 : 0.5;
    };
    const sel = document.getElementById(id.type);
    return { type: sel ? sel.value : 'none', p: id.p.map(g), mix: g(id.mix) };
}

// つまみの名前と目盛りの表示を、いま選ばれている中身に合わせて書き換える
function fxRelabel(src, i) {
    const id = fxIds(src, i);
    const st = fxReadSlot(src, i);
    const def = FX_DEFS[st.type] || FX_DEFS.none;
    for (let k = 0; k < FX_PARAMS; k++) {
        const row = document.getElementById(`${id.p[k]}Row`);
        const lab = document.getElementById(`${id.p[k]}Label`);
        const val = document.getElementById(`${id.p[k]}Value`);
        const pr = def.params[k];
        if (row) row.style.display = pr ? '' : 'none';
        if (pr && lab) lab.textContent = pr.name;
        if (pr && val) val.textContent = pr.show(st.p[k]);
    }
    const mixRow = document.getElementById(`${id.mix}Row`);
    if (mixRow) mixRow.style.display = st.type === 'none' ? 'none' : '';
    const mixVal = document.getElementById(`${id.mix}Value`);
    if (mixVal) mixVal.textContent = `${Math.round(st.mix * 100)}%`;
}

// 使っているスロットは必ず見せる。空きは、直前が埋まっていればひとつだけ。
function fxRefreshSlots(src) {
    const used = [];
    for (let i = 0; i < FX_SLOTS; i++) used.push(fxReadSlot(src, i).type !== 'none');
    for (let i = 0; i < FX_SLOTS; i++) {
        const show = i === 0 || used[i] || used[i - 1];
        const box = document.getElementById(`fx${fxCap(src)}Slot${i + 1}`);
        if (box) box.style.display = show ? '' : 'none';
        fxRelabel(src, i);
    }
}

function fxApply(src, i, rebuild) {
    const rack = fxRacks[src];
    if (!rack || !actx) return;
    const slot = rack.slots[i];
    const st = fxReadSlot(src, i);
    const t = actx.currentTime;
    if (rebuild || slot.type !== st.type) fxBuild(slot, st.type, st.p);
    else fxTune(slot, st.p);
    const m = st.type === 'none' ? 0 : clamp(sndSafe(st.mix, 0), 0, 1);
    if (st.type === 'reverb') {
        // 残響だけは足し算にする。乾いた音は減らさないので、
        // かけても音がこもらない（ミキサーの「送り」と同じ効き方）。
        setP(slot.dry.gain, 1, t, 0.05, 1);
        setP(slot.wetOut.gain, m, t, 0.05, 0);
    } else {
        // ほかは等パワーで混ぜる。つまみの真ん中でも音量が痩せない
        setP(slot.dry.gain, Math.cos((m * Math.PI) / 2), t, 0.05, 1);
        setP(slot.wetOut.gain, Math.sin((m * Math.PI) / 2), t, 0.05, 0);
    }
}

function fxApplyAll() {
    for (const src of FX_SRCS) {
        for (let i = 0; i < FX_SLOTS; i++) fxApply(src, i, true);
    }
}

function fxBuildUI(src) {
    const host = document.getElementById(`fx${fxCap(src)}`);
    if (!host) return;
    host.innerHTML = '';
    for (let i = 0; i < FX_SLOTS; i++) {
        const id = fxIds(src, i);
        const box = document.createElement('div');
        box.id = `fx${fxCap(src)}Slot${i + 1}`;
        let html = `<div class="control-row">
            <label for="${id.type}">スロット${i + 1}</label>
            <select id="${id.type}">`;
        for (const key of FX_ORDER) {
            html += `<option value="${key}">${FX_DEFS[key].name}</option>`;
        }
        html += '</select></div>';
        for (let k = 0; k < FX_PARAMS; k++) {
            html += `<div class="control-row" id="${id.p[k]}Row" style="display:none">
                <label for="${id.p[k]}"><span id="${id.p[k]}Label"></span> <span class="value" id="${id.p[k]}Value"></span></label>
                <input type="range" id="${id.p[k]}" min="0" max="100" step="1" value="50">
            </div>`;
        }
        html += `<div class="control-row divider-row" id="${id.mix}Row" style="display:none">
            <label for="${id.mix}">ミックス <span class="value" id="${id.mix}Value">35%</span></label>
            <input type="range" id="${id.mix}" min="0" max="100" step="1" value="35">
        </div>`;
        box.innerHTML = html;
        host.appendChild(box);

        const sel = document.getElementById(id.type);
        sel.addEventListener('change', () => {
            // 選び直したときは、その中身に似合う初期値をひとそろい入れておく
            const def = FX_DEFS[sel.value];
            if (def && !soundStashBusy) {
                for (let k = 0; k < FX_PARAMS; k++) {
                    const el = document.getElementById(id.p[k]);
                    const d = def.defs && def.defs[k];
                    if (el && d !== undefined) { el.value = String(d); el.dispatchEvent(new Event('input')); }
                }
                const mixEl = document.getElementById(id.mix);
                if (mixEl && def.mix !== undefined) {
                    mixEl.value = String(def.mix);
                    mixEl.dispatchEvent(new Event('input'));
                }
            }
            fxRefreshSlots(src);
            fxApply(src, i, true);
        });
        for (const pid of id.p) {
            document.getElementById(pid).addEventListener('input', () => {
                fxRelabel(src, i);
                fxApply(src, i, false);
            });
        }
        document.getElementById(id.mix).addEventListener('input', () => {
            fxRelabel(src, i);
            fxApply(src, i, false);
        });
    }
    fxRefreshSlots(src);
}

// アニメーションループ
let animationId = null;
let lastFrameMs = 0;
let nextHealthCheckAt = 0;

let animateWarned = false;
let lastFrameAt = performance.now();

// 1フレームの中で何か落ちても、次のフレームは必ず回す。
// ここを素通しにしていると、音のノードにおかしな値を1回渡しただけで
// 描画ごと止まってしまい、モードを切り替えても戻らなくなる。
// タブが裏に回ると requestAnimationFrame は止まる。音だけは続けたいので、
// そのときはタイマーで回す。ブラウザは「音を出しているページ」の
// タイマーは絞らない決まりなので、これで裏でも普通に進む。
let bgTimer = null;
let bgPlay = true;
let pausedAt = 0;      // 隠していたあいだの時刻（戻ったときに時計を戻す）

function bgMode() { return document.hidden && bgPlay && soundOn && actx; }

function scheduleFrame() {
    if (bgTimer) { clearTimeout(bgTimer); bgTimer = null; }
    if (bgMode()) {
        animationId = null;
        bgTimer = setTimeout(animate, 16);
    } else {
        animationId = requestAnimationFrame(animate);
    }
}

function animate() {
    lastFrameAt = performance.now();
    try {
        animateBody();
    } catch (err) {
        if (!animateWarned) { animateWarned = true; console.error('animate:', err); }
        try { rebuildAudio(); } catch (e2) { /* 音は諦めて絵だけ続ける */ }
    }
    scheduleFrame();
}

function animateBody() {
    // 裏で回しているあいだは、絵を描いても誰も見ていないので省く
    const draw = !document.hidden;
    if (draw) {
        // 背景はテーマ色で塗りつぶす（透明のままだとページの背景が透ける）
        ctx.fillStyle = currentTheme().background;
        ctx.fillRect(0, 0, logicalWidth, logicalHeight);
        if (showRail) drawBoundary();
    }

    const elapsedMs = performance.now() - startTime;
    const dtMs = Math.min(64, elapsedMs - lastFrameMs);
    lastFrameMs = elapsedMs;

    // ときどき値の健康診断をして、おかしくなっていたら静かに立て直す。
    // （表示できる場所が一瞬なくなったときなどに、数がおかしくなることがある）
    if (elapsedMs >= nextHealthCheckAt) {
        nextHealthCheckAt = elapsedMs + 1000;
        const broken = layers.some((l) => l.boids.some(
            (b) => !Number.isFinite(b.arcFraction) || !Number.isFinite(b.speed)));
        if (broken) sanitizeBoids();
    }

    // シーケンス（モードをつないだタイムライン）を進める。
    // モードやパラメーターの差し替えは、この中で起きる。
    updateSequence(elapsedMs);

    // バーの長さを目標へなめらかに寄せる（モードが変わった瞬間に飛ばないように）
    const barTarget = 1;
    barScaleSmooth += (barTarget - barScaleSmooth) * clamp(dtMs / 400, 0, 1);

    // 「集団が均一に流れる⇔分裂する」フェーズは全レイヤー共通なので、
    // レイヤーごとではなく1フレームに1回だけ進める
    updateSpeedVariancePhase(elapsedMs);

    // 選ばれているモードの内部状態（波・驚き・体内時計・捕食者）を進める
    updateModeState(elapsedMs, dtMs);

    // 「グループを等間隔に」の効き目を、切り替え時にゆっくり出し入れする
    // （いきなり全開／全切りにすると、そこでビクッと動いてしまうため）
    const blendStep = 16 / EVEN_BLEND_MS;
    const evenTarget = evenSpacing ? evenStrength : 0;
    if (evenBlend < evenTarget) evenBlend = Math.min(evenTarget, evenBlend + blendStep);
    else if (evenBlend > evenTarget) evenBlend = Math.max(evenTarget, evenBlend - blendStep);

    // グループの継ぎ目・リーダーはMODE1でだけ使う仕組み
    if (motionMode === 1) {
        updateSeams(elapsedMs);
    } else {
        for (const b of layers.flatMap((l) => l.boids)) {
            b.seamAhead = false;
            b.groupShift = 0;
            b.groupDir = 0;
        }
    }

    // 動きはレイヤーごとに独立して進める
    for (const layer of layers) {
        stepSimulation(layer, elapsedMs);
    }

    // 集団の判定とリーダーの誕生・引退は、上下のレイヤーをまとめて1回だけ行う
    if (motionMode === 1 || (motionMode === 26 && m22W < 0.999)) {
        maybeUpdateClusterLeaders(elapsedMs);
    }

    // 動きが決まったところで、その様子を音にする。
    // 音の側で何が起きても、動きと描画は止めない。
    try {
        updateSound(elapsedMs, dtMs);
    } catch (err) {
        if (!animateWarned) { animateWarned = true; console.error('sound:', err); }
        rebuildAudio();
    }

    if (!draw) return;

    // レイヤーは配列の順（下→上）に重ねて描く。
    // 各レイヤーの中では、バーを先にまとめて描いてからドットを上に重ねる
    // （そうしないと、他のドットのバーがドット本体を横切って見えてしまう）。
    for (const layer of layers) {
        for (const boid of layer.boids) {
            boid.drawBar();
        }
        if (showDots) {
            for (const boid of layer.boids) {
                boid.draw();
            }
        }
    }

    if (showTopPlate) drawTopPlate();

}

// タブが非表示のときはアニメーションを止めてCPU/バッテリーを節約する
// 動きの見張り。何かの拍子にコマ送りが止まってしまっても、
// ここが気づいて回し直す。原因が何であれ、画面が固まったままには
// ならないようにしておく（タブが隠れているあいだは休ませたままにする）。
setInterval(() => {
    if (document.hidden && !bgMode()) return;
    if (performance.now() - lastFrameAt < 2000) return;
    if (animationId !== null) {
        try { cancelAnimationFrame(animationId); } catch (err) { /* すでに無効 */ }
    }
    if (bgTimer) { clearTimeout(bgTimer); bgTimer = null; }
    animationId = null;
    lastFrameMs = performance.now() - startTime;   // 時間の飛びを持ち込まない
    lastFrameAt = performance.now();
    animWatchdogs++;
    animate();
}, 2000);
let animWatchdogs = 0;

// 再生しているあいだ、画面を消させない。
// YouTube などと同じ仕組み（Screen Wake Lock）を使う。パソコンの
// 設定は触らず、このページを見ているあいだだけ効く。
// タブを隠すとブラウザが自動で解除するので、戻ったら取り直す。
let sleepBlock = true;
let wakeLock = null;

async function keepAwakeOn() {
    if (!sleepBlock) return;
    // 見えていないときは何もしない。控えの動画を回したままにすると、
    // 「メディア再生中のページ」とみなされて、裏でも起こされ続ける。
    if (document.hidden) { keepAwakeOff(); return; }
    if (navigator.wakeLock && !wakeLock && !document.hidden) {
        try {
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLock.addEventListener('release', () => { wakeLock = null; });
            return;
        } catch (err) {
            // 画面が隠れている・操作がまだない等。あとでもう一度試す
            wakeLock = null;
        }
    }
    // Wake Lock が無いブラウザは、無音の小さな動画を流して代わりにする
    const v = document.getElementById('keepAwakeVideo');
    if (v && v.paused) {
        v.play().then(() => {
            // 待っているあいだにスイッチが切られていたら、すぐ止める
            if (!sleepBlock) v.pause();
        }).catch(() => { /* 自動再生が許されていない。操作のあとで再挑戦する */ });
    }
}

function keepAwakeOff() {
    if (wakeLock) { try { wakeLock.release(); } catch (err) { /* もう外れている */ } }
    wakeLock = null;
    const v = document.getElementById('keepAwakeVideo');
    if (v && !v.paused) v.pause();
}

document.getElementById('sleepBlockToggle').addEventListener('change', (e) => {
    sleepBlock = e.target.checked;
    if (sleepBlock) keepAwakeOn(); else keepAwakeOff();
});

// 最初の一回。ブラウザによっては「人が触ったあと」でないと通らないので、
// 通らなかったときのために、最初の操作でもう一度試す。
keepAwakeOn();
for (const ev of ['pointerdown', 'keydown']) {
    window.addEventListener(ev, () => {
        // スイッチを押したときは change のほうが後に来るので、少し待つ
        setTimeout(() => { if (sleepBlock && !wakeLock) keepAwakeOn(); }, 0);
    }, { passive: true });
}
// 効いているか、ときどき確かめて取り直す
setInterval(() => { if (sleepBlock && !document.hidden && !wakeLock) keepAwakeOn(); }, 15000);

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        if (animationId !== null) {
            cancelAnimationFrame(animationId);
            animationId = null;
        }
        if (bgMode()) {
            // 裏でもそのまま鳴らす。絵は描かず、動きと音だけ進める。
            // 画面はもう見ていないので、消えないようにする仕掛けは外す
            keepAwakeOff();
            scheduleFrame();
        } else {
            // 止めるほうを選んだとき。休んでいたぶんの時間は
            // 進んでいないことにして、戻ったら続きから動かす。
            // （そうしないと、シーケンスが隠していた時間ぶん飛ぶ）
            pausedAt = performance.now();
            if (actx && actx.state === 'running') actx.suspend();
            keepAwakeOff();     // 控えの動画も止めて、完全に休ませる
        }
    } else {
        if (bgTimer) { clearTimeout(bgTimer); bgTimer = null; }
        if (pausedAt > 0) {
            startTime += performance.now() - pausedAt;
            pausedAt = 0;
            lastFrameMs = performance.now() - startTime;
        }
        if (animationId === null) animate();
        if (soundOn && actx && actx.state === 'suspended') actx.resume();
        keepAwakeOn();          // タブを隠すと外れるので、戻ったら取り直す
    }
});

document.getElementById('bgPlayToggle').addEventListener('change', (e) => {
    bgPlay = e.target.checked;
    if (!bgPlay && document.hidden && actx && actx.state === 'running') actx.suspend();
    if (bgPlay && document.hidden && soundOn && actx) {
        if (actx.state === 'suspended') actx.resume();
        if (animationId === null && !bgTimer) scheduleFrame();
    }
});

animate();
</script>
</body>
</html>

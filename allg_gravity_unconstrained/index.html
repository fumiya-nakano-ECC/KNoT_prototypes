<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f1e9"><title>KNoT — Gravity / 浮力と重力のあいだ</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<header><a class="brand" href="../">KNoT<span>MOTION STUDIES</span></a><span class="edition">STUDY 03 / GRAVITY</span></header>
<div class="intro"><div><p class="eyebrow">浮力と重力のあいだ</p><h1>A little less<br><em>gravity.</em></h1></div><p class="description">落ちる。弾む。ふわりとほどける。<br>36本の線が、重さを忘れるまで。<span>画面に触れて、小さな波を起こしてみてください。</span></p></div>
<section class="experiment" aria-label="重力と浮遊のモーションデモ"><div class="stage-top"><span><i></i> LIVE EXPERIMENT</span><span id="phaseLabel">01 — 浮遊</span></div>
<svg id="stage" viewBox="0 0 1000 550" role="img" aria-label="36本のバーが浮遊と落下を繰り返すアニメーション"><defs><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#d8d7cc"/></pattern></defs><rect width="1000" height="550" fill="url(#grid)"/><ellipse id="shadow" cx="500" cy="494" rx="200" ry="9"/><path class="floor" d="M 75 500 H 925"/><g id="bars"></g><circle id="ripple" r="0"/><text class="stage-text" x="75" y="523">GROUND / 0</text><text class="stage-text" x="925" y="523" text-anchor="end">18 + 18 ELEMENTS</text></svg>
<div class="stage-bottom"><span class="legend"><b></b> TOP <b></b> BOTTOM</span><span id="forceLabel">WEIGHTLESS</span></div></section>
<div class="controls"><div class="modes" role="group" aria-label="モーション"><button data-mode="auto" class="active" aria-pressed="true">往復 <span>Cycle</span></button><button data-mode="gravity" aria-pressed="false">重力 <span>Gravity</span></button><button data-mode="float" aria-pressed="false">浮遊 <span>Float</span></button></div><label class="speed" for="speed">速度 <input id="speed" type="range" min="0.25" max="2" step="0.05" value="1"><output id="speedValue" for="speed">1.00×</output></label><div class="playback"><button id="pulse" title="バーに波を与える">波を起こす ↗</button><button id="play" aria-label="一時停止">Ⅱ</button><button id="reset" aria-label="最初から再生" title="最初から">↺</button></div></div>
<footer><p>重さは、動きのなかにある。</p><a href="https://kinaesthetic.design/ja#gravity_jp" target="_blank" rel="noopener noreferrer">Inspired by ウゴキのデザインリサーチ ↗</a></footer>
</main><script src="skeleton.js" defer></script></body></html>
